<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Center</title>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #11141a;
    --surface-2: #161a21;
    --line: #1e232c;
    --line-soft: #171b22;
    --fg: #e6edf3;
    --dim: #8b95a5;
    --faint: #5a6472;

    --working: #4da3ff;
    --waiting: #f0a92b;
    --failed:  #ff5c57;
    --done:    #3fd07f;
    --idle:    #5a6472;

    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    /* Bahnschrift é a DIN que já vem no Windows: letra de sinalização
       industrial. Variável — a largura condensada carrega a personalidade. */
    --label: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", sans-serif;
  }
  /* O tema claro redefine as mesmas variáveis, e nada mais. `data-tema` é
     sempre resolvido pelo JS para claro|escuro — "auto" não chega ao CSS, o
     que evita repetir a paleta clara num @media além daqui. */
  :root[data-tema="claro"] {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f6f8fa;
    --surface-2: #eceff2;
    --line: #d0d7de;
    --line-soft: #e6eaef;
    --fg: #1f2328;
    --dim: #57606a;
    --faint: #818b98;

    /* As cores de estado precisam escurecer: o azul que brilha no fundo preto
       fica ilegível no branco. Estas passam em 4.5:1 sobre #ffffff. */
    --working: #0969da;
    --waiting: #9a6700;
    --failed:  #cf222e;
    --done:    #1a7f37;
    --idle:    #6e7781;
  }

  h1, .count, .tab, thead th, tr.zone > td, .cat, h3, .col-head, .big {
    font-stretch: 75%;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 var(--mono); -webkit-font-smoothing: antialiased;
    display: flex; height: 100vh; overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* ---------- estrutura: painel | divisória | notas ----------
     O painel é o contêiner de consulta. Sem `container-type`, o breakpoint
     olharia a largura da JANELA — e com as notas abertas a janela continua
     larga enquanto o painel some. A tabela quebraria em vez de compactar. */
  #painel {
    flex: 1 1 auto; min-width: 0; overflow-y: auto;
    container-type: inline-size; container-name: painel;
  }
  #split {
    flex: none; width: 6px; cursor: col-resize; background: var(--line);
    border-left: 1px solid var(--bg); border-right: 1px solid var(--bg);
  }
  #split:hover, #split.drag { background: var(--working); }
  #notas {
    flex: none; width: min(var(--notes-w, 340px), 78vw); min-width: 0;
    background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto;
  }
  :focus-visible { outline: 2px solid var(--working); outline-offset: 2px; }
  h3 {
    margin: 0 0 6px; font: 700 10px/1 var(--label);
    letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
  }

  /* ---------- topo ---------- */
  header { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 14px 20px 0; }
  .top { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  h1 {
    font: 700 20px/1 var(--label); letter-spacing: .26em;
    text-transform: uppercase; margin: 0; white-space: nowrap;
  }
  .counts { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .count {
    font: 700 12px/1 var(--label); letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); display: flex; align-items: baseline; gap: 6px;
  }
  .count b { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--dim); }
  .count.hot b { color: var(--fg); }
  .grow { flex: 1 1 40px; }
  /* juntos num bloco só: soltos, ao quebrar a linha o campo de filtro sobrava
     no meio do cabeçalho enquanto o resto ia pra outra ponta */
  .ferramentas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=search], select {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 9px; font: 12px var(--mono); min-width: 170px;
  }
  input[type=search]::placeholder { color: var(--faint); }

  nav { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 14px; cursor: pointer; color: var(--faint); white-space: nowrap;
    font: 700 12px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
  }
  .tab:hover { color: var(--dim); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--working); }
  .tab .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); margin-left: 6px; }

  main { padding: 4px 20px 60px; }
  footer { color: var(--faint); font-size: 11px; padding: 0 20px 28px; }
  .empty { color: var(--faint); text-align: center; padding: 60px 0; }

  /* ---------- tabela de agentes ---------- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  col.c-dot { width: 22px; } col.c-path { width: 210px; }
  col.c-model { width: 84px; } col.c-tok { width: 66px; }
  col.c-time { width: 200px; } col.c-bar { width: 150px; }
  col.c-todo { width: 64px; } col.c-acts { width: 96px; }

  thead th {
    text-align: left; padding: 10px 10px 7px 0;
    font: 700 10px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  thead th button {
    background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
    font: inherit; letter-spacing: inherit; text-transform: inherit;
  }
  thead th button:hover { color: var(--fg); }
  thead th button .dir { color: var(--working); margin-left: 4px; }
  thead th.ativo button { color: var(--fg); }

  /* largura de leitura: sem isso o assunto estica por 900px numa tela larga
     e as colunas da direita ficam espremidas no canto */
  .subject, .note { max-width: 74ch; }

  .tokbar { height: 5px; background: var(--line); border-radius: 2px; margin-top: 6px; }
  .tokbar > i { display: block; height: 100%; border-radius: 2px; background: currentColor; opacity: .8; }

  td.acts { text-align: right; white-space: nowrap; opacity: 0; }
  tr.row:hover td.acts, tr.row:focus-within td.acts { opacity: 1; }
  td.acts button {
    background: none; border: 0; padding: 2px 5px; cursor: pointer;
    color: var(--faint); font: 13px/1 var(--mono);
  }
  td.acts button:hover { color: var(--fg); }
  td.acts button.on { color: var(--waiting); opacity: 1; }
  td.acts button[disabled] { opacity: .25; cursor: not-allowed; }
  /* o que está fixado precisa se ver sem passar o mouse */
  tr.row.pinned td.acts { opacity: 1; }
  tr.row.pinned td.acts button:not(.on) { opacity: 0; }
  tr.row.pinned:hover td.acts button { opacity: 1; }

  .aviso-ordem {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 0 2px;
    color: var(--faint); font-size: 12px;
  }
  .aviso-ordem button {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--working); font: 12px var(--mono);
  }
  tr.zone > td {
    padding: 24px 0 7px; font: 700 14px/1 var(--label);
    letter-spacing: .24em; text-transform: uppercase;
  }
  tr.zone .bar { display: flex; align-items: center; gap: 10px; }
  tr.zone .rule { flex: 1; height: 1px; background: var(--line); }
  tr.zone .n { color: var(--faint); font-family: var(--mono); letter-spacing: 0; }
  tr.zone button {
    background: none; border: 0; padding: 0; cursor: pointer; color: var(--faint);
    font: inherit; letter-spacing: inherit; text-transform: inherit;
  }
  tr.zone button:hover { color: var(--fg); }
  .z-waiting { color: var(--waiting); } .z-failed { color: var(--failed); }
  .z-working { color: var(--working); } .z-idle { color: var(--idle); }
  .z-done { color: var(--done); }

  tr.row { cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  tr.row:hover, tr.row.sel { background: var(--surface); }
  tr.row.sel > td:first-child { box-shadow: inset 2px 0 0 currentColor; }
  tr.row.pinned > td:first-child { box-shadow: inset 2px 0 0 var(--waiting); }
  td { padding: 7px 10px 7px 0; vertical-align: top; }

  .dot { width: 7px; height: 7px; border-radius: 50%; display: block; margin-top: 5px; }
  .s-working { background: var(--working); } .s-waiting { background: var(--waiting); }
  .s-failed { background: var(--failed); } .s-done { background: var(--done); }
  .s-idle { background: var(--idle); }

  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subject { display: flex; align-items: baseline; gap: 7px; }
  .note { color: var(--faint); font-size: 12px; margin-top: 2px; }
  .note.warn { color: var(--waiting); } .note.bad { color: var(--failed); }
  .cat {
    font: 700 9px/1.6 var(--label); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 2px;
    padding: 0 5px; flex: none;
  }
  .path { color: var(--dim); font-size: 12px; }
  .path em { color: var(--faint); font-style: normal; }
  .num { color: var(--dim); font-variant-numeric: tabular-nums; }

  .bar-todo { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; }
  .bar-todo > i { display: block; height: 100%; background: var(--done); border-radius: 2px; }

  /* ---------- painel lateral ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(660px, 92vw); background: var(--surface);
    border-left: 1px solid var(--line); overflow-y: auto;
    transform: translateX(100%); box-shadow: -24px 0 48px rgba(0,0,0,.5);
  }
  .drawer.on { transform: none; }
  @media (prefers-reduced-motion: no-preference) {
    .drawer { transition: transform .16s ease-out; }
    .scrim { transition: opacity .16s ease-out; }
    tr.row { transition: background .12s ease; }
  }
  .d-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
  .d-head .big {
    font: 700 22px/1.15 var(--label); letter-spacing: .02em; margin: 6px 0 8px;
  }
  .d-close {
    float: right; background: none; border: 0; color: var(--faint);
    font: 16px var(--mono); cursor: pointer; padding: 0 2px;
  }
  .d-close:hover { color: var(--fg); }
  .d-status {
    display: inline-flex; align-items: center; gap: 7px;
    font: 700 11px/1 var(--label); letter-spacing: .18em; text-transform: uppercase;
  }
  .d-meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .d-meta span:not(:last-child)::after { content: " ·"; color: var(--faint); }
  .d-body { padding: 18px 22px 40px; display: grid; gap: 22px; }
  .d-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .d-body p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote {
    border-left: 2px solid var(--line); padding-left: 12px; color: var(--fg);
  }
  details.lvl > summary {
    cursor: pointer; color: var(--faint); list-style: none;
    font: 700 10px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  details.lvl > summary::-webkit-details-marker { display: none; }
  details.lvl > summary::before { content: "▸ "; }
  details.lvl[open] > summary::before { content: "▾ "; }
  details.lvl > summary:hover { color: var(--fg); }

  .todos { list-style: none; margin: 0; padding: 0; }
  .todos li { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; }
  .todos input { margin-top: 3px; accent-color: var(--done); flex: none; }
  .todos li.done span { color: var(--faint); text-decoration: line-through; }
  a { color: var(--working); }
  code {
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    padding: 0 5px; color: var(--dim); overflow-wrap: anywhere;
  }

  .col-head {
    display: flex; align-items: baseline; gap: 8px; padding: 14px 0 8px;
    font: 700 13px/1 var(--label); letter-spacing: .2em; text-transform: uppercase;
  }
  .col-head .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

  /* ---------- to-dos: lista densa ---------- */
  .lista { max-width: 920px; }
  .grupo { margin-bottom: 20px; }
  .g-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 0 6px; border-bottom: 1px solid var(--line-soft);
  }
  .g-head .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .g-head .path { cursor: pointer; }
  .g-head .path:hover { color: var(--fg); }
  .g-add {
    background: none; border: 0; padding: 1px 7px; cursor: pointer;
    color: var(--faint); font: 15px/1 var(--mono);
  }
  .g-add:hover { color: var(--done); }
  .item { display: flex; align-items: baseline; gap: 9px; padding: 1px 0 1px 3px; border-radius: 2px; }
  .item:hover { background: var(--surface); }
  .item > input[type=checkbox] {
    flex: none; margin: 0; position: relative; top: 2px; accent-color: var(--done); cursor: pointer;
  }
  /* o texto é sempre um campo: editar sem entrar em "modo edição" é uma
     interação a menos, e o painel já pausa o redesenho enquanto tem foco */
  .item .txt {
    flex: 1; min-width: 0; background: none; border: 0; border-radius: 2px;
    color: var(--fg); font: 13px/1.6 var(--mono); padding: 1px 5px;
  }
  .item .txt:hover { background: var(--surface-2); }
  .item .txt:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--working); }
  .item .txt::placeholder { color: var(--faint); }
  .item.done .txt { color: var(--faint); text-decoration: line-through; }
  .grupo details.lvl > summary { border-top: 0; padding: 4px 0 4px 3px; }
  .outros { border-top: 1px solid var(--line-soft); padding-top: 6px; }

  /* ---------- projetos ---------- */
  .projs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  .proj { border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
  .proj > .hd { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .proj .name { font: 700 15px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; }
  .proj .sub { color: var(--faint); font-size: 11px; margin-top: 6px; }
  .proj .item {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 14px;
    border-top: 1px solid var(--line-soft); cursor: pointer;
  }
  .proj .item:hover { background: var(--surface-2); }

  /* ---------- tempo ---------- */
  .t-ctl {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 0 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
  }
  .t-ctl label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 10px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
  }
  .t-ctl input[type=date], .t-ctl select {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); min-width: 0;
  }
  .t-aviso { color: var(--faint); font-size: 11px; max-width: 78ch; margin: 0 0 14px; }
  .t-aviso b { color: var(--waiting); font-weight: 400; }

  .t-proj { border-bottom: 1px solid var(--line-soft); }
  .t-linha {
    display: grid; gap: 12px; align-items: baseline; padding: 9px 4px;
    grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px; cursor: pointer;
  }
  /* Cada coluna opcional entra na grade só quando existe: sem isso, ligar a
     assinatura empurraria tudo e a linha estouraria o painel estreito. */
  .t-linha.com-valor { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 86px; }
  .t-linha.com-real  { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 80px; }
  .t-linha.com-valor.com-real { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 80px 86px; }
  .t-linha.com-valor.com-real.com-sobra {
    grid-template-columns: 1fr 66px 44px 58px 60px 70px 58px 76px 82px 82px;
  }
  .t-linha:hover { background: var(--surface); }
  .t-linha .val { color: var(--fg); font-weight: 600; }
  .t-linha .real { color: var(--waiting); }
  .t-linha .ok { color: var(--done); font-weight: 600; }
  .t-linha .ruim { color: var(--failed); font-weight: 600; }
  .t-linha .nome { font: 700 13px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase; }
  .t-linha .v { text-align: right; font-variant-numeric: tabular-nums; }
  .t-linha .h { color: var(--fg); font-size: 14px; }
  .t-linha .cif { color: var(--done); }
  .t-head { color: var(--faint); cursor: default; padding-bottom: 4px; }
  .t-head:hover { background: none; }
  .t-head span {
    font: 700 9px/1.3 var(--label); letter-spacing: .14em; text-transform: uppercase;
  }
  .t-corpo { padding: 4px 4px 20px; display: grid; gap: 18px; }
  .t-taxa {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); width: 76px;
  }
  .t-valor { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .t-valor label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 10px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
  }
  .t-valor b { font-size: 20px; color: var(--fg); font-weight: 600; }
  .t-valor b.ok { font-size: inherit; color: var(--done); }
  .t-valor b.ruim { font-size: inherit; color: var(--failed); }

  .t-dias { display: flex; align-items: flex-end; gap: 3px; height: 76px; }
  .t-dia { flex: 1; min-width: 4px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .t-dia > i { display: block; background: var(--working); opacity: .8; border-radius: 1px 1px 0 0; min-height: 2px; }
  .t-dia:hover > i { opacity: 1; background: var(--fg); }
  .t-eixo { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; margin-top: 5px; }

  .t-ses { width: 100%; border-collapse: collapse; }
  .t-ses td { padding: 4px 10px 4px 0; border-top: 1px solid var(--line-soft); font-size: 12px; }
  .t-ses .num { text-align: right; font-variant-numeric: tabular-nums; }
  .t-mod { display: flex; gap: 18px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }

  /* ---------- gráficos ---------- */
  .g-grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
  .g-card { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px 14px; background: var(--surface); }
  .g-card > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .g-card > header b { font: 700 12px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase; }
  .btn.min { padding: 2px 6px; font-size: 12px; }

  .g-leg { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; color: var(--dim); font-size: 11px; }
  .g-leg i, .g-lista i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .g-escala { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; margin-top: 6px; }

  .g-barras { display: flex; align-items: flex-end; gap: 3px; height: 150px; }
  .g-col { flex: 1; min-width: 3px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .g-pilha { display: flex; flex-direction: column-reverse; min-height: 2px; border-radius: 1px 1px 0 0; overflow: hidden; }
  .g-pilha.neg { opacity: .55; }
  .g-pilha > i { display: block; width: 100%; }
  .g-rot {
    font-size: 9px; color: var(--faint); text-align: center; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Com muitas colunas o rótulo vira tinta ilegível; some e fica o tooltip. */
  .g-barras > .g-col:nth-child(n+16) .g-rot, .g-barras:has(> :nth-child(16)) .g-rot { display: none; }

  .g-svg { width: 100%; height: 200px; display: block; }

  .g-rosca { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .g-rosca svg { width: 140px; height: 140px; flex: none; }
  .g-lista { list-style: none; margin: 0; padding: 0; flex: 1 1 200px; min-width: 0; }
  .g-lista li { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; font-size: 12px; }
  .g-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .g-lista b { color: var(--fg); font-weight: 600; }
  .g-pct { color: var(--faint); width: 34px; text-align: right; }

  .g-cal { display: flex; gap: 3px; align-items: flex-start; overflow-x: auto; padding-bottom: 2px; }
  .g-sem { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; }
  .g-cal i { display: block; width: 11px; height: 11px; border-radius: 2px; background: var(--line); }
  .g-cal i.vazio { background: var(--line-soft); }

  .g-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .g-tab th { text-align: left; color: var(--faint); font-weight: 400; padding: 3px 8px 6px 0; }
  .g-tab td { padding: 3px 8px 3px 0; color: var(--dim); border-top: 1px solid var(--line-soft); }
  .g-tab .num { text-align: right; font-variant-numeric: tabular-nums; }
  .g-tab .forte { color: var(--fg); }
  .g-tab tr.off td { opacity: .55; }

  .g-erro { color: var(--waiting); font-size: 12px; padding: 10px 0; }
  .g-form { border: 1px solid var(--working); border-radius: 4px; padding: 12px 14px; margin-bottom: 16px; }
  .g-campos { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .g-campos label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 10px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
  }
  .g-campos select, .g-campos input {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); min-width: 0;
  }
  .g-previa { margin-top: 14px; }
  .g-indice { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); margin-bottom: 18px; }

  /* ---------- servidores ---------- */
  .srv { width: 100%; border-collapse: collapse; }
  .srv td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .srv .port { font: 700 15px/1 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--dim);
    border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 11px var(--mono);
  }
  .btn:hover { color: var(--fg); border-color: var(--faint); }
  .btn.danger { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--line)); }
  .btn.danger:hover { background: color-mix(in srgb, var(--failed) 16%, var(--surface)); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }

  /* ---------- bloco de notas ---------- */
  .n-head {
    position: sticky; top: 0; z-index: 5; background: var(--surface);
    display: flex; align-items: center; gap: 10px;
    padding: 15px 14px 11px; border-bottom: 1px solid var(--line);
  }
  .n-head h3 { margin: 0; flex: 1; }
  #n-list { padding: 12px 14px 40px; display: grid; gap: 12px; align-content: start; }
  .n-block { border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
  .n-block:focus-within { border-color: var(--faint); }
  .n-top {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 5px 4px 10px; border-bottom: 1px solid var(--line-soft);
  }
  .n-title {
    flex: 1; min-width: 0; background: none; border: 0; padding: 2px 0; color: var(--fg);
    font: 700 11px/1.4 var(--label); letter-spacing: .12em; text-transform: uppercase;
  }
  .n-title::placeholder { color: var(--faint); }
  .n-title:focus { outline: none; }
  .n-del {
    flex: none; background: none; border: 0; padding: 2px 5px; cursor: pointer;
    color: var(--faint); font: 12px var(--mono);
  }
  .n-del:hover { color: var(--failed); }
  .n-del.armed { color: var(--failed); font-size: 10px; }
  /* resize nativo do textarea: a alça de altura sai de graça, sem JS */
  .n-block textarea {
    display: block; width: 100%; min-height: 40px; border: 0; background: none;
    color: var(--fg); font: 12px/1.55 var(--mono); padding: 8px 10px 10px; resize: vertical;
  }
  .n-block textarea:focus { outline: none; }
  .n-empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }
  .n-modo {
    flex: none; background: none; border: 0; padding: 2px 4px; cursor: pointer;
    color: var(--faint); font: 12px var(--mono);
  }
  .n-modo:hover { color: var(--working); }
  .n-itens { padding: 5px 8px 7px; }
  .n-item { display: flex; align-items: baseline; gap: 8px; padding: 1px 0; }
  .n-item > input[type=checkbox] {
    flex: none; margin: 0; position: relative; top: 2px; accent-color: var(--done); cursor: pointer;
  }
  .n-item .txt {
    flex: 1; min-width: 0; background: none; border: 0; border-radius: 2px;
    color: var(--fg); font: 12px/1.55 var(--mono); padding: 1px 4px;
  }
  .n-item .txt:hover { background: var(--surface-2); }
  .n-item .txt:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--working); }
  .n-item.done .txt { color: var(--faint); text-decoration: line-through; }
  .n-add-item {
    background: none; border: 0; padding: 3px 4px; cursor: pointer;
    color: var(--faint); font: 11px var(--mono);
  }
  .n-add-item:hover { color: var(--done); }

  /* campo de notas do agente, no painel lateral */
  .d-nota {
    width: 100%; min-height: 68px; resize: vertical; border: 1px solid var(--line);
    border-radius: 3px; background: var(--bg); color: var(--fg);
    font: 12px/1.55 var(--mono); padding: 7px 9px;
  }
  .d-nota:focus { outline: none; border-color: var(--faint); }
  .d-nota::placeholder { color: var(--faint); }
  .btn.on { color: var(--fg); border-color: var(--faint); background: var(--surface-2); }

  /* ---------- o painel reage ao espaço que sobrou, não à janela ---------- */
  .only-xs { display: none; }
  @container painel (max-width: 900px) {
    col.c-model, col.c-tok, col.c-time { width: 0; }
    .hide-sm { display: none; }
  }
  @container painel (max-width: 620px) {
    col.c-path { width: 0; }
    .hide-xs { display: none; }
    .only-xs { display: block; }
    header { padding: 12px 12px 0; }
    main { padding: 4px 12px 40px; }
    footer { padding: 0 12px 24px; }
    .top { gap: 12px; }
    input[type=search], select { min-width: 0; flex: 1 1 110px; }
    .tab { padding: 8px 8px; letter-spacing: .1em; }
    h1 { font-size: 17px; letter-spacing: .18em; }
  }
  /* auto-fit sozinho não impede estouro: a coluna mínima de 340px é maior que
     o painel estreito. O min() faz o cartão encolher em vez de vazar. */
  .projs { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
  .d-grid { grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); }
</style>
<script>
  // No head, e não junto do resto: aplicado depois do body a página pisca
  // escura antes de clarear. Três estados — auto segue o Windows.
  var TEMA_ESCURO = matchMedia('(prefers-color-scheme: dark)')
  // ?tema= existe para a captura de tela: headless não tem preferência de
  // sistema nem localStorage, e sem isso não dá para conferir o tema claro.
  var temaModo = new URLSearchParams(location.search).get('tema')
    || localStorage.getItem('cc-tema') || 'auto'
  function aplicarTema() {
    var claro = temaModo === 'claro' || (temaModo === 'auto' && !TEMA_ESCURO.matches)
    document.documentElement.dataset.tema = claro ? 'claro' : 'escuro'
    var botao = document.getElementById('tema-toggle')
    if (!botao) return
    botao.textContent = { auto: '◐', claro: '☀', escuro: '☾' }[temaModo]
    botao.title = { auto: 'tema: segue o Windows', claro: 'tema: claro', escuro: 'tema: escuro' }[temaModo]
  }
  aplicarTema()
  // Só interessa quando está em auto, mas o listener é barato e não erra.
  TEMA_ESCURO.addEventListener('change', aplicarTema)
</script>
</head>
<body>
<div id="painel">
  <header>
    <div class="top">
      <h1>Control Center</h1>
      <div class="counts" id="counts"></div>
      <span class="grow"></span>
      <div class="ferramentas">
        <input type="search" id="q" placeholder="filtrar…" autocomplete="off">
        <select id="proj"><option value="">todos os projetos</option></select>
        <button class="btn" id="tema-toggle" title="tema: segue o Windows"></button>
        <button class="btn" id="n-toggle" aria-pressed="false">notas</button>
      </div>
    </div>
    <nav id="tabs" role="tablist"></nav>
  </header>

  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<div id="split" hidden role="separator" aria-orientation="vertical" aria-label="largura das notas"></div>
<aside id="notas" hidden aria-label="bloco de notas">
  <div class="n-head">
    <h3>notas</h3>
    <button class="btn" id="n-add">+ bloco</button>
  </div>
  <div id="n-list"></div>
</aside>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="detalhe do agente"></aside>

<script src="/graficos.js"></script>
<script>
const $ = (s) => document.querySelector(s)
const params = new URLSearchParams(location.search)
let DATA = { jobs: [], summary: {} }
let SERVERS = null            // carregado só quando a aba de servidores abre
let TEMPO = null              // idem: a varredura dos transcritos é cara
// o corte é a escolha que muda o número cobrado — vale lembrar entre sessões
const tempoParams = {
  corte: Number(params.get('corte')) || Number(localStorage.getItem('cc-corte')) || 15,
  de: params.get('de') || '',
  ate: params.get('ate') || '',
}
const tempoAberto = new Set()
let armed = null              // pid com "encerrar" armado, aguardando confirmação
let selected = params.get('open') || null

const TABS = [
  { id: 'agentes', label: 'agentes' },
  { id: 'todos', label: 'to-dos' },
  { id: 'projetos', label: 'projetos' },
  { id: 'tempo', label: 'tempo' },
  { id: 'graficos', label: 'gráficos' },
  { id: 'servidores', label: 'servidores' },
]
// A aba lembrada pode não existir mais: quem tinha `custo` guardado abriria o
// painel sem nenhuma aba marcada.
let tab = params.get('tab') || localStorage.getItem('cc-tab') || 'agentes'
if (!TABS.some((t) => t.id === tab)) tab = 'agentes'

const collapsed = params.has('expand')
  ? new Set()
  : new Set(JSON.parse(localStorage.getItem('cc-collapsed') || '["done","idle"]'))

// quais agentes estão com as tarefas concluídas à mostra na aba de to-dos
const feitosAbertos = new Set(JSON.parse(localStorage.getItem('cc-feitos') || '[]'))
const tudoAberto = params.has('expand') // captura de tela precisa ver tudo

// ordem da tabela de agentes; campo vazio = agrupado por urgência
const ordem = { campo: '', desc: true, ...JSON.parse(localStorage.getItem('cc-ordem') || '{}') }

const ZONES = [
  { key: 'waiting', title: 'precisa de você' },
  { key: 'failed', title: 'falhou' },
  { key: 'working', title: 'trabalhando' },
  { key: 'idle', title: 'parados' },
  { key: 'done', title: 'prontos' },
]
const LABEL = { working: 'ativos', waiting: 'esperando', failed: 'falharam', done: 'prontos', idle: 'parados' }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const age = (ms) => {
  if (!(ms >= 0)) return '—'
  const m = Math.floor(ms / 6e4)
  if (m < 60) return m + 'm'
  const h = Math.floor(m / 60)
  return h < 24 ? h + 'h' + String(m % 60).padStart(2, '0') : Math.floor(h / 24) + 'd' + (h % 24) + 'h'
}
const tok = (n) => !n ? '—' : n < 1e3 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(1) + 'M'
const byId = (id) => DATA.jobs.find((j) => j.id === id)

function filtered() {
  const q = $('#q').value.trim().toLowerCase()
  const proj = $('#proj').value
  return DATA.jobs.filter((j) => {
    if (proj && j.project !== proj) return false
    if (!q) return true
    return [j.subject, j.route, j.project, j.sub, j.category, j.detail, j.model, j.id, j.lastPrompt,
      ...j.todos.map((t) => t.text)].join(' ').toLowerCase().includes(q)
  })
}

/* ============================ topo ============================ */

function renderHeader() {
  const s = DATA.summary
  $('#counts').innerHTML = ['waiting', 'failed', 'working', 'idle', 'done']
    .map((k) => {
      const n = s[k] ?? 0
      const hot = n > 0 && (k === 'waiting' || k === 'failed')
      return `<span class="count${hot ? ' hot' : ''}" style="${hot ? `color:var(--${k})` : ''}"><b>${n}</b>${LABEL[k]}</span>`
    }).join('') + `<span class="count"><b>${tok(s.tokens)}</b>tokens</span>`

  const sel = $('#proj'), cur = sel.value
  sel.innerHTML = ['<option value="">todos os projetos</option>']
    .concat((s.projects || []).map((p) => `<option${p === cur ? ' selected' : ''}>${esc(p)}</option>`)).join('')

  const counts = {
    agentes: DATA.jobs.length,
    todos: DATA.jobs.reduce((a, j) => a + j.todos.filter((t) => !t.done).length, 0),
    projetos: (s.projects || []).length,
    servidores: SERVERS ? SERVERS.filter((x) => x.dev).length : null,
  }
  $('#tabs').innerHTML = TABS.map((t) => `
    <button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}">
      ${t.label}${counts[t.id] != null ? `<span class="n">${counts[t.id]}</span>` : ''}
    </button>`).join('')
}

/* ======================= aba: agentes ======================== */

function row(j, maxTok, total) {
  // "done" repetiria o ponto verde e a zona: nota só quando acrescenta algo
  const note = j.stale ? `<div class="note warn clip">sem sinal há ${age(j.idleMs)}</div>`
    : j.blockers.length ? `<div class="note bad clip">${esc(j.blockers[0])}</div>`
    : j.inFlight.length ? `<div class="note clip">${esc(j.inFlight[0].label)}</div>`
    : j.lastPrompt ? `<div class="note clip">${esc(j.lastPrompt)}</div>`
    : j.detail ? `<div class="note clip">${esc(j.detail)}</div>` : ''
  const pct = j.todos.length ? Math.round((j.todosDone / j.todos.length) * 100) : 0
  const fatia = total ? Math.round((j.tokens / total) * 100) : 0
  return `
    <tr class="row${selected === j.id ? ' sel' : ''}${j.pinned ? ' pinned' : ''}" data-job="${j.id}"
        style="color:var(--${j.status})" tabindex="0" title="${j.pinned ? 'fixado · ' : ''}${esc(j.id)}">
      <td><i class="dot s-${j.status}"></i></td>
      <td>
        <div class="subject clip" style="color:var(--fg)">
          ${j.category ? `<span class="cat">${esc(j.category)}</span>` : ''}
          <b class="clip">${esc(j.subject)}</b>
        </div>${note}
        <div class="path clip only-xs">${esc(j.project)}<em>/${esc(j.route)}</em></div>
      </td>
      <td class="path clip hide-xs" title="${esc(j.project)}/${esc(j.route)}">${esc(j.project)}<em>/${esc(j.route)}</em></td>
      <td class="path hide-sm">${esc(j.model)}</td>
      <td class="num hide-sm">${tok(j.tokens)}</td>
      <td class="hide-sm">
        <div class="tokbar" title="${tok(j.tokens)} tokens · ${esc(j.model)} · ${fatia}% do total na tela">
          <i style="width:${maxTok ? Math.max((j.tokens / maxTok) * 100, j.tokens ? 1.5 : 0) : 0}%"></i>
        </div>
      </td>
      <td>${j.todos.length
        ? `<span class="num">${j.todosDone}/${j.todos.length}</span><div class="bar-todo"><i style="width:${pct}%"></i></div>`
        : '<span class="path">—</span>'}</td>
      <td class="acts">
        <button data-act="resume" data-id="${j.id}" ${j.sessionId ? '' : 'disabled'}
          title="${j.sessionId ? 'copiar claude --resume' : 'sem sessão para retomar'}">↻</button>
        <button data-act="pin" data-id="${j.id}" class="${j.pinned ? 'on' : ''}"
          title="${j.pinnedAqui ? 'desafixar' : j.pinned ? 'fixado pelo Claude Code' : 'fixar no topo'}"
          ${j.pinned && !j.pinnedAqui ? 'disabled' : ''}>${j.pinned ? '★' : '☆'}</button>
        <button data-act="path" data-id="${j.id}" title="copiar o caminho da pasta">⧉</button>
      </td>
    </tr>`
}

const CAMPOS = {
  subject: (j) => j.subject.toLowerCase(),
  project: (j) => `${j.project}/${j.route}`.toLowerCase(),
  model: (j) => j.model.toLowerCase(),
  tokens: (j) => j.tokens || 0,
  todos: (j) => (j.todos.length ? j.todosDone / j.todos.length : -1),
}

function ordenar(lista) {
  const f = CAMPOS[ordem.campo]
  if (!f) return lista
  const dir = ordem.desc ? -1 : 1
  return [...lista].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1 // fixado fica no topo
    const [x, y] = [f(a), f(b)]
    return (x < y ? -1 : x > y ? 1 : 0) * dir
  })
}

const th = (campo, rotulo, classe = '') => {
  const ativo = ordem.campo === campo
  return `<th class="${classe}${ativo ? ' ativo' : ''}">
    <button data-sort="${campo}">${rotulo}${ativo ? `<span class="dir">${ordem.desc ? '▾' : '▴'}</span>` : ''}</button>
  </th>`
}

function viewAgentes(jobs) {
  const maxTok = Math.max(0, ...jobs.map((j) => j.tokens || 0))
  const total = jobs.reduce((a, j) => a + (j.tokens || 0), 0)
  const linhas = (lista) => lista.map((j) => row(j, maxTok, total)).join('')

  // Ordenar por coluna desliga as zonas: comparar tokens dentro de cada faixa
  // de urgência esconde justamente o agente caro que se quer achar.
  const body = ordem.campo
    ? `<tbody>${linhas(ordenar(jobs))}</tbody>`
    : ZONES.map((z) => {
        const list = jobs.filter((j) => j.status === z.key)
        if (!list.length) return ''
        const hidden = collapsed.has(z.key)
        return `<tbody>
          <tr class="zone"><td colspan="8"><div class="bar">
            <button data-zone="${z.key}" aria-expanded="${!hidden}">
              <span class="z-${z.key}">${z.title}</span> <span class="n">${list.length}</span>
              ${hidden ? '<span class="n">▸</span>' : ''}
            </button><span class="rule"></span>
          </div></td></tr>
          ${hidden ? '' : linhas(list)}
        </tbody>`
      }).join('')

  const aviso = ordem.campo
    ? `<div class="aviso-ordem">
        <span>ordenado por ${esc(ordem.campo)} — zonas desligadas</span>
        <button data-sort="">voltar a agrupar por urgência</button>
      </div>`
    : ''

  return `${aviso}<table>
    <colgroup><col class="c-dot"><col><col class="c-path">
      <col class="c-model"><col class="c-tok"><col class="c-bar"><col class="c-todo"><col class="c-acts"></colgroup>
    <thead><tr>
      <th></th>
      ${th('subject', 'assunto')}
      ${th('project', 'projeto / rota', 'hide-xs')}
      ${th('model', 'modelo', 'hide-sm')}
      ${th('tokens', 'tokens', 'hide-sm')}
      <th class="hide-sm">gasto</th>
      ${th('todos', 'to-do')}
      <th></th>
    </tr></thead>${body}</table>`
}

/* ======================== aba: to-dos ======================== */

function viewTodos(jobs) {
  const comTodo = jobs.filter((j) => j.todos.length)
  const semTodo = jobs.filter((j) => !j.todos.length)
  if (!jobs.length) return '<div class="empty">nenhum agente no filtro</div>'

  const item = (j, t, i) => `
    <div class="item${t.done ? ' done' : ''}">
      <input type="checkbox" data-todo="${j.id}" data-i="${i}" ${t.done ? 'checked' : ''}
        aria-label="marcar como feita">
      <input class="txt" value="${esc(t.text)}" data-edit="${j.id}" data-i="${i}"
        aria-label="texto da tarefa" placeholder="descreva a tarefa — em branco, ela some">
    </div>`

  // Cabeçalho por agente: sem isso "projeto/rota · assunto" se repetiria em
  // toda linha da lista.
  const grupo = (j) => {
    const marcados = j.todos.map((t, i) => ({ t, i }))
    const abertos = marcados.filter(({ t }) => !t.done)
    const feitos = marcados.filter(({ t }) => t.done)
    return `<section class="grupo">
      <div class="g-head" style="color:var(--${j.status})">
        <i class="dot s-${j.status}" style="margin:0;position:relative;top:1px"></i>
        <span class="path" data-job="${j.id}" tabindex="0" title="abrir o agente"
          >${esc(j.project)}<em>/${esc(j.route)}</em></span>
        <b class="clip" style="flex:1;color:var(--fg)">${esc(j.subject)}</b>
        <span class="n">${abertos.length}</span>
        <button class="g-add" data-add="${j.id}" title="nova tarefa neste agente">+</button>
      </div>
      ${abertos.map(({ t, i }) => item(j, t, i)).join('')}
      ${feitos.length ? `
        <details class="lvl"${feitosAbertos.has(j.id) || tudoAberto ? ' open' : ''} data-feitos="${j.id}">
          <summary>${feitos.length} concluída${feitos.length > 1 ? 's' : ''}</summary>
          ${feitos.map(({ t, i }) => item(j, t, i)).join('')}
        </details>` : ''}
      ${!abertos.length && !feitos.length ? '<div class="path" style="padding:3px 5px">sem tarefa</div>' : ''}
    </section>`
  }

  return `<div class="lista">
    ${comTodo.length ? comTodo.map(grupo).join('') : '<div class="path">nenhum agente registrou tarefa ainda</div>'}
    ${semTodo.length ? `
      <details class="lvl outros"${tudoAberto ? ' open' : ''}>
        <summary>abrir tarefa em outro agente (${semTodo.length})</summary>
        ${semTodo.map(grupo).join('')}
      </details>` : ''}
  </div>`
}

/* ======================= aba: projetos ======================= */

function viewProjetos(jobs) {
  const groups = new Map()
  for (const j of jobs) {
    if (!groups.has(j.project)) groups.set(j.project, [])
    groups.get(j.project).push(j)
  }
  if (!groups.size) return '<div class="empty">nenhum projeto no filtro</div>'

  return `<div class="projs">${[...groups].map(([name, list]) => {
    const tokens = list.reduce((a, j) => a + (j.tokens || 0), 0)
    const rotas = [...new Set(list.map((j) => j.route))]
    const abertos = list.filter((j) => j.todos.some((t) => !t.done)).length
    const porStatus = ZONES.map((z) => {
      const n = list.filter((j) => j.status === z.key).length
      return n ? `<span style="color:var(--${z.key})">${n} ${z.title}</span>` : ''
    }).filter(Boolean).join(' · ')
    return `<div class="proj">
      <div class="hd">
        <div class="name">${esc(name)}</div>
        <div class="sub">${list.length} agentes · ${tok(tokens)} tokens${abertos ? ` · ${abertos} com to-do aberto` : ''}</div>
        <div class="sub" style="color:var(--dim)">${porStatus}</div>
        <div class="sub">rotas: ${rotas.map(esc).join(', ')}</div>
      </div>
      ${list.map((j) => `
        <div class="item" data-job="${j.id}" tabindex="0">
          <i class="dot s-${j.status}" style="margin-top:6px"></i>
          <span class="clip" style="flex:1">${esc(j.subject)}</span>
          <span class="path">${esc(j.route)}</span>
        </div>`).join('')}
    </div>`
  }).join('')}</div>`
}

/* ======================== aba: tempo ========================= */

const horas = (ms) => {
  const min = Math.round(ms / 60_000)
  return `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`
}
const usd = (n) => (n >= 1000 ? `$${(n / 1000).toFixed(1)}k` : `$${n.toFixed(2)}`)
// Valor de projeto é número que vai pra proposta: sem abreviar em "k", porque
// R$ 12,4k não se cola num orçamento. Centavos só abaixo de cem reais — num
// custo de API de R$ 3,74 eles são a informação, num projeto de R$ 15 mil são ruído.
const brl = (n) => {
  const casas = Math.abs(n) < 100 ? 2 : 0
  return n.toLocaleString('pt-BR', {
    style: 'currency', currency: 'BRL', minimumFractionDigits: casas, maximumFractionDigits: casas,
  })
}
const dataCurta = (dia) => dia.slice(8) + '/' + dia.slice(5, 7)
const diaDe = (ms) => new Date(ms).toISOString().slice(0, 10)

function viewTempo() {
  if (!TEMPO) return '<div class="empty">lendo os transcritos… a primeira vez varre ~800 MB</div>'
  if (TEMPO.error) return `<div class="empty">não deu para ler os transcritos: ${esc(TEMPO.error)}</div>`

  const ctl = `
    <div class="t-ctl">
      <label>parada que encerra
        <select data-tempo="corte">${[2, 5, 10, 15, 30, 60].map((m) =>
          `<option value="${m}"${m === TEMPO.corteMin ? ' selected' : ''}>${m} min</option>`).join('')}</select>
      </label>
      <label>de <input type="date" data-tempo="de" value="${esc(TEMPO.de || '')}"></label>
      <label>até <input type="date" data-tempo="ate" value="${esc(TEMPO.ate || '')}"></label>
      ${TEMPO.de || TEMPO.ate ? '<button class="btn" data-tempo-limpar>período inteiro</button>' : ''}
      <label title="0 esconde a coluna de valor">R$ por hora
        <input type="number" min="0" step="10" class="t-taxa" data-taxa value="${TEMPO.taxaGlobal || ''}" placeholder="—">
      </label>
      <label title="quanto você paga de assinatura por mês; 0 mostra só o preço de API">assinatura/mês
        <input type="number" min="0" step="10" class="t-taxa" data-assinatura
          value="${TEMPO.assinaturaMes || ''}" placeholder="—">
      </label>
      <label title="${TEMPO.cambio.em
        ? `cotação de ${new Date(TEMPO.cambio.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}${
            TEMPO.cambio.manual ? ', digitada por você' : ', buscada automaticamente'}`
        : 'sem cotação — digite uma para ver o custo em real'}">dólar
        <input type="number" min="0" step="0.01" class="t-taxa" data-cambio
          value="${TEMPO.cambio.brlPorUsd ? TEMPO.cambio.brlPorUsd.toFixed(2) : ''}" placeholder="—">

      <button class="btn" data-tempo-recarregar>reler transcritos</button>
    </div>`

  const aviso = `<p class="t-aviso">
    Tempo ativo é a soma dos intervalos entre mensagens, descartando as paradas maiores
    que o corte acima. <b>Agente rodando sozinho conta como trabalho</b>, e tempo lendo
    código ou em reunião não conta. O custo é o preço de API dos tokens gastos —
    referência de esforço, não o que foi cobrado de você na assinatura.
    ${TEMPO.cambio.brlPorUsd
      ? `Convertido a ${brl(TEMPO.cambio.brlPorUsd)} por dólar${TEMPO.cambio.manual

  if (!TEMPO.projetos.length) return ctl + aviso + '<div class="empty">nenhum trabalho no período</div>'

  const totalMs = TEMPO.projetos.reduce((a, p) => a + p.ativoMs, 0)
  const totalUsd = TEMPO.projetos.reduce((a, p) => a + p.custo, 0)
  // A coluna de valor só existe depois que uma taxa foi definida: sem taxa,
  // mostrar R$ 0,00 em toda linha diria que o trabalho não vale nada.
  const comValor = TEMPO.projetos.some((p) => p.taxaHora > 0)
  const comReal = TEMPO.assinaturaMes > 0
  const comSobra = comValor && comReal
  const cls = `${comValor ? ' com-valor' : ''}${comReal ? ' com-real' : ''}${comSobra ? ' com-sobra' : ''}`

  const barras = (dias) => {
    const maior = Math.max(...dias.map((d) => d.ativoMs))
    return `<div>
      <h3>por dia</h3>
      <div class="t-dias">${dias.map((d) => `
        <div class="t-dia" title="${d.dia}: ${horas(d.ativoMs)}">
          <i style="height:${Math.max((d.ativoMs / maior) * 100, 2)}%"></i>
        </div>`).join('')}</div>
      <div class="t-eixo"><span>${dataCurta(dias[0].dia)}</span>
        <span>${horas(maior)} no melhor dia</span>
        <span>${dataCurta(dias[dias.length - 1].dia)}</span></div>
    </div>`
  }

  const proj = (p) => {
    const aberto = tempoAberto.has(p.projeto) || tudoAberto
    const porDia = p.diasTrabalhados ? p.ativoMs / p.diasTrabalhados : 0
    return `<div class="t-proj">
      <div class="t-linha${cls}" data-tempo-proj="${esc(p.projeto)}" tabindex="0">
        <span class="nome">${aberto ? '▾' : '▸'} ${esc(p.projeto)}</span>
        <span class="v h">${horas(p.ativoMs)}</span>
        <span class="v path">${p.diasTrabalhados}d</span>
        <span class="v path">${horas(porDia)}/dia</span>
        <span class="v num">${tok(p.tokens)}</span>
        <span class="v cif" title="${usd(p.custo)} de API">${p.custoBrl == null ? usd(p.custo) : brl(p.custoBrl)}</span>
        <span class="v path">${!p.ativoMs ? '—' : (() => {
          const porHora = p.custo / (p.ativoMs / 36e5)
          return TEMPO.cambio.brlPorUsd ? brl(porHora * TEMPO.cambio.brlPorUsd) + '/h' : usd(porHora) + '/h'
        })()}</span>
        ${comReal ? `<span class="v real" title="fatia da assinatura pelas horas deste projeto em cada mês">${brl(p.custoReal)}</span>` : ''}
        ${comValor ? `<span class="v val" title="${p.taxaHora ? `${horas(p.ativoMs)} a ${brl(p.taxaHora)}/h${p.taxaPropria ? ' (taxa deste projeto)' : ''}` : 'sem taxa'}">${
          p.taxaHora ? brl(p.valor) : '—'}</span>` : ''}
        ${comSobra ? `<span class="v ${p.sobra == null ? '' : p.sobra >= 0 ? 'ok' : 'ruim'}">${
          p.sobra == null ? '—' : brl(p.sobra)}</span>` : ''}
      </div>
      ${aberto ? `<div class="t-corpo">
        <div class="t-valor">
          <label>R$ por hora aqui
            <input type="number" min="0" step="10" class="t-taxa" data-taxa
              data-projeto="${esc(p.projeto)}"
              value="${p.taxaPropria ? p.taxaHora : ''}"
              placeholder="${TEMPO.taxaGlobal || '—'}">
          </label>
          ${p.taxaHora ? `<b>${brl(p.valor)}</b>
            <span class="path">${horas(p.ativoMs)} × ${brl(p.taxaHora)}/h${
              p.taxaPropria ? '' : ' (taxa global)'} · API ${
              p.custoBrl == null ? usd(p.custo) : `${brl(p.custoBrl)} (${usd(p.custo)})`}</span>`
            : '<span class="path">defina a taxa para ver o valor do projeto</span>'}
          ${p.custoReal == null ? '' : `<span class="path">· assinatura ${brl(p.custoReal)}${
            p.sobra == null ? '' : ` · <b class="${p.sobra >= 0 ? 'ok' : 'ruim'}">sobra ${brl(p.sobra)}</b>`}</span>`}
        </div>
        ${p.dias.length ? barras(p.dias) : ''}
        <div>
          <h3>gasto por modelo</h3>
          <table class="t-ses">
            <tr class="path"><td>modelo</td><td class="num">entrada</td><td class="num">saída</td>
              <td class="num">cache escrito</td><td class="num">cache lido</td><td class="num">custo</td></tr>
            ${p.uso.map((u) => `
              <tr>
                <td style="color:var(--fg)">${esc(u.modelo)}</td>
                <td class="num">${tok(u.input)}</td>
                <td class="num">${tok(u.output)}</td>
                <td class="num">${tok(u.escrita5m + u.escrita1h)}</td>
                <td class="num">${tok(u.leitura)}</td>
                <td class="num cif" title="${u.custo == null ? '' : usd(u.custo) + ' de API'}">${
                  u.custo == null ? '<em class="path">sem preço</em>'
                    : TEMPO.cambio.brlPorUsd ? brl(u.custo * TEMPO.cambio.brlPorUsd) : usd(u.custo)}</td>
              </tr>`).join('')}
          </table>
          <p class="path" style="margin:6px 0 0">
            releitura de cache costuma ser a maior fatia do volume e a menor do preço — custa 10% da entrada.
          </p>
        </div>
        <div>
          <h3>sessões — ${p.sessoes.length}</h3>
          <table class="t-ses">${p.sessoes.slice(0, 40).map((s) => {
            const fmt = (ms, opts) => new Date(ms).toLocaleString('pt-BR', opts)
            const mesmoDia = diaDe(s.inicio) === diaDe(s.fim)
            // sessão de madrugada com agente autônomo cruza o dia; mostrar só
            // o começo faria parecer que 19h de trabalho couberam num dia
            const quando = mesmoDia
              ? fmt(s.inicio, { dateStyle: 'short', timeStyle: 'short' })
              : `${fmt(s.inicio, { dateStyle: 'short', timeStyle: 'short' })} → ${fmt(s.fim, { dateStyle: 'short', timeStyle: 'short' })}`
            return `<tr>
              <td class="path">${quando}</td>
              <td class="num" style="color:var(--fg);width:70px">${horas(s.ativoMs)}</td>
              <td class="path num" style="width:80px" title="janela do começo ao fim">${horas(s.fim - s.inicio)} corridas</td>
              <td class="path clip" title="${esc(s.id)}">${esc(s.id.slice(0, 8))}</td>
            </tr>`
          }).join('')}
          </table>
          ${p.sessoes.length > 40 ? `<p class="path" style="margin:6px 0 0">mostrando as 40 mais recentes de ${p.sessoes.length}</p>` : ''}
        </div>
      </div>` : ''}
    </div>`
  }

  const totalValor = TEMPO.projetos.reduce((a, p) => a + p.valor, 0)
  return `${ctl}${aviso}
    <div class="t-linha t-head${cls}">
      <span>projeto</span><span class="v">horas</span><span class="v">dias</span>
      <span class="v">média</span><span class="v">tokens</span><span class="v">custo api</span><span class="v">por hora</span>
      ${comReal ? '<span class="v">custo real</span>' : ''}
      ${comValor ? '<span class="v">valor</span>' : ''}

    ${TEMPO.projetos.map(proj).join('')}
    <div class="t-linha${cls}" style="border-top:1px solid var(--line);cursor:default">
      <span class="nome" style="color:var(--faint)">total</span>
      <span class="v h">${horas(totalMs)}</span><span class="v"></span><span class="v"></span>
      <span class="v num">${tok(TEMPO.projetos.reduce((a, p) => a + p.tokens, 0))}</span>
      <span class="v cif" title="${usd(totalUsd)} de API">${
        TEMPO.cambio.brlPorUsd ? brl(totalUsd * TEMPO.cambio.brlPorUsd) : usd(totalUsd)}</span>
      <span class="v path">${!totalMs ? '' : (() => {
        const porHora = totalUsd / (totalMs / 36e5)
        return TEMPO.cambio.brlPorUsd ? brl(porHora * TEMPO.cambio.brlPorUsd) + '/h' : usd(porHora) + '/h'
      })()}</span>
      ${comReal ? `<span class="v real">${brl(TEMPO.projetos.reduce((a, p) => a + (p.custoReal || 0), 0))}</span>` : ''}
      ${comValor ? `<span class="v val">${brl(totalValor)}</span>` : ''}
      ${comSobra ? (() => {
        const s = TEMPO.projetos.reduce((a, p) => a + (p.sobra || 0), 0)
        return `<span class="v ${s >= 0 ? 'ok' : 'ruim'}">${brl(s)}</span>`
      })() : ''}
    </div>`
}

/* ======================== aba: gráficos ======================
   Os dados são os mesmos da aba de tempo — nada é lido de novo. O que muda é
   que aqui eles viram fatos soltos, que o motor em graficos.js cruza. */

let GRAFICOS = null          // null = nunca mexeu, mostra os prontos
// ?novo=1 e ?indice=1 abrem o construtor e o índice já na carga — sem eles não
// dá pra conferir nenhum dos dois numa captura de tela.
let rascunho = params.has('novo')
  ? { forma: 'barras', dimensao: 'projeto', serie: 'nenhuma', medida: 'horas', nome: '' }
  : null
let indiceAberto = params.has('indice')

/** Um id curto e estável, para o cartão sobreviver a reordenar e reeditar. */
const novoIdGrafico = () => 'g' + Math.random().toString(36).slice(2, 8)

const graficosAtuais = () => GRAFICOS
  || CCGraficos.PRONTOS.map((g) => ({ ...g, id: novoIdGrafico() }))

/**
 * As duas tabelas de fatos. `tempo` carrega a taxa e o custo/hora do mês junto
 * de cada linha: assim o motor calcula valor e sobra sem saber de configuração.
 */
function fatosDe(T) {
  const custoHoraMes = Object.fromEntries((T.meses || []).map((m) => [m.mes, m.custoHora]))
  const cambio = T.cambio.brlPorUsd || 0
  const tempo = []
  const uso = []
  for (const p of T.projetos) {
    for (const d of p.dias) {
      tempo.push({
        projeto: p.projeto, dia: d.dia, ms: d.ativoMs,
        taxaHora: p.taxaHora || 0,
        custoHoraMes: custoHoraMes[d.dia.slice(0, 7)] || 0,
      })
    }
    for (const u of p.usoDias || []) {
      // Converte aqui e não no motor: o motor não deve saber de moeda.
      uso.push({ ...u, projeto: p.projeto, custo: (u.custo || 0) * (cambio || 1) })
    }
  }
  return { tempo, uso }
}

const fmtG = (v, tipo) => {
  if (tipo === 'horas') return horas(v * 36e5)
  if (tipo === 'brl') return brl(v)
  if (tipo === 'tok') return tok(Math.round(v))
  if (tipo === 'moeda') return TEMPO.cambio.brlPorUsd ? brl(v) : usd(v)
  return String(Math.round(v))
}

function seletor(nome, opcoes, atual) {
  return `<select data-rasc="${nome}">${opcoes.map(([id, rot]) =>
    `<option value="${esc(id)}"${id === atual ? ' selected' : ''}>${esc(rot)}</option>`).join('')}</select>`
}

function construtor(idx, estado) {
  const s = rascunho
  const erro = CCGraficos.validar(s, estado)
  return `<div class="g-form">
    <div class="g-campos">
      <label>forma ${seletor('forma', Object.entries(CCGraficos.FORMAS).map(([id, f]) => [id, f.rotulo]), s.forma)}</label>
      <label>medida ${seletor('medida', idx.medidas.map((m) => [m.id, m.rotulo]), s.medida)}</label>
      <label>eixo ${seletor('dimensao', Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([id, d]) => [id, d.rotulo]), s.dimensao)}</label>
      <label>dividir por ${seletor('serie', Object.entries(CCGraficos.DIMENSOES).map(([id, d]) => [id, d.rotulo]), s.serie)}</label>
      <label>nome <input type="text" data-rasc="nome" value="${esc(s.nome || '')}" placeholder="${esc(CCGraficos.descrever(s))}"></label>
      <span class="grow"></span>
      <button class="btn" data-g-salvar${erro ? ' disabled' : ''}>${s.id ? 'salvar' : 'adicionar'}</button>
      <button class="btn" data-g-cancelar>cancelar</button>
    </div>
    ${erro ? `<div class="g-erro">${esc(erro)}</div>`
      : `<div class="g-previa">${CCGraficos.desenhar(s, fatosDe(TEMPO), fmtG, estado)}</div>`}
  </div>`
}

function viewIndice(idx) {
  if (!indiceAberto) return ''
  const fonteDe = (f) => (f === 'tempo' ? 'relógio' : 'uso de token')
  return `<div class="g-indice">
    <div>
      <h3>medidas</h3>
      <table class="g-tab">
        ${idx.medidas.map((m) => `<tr><td>${esc(m.rotulo)}</td><td class="path">vem do ${fonteDe(m.fonte)}</td></tr>`).join('')}
        ${idx.bloqueadas.map((m) => `<tr class="off"><td>${esc(m.rotulo)}</td>
          <td class="path">falta ${esc(m.precisa.replace('+', ' e '))} — defina na aba tempo</td></tr>`).join('')}
      </table>
    </div>
    <div>
      <h3>eixos</h3>
      <table class="g-tab">
        ${Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([, d]) =>
          `<tr><td>${esc(d.rotulo)}</td><td class="path">${d.fontes.length === 2
            ? 'cruza com qualquer medida'
            : `só com medidas do ${fonteDe(d.fontes[0])}`}</td></tr>`).join('')}
      </table>
      <p class="path" style="margin:10px 0 0">
        O relógio não sabe qual modelo rodou, e o uso de token não sabe quanto tempo levou.
        Por isso horas não cruza com modelo — e o construtor avisa em vez de desenhar zero.
      </p>
    </div>
  </div>`
}

function viewGraficos() {
  if (!TEMPO) return '<div class="empty">lendo os transcritos… a primeira vez varre ~800 MB</div>'
  if (TEMPO.error) return `<div class="empty">não deu para ler os transcritos: ${esc(TEMPO.error)}</div>`

  const estado = {
    temTaxa: TEMPO.projetos.some((p) => p.taxaHora > 0),
    temAssinatura: TEMPO.assinaturaMes > 0,
  }
  const idx = CCGraficos.indice(estado)
  const dados = fatosDe(TEMPO)
  const lista = graficosAtuais()

  const barra = `<div class="t-ctl">
    <button class="btn" data-g-novo${rascunho ? ' disabled' : ''}>+ gráfico</button>
    <button class="btn${indiceAberto ? ' on' : ''}" data-g-indice>o que dá pra cruzar</button>
    ${GRAFICOS ? '<button class="btn" data-g-restaurar>voltar aos prontos</button>' : ''}
    <span class="grow"></span>
    <span class="path">período e corte saem da aba tempo${
      TEMPO.de || TEMPO.ate ? ` · recorte ativo` : ''}</span>
  </div>`

  const cartoes = lista.map((g) => `
    <section class="g-card">
      <header>
        <b>${esc(g.nome || CCGraficos.descrever(g))}</b>
        <span class="path">${esc(CCGraficos.descrever(g))}</span>
        <span class="grow"></span>
        <button class="btn min" data-g-editar="${esc(g.id)}" title="editar">✎</button>
        <button class="btn min" data-g-remover="${esc(g.id)}" title="remover">✕</button>
      </header>
      ${CCGraficos.desenhar(g, dados, fmtG, estado)}
    </section>`).join('')

  return barra + viewIndice(idx)
    + (rascunho ? construtor(idx, estado) : '')
    + (lista.length ? `<div class="g-grade">${cartoes}</div>`
      : '<div class="empty">nenhum gráfico — use o + acima</div>')
}

async function gravarGraficos(lista) {
  GRAFICOS = lista
  render()
  await fetch('/api/graficos', { method: 'POST', body: JSON.stringify({ graficos: lista }) })
}

/* ====================== aba: servidores ====================== */

function viewServidores() {
  if (!SERVERS) return '<div class="empty">lendo as portas em escuta…</div>'
  const dev = SERVERS.filter((s) => s.dev)
  const resto = SERVERS.filter((s) => !s.dev)

  // O começo do caminho é sempre o mesmo; o que identifica o app está no fim.
  const cauda = (p, n = 42) => (p.length > n ? '…' + p.slice(-(n - 1)) : p)

  const linha = (s) => `
    <tr>
      <td class="port" style="width:80px">${s.ports.join(', ')}</td>
      <td style="width:74px"><span class="cat">${esc(s.kind)}</span></td>
      <td class="clip" title="${esc(s.cmd)}">
        <span style="color:var(--fg)">${esc(s.project || s.name)}</span>
        ${s.path ? `<div class="path">${esc(cauda(s.path))}</div>` : ''}
      </td>
      <td class="path" style="width:90px">${s.startedAt ? 'há ' + age(Date.now() - s.startedAt) : '—'}</td>
      <td class="path" style="width:90px">pid ${s.pid}</td>
      <td style="width:150px;text-align:right;white-space:nowrap">
        ${s.url ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">abrir</a>` : ''}
        ${s.dev && !s.protegido
          ? `<button class="btn danger" data-kill="${s.pid}">${armed === s.pid ? 'confirmar?' : 'encerrar'}</button>`
          : ''}
      </td>
    </tr>`

  // duas instâncias do mesmo projeto quase sempre é uma esquecida de ontem
  const porProjeto = new Map()
  for (const s of dev) if (s.project) porProjeto.set(s.project, (porProjeto.get(s.project) || 0) + 1)
  const dobrados = [...porProjeto].filter(([, n]) => n > 1)

  return `
    <div class="col-head"><span>servidores de projeto</span><span class="n">${dev.length}</span></div>
    ${dobrados.length ? `<p class="note warn" style="margin:0 0 10px">${
      dobrados.map(([p, n]) => `${esc(p)} está com ${n} servidores abertos`).join(' · ')}</p>` : ''}
    ${dev.length ? `<table class="srv">${dev.map(linha).join('')}</table>`
      : '<div class="path">nenhum servidor de desenvolvimento escutando agora</div>'}
    <details class="lvl" style="margin-top:24px">
      <summary>outros processos com porta aberta (${resto.length})</summary>
      <table class="srv">${resto.map(linha).join('')}</table>
    </details>
    <p class="path" style="margin-top:20px">
      encerrar pede confirmação e só vale para servidor de desenvolvimento —
      processo do Windows fica de fora de propósito.
    </p>`
}

/* ==================== painel lateral ========================= */
