  .doc-card b { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
  .doc-card span { color: var(--faint); font-size: 11px; }
  /* O leitor tem medida propria, e ela nao e a do painel. Texto corrido em
     coluna larga se le mal — 68 caracteres e o limite classico, e aqui vale
     dobrado porque o documento e para LER, nao para bater o olho como a tabela
     de agentes. Corpo em 15px pelo mesmo motivo. */
  .doc-leitor { max-width: 68ch; font-size: 15px; line-height: 1.6; }
  .doc-leitor h1 {
    font: 700 22px/1.25 var(--sans, inherit); letter-spacing: normal;
    text-transform: none; white-space: normal; margin: 0 0 10px; overflow-wrap: anywhere;
  }
  .doc-leitor h2 { font-size: 17px; margin: 22px 0 8px; }
  .doc-leitor h3 { font-size: 15px; margin: 18px 0 6px; }
  .doc-leitor p { margin: 0 0 12px; }
  .doc-leitor ul { margin: 0 0 12px; padding-left: 20px; }
  .doc-leitor li { margin-bottom: 4px; }
  .doc-leitor blockquote {
    margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--faint);
    color: var(--dim); font-style: italic;
  }
  .doc-leitor pre { background: var(--surface); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  .doc-leitor code { background: var(--surface); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .doc-pe { color: var(--faint); font-size: 11px; margin-top: 20px; }

  #doc-edit {
    width: min(760px, 94vw); border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--fg); padding: 18px;
  }
  #doc-edit::backdrop { background: rgba(0, 0, 0, .6); }
  #doc-edit h2 { font: 700 13px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; margin: 0 0 14px; color: var(--dim); }
  #doc-edit input, #doc-edit textarea { width: 100%; margin-bottom: 10px; }
  #doc-edit textarea {
    font: 13px/1.55 var(--mono); resize: vertical; padding: 10px 12px;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
  }
  .doc-edit-pe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; }
  .btn.primario { border-color: var(--acento); color: var(--acento); }
  .btn.perigo { border-color: var(--failed); color: var(--failed); }
  .gl-card header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .gl-card p { margin: 0 0 8px; font-size: 12.5px; line-height: 1.45; }
  .gl-card footer { margin-top: 8px; }
  .gl-termos { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 11.5px; }
  .gl-termos dt { color: var(--fg); font-weight: 600; white-space: nowrap; }
  .gl-termos dd { color: var(--dim); margin: 0; }
  .gl-hits { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .gl-hit {
    display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
    border-left: 2px solid var(--acento); padding: 3px 0 3px 10px; font-size: 12px;
  }
  .gl-faltando { margin-top: 16px; }
  .gl-faltando summary { cursor: pointer; font-size: 11.5px; color: var(--dim); }

  /* Configuração da federação, na aba remoto. Rótulo em cima do campo abaixo de
     560px: no celular, rótulo e campo lado a lado deixam o campo com 40px. */
  .fed-bloco { border: 1px solid var(--faint); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .fed-bloco h3 { font-size: 12px; margin: 0 0 6px; }
  .fed-linha { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fed-linha label { font-size: 11px; color: var(--dim); min-width: 132px; }
  .fed-linha input {
    flex: 1; min-width: 180px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--faint); border-radius: 6px; padding: 5px 8px; font-size: 12px;
  }
  @container (max-width: 560px) { .fed-linha { flex-direction: column; align-items: stretch; } }
  .fw-lista { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .fw-linha {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 6px 10px; border: 1px solid var(--faint); border-radius: 8px; font-size: 11.5px;
  }

  /* CC-34: pastilhas de frente, sem biblioteca de grid/chart nenhuma. */
  .ck-mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .ck-mini-f {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
    border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
    max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* CC-81: a resposta nasce ao lado da pergunta. z-index acima do header
     (que é sticky com 30), senão fica cortado quando o player está tocando. */
  /* CC-87, a aba tempo em tela estreita. A tabela tem até 9 colunas de largura
     fixa, e ela é a que ele mais olha — no celular sobrava rolagem lateral e
     nenhuma leitura possível.

     Aqui as colunas de detalhe (dias, média, tokens, custo/hora) somem, e ficam
     projeto, horas e dinheiro: as três que respondem a pergunta do topo. O
     detalhe continua a um clique, no painel do projeto, que é o nível de baixo
     da árvore (CC-75). */
  @container (max-width: 620px) {
    .t-linha { grid-template-columns: 1fr 70px 76px !important; }
    .t-linha > span:nth-child(3),
    .t-linha > span:nth-child(4),
    .t-linha > span:nth-child(5),
    .t-linha > span:nth-child(7) { display: none; }
    .t-aviso { font-size: 11px; }
  }

  /* CC-91 parte 3: um pedido por linha, com botão próprio. Sem isto ele só
     tinha o "liberar tudo", que é o atalho que esvazia o modo. */
  .fw-pedidos { display: grid; gap: 4px; width: 100%; margin: 4px 0; }
  .fw-pedido { display: flex; align-items: center; gap: 8px; }
  .fw-pedido code { flex: 1 1 auto; font-size: 11.5px; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* CC-87, hooks agrupados por nível. A linha fantasma (ligada e não
     registrada) é a única que ganha cor: ela parece ativa e não faz nada. */
  .hk-grupo { margin-bottom: 14px; }
  .hk-linha.fantasma { border-left: 3px solid var(--failed); padding-left: 7px; }
  .hk-planejados { margin-top: 10px; }
  .hk-planejados summary { color: var(--dim); font-size: 12px; cursor: pointer; }

  /* CC-143: o formulário de projeto novo. Mora na mesma faixa dos módulos, e
     por isso usa o mesmo desenho de cartão da entrevista. */
  .np {
    margin: 10px 0 4px; padding: 12px 14px; border-radius: 9px;
    background: var(--card); border-left: 4px solid var(--acento);
  }
  .np-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 9px; margin: 10px 0; }
  .np-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--dim); }
  .np-form input, .np-form select {
    background: var(--bg); color: var(--fg); border: 1px solid var(--faint);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 12.5px; min-width: 150px;
  }
  .np-cresce { flex: 1 1 220px; }
  .np-cresce input { width: 100%; }
  .np-vai, .np-adiadas { font-size: 11px; line-height: 1.5; margin: 6px 0 0; }
  .np-pronto { font-size: .95rem; margin: 0 0 4px; }
  .np-caminho { font-size: 11.5px; color: var(--dim); }
  .np-passos { list-style: none; padding: 0; margin: 9px 0 0; display: grid; gap: 4px; font-size: 11.5px; }
  .np-passos li.ruim { color: var(--failed); }
  @container (max-width: 560px) {
    .np-form { flex-direction: column; align-items: stretch; }
    .np-form input, .np-form select { width: 100%; }
    /* Em coluna, `flex: 1 1 220px` cresce na VERTICAL: no telefone abriu um
       buraco de 150px entre o último campo e o botão "criar". A base de
       crescimento serve à linha, não à pilha. */
    .np-cresce { flex: 0 0 auto; }
  }

  /* CC-133: a entrevista, embaixo da linha do projeto dela.
     A pergunta é o maior texto da tela de propósito: é a única coisa que ele
     precisa ler para responder, e tudo o mais ali é apoio. */
  .ent {
    margin: -2px 0 8px; padding: 12px 14px; border-radius: 9px;
    background: var(--card); border-left: 4px solid var(--acento);
  }
  .ent-cab { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .ent-cab b { font-size: 12px; }
  .ent-prog {
    flex: 0 1 140px; height: 5px; border-radius: 3px; background: var(--faint); overflow: hidden;
  }
  .ent-prog i { display: block; height: 100%; background: var(--acento); }
  .ent-conta { font-size: 11px; }
  .ent-pergunta { font-size: 1.05rem; font-weight: 600; margin: 12px 0 4px; line-height: 1.35; }
  .ent-ajuda { color: var(--dim); font-size: .82rem; margin: 0 0 10px; line-height: 1.45; }
  .ent-ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 7px; }
  .ent-op {
    display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
    padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg);
  }
  .ent-op:hover, .ent-op:focus-visible { border-color: var(--acento); }
  .ent-op b { font-size: 12.5px; }
  .ent-op span { color: var(--dim); font-size: 11px; line-height: 1.35; }
  .ent-livre { display: flex; align-items: flex-end; gap: 8px; margin-top: 9px; }
  .ent-livre textarea {
    flex: 1; resize: vertical; min-height: 46px; font: inherit; font-size: 12.5px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--faint);
    border-radius: 7px; padding: 7px 9px;
  }
  .ent-antes { margin-top: 12px; }
  .ent-antes summary { color: var(--dim); font-size: 11.5px; cursor: pointer; }
  .ent-ja {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 5px 0; border-bottom: 1px solid var(--faint); font-size: 11.5px;
  }
  .ent-ja b { flex: 0 0 84px; color: var(--dim); font-weight: 500; }
  .ent-ja span { flex: 1 1 160px; }
  .ent-orfas { color: var(--waiting); font-size: 11.5px; margin: 8px 0 0; }
  .ent-pronto { font-size: .86rem; line-height: 1.5; margin: 10px 0 0; }
  /* No telefone o campo embaixo do botão vira duas linhas espremidas: empilha,
     e o botão ocupa a largura toda para virar alvo de toque de verdade. */
  @container (max-width: 560px) {
    .ent-livre { flex-direction: column; align-items: stretch; }
    .ent-prog { flex-basis: 90px; }
  }

  /* CC-91: o autorizar em linha própria, longe do seletor de modo. */
  .fw-aut {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-top: 8px; padding: 8px 11px; border-radius: 7px;
    background: var(--surface); border-left: 3px solid var(--waiting);
  }
  .fw-aut.ok { border-left-color: var(--done); }
  .fw-aut b { font-size: 12px; }
  .fw-aut .path { flex: 1 1 200px; }
  /* a confirmação da troca de modo: o que o ARQUIVO diz, não o que foi clicado */
  .fw-salvo {
    margin-top: 6px; font-size: 11.5px; color: var(--done);
  }
  .fw-salvo.ruim { color: var(--failed); font-weight: 600; }

  /* CC-87: o topo de toda tela. Mesmo desenho do veredito da VPS, que foi a
     primeira a usar — a barra colorida à esquerda é o que faz o olho pousar
     ali antes do conteúdo. */
  .tela-cabeca {
    display: flex; flex-direction: column; gap: 3px; padding: 11px 14px;
    border-radius: 9px; margin-bottom: 14px; background: var(--card);
    border-left: 4px solid var(--dim);
  }
  .tela-cabeca b { font-size: 1.02rem; }
  .tela-cabeca span { color: var(--dim); font-size: .88rem; }
  .tela-cabeca.v-bom { border-left-color: var(--done); }
  .tela-cabeca.v-atencao { border-left-color: var(--waiting); }
  .tela-cabeca.v-ruim { border-left-color: var(--failed); }

  /* CC-83: os três níveis de backlog. A coluna "agora" é derivada de quem
     tem agente — nunca digitada, senão vira artefato que envelhece. */
  .m-niveis { display: grid; gap: 8px; margin-bottom: 16px; }
  .m-nivel { padding: 9px 12px; border-radius: 8px; background: var(--surface);
    border-left: 3px solid var(--line); }
  .m-nivel.n-agora { border-left-color: var(--working); }
  .m-nivel.n-fila { border-left-color: var(--waiting); }
  .m-nivel.n-prontas { border-left-color: var(--done); opacity: .7; }
  .m-nivel-cab { display: flex; align-items: baseline; gap: 8px; }
  .m-nivel-cab b { font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; }
  .m-nivel-itens { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .m-nivel-itens span { font-size: 11px; padding: 2px 7px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--line); }

  /* CC-78: as rotas no mapa. Três cores, e a do meio é derivada. */
  .m-rotas { display: grid; gap: 6px; margin: 8px 0; }
  .m-rota {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface); color: var(--fg); cursor: pointer; font: inherit;
  }
  .m-rota:hover { border-color: var(--acento); }
  .m-rota i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--dim); }
  .m-rota.c-livre i { background: var(--done); }
  .m-rota.c-ocupada i { background: var(--failed); }
  /* azul: ocupada por quem sumiu. Não é escolha, é descoberta — por isso não
     entra no ciclo do clique. */
  .m-rota.c-orfa i { background: #4a8fd6; }
  .m-rota b { font-weight: 600; }
  .m-rota .path { margin-left: auto; }

  #frente-pop {
    position: fixed; z-index: 60; max-width: min(420px, calc(100vw - 16px));
    display: flex; flex-direction: column; gap: 6px; padding: 12px 14px;
    border: 1px solid var(--acento); border-radius: 10px; background: var(--bg);
    box-shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  /* CC-118: as mensagens recuperadas. Texto no tamanho de leitura (15px), não de
     tabela: é ditado por voz e pode ter cinquenta palavras. Fundo de superfície
     e fio na esquerda porque é fala DELE, o mesmo tratamento das citações. */
  /* CC-122: o que mudou desde a última olhada. Fio na esquerda porque é
     histórico, não tarefa: nada aqui se clica para fazer. */
  .dqo { margin: 10px 0 4px; border-left: 3px solid var(--done); padding-left: 12px; }
  .dqo summary { cursor: pointer; font-size: 14px; color: var(--dim); }
  .dqo summary b { color: var(--fg); }
  .dqo-lista { display: grid; gap: 6px; margin: 10px 0; max-height: 320px; overflow-y: auto; }
  .dqo-i { display: grid; gap: 1px; font-size: 13.5px; }
  .dqo-i i { font-style: normal; color: var(--done); }

  .fp-lista { display: grid; gap: 10px; margin-top: 12px; }
  .fp-item {
    background: var(--surface); border-radius: 12px; box-shadow: var(--sombra);
    border-left: 3px solid var(--acento); padding: 12px 14px;
  }
  .fp-item header { padding: 0; background: none; position: static; }
  .fp-item p { margin: 6px 0 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }

  #frente-pop .fp-cit {
    margin: 4px 0; padding-left: 10px; border-left: 2px solid var(--acento);
    color: var(--fg); font-style: italic;
  }
  #frente-pop .btn { align-self: flex-start; margin-top: 4px; }
  .ck-mini-f { background: none; cursor: pointer; font-family: inherit; text-align: left; }
  .ck-mini-f:hover { border-color: var(--acento); }
  /* CC-81, o peso. Derivado, nunca digitado: frente inteira, item com muitos
     filhos e item que traz as palavras dele pesam mais. Sem isto o mapa dá a
     mesma altura para uma frente e para um conserto de regex. */
  .ck-mini-f.p-2 { font-size: 11.5px; max-width: 300px; }
  .ck-mini-f.p-3 { font-size: 12.5px; max-width: 100%; font-weight: 600; border-width: 1px;
    background: var(--surface); padding: 5px 10px; }
  /* aspas: este item guarda o que ELE disse, e o clique mostra */
  .ck-mini-f .tem-fala { font-style: normal; color: var(--acento); font-size: 13px; line-height: 0; }
  .ck-mini-f b { font-weight: 500; color: var(--faint); margin-left: 2px; }
  /* Escopado à pastilha, não solto: uma .f-failed global já pintou fundo
     inteiro de cartão por engano nesta mesma aba (regra registrada no CLAUDE.md). */
  .ck-mini-f.f-failed { border-color: color-mix(in srgb, var(--failed) 45%, var(--line)); color: var(--failed); }
  .ck-mini-f.f-waiting { border-color: color-mix(in srgb, var(--waiting) 45%, var(--line)); color: var(--waiting); }
  .ck-mini-f.f-done { border-color: color-mix(in srgb, var(--done) 45%, var(--line)); color: var(--done); }
  .ck-mini-f.f-dim { color: var(--faint); }
  .ck-mini-f .dot { margin-right: 1px; }

  /* aba: remoto */
  .rm-lista { display: grid; gap: 2px; max-width: 720px; }
  .rm-linha {
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
    padding: 8px 10px; border-radius: 4px; border-bottom: 1px solid var(--line);
  }
  .rm-linha:hover { background: var(--surface); }
  .rm-nome { font-size: 13px; }

  /* CC-24: digest semanal, painel simples acima da lista de projetos. */
  .dg-cab { margin-bottom: 14px; }
  .dg-lista { display: grid; gap: 10px; margin-top: 10px; max-width: 900px; }
  .dg-proj { border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font-size: 12px; }
  .dg-item { padding: 2px 0 2px 10px; color: var(--faint); font-size: 11px; }

  /* ---------- projetos (visão antiga, ainda usada em outros lugares) ---------- */
  .projs { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  .proj { border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }
  .proj > .hd { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .proj .name { font: 700 15px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; }
  .proj .sub { color: var(--faint); font-size: 11px; margin-top: 6px; }
  .proj .item {
    display: flex; align-items: baseline; gap: 8px; padding: 7px 14px;
    border-top: 1px solid var(--line-soft); cursor: pointer;
  }
  .proj .item:hover { background: var(--surface-2); }

  /* ---------- tempo ---------- */
  .t-ctl {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 0 14px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
  }
  .t-ctl label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 11.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .t-ctl input[type=date], .t-ctl select {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); min-width: 0;
  }
  .t-aviso { color: var(--faint); font-size: 11px; max-width: 78ch; margin: 0 0 14px; }
  .t-aviso b { color: var(--waiting); font-weight: 400; }

  .t-proj { border-bottom: 1px solid var(--line-soft); }
  .t-linha {
    display: grid; gap: 12px; align-items: baseline; padding: 9px 4px;
    grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px; cursor: pointer;
  }
  /* Cada coluna opcional entra na grade só quando existe: sem isso, ligar a
     assinatura empurraria tudo e a linha estouraria o painel estreito. */
  .t-linha.com-valor { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 86px; }
  .t-linha.com-real  { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 80px; }
  .t-linha.com-valor.com-real { grid-template-columns: 1fr 74px 52px 62px 66px 78px 62px 80px 86px; }
  .t-linha.com-valor.com-real.com-sobra {
    grid-template-columns: 1fr 66px 44px 58px 60px 70px 58px 76px 82px 82px;
  }
  .t-linha:hover { background: var(--surface); }
  .t-linha .val { color: var(--fg); font-weight: 600; }
  .t-linha .real { color: var(--waiting); }
  .t-linha .ok { color: var(--done); font-weight: 600; }
  .t-linha .ruim { color: var(--failed); font-weight: 600; }
  .t-linha .nome { font: 700 13px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase; }
  .t-linha .v { text-align: right; font-variant-numeric: tabular-nums; }
  .t-linha .h { color: var(--fg); font-size: 14px; }
  .t-linha .cif { color: var(--done); }
  .t-head { color: var(--faint); cursor: default; padding-bottom: 4px; }
  .t-head:hover { background: none; }
  .t-head span {
    font: 700 11px/1.3 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .t-corpo { padding: 4px 4px 20px; display: grid; gap: 18px; }
  .t-taxa {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); width: 76px;
  }
  .t-valor { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .t-valor label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 11.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .t-valor b { font-size: 20px; color: var(--fg); font-weight: 600; }
  .t-valor b.ok { font-size: inherit; color: var(--done); }
  .t-valor b.ruim { font-size: inherit; color: var(--failed); }

  .t-dias { display: flex; align-items: flex-end; gap: 3px; height: 76px; }
  .t-dia { flex: 1; min-width: 4px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .t-dia > i { display: block; background: var(--working); opacity: .8; border-radius: 1px 1px 0 0; min-height: 2px; }
  .t-dia:hover > i { opacity: 1; background: var(--fg); }
  .t-eixo { display: flex; justify-content: space-between; color: var(--faint); font-size: 11.5px; margin-top: 5px; }

  .t-ses { width: 100%; border-collapse: collapse; }
  .t-ses td { padding: 4px 10px 4px 0; border-top: 1px solid var(--line-soft); font-size: 12px; }
  .t-ses .num { text-align: right; font-variant-numeric: tabular-nums; }
  .t-mod { display: flex; gap: 18px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }

  .aviso-todo {
    border: 1px solid var(--waiting); border-left-width: 3px; border-radius: 4px;
    background: var(--surface); padding: 10px 12px; margin-bottom: 14px; display: grid; gap: 6px;
  }
  .aviso-todo > b { color: var(--waiting); font-weight: 600; }
  .aviso-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .aviso-linha > .path:first-child { color: var(--fg); cursor: pointer; }

  /* ---------- mapa do projeto ---------- */
  .mapa {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(520px, 92vw); overflow-y: auto; padding: 16px 20px 40px;
    background: var(--bg); border-left: 1px solid var(--line);
    /* A gaveta vira um contêiner com o MESMO nome do painel: as regras de
       estreito passam a valer dentro dela pela largura DELA. Sem isto a tabela
       de rotas media a página (390) mas a query nunca disparava aqui dentro,
       porque a gaveta é irmã do painel, não filha. A gaveta nunca passa de
       520px, então dentro dela o empilhado é sempre o certo. */
    container: painel / inline-size;
  }
  .m-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); padding-bottom: 8px; }
  .m-todo-ok { color: var(--done); margin-top: 14px; }
  .m-head b { font: 700 15px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; }
  .m-grupo { margin-bottom: 18px; padding-left: 10px; border-left: 3px solid var(--line); }
  .m-grupo.e-bloqueado { border-left-color: var(--failed); }
  .m-grupo.e-esperando { border-left-color: var(--waiting); }
  .m-grupo.e-aberto { border-left-color: var(--done); }
  .m-grupo.e-feito { border-left-color: var(--idle); opacity: .65; }
  .m-gtit { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .m-gtit b { color: var(--fg); font-size: 13px; }
  .m-selo {
    font: 700 11px/1.6 var(--label); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 2px; padding: 0 5px;
  }
  .m-frac { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .m-frente {
    display: flex; align-items: baseline; gap: 8px;
    padding: 3px 0 3px 12px; font-size: 12px; color: var(--dim);
  }
  .m-frente.com-agente { color: var(--fg); }
  .m-nome { flex: 1; min-width: 0; }
  /* onde há gente trabalhando é a informação que se procura primeiro */
  .m-agentes {
    color: var(--working); font-size: 11.5px; white-space: nowrap;
    border: 1px solid currentColor; border-radius: 10px; padding: 0 7px;
  }
  .m-rodape { margin-top: 20px; font-size: 11.5px; }

  /* CC-35: commits desde a última visita, dentro do próprio mapa. */
  .m-git-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .m-git-sec h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .m-git { display: grid; gap: 4px; }
  .m-commit {
    display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: baseline;
    font-size: 12px; padding: 4px 0;
  }
  .m-git-carregando { font-style: italic; }
  .c-mapa {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--dim); font: inherit;
  }
  .c-mapa:hover { color: var(--acento); text-decoration: underline; }
  /* Frente é texto livre do agente e pode ser longa: sem quebra, uma frente de
     50 caracteres vazou 13px no cartão em 390px, pega pelo gate do estreito. */
  .c-frente { color: var(--acento); min-width: 0; overflow-wrap: anywhere; }

  /* ---------- preço ---------- */
  .p-niveis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); margin: 4px 0 16px; }
  .p-nivel {
    border: 1px solid var(--line); border-left-width: 3px; border-radius: 4px;
    background: var(--surface); padding: 10px 12px; display: grid; gap: 4px;
  }
  .p-nivel b { font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; }
  .p-nivel .p-hora { font-size: 20px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .p-nivel .p-hora i { font-size: 12px; color: var(--faint); font-style: normal; }
  .p-nivel input { width: 90px; }
  .n-junior { color: var(--done); }  .p-nivel.n-junior { border-left-color: var(--done); }
  .n-pleno  { color: var(--working); } .p-nivel.n-pleno { border-left-color: var(--working); }
  .n-senior { color: var(--waiting); } .p-nivel.n-senior { border-left-color: var(--waiting); }

  .p-resumo { display: flex; gap: 32px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line-soft); }
  .p-resumo div { display: grid; gap: 2px; }
  .p-resumo b { font-size: 22px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .p-resumo .path { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }

  .p-linha {
    display: grid; gap: 12px; align-items: baseline; padding: 8px 4px; cursor: pointer;
    grid-template-columns: 1fr 130px 62px 62px 66px 66px 78px;
    border-bottom: 1px solid var(--line-soft);
  }
  .p-linha:hover { background: var(--surface); }
  .p-linha .v { text-align: right; font-variant-numeric: tabular-nums; }
  .p-linha .h { color: var(--fg); }
  .p-linha .cif { color: var(--done); font-weight: 600; }
  .p-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-head { color: var(--faint); cursor: default; }
  .p-head:hover { background: none; }
  .p-head span { font: 700 11px/1.3 var(--label); letter-spacing: .07em; text-transform: uppercase; }
  .p-item.on { background: var(--surface); }
  .p-detalhe { padding: 6px 8px 14px; display: grid; gap: 12px; }
  .p-sinais { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
  .p-sinal { display: grid; gap: 1px; font-size: 12px; }
  .p-sinal b { color: var(--fg); font-weight: 600; }
  .p-notas { color: var(--working); letter-spacing: 2px; }
  .p-acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .p-acoes label { display: flex; align-items: center; gap: 6px; }
  .p-acoes input { width: 80px; }

  /* ---------- gráficos ---------- */
  .g-grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
  .g-card { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px 14px; background: var(--surface); }
  .g-card > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .g-card > header b { font: 700 12px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase; }
  .btn.min { padding: 2px 6px; font-size: 12px; }

  .g-leg { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; color: var(--dim); font-size: 11px; }
  .g-leg i, .g-lista i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .g-escala { display: flex; justify-content: space-between; color: var(--faint); font-size: 11.5px; margin-top: 6px; }

  .g-barras { display: flex; align-items: flex-end; gap: 3px; height: 150px; }
  .g-col { flex: 1; min-width: 3px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .g-pilha { display: flex; flex-direction: column-reverse; min-height: 2px; border-radius: 1px 1px 0 0; overflow: hidden; }
  .g-pilha.neg { opacity: .55; }
  .g-pilha > i { display: block; width: 100%; }
  .g-rot {
    font-size: 11px; color: var(--faint); text-align: center; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Com muitas colunas o rótulo vira tinta ilegível; some e fica o tooltip. */
  .g-barras > .g-col:nth-child(n+16) .g-rot, .g-barras:has(> :nth-child(16)) .g-rot { display: none; }

  .g-svg { width: 100%; height: 200px; display: block; }

  .g-rosca { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .g-rosca svg { width: 140px; height: 140px; flex: none; }
  .g-lista { list-style: none; margin: 0; padding: 0; flex: 1 1 200px; min-width: 0; }
  .g-lista li { display: flex; align-items: baseline; gap: 6px; padding: 2px 0; font-size: 12px; }
  .g-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .g-lista b { color: var(--fg); font-weight: 600; }
  .g-pct { color: var(--faint); width: 34px; text-align: right; }

  .g-cal { display: flex; gap: 3px; align-items: flex-start; overflow-x: auto; padding-bottom: 2px; }
  .g-sem { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; }
  .g-cal i { display: block; width: 11px; height: 11px; border-radius: 2px; background: var(--line); }
  .g-cal i.vazio { background: var(--line-soft); }

  .g-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .g-tab th { text-align: left; color: var(--faint); font-weight: 400; padding: 3px 8px 6px 0; }
  .g-tab td { padding: 3px 8px 3px 0; color: var(--dim); border-top: 1px solid var(--line-soft); }
  .g-tab .num { text-align: right; font-variant-numeric: tabular-nums; }
  .g-tab .forte { color: var(--fg); }
  .g-tab tr.off td { opacity: .55; }

  .g-erro { color: var(--waiting); font-size: 12px; padding: 10px 0; }
  .g-form { border: 1px solid var(--acento); border-radius: 4px; padding: 12px 14px; margin-bottom: 16px; }
  .g-campos { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .g-campos label {
    display: flex; align-items: center; gap: 6px; color: var(--faint);
    font: 700 11.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .g-campos select, .g-campos input {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 4px 7px; font: 12px var(--mono); min-width: 0;
  }
  .g-previa { margin-top: 14px; }
  .g-indice { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); margin-bottom: 18px; }

  /* ---------- servidores ---------- */
  .srv-card {
    position: relative; display: flex; flex-direction: column; gap: 5px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    padding: 9px 11px 8px 13px; min-width: 0;
  }
  /* verde na borda = servidor de desenvolvimento, o único que dá pra encerrar */
  .srv-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 6px 0 0 6px; background: var(--idle);
  }
  .srv-card.dev::before { background: var(--done); }
  .srv-card > header { display: flex; align-items: baseline; gap: 8px; }
  .srv-card > footer {
    display: flex; align-items: center; gap: 8px; margin-top: 3px;
    padding-top: 7px; border-top: 1px solid var(--line-soft); flex-wrap: wrap;
  }
  /* sem isto o "no ar há 43m" vira quatro linhas e empurra o encerrar pra fora */
  .srv-card > footer .idade { white-space: nowrap; }
  .srv-card .port { font: 700 15px/1 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--dim);
    border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 11px var(--mono);
  }
  .btn:hover { color: var(--fg); border-color: var(--faint); }
  .btn.danger { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--line)); }
  .btn.danger:hover { background: color-mix(in srgb, var(--failed) 16%, var(--surface)); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .btn.mini { padding: 2px 7px; font-size: 11.5px; }

  /* Atalhos dos agentes que não são Claude (opencode, agy). Maior que o `.btn`
     de propósito: aqui o alvo é dedo, não ponteiro. Ele abre esta aba no
     celular, na rua, e 44px é o mínimo de toque confortável. */
  .atalhos-fora { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .atalho-fora {
    display: flex; flex-direction: column; gap: 2px; min-height: 44px;
    justify-content: center; text-align: left; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    border-radius: 4px; padding: 8px 14px; cursor: pointer; font: 13px var(--mono);
  }
  .atalho-fora:hover { border-color: var(--acento); }
  .atalho-fora small { color: var(--faint); font-size: 11px; }
  .atalho-fora[disabled] { opacity: .5; cursor: progress; }

  /* popover de configuração da janela flutuante. Posição vem de JS (embaixo
     do botão de verdade): a altura do header varia com o player de mídia
     aparecendo e sumindo, então um `top` fixo ora sobrava, ora ficava por
     baixo do header (`z-index: 30`) — daqui o 40, acima dele. */
  .pip-cfg {
    position: fixed; z-index: 40; width: 220px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .pip-cfg-tit { display: block; font-size: 11.5px; letter-spacing: .04em; color: var(--faint); text-transform: uppercase; margin: 10px 0 6px; }
  .pip-cfg-tit:first-child { margin-top: 0; }
  .pip-cfg-blocos { display: grid; gap: 6px; }
  .pip-cfg-item { display: flex; align-items: center; gap: 7px; font-size: 12px; cursor: pointer; }

  /* filtro da lista: por porta, por projeto, só favoritos */
  .chip {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 3px 11px; cursor: pointer; font: 11px var(--mono);
  }
  .chip:hover { color: var(--fg); }
  .chip.on { color: var(--acento); border-color: var(--acento); }

  .srv-topo { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
  .srv-fav {
    background: none; border: 0; cursor: pointer; padding: 0 2px;
    color: var(--faint); font-size: 13px; line-height: 1;
  }
  .srv-fav.on, .srv-fav:hover { color: var(--acento); }
  /* o que o processo está de fato executando — a resposta pro "node" solto */
  .srv-resumo { margin: 0; font: 11px var(--mono); color: var(--dim); }
  /* texto escrito à mão: ganha destaque, é o que a pessoa quis dizer */
  .srv-nota {
    margin: 2px 0 0; padding-left: 7px; border-left: 2px solid var(--line);
    font-size: 11px; color: var(--fg);
  }
  .srv-onde { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

  .srv-novo {
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    padding: 4px 13px 13px; margin-bottom: 16px;
  }
  .srv-lanc {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 5px 0; border-bottom: 1px solid var(--line-soft);
  }
  .srv-lanc:last-child { border-bottom: 0; }
  .srv-lanc code { font-size: 11.5px; }

  /* ---------- VPS ---------- */
  .vps-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .vps-form {
    display: grid; gap: 10px; max-width: 360px; margin: 14px 0 22px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 14px 16px;
  }
  .vps-form label { display: grid; gap: 4px; font-size: 11px; color: var(--dim); }
  .vps-form input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 7px 9px; color: var(--fg); font: 13px var(--mono);
  }
  .vps-form button { justify-self: start; }
  /* ---- a tela responde uma pergunta, e o veredito vem antes do dado ---- */
  .vps-veredito { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px;
    border-radius: 10px; margin-bottom: 14px; border-left: 4px solid var(--dim); background: var(--card); }
  .vps-veredito b { font-size: 1.05rem; }
  .vps-veredito.v-bom { border-left-color: var(--done); }
  .vps-veredito.v-atencao { border-left-color: var(--waiting); }
  .vps-veredito.v-ruim { border-left-color: var(--failed); }
  .vps-alertas { display: grid; gap: 8px; margin-bottom: 18px; }
  .vps-alerta { padding: 10px 14px; border-radius: 8px; background: var(--card);
    border-left: 3px solid var(--waiting); display: flex; flex-direction: column; gap: 2px; }
  .vps-alerta.a-grave { border-left-color: var(--failed); }
  /* o "o que fazer" é o que separa alerta de ruído, então nunca é escondido */
  .vps-alerta span { color: var(--dim); font-size: .86rem; }
  .vps-tec { color: var(--faint); font-size: .76rem; }
  /* o "?" só aparece onde a tradução não cabe: seção inteira, nunca por dado */
  .ajuda { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--dim);
    background: none; color: var(--dim); font-size: .72rem; line-height: 1; cursor: pointer; padding: 0; }
  .ajuda:hover { color: var(--acento); border-color: var(--acento); }
  /* Celular: é onde ele usa de verdade. `@container` e não `@media` porque a
     coluna de notas encolhe o painel sem encolher a janela — armadilha já
     registrada no CLAUDE.md. */
  @container (max-width: 560px) {
    .vps-topo { flex-wrap: wrap; }
    .vps-veredito b { font-size: 1rem; }
    .vps-alerta { padding: 9px 12px; }
  }
  .vps-stats { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .vps-stats .pip-item { gap: 8px; }
  /* três colunas — encolhe pra uma só em janela estreita, igual aos gráficos */
  .vps-organograma { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); align-items: start; }
  .vps-liga { color: var(--acento); font-weight: 600; }

  /* ---------- agenda ---------- */
  /* `--dim` e `--failed` já existiam como variável, mas não havia classe que
     as aplicasse — `class="dim"` não pintava nada, e classe que não existe não
     dá erro nenhum, só passa despercebida. Utilitárias, valem pra tela toda. */
  .dim { color: var(--dim); }
  .bad { color: var(--failed); }
  .ag-topo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .ag-topo .spacer { flex: 1; }
  .ag-form {
    display: grid; gap: 10px; max-width: 460px; margin: 14px 0 22px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 14px 16px;
  }
  .ag-form label { display: grid; gap: 4px; font-size: 11px; color: var(--dim); }
  .ag-form input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    padding: 7px 9px; color: var(--fg); font: 13px var(--mono);
  }
  .ag-form button { justify-self: start; }
  .ag-ajuda { font-size: 12px; color: var(--dim); line-height: 1.55; margin: 0; }
  .ag-cals { display: flex; flex-wrap: wrap; gap: 8px; }
  .ag-cal {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .ag-erro { font-size: 12px; color: var(--waiting); margin: 0 0 14px; }
  .ag-lista { display: grid; gap: 22px; }
  .ag-dia h3 {
    font-size: 12px; font-weight: 600; color: var(--dim); text-transform: lowercase;
    margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .ag-ev {
    display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: baseline;
    padding: 7px 8px; border-radius: 4px; border-left: 2px solid transparent;
  }
  .ag-ev:hover { background: var(--surface); }
  .ag-hora { font: 12px var(--mono); color: var(--dim); }
  .ag-tit { font-size: 13px; }
  .ag-local { font-size: 11px; }
  /* acontecendo agora ganha a cor de foco; o que já passou apaga mas não some,
     porque "o que eu fiz hoje" é justamente a pergunta do digest de conteúdo */
  .ag-ev.agora { border-left-color: var(--acento); background: var(--surface); }
  .ag-ev.agora .ag-hora { color: var(--acento); font-weight: 600; }
  .ag-ev.passou { opacity: .5; }
  @container (max-width: 620px) {
    .ag-ev { grid-template-columns: 56px 1fr; }
    .ag-ev .ag-local { grid-column: 2; }
  }

  /* ---------- hooks ---------- */
  .hk-lista { display: grid; gap: 2px; max-width: 720px; }
  /* CC-103: a linha do relatório de provas não tem caixinha, então ela NÃO usa
     a grade de três colunas: no estreito a pastilha caía na coluna de 22px que
     existe para a caixinha e ficava escrita em cima do nome. Visto no print de
     390px, e é a terceira vez que uma grade de coluna fixa herdada morde uma
     linha nova. */
  .hk-prova .hk-linha { grid-template-columns: auto 1fr !important; align-items: baseline; }
  .hk-prova .hk-badge { justify-self: start; }
  .hk-linha {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
    padding: 10px 8px; border-radius: 4px; border-bottom: 1px solid var(--line);
  }
  .hk-linha:hover { background: var(--surface); }
  .hk-linha input[type="checkbox"] { width: 16px; height: 16px; }
  .hk-info { display: grid; gap: 2px; }
  .hk-info b { font-size: 13px; }
  .hk-info .dim { font-size: 11px; }
  .hk-badge {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--dim);
  }
  .hk-badge.ok { color: var(--done); border-color: color-mix(in srgb, var(--done) 40%, var(--line)); }
  .hk-badge.bad { color: var(--waiting); border-color: color-mix(in srgb, var(--waiting) 40%, var(--line)); }

  /* ---------- rotinas (comandos copiados dentro dos projetos) ---------- */
  .rt-lista { display: grid; gap: 14px; max-width: 1000px; }
  .rt-proj { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .rt-proj > header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .rt-proj > header b { font-size: 13px; }
  .rt-linha {
    display: grid; grid-template-columns: minmax(340px, 1fr) auto auto; gap: 10px; align-items: center;
    padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px;
  }
  .rt-linha:last-child { border-bottom: 0; }
  .rt-linha:hover { background: var(--surface); }
  /* uma linha por rotina: nome e detalhe lado a lado, sem quebra. "archive-"
     em cima de "sprint", ou o detalhe caindo para baixo, dobram a altura da
     lista e tornam impossível varrer os 22 casos de relance. */
  .rt-nome { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
  .rt-nome b { font-weight: 500; }
  .rt-nome .dim { overflow: hidden; text-overflow: ellipsis; }
  .rt-acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .rt-diff {
    margin: 0; padding: 10px 12px; max-height: 320px; overflow: auto;
    background: var(--surface); border-top: 1px solid var(--line);
    font-size: 11px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  }
  .rt-diff ins { background: color-mix(in srgb, var(--done) 22%, transparent); text-decoration: none; }
  .rt-diff del { background: color-mix(in srgb, var(--failed) 22%, transparent); text-decoration: none; }

  /* ---------- bloco de notas ---------- */
  .n-head {
    position: sticky; top: 0; z-index: 5; background: var(--surface);
    display: flex; align-items: center; gap: 10px;
    padding: 15px 14px 11px; border-bottom: 1px solid var(--line);
  }
  .n-head h3 { margin: 0; flex: 1; }
  #n-list { padding: 12px 14px 40px; display: grid; gap: 12px; align-content: start; }
  .n-block { border: 1px solid var(--line); border-radius: 3px; background: var(--bg); }
  .n-block:focus-within { border-color: var(--faint); }
  .n-top {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 5px 4px 10px; border-bottom: 1px solid var(--line-soft);
  }
  .n-title {
    flex: 1; min-width: 0; background: none; border: 0; padding: 2px 0; color: var(--fg);
    font: 700 11px/1.4 var(--label); letter-spacing: .05em; text-transform: uppercase;
  }
  .n-title::placeholder { color: var(--faint); }
  .n-title:focus { outline: none; }
  .n-del {
    flex: none; background: none; border: 0; padding: 2px 5px; cursor: pointer;
    color: var(--faint); font: 12px var(--mono);
  }
  .n-del:hover { color: var(--failed); }
  .n-del.armed { color: var(--failed); font-size: 11.5px; }
  /* resize nativo do textarea: a alça de altura sai de graça, sem JS */
  .n-block textarea {
    display: block; width: 100%; min-height: 40px; border: 0; background: none;
    color: var(--fg); font: 12px/1.55 var(--mono); padding: 8px 10px 10px; resize: vertical;
  }
  .n-block textarea:focus { outline: none; }
  .n-empty { color: var(--faint); font-size: 12px; padding: 6px 2px; }
  .n-modo {
    flex: none; background: none; border: 0; padding: 2px 4px; cursor: pointer;
    color: var(--faint); font: 12px var(--mono);
  }
  .n-modo:hover { color: var(--acento); }
  .n-itens { padding: 5px 8px 7px; }
  .n-item { display: flex; align-items: baseline; gap: 8px; padding: 1px 0; }
  .n-item > input[type=checkbox] {
    flex: none; margin: 0; position: relative; top: 2px; accent-color: var(--done); cursor: pointer;
  }
  .n-item .txt {
    flex: 1; min-width: 0; background: none; border: 0; border-radius: 2px;
    color: var(--fg); font: 12px/1.55 var(--mono); padding: 1px 4px;
  }
  .n-item .txt:hover { background: var(--surface-2); }
  .n-item .txt:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--acento); }
  .n-item.done .txt { color: var(--faint); text-decoration: line-through; }
  .n-add-item {
    background: none; border: 0; padding: 3px 4px; cursor: pointer;
    color: var(--faint); font: 11px var(--mono);
  }
  .n-add-item:hover { color: var(--done); }

  /* campo de notas do agente, no painel lateral */
  .d-nota {
    width: 100%; min-height: 68px; resize: vertical; border: 1px solid var(--line);
    border-radius: 3px; background: var(--bg); color: var(--fg);
    font: 12px/1.55 var(--mono); padding: 7px 9px;
  }
  .d-nota:focus { outline: none; border-color: var(--faint); }
  .d-nota::placeholder { color: var(--faint); }
  .btn.on { color: var(--fg); border-color: var(--faint); background: var(--surface-2); }

  /* ---------- o painel reage ao espaço que sobrou, não à janela ---------- */
  .only-xs { display: none; }
  /* Os cartões encolhem sozinhos pelo minmax da grade, então o que sobrou aqui
     é só o enquadramento da página — as regras que escondiam coluna morreram
     junto com a tabela de agentes. */
  @container painel (max-width: 620px) {
    .only-xs { display: inline-flex; }
    /* escondidos até o ⋯ abrir. `hidden` do pip-toggle continua mandando: um
       botão que o navegador não suporta não pode aparecer só porque abriu. */
    .ferramentas > .ctl-extra:not([hidden]) { display: none; }
    .ferramentas.aberta > .ctl-extra:not([hidden]) { display: inline-flex; }
    #painel > header { padding: 12px 12px 0; }
    main { padding: 4px 12px 40px; }
    #painel > footer { padding: 0 12px 24px; }
    .top { gap: 12px; }
    input[type=search], select { min-width: 0; flex: 1 1 110px; }
    .tab { padding: 8px 8px; letter-spacing: .1em; }
    h1 { font-size: 17px; letter-spacing: .07em; }
  }
  /* auto-fit sozinho não impede estouro: a coluna mínima de 340px é maior que
     o painel estreito. O min() faz o cartão encolher em vez de vazar. */
  .projs { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
  .d-grid { grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); }

  /* ---------------------------- escritório ---------------------------- */
  .painel-lista {
    display: grid; gap: 10px; margin-bottom: 12px;
    grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  }
  .painel-card {
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); padding: 10px 12px; cursor: pointer;
  }
  .painel-card:hover { background: var(--surface-2); }
  /* o cartão escolhido é o que está no palco abaixo; a barra à esquerda liga
     visualmente uma coisa à outra */
  .painel-card.sel { border-color: var(--working); box-shadow: inset 3px 0 0 var(--working); }
  .painel-topo { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .painel-bolha { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .painel-acoes { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .painel-acoes .btn { text-decoration: none; }
  /* altura fixa: o conteúdo é um canvas de jogo, que não tem altura própria
     pra empurrar o iframe */
  .painel-palco {
    width: 100%; height: min(70vh, 620px);
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); display: block;
  }
  /* Palco largo, legenda estreita e fixa: a coluna de texto não deve roubar
     espaço do escritório, e abaixo de 900px vira uma coisa embaixo da outra. */
  .escritorio-grade { display: grid; grid-template-columns: 1fr 280px; gap: 10px; }
  /* `@container` e não `@media`: com a coluna de notas aberta a janela continua
     larga enquanto o painel encolhe, então a media query nunca dispararia e a
     grade ficaria em duas colunas espremidas. Achado pelo gate do CC-73. */
  @container (max-width: 900px) { .escritorio-grade { grid-template-columns: 1fr; } }
  .escritorio-legenda {
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); overflow: hidden;
    display: flex; flex-direction: column; max-height: min(70vh, 620px);
  }
  .escritorio-legenda h3 {
    margin: 0; padding: 8px 10px; font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line-soft);
  }
  .leg-lista { overflow-y: auto; }
  .leg-item {
    padding: 7px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer;
  }
  .leg-item:hover { background: var(--surface-2); }
  .leg-topo { display: flex; align-items: center; gap: 6px; }
  .leg-nome {
    font-size: 12px; color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .leg-proj { font-size: 11.5px; color: var(--faint); margin: 1px 0 0 14px; }
  /* Fechado: uma linha. Aberto: o texto inteiro, quebrado. É o clique que
     decide — comando de deploy não cabe em coluna de 280px. */
  .leg-faz {
    font-size: 11px; color: var(--dim); margin: 3px 0 0 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .leg-item.on .leg-faz { white-space: normal; word-break: break-word; }
  .leg-mais { color: var(--working); font-size: 11.5px; }
</style>
<script>
  // No head, e não junto do resto: aplicado depois do body a página pisca
  // escura antes de clarear. Três estados — auto segue o Windows.
  var TEMA_ESCURO = matchMedia('(prefers-color-scheme: dark)')
  // A ordem é a do menu. `escuro` diz para qual lado o "automático" cai.
  /* Dois temas, decisao dele em 16/08. Eram seis, e quatro ficavam sempre meio
     acertados: conferir cada tela em seis variacoes multiplica o trabalho por
     seis e ninguem faz. Dois bem feitos valem mais. */
  var TEMAS = [
    { id: 'noite', nome: 'escuro', escuro: true },
    { id: 'papel', nome: 'claro', escuro: false },
  ]
  // ?tema= existe para a captura de tela: headless não tem preferência de
  // sistema nem localStorage, e sem isso não dá para conferir tema nenhum.
  var temaModo = new URLSearchParams(location.search).get('tema')
    || localStorage.getItem('cc-tema') || 'auto'

  function aplicarTema() {
    var alvo = temaModo
    // "automático" escolhe o par padrão de cada lado; tema nomeado manda nele.
    if (alvo === 'auto') alvo = TEMA_ESCURO.matches ? 'noite' : 'papel'
    if (!TEMAS.some(function (t) { return t.id === alvo })) alvo = 'noite'
    document.documentElement.dataset.tema = alvo
    var sel = document.getElementById('tema-sel')
    if (sel && sel.value !== temaModo) sel.value = temaModo
  }
  aplicarTema()
  // Só interessa quando está em automático, mas o listener é barato e não erra.
  TEMA_ESCURO.addEventListener('change', aplicarTema)
</script>
</head>
<body>
<div id="painel">
  <header>
    <div class="top">
      <h1>Agent Cockpit</h1>
      <div class="counts" id="counts"></div>
      <span class="grow"></span>
      <div id="uso" class="uso"></div>
      <div class="ferramentas">
        <!-- CC-74: em tela estreita os seis controles ocupavam duas linhas do
             cabeçalho. Filtro e projeto ficam (uso constante); tema, notas,
             flutuar e ⚙ entram atrás deste botão, que só existe no estreito.
             É o princípio da árvore aplicado ao cabeçalho: o de cima simples,
             o resto a um clique. -->
        <button class="btn only-xs" id="mais-ctl" aria-expanded="false"
          title="tema, notas e janela flutuante">⋯</button>
        <input type="search" id="q" placeholder="filtrar…" autocomplete="off">
        <select id="proj"><option value="">todos os projetos</option></select>
        <!-- CC-47: só aparece quando há mais de uma máquina reportando. Com uma
             só, o seletor seria uma escolha sem alternativa. -->
        <select id="maq" title="de qual máquina" aria-label="filtrar por máquina" hidden></select>
        <select id="tema-sel" class="ctl-extra" title="tema do painel" aria-label="tema do painel"></select>
        <button class="btn ctl-extra" id="n-toggle" aria-pressed="false">notas</button>
        <button class="btn ctl-extra" id="pip-toggle" hidden aria-pressed="false">flutuar</button>
        <button class="btn ctl-extra" id="pip-config-toggle" hidden title="escolher o que aparece na janela flutuante">⚙</button>
      </div>
    </div>
    <!-- O player divide a linha com as abas: sobra espaço à direita ali, e no
         rodapé ele disputava atenção com o conteúdo. -->
    <div class="linha-abas">
      <nav id="tabs" role="tablist"></nav>
      <div class="modulos">
        <div id="maquina" class="modulos"></div>
        <div id="player" class="player mod" hidden></div>
      </div>
    </div>
  </header>

  <main id="main"></main>
  <footer id="foot"></footer>
  <!-- Modo aplicativo (17/08): os quatro grupos na barra de baixo, só no
       estreito. Fica DENTRO do #painel e é `sticky`, não `fixed`: com a gaveta
       de notas aberta a janela continua larga enquanto o painel encolhe, e uma
       barra fixa na viewport cobriria a gaveta. Mesma família da armadilha do
       @container. -->
  <nav id="app-bar" aria-label="grupos de tela"></nav>
</div>

<div id="split" hidden role="separator" aria-orientation="vertical" aria-label="largura das notas"></div>
<aside id="notas" hidden aria-label="bloco de notas">
  <div class="n-head">
    <h3>notas</h3>
    <button class="btn" id="n-add">+ bloco</button>
  </div>
  <div id="n-list"></div>
</aside>

<div class="pip-cfg" id="pip-config" hidden></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="detalhe do agente"></aside>

<div class="scrim" id="scrim-mapa"></div>
<aside class="mapa" id="mapa" hidden role="dialog" aria-label="mapa do projeto"></aside>

<!-- CC-82: o editor de documento. Fora do #main de proposito, `render()`
     reescreve aquele bloco a cada tique do stream, e o cursor sumiria no meio
     da frase. Aqui nada o redesenha. -->
<dialog id="doc-edit" aria-label="editar documento">
  <h2>novo documento</h2>
  <input type="hidden" data-doc-id>
  <input data-doc-titulo placeholder="titulo" autocomplete="off">
  <textarea data-doc-texto rows="16" placeholder="o texto. aceita # titulo, **negrito**, - lista, > citacao e ```codigo```"></textarea>
  <div class="doc-edit-pe">
    <span class="dim">so grava quando voce clica em guardar</span>
    <span class="grow"></span>
    <button class="btn" data-doc-cancelar>cancelar</button>
    <button class="btn primario" data-doc-salvar>guardar</button>
  </div>
</dialog>

<script src="/graficos.js"></script>
<script>
const $ = (s) => document.querySelector(s)
const params = new URLSearchParams(location.search)
let DATA = { jobs: [], summary: {} }
let SERVERS = null            // carregado só quando a aba de servidores abre
let DUPLICADOS = []           // grupos repetidos, calculados no servidor
let RECENTES = []             // já rodaram e não estão no ar: dá pra subir de novo
let PROJETOS = null           // pastas com script de servidor; varre disco, só sob demanda
let srvModo = localStorage.getItem('cc-srv-modo') || 'porta'
// `?subir=1` abre o painel de subir servidor: sem ele não há como capturar
// essa parte da tela, porque o headless não clica em nada
let srvNovo = params.has('subir')
let srvDedup = false          // "fechar duplicados" armado, esperando confirmação
let PAINEIS = null            // idem, aba escritório
// qual painel está embutido na aba; a escolha sobrevive ao recarregar
// `escritorio` desde 16/08, quando o CC-60 fechou e sobrou um painel só. Quem
// tem `local` guardado do tempo dos dois cai no fallback `PAINEIS[0]` — que é o
// mesmo painel, então a troca é invisível e ninguém precisa limpar nada.
let painelAtivo = localStorage.getItem('cc-painel') || 'escritorio'
// quais linhas da legenda estão com o texto inteiro à mostra
const legendaAberta = new Set()
let TEMPO = null              // idem: a varredura dos transcritos é cara
// o corte é a escolha que muda o número cobrado — vale lembrar entre sessões
const tempoParams = {
  corte: Number(params.get('corte')) || Number(localStorage.getItem('cc-corte')) || 15,
  de: params.get('de') || '',
  ate: params.get('ate') || '',
}
const tempoAberto = new Set()
let armed = null              // pid com "encerrar" armado, aguardando confirmação
let selected = params.get('open') || null

const TABS = [
  { id: 'agentes', label: 'agentes' },
  // CC-83: o nome vem do Scrum, que ele já domina — decisão dele em 15/08:
  // "vamos chamar os to-dos de sprint backlog? fica melhor usar aquela ideia
  // dos nomes do scrum pras coisas". O `id` continua `todos` de propósito:
  // trocar mandaria quem tem a aba lembrada no localStorage pra outro lugar.
  { id: 'todos', label: 'sprint' },
  // id continua `projetos` de propósito: mudar mandaria quem tem a aba
  // lembrada no localStorage pra outro lugar sem motivo.
  { id: 'projetos', label: 'cockpit' },
  { id: 'tempo', label: 'tempo' },
  { id: 'graficos', label: 'gráficos' },
  { id: 'preco', label: 'preço' },
  { id: 'agenda', label: 'agenda' },
  { id: 'hooks', label: 'hooks' },
  { id: 'rotinas', label: 'rotinas' },
  { id: 'servidores', label: 'servidores' },
  { id: 'vps', label: 'VPS' },
  { id: 'escritorio', label: 'escritório' },
  // CC-63/64: o que depende dele, e o glossário. Ficam no fim até o redesign
  // de abas agrupar tudo — acrescentar aba solta é exatamente o que ele
  // reclamou, mas sem tela o recurso não existe pra ele.
  { id: 'meu', label: 'meu' },
  { id: 'glossario', label: 'glossário' },
  { id: 'docs', label: 'documentos' },
  { id: 'bancada', label: 'bancada' },
  { id: 'remoto', label: 'remoto' },
]

/**
 * F11: as quatro portas.
 *
 * Eram 15 abas numa fileira só, e duas delas nasceram no mesmo dia do redesign
 * — o Felipe reclamou com razão. O critério de agrupamento é dele: **a pergunta
 * que ele faz**, nunca o tipo de dado. Dois grupos ele nomeou diretamente
 * (tempo/gráficos/preço juntos; servidores/VPS/hooks/remoto juntos), os outros
 * seguem a mesma lógica.
 *
 * A aba continua sendo a unidade real: `tab` guarda o id de sempre, `?tab=`
 * continua valendo (a captura de tela depende disso) e o localStorage de quem
 * já usa não muda de lugar. O grupo é derivado da aba ativa, não guardado —
 * um estado a menos para dessincronizar.
 */
/* O `ico` existe só para a barra de baixo do modo aplicativo (17/08): num alvo
   de dedo, texto de 12px sozinho não se distingue de relance. São caracteres
   comuns, nunca fonte de ícone: dependência externa não sobrevive offline, e o
   painel inteiro funciona sem rede. */
const GRUPOS = [
  { id: 'agora', label: 'agora', ico: '◉', abas: ['projetos', 'agentes', 'todos', 'meu', 'escritorio'] },
  { id: 'custo', label: 'custo', ico: '◔', abas: ['tempo', 'graficos', 'preco'] },
  { id: 'controle', label: 'controle', ico: '✦', abas: ['servidores', 'vps', 'hooks', 'bancada', 'rotinas', 'remoto'] },
  { id: 'saber', label: 'saber', ico: '✎', abas: ['glossario', 'docs', 'agenda'] },
]
// A aba lembrada pode não existir mais: quem tinha `custo` guardado abriria o
// painel sem nenhuma aba marcada.
// Abre no backlog, nao na lista de agentes. Decisao dele em 16/08: a primeira
// pergunta que ele faz e "em qual item do backlog estamos", e a tela de agentes
// responde "quem esta trabalhando", que e a folha.
let tab = params.get('tab') || localStorage.getItem('cc-tab') || 'projetos'
if (!TABS.some((t) => t.id === tab)) tab = 'agentes'

const collapsed = params.has('expand')
  ? new Set()
  : new Set(JSON.parse(localStorage.getItem('cc-collapsed') || '["done","idle"]'))

// quais agentes estão com as tarefas concluídas à mostra na aba de to-dos
const feitosAbertos = new Set(JSON.parse(localStorage.getItem('cc-feitos') || '[]'))
const tudoAberto = params.has('expand') // captura de tela precisa ver tudo

// ordem da tabela de agentes; campo vazio = agrupado por urgência
const ordem = { campo: '', desc: true, ...JSON.parse(localStorage.getItem('cc-ordem') || '{}') }

const ZONES = [
  { key: 'waiting', title: 'precisa de você' },
  { key: 'failed', title: 'falhou' },
  { key: 'working', title: 'trabalhando' },
  { key: 'idle', title: 'parados' },
  { key: 'done', title: 'prontos' },
]
const LABEL = { working: 'ativos', waiting: 'esperando', failed: 'falharam', done: 'prontos', idle: 'parados' }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const age = (ms) => {
  if (!(ms >= 0)) return '...'
  const m = Math.floor(ms / 6e4)
  if (m < 60) return m + 'm'
  const h = Math.floor(m / 60)
  return h < 24 ? h + 'h' + String(m % 60).padStart(2, '0') : Math.floor(h / 24) + 'd' + (h % 24) + 'h'
}
const tok = (n) => !n ? '...' : n < 1e3 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k'
  : n < 1e9 ? (n / 1e6).toFixed(1) + 'M' : (n / 1e9).toFixed(1) + 'B'
const byId = (id) => DATA.jobs.find((j) => j.id === id)

function filtered() {
  const q = $('#q').value.trim().toLowerCase()
  const proj = $('#proj').value
  const maq = $('#maq').value
  return DATA.jobs.filter((j) => {
    // CC-47: "só este desktop", "só a VPS", ou tudo. Compara por id e não por
    // nome: renomear a máquina não pode zerar o filtro guardado.
    if (maq && j.origem?.id !== maq) return false
    if (proj && j.project !== proj) return false
    if (!q) return true
    return [j.subject, j.route, j.project, j.sub, j.category, j.detail, j.model, j.id, j.lastPrompt,
      ...j.todos.map((t) => t.text)].join(' ').toLowerCase().includes(q)
  })
}

/* ============================ topo ============================ */

/**
 * Uso do plano, no topo e em toda aba — é o número que decide se dá pra
 * despachar mais um agente agora. Vem do statusLine do Claude Code, então
 * só anda quando ele responde algo: por isso a hora da leitura aparece
 * quando envelhece, em vez de fingir que é de agora.
 */
function renderUso() {
  const u = DATA.uso
  const alvo = $('#uso')
  if (!u || (!u.cincoHoras && !u.semana)) {
    alvo.innerHTML = ''
    alvo.title = 'sem leitura ainda, aparece depois da próxima resposta do Claude Code'
    return
  }
  const faixa = (p) => (p >= 85 ? 'alto' : p >= 60 ? 'medio' : 'baixo')
  const relogio = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  const dia = (ms) => new Date(ms).toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')
  /** Quanto falta para zerar, curto o bastante para caber ao lado do número. */
  const falta = (ms) => {
    const min = Math.round((ms - Date.now()) / 60000)
    if (min <= 0) return 'zerando'
    if (min < 60) return `${min}min`
    const h = Math.floor(min / 60)
    return h < 24 ? `${h}h${String(min % 60).padStart(2, '0')}` : `${Math.floor(h / 24)}d${h % 24}h`
  }
  const medidor = (rot, j, nota = '') => {
    if (!j) return ''
    const quando = j.resetaEm
      ? `zera ${falta(j.resetaEm)}, ${dia(j.resetaEm)} às ${relogio(j.resetaEm)}`
      : 'sem hora de virada informada'
    return `<span class="u-item n-${faixa(j.pct)}" title="${rot}: ${j.pct.toFixed(1)}% usado · ${quando}${nota ? ` · ${nota}` : ''}">
      <span class="u-rot">${rot}</span>
      <span class="u-barra"><i style="width:${Math.min(j.pct, 100)}%"></i></span>
      <b>${Math.round(j.pct)}%</b>
      ${j.resetaEm ? `<span class="u-reset">${falta(j.resetaEm)}</span>` : ''}
    </span>`
  }
  // Só avisa quando a leitura envelhece: enquanto o Claude Code está sendo
  // usado, ela é de segundos atrás e dizer isso seria ruído.
  const velha = Date.now() - u.em > 20 * 60_000
  alvo.innerHTML = medidor('5h', u.cincoHoras)
    + medidor('semana', u.semana, 'o Fable puxa desta janela, até 50% dela, e mais rápido que o Opus')
    + medidor('opus', u.semanaOpus)
    + medidor('sonnet', u.semanaSonnet)
    + (velha ? `<span class="u-velho" title="a leitura vem do statusLine e só anda quando o Claude Code responde">${age(Date.now() - u.em)} atrás</span>` : '')
  alvo.title = `uso do plano, leitura de ${relogio(u.em)}. `
    + 'O Fable não tem janela própria: consome da semanal, com teto de 50% dela.'
}

function renderHeader() {
  const s = DATA.summary
  renderUso()
  /* CC-74: contador zerado não ocupa espaço. No print dele, em tela estreita,
     a linha era "1 esperando · 0 falharam · 0 ativos · 0 parados · 7 prontos":
     quatro dos cinco números eram zero, e ocupavam a mesma altura que os dois
     que importavam. Zero não é informação aqui — é a ausência dela.

     `done` fica sempre, mesmo em zero: "0 prontos" é resposta legítima a "o que
     terminou?", e sem ele a linha ficaria vazia num dia parado. */
  $('#counts').innerHTML = ['waiting', 'failed', 'working', 'idle', 'done']
    .filter((k) => (s[k] ?? 0) > 0 || k === 'done')
    .map((k) => {
      const n = s[k] ?? 0
      const hot = n > 0 && (k === 'waiting' || k === 'failed')
      return `<span class="count${hot ? ' hot' : ''}" style="${hot ? `color:var(--${k})` : ''}"><b>${n}</b>${LABEL[k]}</span>`
    }).join('') + `<span class="count"><b>${tok(s.tokens)}</b>tokens</span>`

  const sel = $('#proj'), cur = sel.value
  sel.innerHTML = ['<option value="">todos os projetos</option>']
    .concat((s.projects || []).map((p) => `<option${p === cur ? ' selected' : ''}>${esc(p)}</option>`)).join('')

  // CC-47: o seletor de máquina. Escondido enquanto só existe uma, porque aí
  // ele seria uma escolha sem alternativa ocupando espaço no celular.
  const maqs = DATA.maquinas || []
  const selMaq = $('#maq')
  selMaq.hidden = maqs.length < 2
  if (!selMaq.hidden) {
    const escolhida = selMaq.value || localStorage.getItem('cc-maquina') || ''
    selMaq.innerHTML = ['<option value="">todas as máquinas</option>']
      .concat(maqs.map((m) => {
        const rotulo = m.local ? `${m.nome} (aqui)` : m.semContato ? `${m.nome} · sem contato` : m.nome
        return `<option value="${esc(m.id)}"${m.id === escolhida ? ' selected' : ''}>${esc(rotulo)}</option>`
      })).join('')
  }

  const counts = {
    agentes: DATA.jobs.length,
    todos: DATA.jobs.reduce((a, j) => a + j.todos.filter((t) => !t.done).length, 0),
    projetos: (s.projects || []).length,
    servidores: SERVERS ? SERVERS.filter((x) => x.dev).length : null,
  }
  // F11: duas fileiras. Em cima os quatro grupos, embaixo as abas do grupo
  // ativo. O grupo sai da aba, nunca do contrário: guardar os dois criaria a
  // chance de discordarem, e aí o painel abriria num grupo que não contém a
  // aba marcada.
  /* CC-121: aba que só faz sentido nesta máquina não aparece quando não há o
     que mostrar. Cinco das dezessete telas são assim (servidores, VPS,
     escritório, remoto, rotinas), e no telefone metade do menu levava a lugar
     nenhum. O painel já faz isso em três lugares: o seletor de máquina só
     aparece com duas ou mais, o bloco de Docker some sem Docker, a coluna de
     valor some sem taxa. Faltava valer para ABA.

     Regra de segurança: só esconde o que o servidor AFIRMA não existir. Campo
     ausente, servidor velho ou resposta ainda não chegada mostram tudo, porque
     esconder por falta de informação seria pior que a aba vazia: ele procuraria
     uma tela que existe. E a aba ABERTA nunca some, senão a navegação sumiria
     debaixo dele. */
  const tem = DATA?.tem || null
  const escondida = (id) => tem && tem[id] === false && id !== tab
  const visiveis = (lista) => lista.filter((id) => !escondida(id))

  const grupoAtivo = GRUPOS.find((g) => g.abas.includes(tab)) || GRUPOS[0]
  const soma = (g) => g.abas.reduce((a, id) => a + (counts[id] || 0), 0)

  /* Grupo que ficou sem nenhuma aba também some: a porta existiria para uma
     sala vazia. O grupo ATIVO nunca some, pela mesma razão da aba ativa. */
  const gruposVisiveis = GRUPOS.filter((g) => g.id === grupoAtivo.id || visiveis(g.abas).length)
  const linhaGrupos = gruposVisiveis.map((g) => {
    const n = soma(g)
    return `<button class="grupo" data-grupo="${g.id}" aria-selected="${g.id === grupoAtivo.id}">
      ${g.label}${n ? `<span class="n">${n}</span>` : ''}
    </button>`
  }).join('')

  const doGrupo = visiveis(grupoAtivo.abas)
    .map((id) => TABS.find((t) => t.id === id))
    .filter(Boolean)

  /* ⚠️ O <select> aberto MORRE se `#tabs` for reescrito, e no telefone isso
     fechava o menu na cara dele.

     Queixa em 16/08: "clico lá e aparece cockpit etc, antes de dar tempo de eu
     clicar ele some e eu tenho que clicar de novo". O stream redesenha a cada 2
     segundos; o menu nativo do celular leva mais que isso para escolher.

     É a mesma família da armadilha do textarea, com uma diferença que enganou:
     o `<select>` PARECE seguro porque é um elemento pequeno e sem texto
     digitado. Mas o que se perde não é conteúdo, é o **popup aberto do sistema**
     — que morre junto com o elemento e nem aparece no DOM.

     Segurar o redesenho enquanto ele está com foco é o mesmo remédio que o
     `dadosPendentes` usa nos to-dos. A contagem das abas fica alguns segundos
     velha, e isso não é nada perto de não conseguir trocar de tela. */
  /* O menu de uma linha morreu em 17/08, substituído pelo modo aplicativo: o
     popup nativo nunca teve cara de aplicativo, e fechava sozinho. A guarda
     ficou, porque o painel ainda tem `<select>` vivo (o modo do framework na
     lista de módulos), e ela vale para QUALQUER um: elemento com estado do
     sistema aberto não pode morrer em redesenho por timer.

     `SEM_GUARDA` existe só para o teste desligar isto e provar que o defeito
     volta. Teste que só sabe dizer "hoje passa" não prova que pegaria o erro. */
  const foco = document.activeElement
  if (foco?.tagName === 'SELECT' && $('#painel').contains(foco) && !window.SEM_GUARDA) return

  $('#tabs').innerHTML = `<div class="tab-grupos">${linhaGrupos}</div>
    <div class="tab-abas">${doGrupo.map((t) => `
      <button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}">
        ${t.label}${counts[t.id] != null ? `<span class="n">${counts[t.id]}</span>` : ''}
      </button>`).join('')}</div>
`

  /* A barra de baixo do modo aplicativo. Mesmos `data-grupo` da fileira de
     cima, então o clique já funciona sem handler novo, e o estado dos dois sai
     de `tab`: duas telas do mesmo dado, nunca duas contas. */
  $('#app-bar').innerHTML = gruposVisiveis.map((g) => {
    const n = soma(g)
    return `<button data-grupo="${g.id}" aria-selected="${g.id === grupoAtivo.id}">
      <span class="ico" aria-hidden="true">${g.ico}</span>${g.label}${n ? `<span class="n">${n}</span>` : ''}
    </button>`
  }).join('')
}

/* ===================== janela flutuante (resumo) =====================
   Um resumo compacto numa janela real do SO via documentPictureInPictureAPI:
   sobrevive a trocar de aba ou minimizar o Chrome, ao contrário de um
   elemento fixo na página. Só existe em Chrome/Edge recentes; sem a API o
   botão fica escondido.

   O que aparece é configurável (`PIP_CFG.blocos`) e o layout tem dois modos:
   `quadrado` empilha cartões e ganha abas própias quando há mais de um bloco
   ativo (não precisa voltar pro Control Center pra trocar de vista); `fita`
   condensa tudo numa linha só, pensada pra encostar num canto da tela sem
   cobrir nada. Cada bloco por isso tem duas saídas — `full` (cartão) e `fita`
   (uma frase curta) — em vez de um único HTML reaproveitado nos dois modos. */

let pipWin = null
let PIP_CFG = { blocos: ['uso', 'agentes'], layout: 'quadrado' }
let pipAbaAtiva = localStorage.getItem('cc-pip-aba') || null

/** Uma pastilha da fita: rótulo curto + valor em destaque, cor opcional por faixa. */
const pipChip = (rotulo, valor, faixa = '') => `<span class="pip-chip${faixa ? ' n-' + faixa : ''}">
  <span class="pip-chip-rot">${esc(rotulo)}</span><b>${esc(valor)}</b></span>`
const faixaPct = (v, altoEm = 90, medioEm = 70) => (v == null ? '' : v >= altoEm ? 'alto' : v >= medioEm ? 'medio' : 'baixo')

function pipUsoFull() {
  const u = DATA.uso
  const barra = (rot, j) => !j ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${j.pct >= 85 ? 'alto' : j.pct >= 60 ? 'medio' : 'baixo'}">
      <span class="u-barra"><i style="width:${Math.min(j.pct, 100)}%"></i></span>
      <b>${Math.round(j.pct)}%</b>
    </span></div>`
  return barra('5h', u?.cincoHoras) + barra('semana', u?.semana) || '<p class="pip-vazio">sem leitura ainda</p>'
}
const pipUsoFita = () => {
  const u = DATA.uso
  const item = (rot, j) => (j ? pipChip(rot, `${Math.round(j.pct)}%`, faixaPct(j.pct, 85, 60)) : '')
  return item('5h', u?.cincoHoras) + item('sem', u?.semana) || pipChip('uso', '...')
}

function pipAgentesFull() {
  // "em andamento" e não "todos": pronto/parado não é o que se quer ver de
  // relance sem a tela por perto — é o que ainda pede atenção
  const emAndamento = DATA.jobs.filter((j) => j.status === 'working' || j.status === 'waiting')
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
  if (!emAndamento.length) return '<p class="pip-vazio">nenhum agora</p>'
  return emAndamento.map((j) => `<div class="pip-ag">
    <b style="color:var(--${j.status})">● ${esc(j.project)}${j.frente ? ` › ${esc(j.frente)}` : ''}</b>
    <p title="${esc(j.subject || j.detail || '')}">${esc(j.subject || j.detail || '...')}</p>
    <p>${j.todos.length ? `${j.todosDone}/${j.todos.length} to-dos` : 'sem to-dos'} · ${tok(j.tokens)} tokens</p>
  </div>`).join('')
}
const pipAgentesFita = () => {
  const jobs = DATA.jobs.filter((j) => j.status === 'working' || j.status === 'waiting')
  const esperando = jobs.filter((j) => j.status === 'waiting').length
  // esperando pede atenção — vermelho não é exagero aqui, é o mesmo critério
  // do contador "esperando" no topo do painel
  return pipChip('agentes', String(jobs.length), esperando ? 'alto' : '')
}

function pipMaquinaFull() {
  if (!MAQUINA || MAQUINA.erro) return '<p class="pip-vazio">sem leitura</p>'
  const { cpu, ram, gpu } = MAQUINA
  const linha = (rot, uso) => (uso == null ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${uso >= 90 ? 'alto' : uso >= 70 ? 'medio' : 'baixo'}">
    <span class="u-barra"><i style="width:${Math.min(uso, 100)}%"></i></span><b>${Math.round(uso)}%</b></span></div>`)
  return linha('cpu', cpu?.uso) + linha('ram', ram?.uso) + (gpu ? linha('gpu', gpu.uso) : '')
}
const pipMaquinaFita = () => {
  if (!MAQUINA || MAQUINA.erro) return pipChip('máquina', '...')
  const { cpu, ram, gpu } = MAQUINA
  const item = (rot, v) => (v == null ? '' : pipChip(rot, `${Math.round(v)}%`, faixaPct(v)))
  return item('cpu', cpu?.uso) + item('ram', ram?.uso) + (gpu ? item('gpu', gpu.uso) : '')
}

function pipServidoresFull() {
  const dev = (SERVERS || []).filter((s) => s.dev)
  if (!dev.length) return '<p class="pip-vazio">nenhum agora</p>'
  return dev.map((s) => `<div class="pip-ag"><b>:${s.ports[0]} ${esc(s.titulo || s.name)}</b>
    ${s.resumo ? `<p>${esc(s.resumo)}</p>` : ''}</div>`).join('')
}
const pipServidoresFita = () => {
  const n = (SERVERS || []).filter((s) => s.dev).length
  return pipChip('servidores', String(n))
}

function pipDockerFull() {
  if (!DOCKER || DOCKER.disponivel === false) return '<p class="pip-vazio">sem Docker nesta máquina</p>'
  if (!DOCKER.containers) return '<p class="pip-vazio">lendo…</p>'
  const rodando = DOCKER.containers.filter((c) => c.rodando)
  if (!rodando.length) return '<p class="pip-vazio">nenhum container rodando</p>'
  return rodando.map((c) => `<div class="pip-ag"><b>● ${esc(c.nome)}</b><p>${esc(c.imagem)}</p></div>`).join('')
}
const pipDockerFita = () => {
  if (!DOCKER || DOCKER.disponivel === false) return ''
  const n = (DOCKER.containers || []).filter((c) => c.rodando).length
  return pipChip('docker', String(n))
}

function pipProcessosFull() {
  if (!PROCESSOS) return '<p class="pip-vazio">sem leitura</p>'
  const linha = (p, valor) => `<div class="pip-item"><span class="pip-proc-nome">${esc(p.nome)}</span><b>${esc(valor)}</b></div>`
  const bloco = (tit, lista, valor) => !lista.length ? '' : `<b class="pip-sec-tit">${tit}</b>${lista.slice(0, 4).map((p) => linha(p, valor(p))).join('')}`
  const saida = bloco('cpu', PROCESSOS.porCpu, (p) => `${Math.round(p.cpuPct)}%`)
    + bloco('ram', PROCESSOS.porRam, (p) => `${p.ramMB} MB`)
  return saida || '<p class="pip-vazio">sem leitura ainda</p>'
}
const pipProcessosFita = () => {
  const top = PROCESSOS?.porRam?.[0]
  return top ? pipChip(top.nome.slice(0, 16), `${top.ramMB} MB`) : ''
}

const PIP_BLOCO = {
  uso: { label: 'uso do plano', full: pipUsoFull, fita: pipUsoFita },
  agentes: { label: 'agentes', full: pipAgentesFull, fita: pipAgentesFita },
  maquina: { label: 'cpu/ram/gpu', full: pipMaquinaFull, fita: pipMaquinaFita },
  servidores: { label: 'servidores', full: pipServidoresFull, fita: pipServidoresFita },
  docker: { label: 'docker', full: pipDockerFull, fita: pipDockerFita },
  processos: { label: 'processos', full: pipProcessosFull, fita: pipProcessosFita },
}

async function carregarPip() {
  try {
    const d = await (await fetch('/api/pip')).json()
    if (d.pip) PIP_CFG = d.pip
  } catch { /* fica no padrão */ }
  renderPipConfig()
  renderPip()
}
