function viewRemoto() {
  if (!REMOTO_DATA) return viewFederacao() + '<div class="empty">carregando…</div>'
  /* A pasta pessoal sai da lista de projetos: ela ganha linha própria logo
     abaixo. Ela entra na lista sozinha assim que uma sessão avulsa roda ali,
     porque a lista soma os `cwd` de tudo que já rodou, e apareceria duas vezes
     na mesma tela, com nomes diferentes para a mesma pasta. */
  const projetos = (REMOTO_DATA.projetos || []).filter((p) => p.dir !== REMOTO_DATA.casa)
  const ativos = REMOTO_DATA.ativos || {}

  /* CC-129: a sessão avulsa na pasta pessoal.
   *
   * Pedido dele em 17/08: *"podemos incluir no controle center lá no remoto um
   * botão pra criar uma sessão avulsa? daí abre em ~/. pra eu poder alterar
   * coisas no próprio sandbox na vps"*.
   *
   * Fica fora da lista porque a pasta pessoal não é projeto: ela nunca aparece
   * em `projetos`, e o servidor a manda à parte (`casa`). O caminho vai no
   * próprio botão, e nenhuma rota nova foi precisa. O clique de "ligar" já
   * aceita a pasta por `data-remoto-dir`, e o servidor já a usa antes de sair
   * procurando projeto. Medido antes de escrever esta tela.
   *
   * O aviso do alcance fica colado no botão, e não no rodapé: quem clica
   * precisa saber o que abre na hora em que clica.
   */
  const CASA = 'casa'
  const linhaCasa = () => {
    if (!REMOTO_DATA.casa) return ''
    const on = ativos[CASA]
    return `<div class="rm-linha">
      <span class="rm-nome">sessão avulsa <span class="dim">${esc(REMOTO_DATA.casa)}</span></span>
      ${on ? '<span class="hk-badge ok">ligada</span>' : ''}
      <span class="rm-acoes">
        ${on
        ? `<button class="btn" data-remoto-link="${CASA}" title="copia o link de conexão, se já apareceu na tela">pegar link</button>
           <button class="btn" data-remoto-mais="${CASA}" data-remoto-dir="${esc(REMOTO_DATA.casa)}"
             title="abre outra sessão na pasta pessoal, além da que já está no ar">abrir outra</button>
           <button class="btn" data-remoto-desligar="${CASA}">desligar</button>`
        : `<button class="btn" data-remoto-ligar="${CASA}" data-remoto-dir="${esc(REMOTO_DATA.casa)}"
             title="abre uma sessão do Claude Code na sua pasta pessoal, fora de qualquer projeto">abrir na pasta pessoal</button>`}
      </span>
    </div>
    <p class="dim" style="margin:0 0 12px">Fora de projeto: alcança tudo do seu usuário nesta máquina,
      inclusive a configuração do Claude Code e o arquivo que guarda a senha do painel.
      Não vira administrador, e o sandbox de escrita continua valendo lá dentro.</p>`
  }

  if (!projetos.length) {
    return viewFederacao() + linhaCasa() + '<div class="empty">nenhum projeto encontrado</div>'
  }

  /* As sessões extras (`projeto-2`, `projeto-3`) aparecem sob o projeto delas,
     e não como projetos soltos na lista: são o mesmo trabalho, e listá-las como
     projeto faria a lista crescer sem dizer de onde cada uma veio. */
  const extrasDe = (nome) => Object.keys(ativos)
    .filter((k) => k.startsWith(`${nome}-`) && /-\d+$/.test(k.slice(nome.length)))
    .sort()

  /* CC-87. A pergunta é de escolha, não de estado: onde eu quero abrir. O
     veredito diz o que já está de pé, para ele não abrir duas sem querer. */
  const nAtivos = Object.keys(ativos).length
  const vdR = nAtivos
    ? `${nAtivos} sessão(ões) no ar. Abra outra só se precisar de um agente a mais.`
    : `Nenhuma sessão aberta. ${projetos.length} projeto(s) para escolher.`

  return cabecaDaTela('Onde eu quero abrir uma sessão?', vdR, 'bom')
    + viewFederacao() + `<div class="dim" style="margin-bottom:12px">liga uma sessão do Claude Code com Remote Control na pasta do
    projeto escolhido: conecte do celular por <code>claude.ai/code</code>. Na VPS a sessão sobrevive a este painel;
    neste PC uma janela de console abre e fica com ela, "pegar link" só funciona onde tem tmux (Linux).
    <b>mais uma</b> abre outro agente no mesmo projeto.</div>
  ${linhaCasa()}
  <div class="rm-lista">${projetos.map((p) => {
    const on = ativos[p.nome]
    const extras = extrasDe(p.nome)
    return `<div class="rm-linha">
      <span class="rm-nome">${esc(p.nome)}</span>
      ${on ? '<span class="hk-badge ok">ligado</span>' : ''}
      ${extras.length ? `<span class="dim">+${extras.length}</span>` : ''}
      <span class="rm-acoes">
        ${on
        ? `<button class="btn" data-remoto-link="${esc(p.nome)}" title="copia o link de conexão, se já apareceu na tela">pegar link</button>
           <button class="btn" data-remoto-mais="${esc(p.nome)}" data-remoto-dir="${esc(p.dir)}" title="abre outro agente na mesma pasta">mais uma</button>
           <button class="btn" data-remoto-desligar="${esc(p.nome)}">desligar</button>`
        : `<button class="btn" data-remoto-ligar="${esc(p.nome)}" data-remoto-dir="${esc(p.dir)}">ligar</button>`}
      </span>
    </div>${extras.map((e) => `<div class="rm-linha" style="padding-left:22px">
      <span class="rm-nome dim">↳ ${esc(e)}</span>
      <span class="rm-acoes">
        <button class="btn" data-remoto-link="${esc(e)}">pegar link</button>
        <button class="btn" data-remoto-desligar="${esc(e)}">desligar</button>
      </span>
    </div>`).join('')}`
  }).join('')}</div>`
}

/**
 * O que aquele item é, ancorado NA pastilha.
 *
 * Feedback dele vendo a prévia: *"se eu clicar no primeiro eu tenho que descer
 * pra ver; o ideal seria clicar no primeiro e já ver automaticamente"*. A
 * primeira versão punha o texto no fim da lista, a segunda usava `alert()`. As
 * duas erram pelo mesmo motivo: **a resposta tem que nascer ao lado da
 * pergunta**.
 *
 * Posição calculada em JS a partir do botão, e não `top` fixo: o cabeçalho muda
 * de altura conforme o player aparece, e popover com pixel chutado ora fica
 * certo, ora atrás do header (armadilha registrada no CLAUDE.md).
 */
function abrirFrente(botao) {
  const d = botao.dataset
  let pop = $('#frente-pop')
  if (!pop) {
    pop = document.createElement('div')
    pop.id = 'frente-pop'
    document.body.appendChild(pop)
  }

  pop.innerHTML = `
    <b>${esc(d.frenteAbrir)}</b>
    <span class="path">${esc(d.frenteN)} itens fechados</span>
    ${d.frenteCit
      ? `<p class="fp-cit">“${esc(d.frenteCit)}”</p>
         <span class="path">Foi assim que você pediu. Se não é o que você quis dizer, me diga:
         o item foi escrito a partir daí.</span>`
      : '<p class="path">Este item não guarda as suas palavras, foi escrito por mim.</p>'}
    <button class="btn mini" data-frente-fechar="1">fechar</button>`

  pop.hidden = false
  const r = botao.getBoundingClientRect()
  // largura primeiro, para medir a altura real antes de decidir se abre pra cima
  pop.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8))}px`
  const cabeAbaixo = r.bottom + pop.offsetHeight + 12 < window.innerHeight
  pop.style.top = `${Math.round(cabeAbaixo ? r.bottom + 8 : Math.max(8, r.top - pop.offsetHeight - 8))}px`
}

  renderHeader()
  renderPip()
