<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Cockpit</title>
<style>
  /* ---------- a paleta, refeita em 17/08 por causa de fadiga visual ----------

     Ele perdeu um dia de trabalho: "minha visao ta cansada desse modo que ta,
     preciso muito de algo que nao sobrecarregue a minha vista".

     Isto nao e gosto, e ergonomia, e a medicao explica o cansaco inteiro:

       contraste do texto     16,6   (o limite util e ~10; acima disso o texto
                                      claro brilha sobre o fundo escuro e sangra
                                      nas bordas, e piora com astigmatismo)
       texto apagado           3,3   ABAIXO do minimo legivel de 4,5
       fonte de codigo          46 usos, boa parte em texto corrido
       caixa alta               45 usos
       espacamento de letra     50 usos
       linhas de 1px           110, contra 9 sombras

     Cada item desses e um estimulo competindo. Caixa alta apaga a silhueta da
     palavra, que e o que o olho usa para reconhecer sem soletrar; fonte de
     largura fixa tira a mesma pista; e 110 fios finos obrigam o olho a separar
     blocos por contorno em vez de por superficie.

     As duas referencias que ele escolheu, e o que cada uma resolve: o painel do
     Pierre da a paleta quente, papel em vez de branco clinico; o Lev4 da a
     separacao por superficie e sombra, que e o que ele chamou de "linhas mais
     gordinhas".

     Todo tom abaixo foi conferido pela formula de contraste da WCAG. Texto
     principal entre 9 e 11, secundario acima de 5, e NENHUM abaixo de 4,5. */
  :root {
    --bg: #212529;
    --surface: #2a2f35;
    --surface-2: #333940;
    --line: #3a4047;
    --line-soft: #2f353b;
    --fg: #d6dade;
    --dim: #a8b0b8;
    /* 17/08, segunda medicao. O valor anterior (#868f98) so passava contra o
       FUNDO. Sobre `surface`, que e o fundo de todo cartao, dava 4,11, e o
       rodape do cartao (`.ct-pe`, o porque e a idade) e escrito nele. Medir
       texto contra `bg` quando ele mora dentro de um cartao e medir o par
       errado. Aqui: 5,39 sobre o fundo, 4,71 sobre o cartao. */
    --faint: #909aa3;

    --working: #6ba7e8;
    --waiting: #d99a3c;
    --failed:  #e07b72;
    --done:    #5fb885;
    /* 4,11 dentro do cartão na primeira versão, e era a cor de "na fila", o
       estado da maioria dos itens. O erro foi medir tudo contra o fundo da
       página quando quase todo texto mora dentro de uma superfície mais clara.
       Aqui vai 5,15 no cartão e 5,89 no fundo. */
    --idle:    #98a1aa;

    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    /* A fonte de leitura, que passou a valer no texto corrido. A de codigo
       ficou so onde o alinhamento de digito importa: numero, codigo de item,
       caminho de arquivo. Largura fixa em frase e mais lenta de ler, porque
       tira do olho a pista da forma da palavra. */
    --texto: ui-sans-serif, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --label: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", sans-serif;
    /* Sombra no lugar de contorno: separa sem desenhar mais uma linha na tela.
       E o que o Lev4 faz, e o motivo de ele parecer mais suave que o Pierre. */
    --sombra: 0 1px 2px rgba(0, 0, 0, .28), 0 4px 12px rgba(0, 0, 0, .18);
    --raio: 8px;
  }
  /* ---------- temas ----------
     Cada tema redefine as mesmas variáveis, e nada mais. `data-tema` é sempre
     um tema concreto: "automático" é resolvido no JavaScript antes de chegar
     ao CSS, o que evita repetir paleta dentro de @media.

     Regras que valem para todo tema novo:
       - `fg` sobre `bg` tem que passar de 7:1. O tema original ficava em 12:1,
         mas `dim` e `faint` caíam para 4 e 2,6 — era daí que vinha o "difícil
         de ler", não do fundo escuro.
       - os cinco estados continuam distinguíveis entre si em qualquer tema:
         são semânticos, e trocar o significado da cor confundiria mais que
         agradar. O tema colorido muda fundo, superfície e acento de interface.

     `--acento` é o que a interface usa para foco, aba ativa e barra de nota —
     antes era o mesmo azul de "trabalhando", e por isso todo tema parecia azul. */
  :root, :root[data-tema="noite"] {
    color-scheme: dark;
    --acento: #4da3ff;
  }

  /* Escuro neutro, contraste alto: o `dim` sobe de 4,0 para 7,2 sobre o fundo. */
  /* Claro: o papel do Pierre, com o texto suavizado. O claro anterior era
     branco puro com texto quase preto, contraste 17,4 — o mesmo problema do
     escuro, do outro lado. Aqui o texto fica em 9,6 e nenhum tom cai abaixo
     de 4,5. */
  :root[data-tema="papel"] {
    color-scheme: light;
    --bg: #f2ede2;
    --surface: #fbf8f1;
    --surface-2: #f6f1e6;
    --line: #ddd4c4;
    --line-soft: #e8e1d4;
    --fg: #413a31;
    --dim: #635a4e;
    --faint: #6f675b;
    /* Era #9a6b16, que reprovava como TEXTO: 4,01 sobre o fundo e 4,41 sobre o
       cartao. E acento aqui nao e so anel de foco, e o codigo do item
       (`.ct-cod.real`) em todo cartao. Este valor e o `--ambar-fundo` do
       proprio Pierre, que ja tinha sido conferido la pelo mesmo motivo:
       4,88 sobre o fundo, 5,38 sobre o cartao. */
    --acento: #8f5b1e;

    --working: #2a6ba8;
    --waiting: #845a0e;
    --failed:  #a63f2b;
    --done:    #2f6742;
    /* Era #8d8477: 3,16 sobre o fundo, a pior medida do painel inteiro, e logo
       na cor de "na fila", que e o estado da maioria dos quadradinhos. Agora
       4,78. No sol, na rua, era esta que sumia primeiro. */
    --idle:    #6f6759;
    --sombra: 0 1px 2px rgba(65, 58, 49, .10), 0 4px 12px rgba(65, 58, 49, .06);
  }

  h1, .count, .tab, thead th, tr.zone > td, .cat, h3, .col-head, .big {
    font-stretch: 75%;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 var(--texto); -webkit-font-smoothing: antialiased;
    display: flex; height: 100vh; overflow: hidden;
  }
  [hidden] { display: none !important; }

  /* ---------- estrutura: painel | divisória | notas ----------
     O painel é o contêiner de consulta. Sem `container-type`, o breakpoint
     olharia a largura da JANELA — e com as notas abertas a janela continua
     larga enquanto o painel some. A tabela quebraria em vez de compactar. */
  #painel {
    flex: 1 1 auto; min-width: 0; overflow-y: auto;
    /* CC-73: o painel NUNCA rola de lado. Sem isto, um elemento largo (a
       tabela da aba tempo) empurra a página inteira e nasce uma barra de
       rolagem horizontal no rodapé — apareceu no print dele de 15/08, com a
       janela encaixada na lateral do monitor. Quem rola é o elemento largo,
       dentro de `.rolagem`. */
    overflow-x: hidden;
    container-type: inline-size; container-name: painel;
  }
  /* A caixa que segura conteúdo largo. Rola sozinha, sem contaminar a página.
     `overscroll-behavior-x: contain` impede o gesto de arrastar de lado no
     celular virar "voltar" no navegador. */
  .rolagem { overflow-x: auto; overscroll-behavior-x: contain; }
  .rolagem > * { min-width: max-content; }
  #split {
    flex: none; width: 6px; cursor: col-resize; background: var(--line);
    border-left: 1px solid var(--bg); border-right: 1px solid var(--bg);
  }
  #split:hover, #split.drag { background: var(--acento); }
  #notas {
    flex: none; width: min(var(--notes-w, 340px), 78vw); min-width: 0;
    background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto;
  }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  h3 {
    margin: 0 0 6px; font: 700 11.5px/1 var(--label);
    letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
  }

  /* ---------- topo ---------- */
  /* `> header` e não `header`: os cartões de agente usam <header>/<footer>
     próprios, e a regra solta pintava o topo de cada cartão com o fundo da
     página, com 20px de recuo — parecia uma faixa cinza dentro do cartão. */
  #painel > header { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 14px 20px 0; }
  .top { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  /* Escopado no cabecalho: existe UM <h1> na pagina, o nome do painel, e a
     regra solta pegava tambem o titulo dentro do leitor de documentos —
     `nowrap` mais caixa alta cortavam a ultima letra. Mesma armadilha ja
     registrada com <header> e <footer> dentro do cartao de agente. */
  #painel > header h1 {
    font: 700 20px/1 var(--label); letter-spacing: .09em;
    text-transform: uppercase; margin: 0; white-space: nowrap;
  }
  .counts { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline; }
  .count {
    font: 700 12px/1 var(--label); letter-spacing: .05em; text-transform: uppercase;
    color: var(--faint); display: flex; align-items: baseline; gap: 6px;
  }
  .count b { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--dim); }
  .count.hot b { color: var(--fg); }
  .grow { flex: 1 1 40px; }
  /* juntos num bloco só: soltos, ao quebrar a linha o campo de filtro sobrava
     no meio do cabeçalho enquanto o resto ia pra outra ponta */
  .ferramentas { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=search], select {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 9px; font: 12px var(--mono); min-width: 170px;
  }
  input[type=search]::placeholder { color: var(--faint); }

  nav { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 14px; cursor: pointer; color: var(--faint); white-space: nowrap;
    font: 700 12px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .tab:hover { color: var(--dim); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--acento); }
  .tab .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); margin-left: 6px; }

  /* F11: duas fileiras. O grupo é a decisão grande e vem em cima, maior; a aba
     é o detalhe e vem embaixo, menor. Se as duas tivessem o mesmo peso visual,
     seriam 19 botões iguais em vez de 15, que é o oposto do objetivo. */
  .tab-grupos { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab-abas { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
  /* CC-77: escopado em `.tab-grupos >`. Sem isso colidia com o `.grupo` do
     cartao de agente, definido mais abaixo e por isso vencedor: os botoes do
     menu herdavam caixa, borda e a barrinha cinza do ::before. Era a causa
     medida do "os nomes dancam" que ele reclamou. */
  .tab-grupos > .grupo {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 7px 14px; cursor: pointer; color: var(--faint); white-space: nowrap;
    font: 700 13px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .tab-grupos > .grupo::before { content: none; }
  .tab-grupos > .grupo:hover { color: var(--dim); }
  .tab-grupos > .grupo[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--acento); }
  .tab-grupos > .grupo .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); margin-left: 6px; font-size: 11px; }
  /* a barra de baixo só existe no estreito (modo aplicativo, 17/08). No monitor
     a navegação continua nas duas fileiras do topo, que é a ordem dele. */
  #app-bar { display: none; }
  /* a aba dentro do grupo é secundária: sem sublinhado, marcada por fundo */
  .tab-abas .tab {
    border-bottom: 0; border-radius: 999px; padding: 5px 11px;
    font-size: 11.5px; letter-spacing: .1em;
  }
  .tab-abas .tab[aria-selected="true"] { background: var(--faint); color: var(--fg); }

  main { padding: 4px 20px 60px; }
  #painel > footer { color: var(--faint); font-size: 11px; padding: 0 20px 28px; }
  .empty { color: var(--faint); text-align: center; padding: 60px 0; }
  .empty .btn { margin-top: 14px; }

  /* ---------- agentes: faixas de cartões ----------
     Cada situação é uma faixa da largura toda, e os cartões se espalham em
     grade dentro dela. Colunas verticais ficariam magras: é comum um estado
     ter cinco agentes e o vizinho ter zero. */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  td { padding: 7px 10px 7px 0; vertical-align: top; }

  /* Player: colado na base do painel, acima de tudo que rola. Some sozinho
     quando não há mídia — barra de player vazia é só ocupar espaço. */
  /* Divide a linha com as abas. `min-width: 0` no nav é o que deixa as abas
     encolherem em vez de empurrar o player para fora da tela. */
  .linha-abas { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  /* `min-width` na largura das abas inteiras: quando não cabe abas + módulos,
     quem desce para a linha de baixo é o bloco de módulos. Navegação quebrada
     em duas linhas é pior que módulo deslocado. */
  .linha-abas > nav { flex: 1 1 auto; min-width: 480px; align-self: flex-end; }
  .linha-abas > .modulos { flex: 0 1 auto; margin-left: auto; }
  /* Faixa de módulos: hardware e player, todos retangulares e da MESMA altura.
     Duas linhas dentro de cada um — é isso que deixa tudo caber ao lado das
     abas em vez de virar uma faixa esticada embaixo delas. */
  .modulos { display: flex; align-items: stretch; gap: 7px; flex: none; }
  .mod {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    flex: none; padding: 5px 9px; min-height: 40px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
  }

  /* CC-73, tela estreita: `.modulos` e `.mod` são `flex: none`, então nada
     encolhe e a faixa (cpu, ram, player) empurra a página para fora — é o que
     corta o player no print dele. Aqui ela desce para uma linha própria e rola
     dentro de si mesma, em vez de contaminar o painel. */
  @container (max-width: 640px) {
    /* A resposta da tela estava a 255px do topo num aparelho de 390: o
       primeiro terço da primeira dobra era titulo, contagem de agentes, filtro,
       seletor e uso de processador. Nada disso responde a pergunta que ele faz
       ao abrir o painel.

       As duas coisas mais caras somem no estreito, e nenhuma se perde: a
       contagem de agentes tem tela propria, e processador e memoria tambem.
       No monitor as duas continuam onde estavam, porque la sobra espaco. */
    #painel > header .counts { display: none; }
    #painel > header #maquina { display: none; }
    #painel > header { padding-top: 10px; }
    .linha-abas { flex-wrap: wrap; }
    .linha-abas > .modulos {
      margin-left: 0; width: 100%; overflow-x: auto; overscroll-behavior-x: contain;
      padding-bottom: 2px;
    }
    /* CC-77: no estreito a navegacao vira UM nivel. As duas fileiras existem
       no HTML e apenas trocam de lugar, para o CSS decidir sozinho — nao ha
       listener de resize nem segunda conta de "qual aba esta no palco". */
    /* MODO APLICATIVO, 17/08. Referências dele: o painel do Pierre (paleta de
       papel) e o Lev4 (linhas gordinhas, sombra em vez de fio). A ordem dele
       era clara: "no computador pode ficar do jeito que está", então tudo isto
       vive dentro do estreito e nada muda no monitor.

       O `<select>` de uma linha sai de cena aqui: ele resolvia a largura, mas
       o menu do sistema fecha sozinho no telefone (queixa medida em 16/08) e
       um popup nativo nunca vai ter cara de aplicativo. */
    .tab-grupos { display: none; }

    /* as abas do grupo viram pastilhas de dedo, rolando na horizontal */
    .tab-abas {
      display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 0;
      overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
      padding: 2px 0 4px;
    }
    .tab-abas::-webkit-scrollbar { display: none; }
    .tab-abas .tab {
      flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; font-size: 14px;
      border: 1px solid var(--faint); background: var(--surface); color: var(--dim);
      border-bottom-color: var(--faint);
    }
    .tab-abas .tab[aria-selected="true"] {
      background: var(--acento); border-color: var(--acento); color: var(--bg); font-weight: 600;
    }
    .tab-abas .tab .n { color: inherit; opacity: .85; }

    /* a barra dos quatro grupos, colada embaixo */
    #app-bar {
      /* Sem margem negativa: ela sangrava 14px para fora do painel e o gate do
         estreito acusou na primeira medição. A barra vai da borda à borda do
         conteúdo, e o fundo é suficiente para ela parecer uma faixa. */
      display: flex; position: sticky; bottom: 0; z-index: 25;
      margin: 8px 0 0; border-radius: 14px 14px 0 0;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      background: var(--surface); box-shadow: 0 -2px 12px rgba(0, 0, 0, .28);
    }
    #app-bar button {
      flex: 1; position: relative; background: none; border: none; color: var(--dim);
      font: inherit; font-size: 12px; padding: 6px 0; border-radius: 12px;
      display: grid; gap: 2px; justify-items: center;
    }
    #app-bar button .ico { font-size: 21px; line-height: 1; }
    #app-bar button[aria-selected="true"] { color: var(--acento); font-weight: 700; }
    /* a contagem é aviso, não enfeite: usa a cor de "espera você" */
    #app-bar button .n {
      position: absolute; transform: translate(15px, -5px);
      background: var(--waiting); color: var(--bg); border-radius: 999px;
      font-size: 10px; min-width: 16px; height: 16px; line-height: 16px;
      font-weight: 700; text-align: center; padding: 0 3px;
    }
    /* A barra é `sticky`, então enquanto há conteúdo abaixo ela FICA EM CIMA
       dele: sem esta folga, a última fileira de quadradinhos ficava cortada
       pela metade (visto no print de 390px, não deduzido). A altura é a da
       barra (ícone de 21px, rótulo de 12px, 12px de respiro) mais a faixa do
       aparelho. */
    #main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    /* `#tabs` e filho de um flex e nasce com `min-width: auto`, ou seja, com a
       largura do conteudo — as 15 abas somavam 480px num painel de 390, e o
       <select> herdava isso e vazava. Medido com o navegador, nao chutado. */
    #tabs { flex: 1 1 100%; min-width: 0; }
    /* CC-77: as quatro telas que o `test-estreito.mjs` mediu vazando em 390px.
       Todas pelo mesmo motivo — grade de coluna FIXA, dimensionada para o
       monitor. Nenhuma some: elas viram lista, que é o formato do telefone. */
    .p-linha { grid-template-columns: 1fr 66px 66px !important; gap: 8px; }
    .p-linha > :nth-child(n+4) { display: none; }
    .rt-linha { grid-template-columns: 1fr !important; gap: 4px; }
    /* item de grade estica por padrao. Numa coluna so, a pastilha "so deste
       projeto" virava uma pilula da largura da tela com tres palavras no meio.
       So a pastilha e as acoes: aplicar em `> *` tirava o encolhimento do nome,
       que ai passava a vazar — trocar um defeito por outro, medido no gate. */
    .rt-linha > .hk-badge, .rt-linha > .rt-acoes,
    .hk-linha > .hk-badge { justify-self: start; max-width: 100%; }
    .rt-linha > * { min-width: 0; overflow-wrap: anywhere; }
    .rt-acoes { justify-content: flex-start; }
    .hk-linha { grid-template-columns: 22px 1fr; }
    .hk-linha > :nth-child(3) { grid-column: 2; justify-self: start; }
    /* caminho e nome de projeto sao a fonte classica de estouro: string longa
       sem espaco nao quebra sozinha, e empurra o cartao inteiro. */
    .path, .ck-nome, .fw-frase { overflow-wrap: anywhere; }
    .ck-fw .fw-frase { max-width: 100%; }
    .ck-head, .ck-proj { min-width: 0; }
    /* pastilha e `nowrap` de proposito, para o rotulo nao virar duas linhas
       tortas. Em 390px isso inverte: "fase 2 de 2: Execucao" nao cabe em
       largura nenhuma, e nowrap vira estouro. No estreito ela quebra. */
    .fw-selo { white-space: normal; max-width: 100%; }
    /* o filtro de projeto tem largura fixa e cortava o proprio rotulo em 390px */
    #painel > header select, #painel > header input { max-width: 100%; min-width: 0; }
  }

  .hw { display: grid; grid-template-columns: auto 1fr; gap: 2px 7px; align-content: center; }
  .hw-rot {
    grid-row: span 2; align-self: center;
    font: 700 11px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint);
  }
  .hw-nums { display: flex; align-items: baseline; gap: 5px; }
  .hw-nums b { font: 700 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .hw-nums i { font-style: normal; font-size: 11px; color: var(--faint); margin-left: 1px; }
  .hw-temp { color: var(--dim); }
  .hw-barra { grid-column: 2; display: block; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .hw-barra > i { display: block; height: 100%; background: currentColor; border-radius: 2px; }
  .hw-det { grid-column: 2; font-size: 11px; color: var(--faint); white-space: nowrap; }
  .hw.n-baixo { color: var(--done); } .hw.n-medio { color: var(--waiting); }
  .hw.n-alto { color: var(--failed); }

  /* Largura fixa: sem isto o título da música manda no tamanho do bloco, e um
     nome de vídeo do YouTube empurra as abas para a linha de baixo. */
  .player { width: 256px; }
  .p-cima { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .p-titulo {
    color: var(--fg); font-size: 11px; font-weight: 600; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* `min-width: 0` nos dois: sem isso o slider mantém a largura natural, e com
     o zoom do navegador — que estreita o bloco pelos @container — ele vaza
     para fora do cartão em vez de encolher. */
  .p-baixo { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .p-semvol { font-size: 11px; }

  /* Apertado, some primeiro o detalhe do hardware, depois o rótulo do app, e
     por último a GPU. As abas nunca cedem. */
  @container painel (max-width: 1500px) { .hw-det { display: none; } .player { width: 214px; } }
  /* Abaixo daqui o número do volume sai junto com a largura: o slider sozinho
     já diz onde está, e o rótulo era o que espremia a barra até quebrar. */
  @container painel (max-width: 1240px) {
    .player .p-app { display: none; }
    .player { width: 176px; }
    .p-vol > b { display: none; }
  }
  @container painel (max-width: 1080px) { #maquina .hw:nth-child(3) { display: none; } }
  .p-app {
    font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); flex: none;
    background: none; border: 0; padding: 3px 0; cursor: default;
  }
  .p-app.trocavel { cursor: pointer; }
  .p-app.trocavel:hover { color: var(--acento); }
  .p-faixa { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1 1 auto; }
  .p-faixa .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-faixa b { color: var(--fg); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-faixa .path { flex: none; }
  .p-bts { display: flex; gap: 2px; flex: none; }
  .p-bt {
    background: none; border: 0; padding: 3px 7px; cursor: pointer;
    color: var(--dim); font: 14px/1 var(--mono); border-radius: 4px;
  }
  .p-bt:hover:not([disabled]) { color: var(--fg); background: var(--surface); }
  .p-bt[disabled] { opacity: .25; cursor: not-allowed; }
  /* Uma declaração só para o volume. Havia duas — a segunda com `flex: none` e
     largura fixa de 90px — e era a segunda que valia: por isso a barra vazava
     para fora do cartão assim que o zoom estreitava o bloco. */
  .p-vol { display: flex; align-items: center; gap: 6px; flex: 1 1 auto; min-width: 0; }
  .p-vol input[type=range] {
    flex: 1 1 auto; width: auto; min-width: 28px; accent-color: var(--acento);
  }
  .p-vol > b {
    flex: none; font-size: 11.5px; color: var(--dim);
    font-variant-numeric: tabular-nums; min-width: 30px; text-align: right;
  }
  .p-semvol { flex: none; font-size: 11px; }
  @container painel (max-width: 900px) {
    .linha-abas { flex-wrap: wrap; }
    .player { width: 100%; margin: 2px 0 8px; }
  }

  /* Uso do plano: fixo no topo, em toda aba. Compacto de propósito — é
     referência de quanto ainda dá pra rodar, não um painel de métrica. */
  .uso { display: flex; align-items: center; gap: 14px; flex: none; }
  .u-item {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px;
    background: var(--surface);
  }
  .u-rot {
    font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint);
  }
  .u-barra { display: block; width: 64px; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .u-barra > i { display: block; height: 100%; background: currentColor; border-radius: 4px; }
  .u-item b { font: 700 14px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  /* o tempo até zerar muda a decisão: 90% faltando 10min não é 90% faltando 3 dias */
  .u-reset { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  /* passando de 85% a informação vira alerta, não estatística */
  .u-item.n-alto { border-color: var(--failed); }
  .u-item.n-baixo { color: var(--done); } .u-item.n-medio { color: var(--waiting); }
  .u-item.n-alto { color: var(--failed); }
  .u-velho { color: var(--faint); font-size: 11.5px; }

  .ord { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0 14px; }
  .ord .dir { color: var(--acento); }

  .faixa { margin-bottom: 26px; }
  .f-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .f-head button {
    background: none; border: 0; padding: 0; cursor: pointer; display: flex;
    align-items: baseline; gap: 8px;
    font: 700 13px/1 var(--label); letter-spacing: .09em; text-transform: uppercase;
  }
  .f-head .n { color: var(--faint); font-family: var(--mono); letter-spacing: 0; font-weight: 400; }
  .f-head .rule { flex: 1; height: 1px; background: var(--line); }
  .z-waiting { color: var(--waiting); } .z-failed { color: var(--failed); }
  .z-working { color: var(--working); } .z-idle { color: var(--idle); }
  .z-done { color: var(--done); }

  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(270px, 100%), 1fr)); }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 5px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
    padding: 9px 11px 8px 13px; cursor: pointer; min-width: 0;
  }
  /* a cor do estado é uma barra na borda, não texto: identifica sem competir
     com o assunto, que é o que se quer ler */
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 6px 0 0 6px; background: var(--idle);
  }
  .card.s-working::before { background: var(--working); }
  .card.s-waiting::before { background: var(--waiting); }
  .card.s-failed::before  { background: var(--failed); }
  .card.s-done::before    { background: var(--done); }
  .card:hover { background: var(--surface-2); border-color: var(--line); }
  .card.sel { border-color: var(--acento); }
  .card.pinned::after {
    content: '★'; position: absolute; top: 7px; right: 9px;
    color: var(--waiting); font-size: 11px; pointer-events: none;
  }
  .card > header { display: flex; align-items: center; gap: 6px; min-height: 17px; }
  .cat.vazia { border: 0; padding: 0; }
  .c-titulo {
    color: var(--fg); font-size: 13px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  /* Quebra em vez de cortar. A linha carregava reticências com nowrap, e a
     frente do agente (texto livre, pode ter 50 caracteres) saía CORTADA no
     celular. Pega pelo gate do estreito em 17/08 e medida no navegador: o span
     herdava o nowrap do pai e o overflow escondia o resto. Nome de coisa nunca
     é cortado; caminho comprido quebra no meio, que é feio e legível. */
  .c-proj { margin: 0; color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
  .c-nota {
    margin: 1px 0 0; color: var(--faint); font-size: 11px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .c-nota.warn { color: var(--waiting); } .c-nota.bad { color: var(--failed); }
  /* rótulo do CC-17: distingue "isto é seu pedido" de "isto é status do agente" */
  .c-nota-origem { color: var(--dim); font-weight: 600; }
  .card > footer {
    display: flex; align-items: center; gap: 8px; margin-top: 3px;
    padding-top: 7px; border-top: 1px solid var(--line-soft); font-size: 11px;
  }
  .card > footer .path { font-size: 11px; }
  .c-prog { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .c-pontos { color: var(--done); letter-spacing: 1px; font-size: 11.5px; }
  .c-frac { color: var(--dim); font-variant-numeric: tabular-nums; }
  .c-barra { display: block; width: 44px; height: 3px; background: var(--line); border-radius: 2px; }
  .c-barra > i { display: block; height: 100%; background: var(--done); border-radius: 2px; }
  .c-idade { color: var(--faint); font-variant-numeric: tabular-nums; }

  /* some até o mouse chegar: três botões em cada cartão viram ruído visual */
  .c-acts { display: flex; gap: 2px; opacity: 0; }
  .card:hover .c-acts, .card:focus-within .c-acts { opacity: 1; }
  .c-acts button {
    background: none; border: 0; padding: 1px 4px; cursor: pointer;
    color: var(--faint); font: 12px/1 var(--mono);
  }
  .c-acts button:hover { color: var(--fg); }
  .c-acts button.on { color: var(--waiting); }
  .c-acts button[disabled] { opacity: .25; cursor: not-allowed; }

  .dot { width: 7px; height: 7px; border-radius: 50%; display: block; margin-top: 5px; }
  /* Escopadas na bolinha: soltas, pintavam o fundo inteiro de qualquer
     elemento que carregasse a classe de estado — foi o que aconteceu com o
     cartão de agente, que ficou laranja com o texto ilegível dentro. */
  .dot.s-working { background: var(--working); } .dot.s-waiting { background: var(--waiting); }
  .dot.s-failed { background: var(--failed); } .dot.s-done { background: var(--done); }
  .dot.s-idle { background: var(--idle); }

  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { color: var(--faint); font-size: 12px; margin-top: 2px; max-width: 74ch; }
  .note.warn { color: var(--waiting); } .note.bad { color: var(--failed); }
  .cat {
    font: 700 11px/1.6 var(--label); letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); border: 1px solid var(--line); border-radius: 2px;
    padding: 0 5px; flex: none;
  }
  .path { color: var(--dim); font-size: 12px; }
  .path em { color: var(--faint); font-style: normal; }
  .num { color: var(--dim); font-variant-numeric: tabular-nums; }

  .bar-todo { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; }
  .bar-todo > i { display: block; height: 100%; background: var(--done); border-radius: 2px; }

  /* ---------- painel lateral ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(660px, 92vw); background: var(--surface);
    border-left: 1px solid var(--line); overflow-y: auto;
    transform: translateX(100%); box-shadow: -24px 0 48px rgba(0,0,0,.5);
  }
  .drawer.on { transform: none; }
  @media (prefers-reduced-motion: no-preference) {
    .drawer { transition: transform .16s ease-out; }
    .scrim { transition: opacity .16s ease-out; }
    tr.row { transition: background .12s ease; }
  }
  .d-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
  .d-head .big {
    font: 700 22px/1.15 var(--label); letter-spacing: .02em; margin: 6px 0 8px;
  }
  .d-close {
    float: right; background: none; border: 0; color: var(--faint);
    font: 16px var(--mono); cursor: pointer; padding: 0 2px;
  }
  .d-close:hover { color: var(--fg); }
  .d-status {
    display: inline-flex; align-items: center; gap: 7px;
    font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
  }
  .d-meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .d-meta span:not(:last-child)::after { content: " ·"; color: var(--faint); }
  .d-body { padding: 18px 22px 40px; display: grid; gap: 22px; }
  .d-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .d-body p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote {
    border-left: 2px solid var(--line); padding-left: 12px; color: var(--fg);
  }
  details.lvl > summary {
    cursor: pointer; color: var(--faint); list-style: none;
    font: 700 11.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    padding: 8px 0; border-top: 1px solid var(--line);
  }
  details.lvl > summary::-webkit-details-marker { display: none; }
  details.lvl > summary::before { content: "▸ "; }
  details.lvl[open] > summary::before { content: "▾ "; }
  details.lvl > summary:hover { color: var(--fg); }

  .todos { list-style: none; margin: 0; padding: 0; }
  .todos li { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; }
  .todos input { margin-top: 3px; accent-color: var(--done); flex: none; }
  .todos li.done span { color: var(--faint); text-decoration: line-through; }
  a { color: var(--acento); }
  code {
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
    padding: 0 5px; color: var(--dim); overflow-wrap: anywhere;
  }

  .col-head {
    display: flex; align-items: baseline; gap: 8px; padding: 14px 0 8px;
    font: 700 13px/1 var(--label); letter-spacing: .09em; text-transform: uppercase;
  }
  .col-head .n { font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

  /* ---------- to-dos: lista densa ---------- */
  /* Mesma linguagem dos cartões de agente: cada agente é um bloco, e a lista
     de tarefas continua densa dentro dele. O que muda é achar o bloco — antes
     era uma coluna só, de 920px, descendo a página inteira. */
  .lista { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); }
  .lista > .grupo {
    position: relative; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); padding: 8px 12px 10px 14px; align-self: start;
  }
  .lista > .grupo::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 6px 0 0 6px; background: var(--idle);
  }
  .lista > .grupo.s-working::before { background: var(--working); }
  .lista > .grupo.s-waiting::before { background: var(--waiting); }
  .lista > .grupo.s-failed::before  { background: var(--failed); }
  .lista > .grupo.s-done::before    { background: var(--done); }
  .g-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 3px 0 7px; border-bottom: 1px solid var(--line-soft); margin-bottom: 4px;
  }
  .g-head .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .g-head b { cursor: pointer; font-size: 13px; }
  .g-head b:hover { color: var(--acento) !important; }
  .lista > .grupo > .c-proj { margin: 0 0 6px; }
  .g-add {
    background: none; border: 0; padding: 1px 7px; cursor: pointer;
    color: var(--faint); font: 15px/1 var(--mono);
  }
  .g-add:hover { color: var(--done); }
  /* CC-83, decisão dele em 15/08: **verde é o que falta, cinza é o que passou**.
     É o contrário do costume, e o motivo é bom — verde chama o olho, e o olho
     deve ir para o que resta, não para o que já acabou. */
  .item { display: flex; align-items: baseline; gap: 9px; padding: 1px 0 1px 3px; border-radius: 2px;
    border-left: 2px solid var(--done); padding-left: 6px; }
  .item.done { border-left-color: var(--line); }
  /* CC-36: explicação do opencode, embaixo do to-do correspondente */
  .todo-explicacao { margin: 0 0 4px 26px; font-size: 11px; color: var(--faint); }
  .todo-explicacao code { font-size: 11.5px; }
  .item:hover { background: var(--surface); }
  .item > input[type=checkbox] {
    flex: none; margin: 0; position: relative; top: 2px; accent-color: var(--done); cursor: pointer;
  }
  /* o texto é sempre um campo: editar sem entrar em "modo edição" é uma
     interação a menos, e o painel já pausa o redesenho enquanto tem foco */
  .item .txt {
    flex: 1; min-width: 0; background: none; border: 0; border-radius: 2px;
    color: var(--fg); font: 13px/1.6 var(--mono); padding: 1px 5px;
  }
  .item .txt:hover { background: var(--surface-2); }
  .item .txt:focus { outline: none; background: var(--surface-2); box-shadow: inset 0 -1px 0 var(--acento); }
  .item .txt::placeholder { color: var(--faint); }
  .item.done .txt { color: var(--faint); text-decoration: line-through; }
  /* o que está no sprint agora: a tarefa do agente que está trabalhando */
  .item.agora { border-left-width: 3px; border-left-color: var(--working); }
  .item.agora .txt { color: var(--fg); font-weight: 500; }
  .lista > .grupo details.lvl > summary { border-top: 0; padding: 4px 0 4px 3px; }
  .outros { border-top: 1px solid var(--line-soft); padding-top: 6px; }

  /* ---------- cockpit (aba projetos) ----------
     Uma coluna de propósito: a ordem é a informação. Grade de cartões faria o
     olho varrer, e a pergunta aqui é "o primeiro" — não "todos". A barra
     colorida à esquerda repete o motivo sem exigir leitura. */
  .ck-lista { display: grid; gap: 12px; max-width: 900px; }
  .ck-proj {
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 4px; background: var(--surface); padding: 12px 14px;
  }
  .ck-proj.p-failed { border-left-color: var(--failed); }
  .ck-proj.p-waiting { border-left-color: var(--waiting); }
  .ck-proj.p-working { border-left-color: var(--working); }
  .ck-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ck-nome {
    font: 700 14px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    background: none; border: 0; color: var(--fg); cursor: pointer; padding: 0;
  }
  .ck-nome:hover { color: var(--acento); }
  .ck-motivo { font-size: 12px; font-weight: 600; }
  .ck-espera { display: grid; gap: 2px; margin: 10px 0 6px; }
  .ck-ag {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 8px;
    border-radius: 3px; cursor: pointer; background: var(--bg);
  }
  .ck-ag:hover { background: var(--surface-2); }
  .ck-ag b { font-size: 13px; font-weight: 600; }
  .ck-ag-motivo { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  /* Uma linha só, não duas: `lastPrompt` pode ser um parágrafo inteiro de
     conversa (visto no inovallbond real), e duas linhas de prosa afogam o
     motivo, que é o que decide. Quem quer o texto todo abre o detalhe. */
  .ck-nota {
    margin: 0 0 4px; padding: 0 8px; color: var(--faint); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ck-frios { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  /* CC-06: só aparece com muitos agentes no mesmo projeto (>4) */
  .ck-rota { margin: 6px 0; }
  .ck-rota > .dim { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .ck-rota .ck-frios { margin: 3px 0 0; }
  .ck-frio {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    color: var(--faint); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; cursor: pointer; max-width: 260px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ck-frio:hover { color: var(--fg); border-color: var(--faint); }
  .ck-pe { display: flex; align-items: baseline; gap: 10px; font-size: 11px; margin-top: 8px; }

  /* Framework de engenharia: linha própria, nunca no rodapé. O cartão de
     servidor já ensinou que rodapé com muitos botões espreme tudo e joga o
     último para fora. `wrap` porque a frase do que falta é texto do usuário e
     pode ser longa. */
  .ck-fw { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; }
  .ck-fw .fw-frase { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .fw-selo {
    display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--faint); color: var(--dim); font-size: 11.5px; white-space: nowrap;
  }
  .fw-selo.fw-off { border-style: dashed; }
  /* CC-115: os grupos de proteção por projeto. Ligado é discreto (o padrão);
     desligado grita em cor de falha, porque projeto sem proteção é exceção
     que precisa saltar aos olhos de relance. Fonte 12px, nunca menos: é botão
     de dedo no telefone, não etiqueta. */
  .fw-mods { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .fw-mod {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--faint); background: none; color: var(--dim);
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .fw-mod:hover { border-color: var(--dim); }
  .fw-mod.off { border-color: var(--failed); color: var(--failed); border-style: dashed; font-weight: 600; }
  .fw-modo {
    background: var(--bg); color: var(--fg); border: 1px solid var(--faint);
    border-radius: 999px; font-size: 11.5px; padding: 1px 4px;
  }

  /* CC-47: de qual máquina é a linha. Discreto de propósito: é contexto, não
     o assunto. `frio` é a máquina que parou de reportar — continua visível,
     porque sumir calada faria parecer que o trabalho nunca existiu. */
  .selo-maq {
    display: inline-flex; align-items: center; padding: 0 6px; border-radius: 999px;
    border: 1px solid var(--faint); color: var(--dim); font-size: 11.5px;
    white-space: nowrap; margin-left: 6px;
  }
  .selo-maq.frio { border-style: dashed; opacity: .65; }

  /* aba "meu": o que depende dele. Linha alta e texto grande de propósito —
     é a lista que ele lê no celular, não uma tabela de dado técnico. */
  .meu-nova { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .meu-nova input {
    flex: 1; min-width: 160px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--faint); border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .meu-lista { display: flex; flex-direction: column; gap: 8px; }
  .meu-item {
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--faint); border-radius: 10px; padding: 10px 12px;
  }
  .meu-item.ok { opacity: .55; }
  .meu-item.ok b { text-decoration: line-through; }
  .meu-check { background: none; border: 0; color: var(--fg); font-size: 17px; cursor: pointer; line-height: 1; padding: 0; }
  .meu-txt { flex: 1; min-width: 0; }
  .meu-txt b { font-size: 13px; font-weight: 600; }
  .meu-txt p { margin: 3px 0 4px; font-size: 11.5px; }
  .meu-feitas { margin-top: 14px; }
  .meu-feitas summary { cursor: pointer; font-size: 11.5px; color: var(--dim); }

  /* aba glossário: cartões curtos, um por documento */
  .gl-busca { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .gl-busca input {
    flex: 1; min-width: 200px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--faint); border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  .gl-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .gl-card { border: 1px solid var(--faint); border-radius: 10px; padding: 12px 14px; }

  /* CC-97: a prova de que a tarefa fechou, e o critério enquanto ela está
     aberta. Verde para a prova porque ela é a única coisa nesta tela que diz
     "isto foi verificado" — o ✓ sozinho só diz "alguém marcou". */
  .todo-prova, .todo-pronto {
    margin: -2px 0 6px 30px; font-size: 11px; line-height: 1.4; color: var(--dim);
    border-left: 2px solid var(--line); padding-left: 8px;
  }
  .todo-prova { border-left-color: var(--done); }
  .todo-prova b, .todo-pronto b { color: var(--faint); font-weight: 700; }

  /* ---------- a tela que abre: o backlog em cartoes ----------

     Rejeitada duas vezes em 16/08. Primeiro por prosa: "e muito texto no mesmo
     lugar (...) ta parecendo um site feio feito por ia, cheio de texto jogado".
     A resposta foi virar LINHA de 44px, e a linha foi rejeitada tambem, agora
     olhando o monitor largo: "ta horripilante (...) vamos fazer algo mais
     parecido com programas de gerenciamento de tarefas, com cards etc".

     As duas queixas sao a MESMA, e e isso que explica por que a primeira
     correcao nao pegou. A linha foi desenhada e conferida a 390px, onde ela
     ocupa a tela inteira e portanto E um cartao. A 1900px a mesma regra estica
     o item ate 1860px: o nome fica na ponta esquerda, o selo de estado na ponta
     direita, e o olho atravessa o monitor inteiro para ligar cinco palavras a
     uma pastilha. Sobra branco no meio, e branco no meio de uma linha e
     exatamente a sensacao de "texto jogado" que ele descreveu da primeira vez.

     A grade de cartoes resolve as duas de uma vez porque nao e uma terceira
     tentativa de layout, e a generalizacao da segunda: `auto-fill` com piso de
     300px da UMA coluna em 390 (a linha que ele aprovou no telefone, intacta) e
     cinco em 1900. O que muda com a largura e quantos cartoes cabem lado a
     lado, nunca o comprimento de um item.

     O que sobrevive das decisoes anteriores, porque foi ele quem pediu:

     1. CODIGO junto do nome, sempre, e agora ele e estavel (`CC-101`, `NV-03`).
        No cartao ele sobe para a primeira linha, em mono e no acento: vira
        etiqueta de cartao, que e como Linear e Jira mostram identificador.
     2. O estado so aparece quando diz alguma coisa. "NA FILA" repetido em 44
        cartoes nao e informacao. Fila e a ausencia de selo. A barra colorida da
        esquerda continua marcando quem tem estado, entao a cor nunca fica sendo
        a unica pista.
     3. Tres listas, contagem no topo, detalhe que abre no toque.

     E a hierarquia, que era o que faltava: quatro pesos diferentes num cartao
     de 350px (codigo 10.5 mono no acento / selo 8.5 em pastilha tingida / nome
     14 semibold / rodape 10 mono apagado), em vez de tudo no mesmo peso
     esticado ao longo de 1860px. */

  /* O seletor das quatro visoes, no topo da tela.

     Eram tres contadores com `href="#secao"`, e a ancora rolava a pagina ate a
     lista. A rolagem era justamente a queixa dele em 16/08. Agora cada um TROCA
     o que a tela mostra: geral, sprint, produto, pendencias. O numero continua
     no mesmo lugar, entao a leitura de relance nao se perdeu na troca.

     O TETO de largura e o conserto antigo, e continua valendo: com `flex:1` e
     sem `max-width` viravam quatro caixas de 460px num monitor de 1900, cada
     uma com um numero de dois digitos perdido no canto. */
  .bl-vistas { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  /* Numero em cima, palavra embaixo. Lado a lado eles pediam 126px cada e as
     quatro visoes viravam duas fileiras de 104px num telefone, o dobro do que
     a navegacao pode custar numa tela que existe para caber inteira. */
  .bl-vista {
    flex: 1 1 76px; min-width: 0; max-width: 214px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: 9px; padding: 8px 10px; background: var(--surface);
    text-align: left; color: var(--dim); cursor: pointer;
  }
  .bl-vista b { font: 700 17px/1 var(--mono); color: var(--fg); }
  /* 8px com pouco espacejamento porque "pendencias" tem que caber em UMA linha
     num botao de 85px: quebrada, ela vira "PENDENCIA" mais um "S" solto, que foi
     o que a primeira medida entregou. */
  .bl-vista i {
    font: 700 11px/1.25 var(--label); letter-spacing: .04em; text-transform: uppercase;
    font-style: normal; min-width: 0; overflow-wrap: anywhere;
  }
  .bl-vista:hover { border-color: var(--acento); }
  .bl-vista:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .bl-vista.v-working { border-left-color: var(--working); }
  .bl-vista.v-working b { color: var(--working); }
  .bl-vista.v-waiting { border-left-color: var(--waiting); }
  .bl-vista.v-waiting b { color: var(--waiting); }
  .bl-vista.v-done { border-left-color: var(--done); }
  /* A visao no ar. Nao basta a borda: com quatro cartoes iguais lado a lado, 1px
     de cor nao responde "onde eu estou". O fundo e o texto acesos respondem. */
  .bl-vista.on { background: var(--line-soft); border-color: var(--acento); color: var(--fg); }

  /* Cabecalho de secao. O total anda COLADO no nome, em pastilha: antes ele
     morava em `margin-left:auto` e ia parar a 1860px do titulo que conta. */
  .bl-sec { margin: 0 0 26px; scroll-margin-top: 64px; }
  .bl-h { display: flex; align-items: center; gap: 9px; margin: 0 0 11px; flex-wrap: wrap; }
  .bl-h .bl-h-t {
    font: 700 12px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--fg);
  }
  .bl-h .bl-h-n {
    font: 700 11.5px/1 var(--mono); color: var(--dim); flex: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px;
  }
  .bl-h .bl-h-s { font-size: 11px; color: var(--faint); min-width: 0; overflow-wrap: anywhere; }
  /* O fio que corre ate a borda direita. Custa zero conteudo, e e o que faz a
     tela larga parecer terminada em vez de vazia. Sem ele, todo cabecalho morre
     no meio do monitor com 1200px de nada depois. */
  .bl-fio { flex: 1 1 24px; min-width: 16px; height: 1px; background: var(--line); }

  /* A grade. Este e o conserto inteiro, e sao duas linhas.

     `auto-fill` + `minmax` nao tem breakpoint: o navegador divide a largura
     disponivel pelo piso e resolve sozinho quantas colunas cabem (390 = 1,
     1100 = 3, 1900 = 5). Piso de 320px porque abaixo disso o nome de um item
     quebra em quatro linhas e o cartao vira paragrafo. Com 300 dava seis
     colunas em 1900, e a sexta so cabia cortando o nome.

     `min(320px, 100%)` no piso e OBRIGATORIO, nao enfeite: com `320px` puro,
     qualquer container mais estreito que isso (a coluna de notas aberta no
     telefone) faz a trilha estourar e a pagina inteira rola de lado. */
  .bl-grade {
    display: grid; align-items: start; gap: 9px;
    grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
  }
  .bl-grade + .bl-grupo { margin-top: 18px; }
  /* `parelha` iguala a altura de todos os cartoes de uma fileira, e so vale
     onde NENHUM cartao abre. No backlog seria o contrario de ajuda: um cartao
     aberto de 300px arrastaria os quatro vizinhos fechados junto, e a fileira
     viraria quatro caixas ocas do lado de uma cheia. Nas duas listas de tarefa
     nada abre, entao a base comum e so alinhamento. */
  .bl-grade.parelha { align-items: stretch; }

  /* O cartao. A barra de 3px na esquerda carrega o estado, como carregava na
     linha: e a mesma linguagem de cor, so que agora ela cerca um bloco em vez
     de correr por 1860px. */
  .ct {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .ct.s-working { border-left-color: var(--working); }
  .ct.s-waiting { border-left-color: var(--waiting); }
  .ct.s-failed  { border-left-color: var(--failed); }
  .ct.s-done    { border-left-color: var(--done); }

  /* O corpo clicavel. `min-height` fixo e o que alinha o rodape de todos os
     cartoes fechados da mesma fileira; sem ele a grade fica com a base
     serrilhada, que e a mesma desorganizacao de antes em duas dimensoes. */
  .ct-cab {
    display: flex; flex-direction: column; gap: 6px; width: 100%;
    min-height: 106px; padding: 10px 12px 9px; margin: 0;
    background: none; border: 0; text-align: left; color: inherit; font: inherit;
    cursor: pointer;
  }
  /* so o que de fato reage ganha a mãozinha: cartao morto com cursor de clique
     e promessa que a tela nao cumpre */
  div.ct-cab { cursor: default; }
  .ct-cab:hover { background: var(--line-soft); }
  .ct-cab:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }

  /* Primeira linha do cartao: etiqueta a esquerda, estado a direita. `auto`
     aqui e uma viagem de 300px, nao de 1800. */
  .ct-alto { display: flex; align-items: center; gap: 8px; min-height: 17px; }
  .ct-cod { font: 700 11.5px/1 var(--mono); letter-spacing: .04em; color: var(--faint); }
  .ct-cod.real { color: var(--acento); }
  .ct-selo {
    margin-left: auto; flex: none;
    font: 700 11px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 7px; border-radius: 999px; white-space: nowrap;
    border: 1px solid currentColor;
    background: color-mix(in srgb, currentColor 13%, transparent);
  }
  .ct-selo.c-working { color: var(--working); }
  .ct-selo.c-waiting { color: var(--waiting); }
  .ct-selo.c-failed  { color: var(--failed); }
  .ct-selo.c-done    { color: var(--done); }

  .ct-nome {
    font-size: 14px; font-weight: 600; line-height: 1.34; color: var(--fg);
    overflow-wrap: anywhere;
  }
  .ct.feito .ct-nome { color: var(--dim); text-decoration: line-through; }

  /* Rodape do cartao: por que esta nesse estado, e de quando e. `margin-top:auto`
     e o que gruda ele na base. Junto do `min-height` acima, e o que faz uma
     fileira de cartoes ter uma unica linha de base. */
  .ct-pe {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: auto; padding-top: 8px;
    font: 400 11.5px/1.25 var(--mono); color: var(--faint);
  }
  .ct-porque { min-width: 0; overflow-wrap: anywhere; }
  .ct-idade { flex: none; white-space: nowrap; }

  /* O cartao de TAREFA (sprint e pendencias dele). Mais baixo que o de backlog
     de proposito: aqui o conteudo e uma frase e uma caixinha, nao um item com
     estado, descricao e idade. */
  .ct-tar {
    display: grid; grid-template-columns: 17px minmax(0, 1fr); gap: 0 10px;
    align-items: stretch; padding: 11px 12px; min-height: 96px; cursor: pointer;
  }
  div.ct-tar { cursor: default; }
  .ct-tar:hover { background: var(--line-soft); }
  .ct-tar:focus-within { outline: 2px solid var(--acento); outline-offset: -2px; }
  .ct-tar input[type=checkbox] {
    width: 17px; height: 17px; margin: 2px 0 0; align-self: start;
    accent-color: var(--acento);
  }
  /* A coluna da caixinha e FIXA em 17px, e o vazio ocupa ela do mesmo jeito.
     Pendencia que veio do roadmap nao tem onde gravar e portanto nao tem
     caixinha; sem reservar a coluna, o nome dela comecava 27px a esquerda dos
     vizinhos e a fileira perdia a linha de leitura vertical. */
  .ct-tar > .ct-vazio { align-self: start; }
  .ct-corpo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ct-corpo .ct-nome { font-size: 13px; }

  /* O detalhe, dentro do proprio cartao. A prosa que antes se espalhava pela
     tela inteira agora tem a largura do cartao como limite natural de leitura. */
  .ct-det {
    display: grid; gap: 7px; padding: 10px 12px 12px;
    border-top: 1px solid var(--line-soft); background: var(--bg);
  }
  .ct-det p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--dim); overflow-wrap: anywhere; }
  .bl-cit {
    margin: 0; padding-left: 9px; border-left: 2px solid var(--faint);
    font-size: 12px; line-height: 1.45; color: var(--dim); font-style: italic;
    overflow-wrap: anywhere;
  }
  .bl-sub { display: grid; gap: 4px; }
  .bl-sub-i { font-size: 12px; color: var(--fg); display: flex; gap: 6px; overflow-wrap: anywhere; }
  .bl-sub-i span { color: var(--working); flex: none; }
  .bl-cru {
    font: 400 11.5px/1.4 var(--mono); color: var(--faint); overflow-wrap: anywhere; margin: 0;
  }

  /* Cabecalho de projeto no backlog, e de agente no sprint. Deixou de ser a
     tampa de uma caixa e virou uma regua sobre a grade: nome, contagem, fio. */
  .bl-grupo {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    margin: 0 0 9px; padding: 0; background: none; border: 0;
  }
  .bl-grupo-t {
    min-width: 0; display: flex; align-items: center; gap: 7px;
    background: none; border: 0; padding: 4px 0; min-height: 32px; cursor: pointer;
    text-align: left; color: var(--dim);
    font: 700 11.5px/1.2 var(--label); letter-spacing: .05em; text-transform: uppercase;
  }
  span.bl-grupo-t { cursor: default; }
  .bl-grupo-t:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
  .bl-grupo-t b { color: var(--fg); font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
  .bl-cara { flex: none; color: var(--faint); font-size: 11px; transition: transform .15s ease; }
  .bl-grupo.aberto .bl-cara { transform: rotate(90deg); }
  .bl-grupo-sub { font-style: normal; font-weight: 400; color: var(--faint); font-size: 11.5px; }
  .bl-sub-cod { font: 600 11px/1 var(--mono); color: var(--acento); }
  /* Dependência na linha do item, como na planilha dele: quem eu espero e quem
     eu destravo. Âmbar espera, verde destrava, e a palavra vai junto da cor. */
  .bl-dep { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 0; font-size: 11px; }
  .bl-dep-t { color: var(--waiting); }
  .bl-dep-d { color: var(--done); }
  /* A tabela de rotas. No estreito as colunas empilham por linha, senão três
     colunas em 366px viram letra de 8px, que é o piso que acabou de subir. */
  /* ---- a planilha de tarefas (17/08) ----
     Mesma linguagem da tabela de rotas: fio fino entre linhas, nada de grade
     fechada. Fonte 13px, um passo acima da tabela de rotas, porque aqui o texto
     da tarefa é para LER, não para bater o olho. */
  .pl-rola { overflow-x: auto; overscroll-behavior-x: contain; }
  .pl-tab { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pl-tab th {
    text-align: left; font: 700 10px/1.4 var(--label); letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); padding: 0 10px 6px 0;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .pl-tab td { padding: 9px 10px 9px 0; vertical-align: top; }
  .pl-tab tbody tr { border-bottom: 1px solid var(--line-soft); }
  .pl-id code, .pl-dep code, .pl-des code { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  /* `table-layout: fixed` e largura declarada em cada coluna. Sem isso o
     navegador distribui pelo conteúdo: a coluna Task quebrava em três linhas
     enquanto sobrava espaço vazio à direita, porque a largura ia para quem
     tinha texto longo por acaso (o assunto do agente). Medido no print de
     17/08, e é a mesma armadilha das grades de coluna fixa herdada. */
  .pl-tab { table-layout: fixed; }
  /* As medidas saíram do print, não de estimativa: com 8ch o código `ESC-132`
     ficava cortado, e com 11ch os títulos DEPENDE DE / DESBLOQUEIA escreviam um
     sobre o outro. Em ch, porque o que decide a largura aqui é quantos
     caracteres o conteúdo tem. */
  .pl-id { width: 12ch; }
  .pl-task { width: 30%; }
  .pl-quem { width: 15%; }
  .pl-st { width: 15ch; }
  /* 16ch, porque "DESBLOQUEIA" em caixa alta com espaçamento de letra ocupa
     mais que os 11 caracteres sugerem. Conferido no print, duas rodadas. */
  .pl-dep, .pl-des { width: 16ch; }
  .pl-prova { width: auto; }
  /* título de coluna pode quebrar em duas linhas; o conteúdo é que não pode */
  .pl-tab th { white-space: normal; }
  .pl-task b, .pl-quem, .pl-prova { overflow-wrap: anywhere; }
  .pl-marca { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .pl-marca b { font-weight: 600; }
  .pl-task .path, .pl-quem .path { display: block; margin-top: 2px; }
  .pl-quem { color: var(--dim); }
  .pl-st { white-space: nowrap; color: var(--dim); }
  .pl-prova { color: var(--dim); max-width: 260px; }
  /* o estado colore o fio da esquerda, como nos cartões: cor sozinha nunca
     carrega significado, ela repete o que a coluna Status já diz por escrito */
  .pl-l { border-left: 3px solid transparent; }
  .pl-l.s-andando { border-left-color: var(--working); }
  .pl-l.s-travado { border-left-color: var(--waiting); }
  .pl-l.s-feito { border-left-color: var(--done); }
  .pl-l > td:first-child { padding-left: 8px; }

  .m-rotas-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .m-rotas-tab tr { border-bottom: 1px solid var(--line-soft); }
  .m-rotas-tab td { padding: 7px 8px 7px 0; vertical-align: top; }
  .m-rota-bt {
    display: flex; align-items: center; gap: 6px; background: none; border: 0;
    cursor: pointer; color: var(--fg); font-weight: 600; padding: 0;
  }
  .m-rota-bt i { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
  tr.c-ocupada .m-rota-bt i { background: var(--failed); }
  tr.c-livre .m-rota-bt i { background: var(--done); }
  tr.c-orfa .m-rota-bt i { background: var(--working); }
  .rt-quem-c { color: var(--dim); white-space: nowrap; }
  /* CC-102: a rota que vem de outra máquina. Levemente apagada e sem cursor de
     clique, porque daqui ela não se mexe: quem libera é o aparelho dono. */
  .rt-fora { opacity: .78; }
  .rt-fora .m-rota-bt { cursor: default; }
  .rt-arq-c code {
    background: var(--surface-2); border-radius: 4px; padding: 1px 5px;
    font-size: 10.5px; overflow-wrap: anywhere;
  }
  @container painel (max-width: 640px) {
    .m-rotas-tab, .m-rotas-tab tbody, .m-rotas-tab tr, .m-rotas-tab td { display: block; }
    .m-rotas-tab td { padding: 1px 0; }
    .m-rotas-tab tr { padding: 7px 0; }
    .rt-quem-c { white-space: normal; }

    /* NO TELEFONE A TABELA CONTINUA TABELA, e rola de lado. A primeira versão
       (17/08) empilhava cada linha em bloco aqui, e foi erro meu de tipo
       conhecido: ele pediu tabela e eu entreguei o que julguei melhor. Palavras
       dele ao ver: "EU PEDI EM TABELA VOCE INVENTOU OUTRA COISA QUE NÃO É
       TABELA, FICOU IGUAL O ANTERIOR". Cabeçalho colado à esquerda para a
       coluna Task ficar legível durante a rolagem. */
    /* A largura MÍNIMA é o que faz a tabela rolar em vez de encolher. Sem ela,
       as sete colunas se espremiam nos 390px e o texto quebrava letra a letra,
       que é o pior dos dois mundos: nem tabela, nem legível. As medidas em `ch`
       são por coluna, e a soma passa da tela de propósito. */
    .pl-tab { table-layout: auto; min-width: 780px; font-size: 12.5px; }
    .pl-id { width: auto; min-width: 10ch; }
    .pl-task { width: auto; min-width: 30ch; position: sticky; left: 0; background: var(--bg); z-index: 1; }
    .pl-quem { width: auto; min-width: 16ch; }
    .pl-st { width: auto; min-width: 15ch; }
    .pl-dep, .pl-des { width: auto; min-width: 13ch; }
    .pl-prova { width: auto; min-width: 20ch; }
    /* a coluna colada precisa de fundo opaco, senão o texto de baixo aparece
       através dela durante a rolagem */
    thead .pl-task { background: var(--bg); }
    .pl-task { box-shadow: 1px 0 0 var(--line-soft); }
  }
  .bl-grupo-n {
    font: 700 11.5px/1 var(--mono); color: var(--dim); flex: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px;
  }
  .bl-onde { font: 400 11.5px/1 var(--mono); color: var(--faint); }

  /* No telefone o fio nao cabe na mesma linha do titulo e desceria sozinho,
     virando um risco solto no meio da tela. Some. E com uma coluna so, a altura
     minima do cartao vira espaco morto: cada um passa a ter a altura do que tem
     dentro, que e a linha compacta que ele aprovou no aparelho. */
  @container painel (max-width: 560px) {
    .bl-fio { display: none; }
    .ct-cab, .ct-tar { min-height: 0; }
  }

  .bl-nada {
    margin: 0; padding: 15px 14px; font-size: 12px; color: var(--faint);
    border: 1px dashed var(--line); border-radius: 10px; max-width: 540px;
    overflow-wrap: anywhere;
  }
  .bl-nota { margin: 9px 2px 0; font-size: 11.5px; color: var(--faint); max-width: 620px; overflow-wrap: anywhere; }
  .bl-ordens { display: flex; gap: 5px; margin: 0 0 11px; flex-wrap: wrap; }
  /* Mesma correcao do `.gr-abrir`, com recuo lateral de 2px porque a lacuna
     desta fileira e 5, nao 8. */
  .bl-ord {
    position: relative;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; min-height: 32px; cursor: pointer; color: var(--dim); font-size: 11.5px;
  }
  .bl-ord::after { content: ''; position: absolute; inset: -6px -2px; }
  .bl-ord.on { border-color: var(--acento); color: var(--fg); }

  /* ==================== a visao geral: tudo em quadradinhos ==================

     Pedido dele em 16/08, com o defeito e a forma na mesma frase: *"eu quero
     que eu consiga ver as coisas como quadradinhos, pra eu poder selecionar e
     ver mais informacoes. Do jeito que esta, estao cards muito grandes, eu
     tenho que ficar dando rolagem pra ler"*.

     A conta que justifica a forma: sao 43 itens. Em cartao de 320px eles
     ocupam sete telas de celular; em quadrado de 54px cabem em uma. O que o
     quadrado carrega e o minimo para ele escolher ONDE tocar, e nada alem:
     o codigo do item e a cor do estado. A prosa abre no toque, logo abaixo da
     grade, sem trocar de tela nem perder o lugar.

     Piso de 44px, que e o alvo de toque minimo e tambem o limite de baixo da
     legibilidade: "CC-104" em 9,5px mono ocupa 34px, e um piso menor quebraria
     o codigo em duas linhas, que deixa de ser reconhecivel de relance. */
  /* `minmax(0, 1fr)` e `min-width: 0` nao sao enfeite, sao o conserto.
     Item de grade nasce com `min-width: auto`, que vale o conteudo: a grade de
     quadrados de dentro pediu 21 colunas, o bloco virou 1036px num painel de
     366, e a legenda e as fileiras saiam pela direita da tela. */
  .gr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .gr > * { min-width: 0; }

  /* A legenda vem ANTES da grade, nao depois. Grade de cor lida sem legenda e
     enigma, e o custo de descobrir isso e o mesmo tempo que o resumo deveria
     economizar. */
  .gr-leg {
    display: flex; flex-wrap: wrap; gap: 5px 12px; margin: 0 0 12px; padding: 0;
    font: 400 11.5px/1.4 var(--mono); color: var(--faint);
  }
  .gr-leg i { display: inline-flex; align-items: center; gap: 5px; font-style: normal; }
  .gr-leg i::before {
    content: ''; width: 10px; height: 10px; border-radius: 3px; flex: none;
    border: 1px solid var(--line); background: var(--surface);
  }
  .gr-leg i.s-working::before { border-color: var(--working); background: color-mix(in srgb, var(--working) 40%, var(--surface)); }
  .gr-leg i.s-waiting::before { border-color: var(--waiting); background: color-mix(in srgb, var(--waiting) 40%, var(--surface)); }
  .gr-leg i.s-failed::before  { border-color: var(--failed);  background: color-mix(in srgb, var(--failed) 40%, var(--surface)); }
  .gr-leg i.s-done::before    { border-color: var(--done);    background: color-mix(in srgb, var(--done) 40%, var(--surface)); }

  /* Cabecalho de bloco na visao geral. E o mesmo do resto da tela, mais baixo:
     tres deles em uma tela de celular nao podem custar 33px cada. */
  .gr-h { display: flex; align-items: center; gap: 8px; margin: 0 0 7px; flex-wrap: wrap; }
  .gr-h b {
    font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--fg);
  }
  .gr-h .bl-h-n { font: 700 11.5px/1 var(--mono); color: var(--dim); flex: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px; }
  /* A pastilha mede 34px de alto, e o alvo de toque minimo e 44. Crescer a
     pastilha custaria 10px em cada um dos tres cabecalhos, e rolagem foi
     justamente a queixa dele. Entao cresce so o ALVO: um retangulo invisivel
     de 46px por cima, que nao ocupa espaco nenhum no fluxo. O recuo lateral
     para em 4px porque a lacuna da fileira e 8, e dois alvos vizinhos
     esticados 4 de cada lado encostam sem se sobrepor. */
  .gr-abrir {
    position: relative;
    flex: none; background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; min-height: 34px; cursor: pointer; color: var(--dim); font-size: 11.5px;
  }
  .gr-abrir::after { content: ''; position: absolute; inset: -6px -4px; }
  .gr-abrir:hover { border-color: var(--acento); color: var(--fg); }
  .gr-abrir:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  /* O nome do projeto sobre a fileira dele. Sem isto, 35 quadrados viram uma
     mancha unica e a pergunta "de onde e este item" so tem resposta no toque. */
  .gr-proj { display: flex; align-items: baseline; gap: 7px; margin: 8px 0 4px; flex-wrap: wrap; }
  .gr-proj-n {
    font: 700 11px/1.2 var(--label); letter-spacing: .05em; text-transform: uppercase;
    color: var(--dim); min-width: 0; overflow-wrap: anywhere;
  }
  .gr-proj-c { font: 400 11px/1 var(--mono); color: var(--faint); flex: none; }
  /* A sigla com o "?": dica, nao verbete. Quem quiser mais abre o glossario. */
  .gr-sigla {
    font: 400 11px/1 var(--mono); color: var(--faint); flex: none;
    border-bottom: 1px dotted var(--faint); cursor: help; text-decoration: none;
  }

  /* `min(44px, 100%)` no piso e obrigatorio, nao enfeite: com `44px` puro, um
     container mais estreito faz a trilha estourar e a pagina rola de lado.
     O teto de 1180px e medida de leitura: fileira mais longa que isso e o olho
     perde a linha na volta, e um monitor de 1900 daria 38 quadrados por fila. */
  .gr-grade {
    display: grid; gap: 4px; max-width: 1180px;
    grid-template-columns: repeat(auto-fill, minmax(min(44px, 100%), 1fr));
  }

  /* O quadradinho. A barra de 3px na esquerda e a mesma linguagem do cartao
     grande, so que agora cerca 54px em vez de 320. */
  .gq {
    aspect-ratio: 1 / 1; min-width: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 2px; margin: 0; cursor: pointer; color: var(--dim);
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 8px;
  }
  /* Sombra interna em vez de `border-color` no hover: a borda esquerda carrega
     o estado, e trocar a cor dela no hover apagaria a informacao no toque. */
  .gq:hover { box-shadow: inset 0 0 0 1px var(--acento); }
  .gq:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .gq-cod { font: 700 11px/1 var(--mono); letter-spacing: 0; color: var(--fg); white-space: nowrap; }
  /* A palavra do estado, em 7,5px. Existe para o daltonico e para quem nunca
     leu a legenda: cor sozinha nao pode ser a unica portadora do estado.
     So aparece fora da fila, porque "NA FILA" em 30 de 35 quadrados foi a
     queixa registrada dele, e repetir o padrao 30 vezes nao informa nada. */
  .gq-est {
    font: 700 11px/1 var(--label); letter-spacing: .04em; text-transform: uppercase;
    white-space: nowrap; max-width: 100%; overflow: hidden;
  }
  .gq.s-working { border-color: color-mix(in srgb, var(--working) 40%, var(--line));
    border-left-color: var(--working); background: color-mix(in srgb, var(--working) 13%, var(--surface)); }
  .gq.s-working .gq-est { color: var(--working); }
  .gq.s-waiting { border-color: color-mix(in srgb, var(--waiting) 40%, var(--line));
    border-left-color: var(--waiting); background: color-mix(in srgb, var(--waiting) 13%, var(--surface)); }
  .gq.s-waiting .gq-est { color: var(--waiting); }
  .gq.s-failed { border-color: color-mix(in srgb, var(--failed) 40%, var(--line));
    border-left-color: var(--failed); background: color-mix(in srgb, var(--failed) 13%, var(--surface)); }
  .gq.s-failed .gq-est { color: var(--failed); }
  .gq.s-done { border-color: color-mix(in srgb, var(--done) 40%, var(--line));
    border-left-color: var(--done); background: color-mix(in srgb, var(--done) 13%, var(--surface)); }
  .gq.s-done .gq-est { color: var(--done); }
  .gq.sel { outline: 2px solid var(--acento); outline-offset: 1px; box-shadow: none; }

  /* O detalhe abre no lugar, logo abaixo da fileira do quadrado tocado. Nao e
     modal de proposito: modal tampa o mapa, e o mapa e o que ele veio ver. */
  .gq-det {
    margin: 9px 0 0; padding: 12px 13px; max-width: 760px;
    display: grid; gap: 8px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 10px;
  }
  .gq-det.s-working { border-left-color: var(--working); }
  .gq-det.s-waiting { border-left-color: var(--waiting); }
  .gq-det.s-failed  { border-left-color: var(--failed); }
  .gq-det.s-done    { border-left-color: var(--done); }
  .gq-det-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .gq-det-t {
    font-size: 14.5px; font-weight: 600; line-height: 1.34; color: var(--fg); overflow-wrap: anywhere;
  }
  .gq-det-m { margin: 0; font: 400 11.5px/1.45 var(--mono); color: var(--faint); overflow-wrap: anywhere; }
  .gq-det-a { display: flex; gap: 6px; flex-wrap: wrap; }
  .gq-det-c { display: flex; align-items: flex-start; gap: 9px; }
  .gq-det-c input[type=checkbox] { width: 17px; height: 17px; margin: 2px 0 0; flex: none; accent-color: var(--acento); }
  .gq-x {
    margin-left: auto; flex: none; background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 11px; min-height: 32px; cursor: pointer;
    color: var(--faint); font-size: 11.5px;
  }
  .gq-x:hover { border-color: var(--acento); color: var(--fg); }

  @media (prefers-reduced-motion: reduce) {
    .bl-cara { transition: none; }
  }

  /* CC-100: o que acabou de mudar. Fica no TOPO da aba sprint porque a
     pergunta que ela responde vem antes de "o que falta": ele abre o painel no
     meio da conversa querendo saber o que aconteceu enquanto lia. */
  .mudou {
    border: 1px solid var(--line); border-left: 3px solid var(--done);
    border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; background: var(--surface);
  }
  .mudou h4 {
    font: 700 11.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    color: var(--done); margin: 0 0 8px;
  }
  .mudou h4 .dim { letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 11.5px; }
  .mudou-item { display: grid; grid-template-columns: 62px 1fr; gap: 2px 8px; margin-bottom: 7px; font-size: 12px; }
  .mudou-q { font-family: var(--mono); font-size: 11.5px; color: var(--faint); text-align: right; }
  .mudou-t { overflow-wrap: anywhere; }
  .mudou-p, .mudou-sp { grid-column: 2; font-size: 11.5px; line-height: 1.4; }
  .mudou-p { color: var(--dim); }
  .mudou-sp { color: var(--failed); }
  .mudou-olho {
    font: 700 9.5px/1 var(--label); letter-spacing: .07em; text-transform: uppercase;
    color: var(--waiting); border: 1px solid var(--waiting); border-radius: 999px;
    padding: 1px 6px; margin-right: 2px;
  }
  .mudou-item.precisa-olho .mudou-t { font-weight: 600; }

  /* CC-99: a revisão da tarefa, no backlog e não no chat. Vermelha enquanto
     não foi respondida — apontamento em aberto é a coisa mais fácil de perder,
     e era exatamente o que sumia na conversa. */
  .todo-rev {
    margin: -2px 0 6px 30px; font-size: 11px; line-height: 1.45; color: var(--dim);
    border-left: 2px solid var(--failed); padding-left: 8px;
  }
  .todo-rev.rev-ok { border-left-color: var(--done); }
  .todo-rev b { color: var(--faint); }
  .rev-resp { display: block; color: var(--dim); }
  .rev-aberta { display: block; color: var(--failed); font-size: 11.5px; }

  /* CC-98: as duas ordens do backlog, no topo do mapa. */
  .m-ordens { margin: 0 0 16px; }
  .m-otabs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
  .m-otab {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 11px; cursor: pointer; color: var(--dim); font-size: 11px;
  }
  .m-otab.on { border-color: var(--acento); color: var(--fg); }
  .m-oexp { font-size: 11px; line-height: 1.45; margin: 0 0 8px; max-width: 62ch; }
  .m-olist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: o; }
  .m-olist li { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  /* o número é o dado, não enfeite: a importância calculada ou a idade */
  .m-onum {
    flex: none; min-width: 34px; text-align: right; font-family: var(--mono);
    font-size: 11px; color: var(--acento); font-variant-numeric: tabular-nums;
  }
  .m-otit { min-width: 0; overflow-wrap: anywhere; }
  .m-odep { flex: none; font-size: 11.5px; color: var(--faint); }

  /* ---------- a bancada: níveis de verificação ---------- */
  .bn-niveis { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); margin-bottom: 12px; }
  .bn-nivel {
    display: grid; gap: 3px; text-align: left; cursor: pointer; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--dim);
  }
  .bn-nivel:hover { border-color: var(--acento); }
  /* o nível escolhido é a única decisão desta tela: precisa ganhar de tudo */
  .bn-nivel.on { border-color: var(--acento); color: var(--fg); box-shadow: inset 0 0 0 1px var(--acento); }
  .bn-nivel b { font-size: 14px; }
  .bn-nivel span { font-size: 11.5px; line-height: 1.35; }
  .bn-nivel i { font-style: normal; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
  .bn-atual { font-size: 12.5px; line-height: 1.5; color: var(--dim); margin: 0 0 12px; max-width: 72ch; }
  .bn-acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .bn-alerta {
    border: 1px solid var(--failed); border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; margin-bottom: 16px;
  }
  .bn-h { font: 700 11px/1 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
  .bn-lista { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); }
  .bn-camada { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
  /* camada de nível acima fica visível mas apagada: sumir com ela esconderia o
     que se ganha ao subir de nível, que é justamente a decisão desta tela */
  .bn-fora { opacity: .55; }
  .bn-topo { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 4px; }
  .bn-topo b { font-size: 13px; }
  .bn-explica { display: block; font-size: 11.5px; line-height: 1.45; color: var(--dim); }
  .bn-pe { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; }
  .fw-selo.v-done { border-color: var(--done); color: var(--done); }
  .fw-selo.v-failed { border-color: var(--failed); color: var(--failed); }
  .fw-selo.v-waiting { border-color: var(--waiting); color: var(--waiting); }
  .fw-selo.v-faint { border-color: var(--faint); color: var(--faint); }

  /* ---------- CC-82: a estante de documentos ---------- */
  .doc-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .doc-barra input { flex: 1 1 220px; min-width: 0; }
  .doc-lista { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
  .doc-card {
    display: grid; gap: 3px; text-align: left; cursor: pointer; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg);
  }
  .doc-card:hover { border-color: var(--acento); }
