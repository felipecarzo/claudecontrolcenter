  const total = (PRECO.tarefas || []).reduce((a, t) => a + (t.preco || 0), 0)
  const vdP = !qtd
    ? 'Nenhum problema resolvido no período, sem base para preço.'
    : `${qtd} problema(s) resolvido(s)${total ? `, somando ${brl(total)}` : ''}. Clique numa linha para ver por que aquele nível.`

  return cabecaDaTela('Quanto cobrar por isso?', vdP, 'bom') + ctl + faixas + resumo + aviso
    + `<div class="p-linha p-head">
        <span>o que foi resolvido</span><span class="v">projeto</span><span class="v">nível</span>
        <span class="v">medido</span><span class="v">seu tempo</span><span class="v">cobrado</span><span class="v">preço</span>
      </div>`
    + PRECO.tarefas.slice(0, 120).map(linha).join('')
    + (PRECO.tarefas.length > 120
      ? `<p class="path" style="margin:10px 0 0">mostrando as 120 mais caras de ${PRECO.tarefas.length}</p>` : '')
}

/* ========================== aba: VPS ==========================
   Organograma da VPS — nginx, Docker e PM2 — pra não depender só de SSH cru.
   A leitura é sempre sob clique (`atualizarVps`), nunca automática: usa a
   chave privada do Felipe pra entrar num servidor de produção, e o painel já
   é processo que fica sempre religado — não é lugar pra SSH em timer. */

let VPS = null
let vpsConfigAberto = false
let vpsAtualizando = false

async function carregarVps(force) {
  if (VPS && !force) return
  try {
    VPS = await (await fetch('/api/vps')).json()
  } catch {
    VPS = null
  }
  render()
}

async function salvarVpsConfig() {
  const host = $('#vps-host').value.trim()
  const usuario = $('#vps-usuario').value.trim() || 'root'
  const chaveDigitada = $('#vps-chave').value.trim()
  if (!VPS?.configurado && !chaveDigitada) {
    return alert('primeira vez: precisa do caminho da chave privada também')
  }
  const body = { host, usuario }
  if (chaveDigitada) body.chave = chaveDigitada // vazio = mantém a que já tem
  const r = await fetch('/api/vps', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  vpsConfigAberto = false
  return carregarVps(true)
}

async function atualizarVps() {
  vpsAtualizando = true
  render()
  try {
    const r = await fetch('/api/vps/atualizar', { method: 'POST' })
    const out = await r.json()
    if (!out.ok) alert(out.error)
    else VPS = { ...VPS, snapshot: out.snapshot }
  } catch {
    alert('não consegui falar com o painel, confira se ele ainda está no ar')
  }
  vpsAtualizando = false
  render()
}

function viewVpsFormulario() {
  const v = VPS || {}
  return `<div class="vps-form">
    <label>host (IP ou domínio)<input id="vps-host" value="${esc(v.host || '')}" placeholder="66.94.117.215"></label>
    <label>usuário<input id="vps-usuario" value="${esc(v.usuario || 'root')}"></label>
    <label>caminho da chave privada<input id="vps-chave" value=""
      placeholder="${v.configurado ? 'já configurada, deixe em branco pra manter' : '~/.ssh/id_ed25519_...'}"></label>
    <button class="btn" data-vps-salvar="1">salvar</button>
    <p class="path">a chave em si nunca sai desta máquina, só o caminho do arquivo fica guardado</p>
  </div>`
}

function viewVpsOrganograma(s) {
  const portaParaDocker = new Map()
  for (const c of s.docker) if (c.porta) portaParaDocker.set(c.porta, c.nome)

  const statLinha = (rot, uso, detalhe) => (uso == null ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${uso >= 90 ? 'alto' : uso >= 70 ? 'medio' : 'baixo'}">
    <span class="u-barra"><i style="width:${Math.min(uso, 100)}%"></i></span><b>${Math.round(uso)}%</b></span>
    <span class="path">${esc(detalhe)}</span></div>`)

  const ramPct = s.ram ? Math.round((100 * s.ram.usadoMB) / s.ram.totalMB) : null
  const discoPct = s.disco ? Math.round((100 * s.disco.usadoGB) / s.disco.totalGB) : null

  const cartaoNginx = (n) => `<article class="srv-card">
    <b class="c-titulo">${esc(n.serverName || n.arquivo)}</b>
    ${n.tipo === 'proxy'
      ? `<p class="srv-resumo">proxy → ${esc(n.alvo || '?')}${
          n.porta && portaParaDocker.has(n.porta) ? ` <span class="vps-liga">(${esc(portaParaDocker.get(n.porta))})</span>` : ''}</p>`
      : n.tipo === 'estatico'
        ? `<p class="srv-resumo">estático → ${esc(n.alvo || '?')}</p>`
        : '<p class="srv-resumo">sem proxy_pass nem root identificado</p>'}
  </article>`

  const cartaoDockerVps = (c) => `<article class="srv-card">
    <b class="c-titulo">${esc(c.nome)}</b>
    <p class="srv-resumo">${esc(c.imagem)}</p>
    ${c.portas.length ? `<p class="c-proj">${c.portas.map(esc).join(' · ')}</p>` : ''}
    <p class="path">${esc(c.status)}</p>
  </article>`

  const cartaoPm2 = (p) => `<article class="srv-card">
    <b class="c-titulo">${esc(p.nome)}</b>
    <p class="srv-resumo">${esc(p.status)}${p.memMB ? ` · ${p.memMB} MB` : ''}</p>
    <p class="path">${p.restarts} reinício${p.restarts === 1 ? '' : 's'}${p.uptimeMs ? ' · no ar há ' + age(p.uptimeMs) : ''}</p>
  </article>`

  /* Título em português, nome da ferramenta entre parênteses e um "?" que abre
     a explicação. O nome técnico fica: quem conhece reconhece na hora, quem não
     conhece não precisa dele para entender a seção. */
  const secao = (id, lista, cartao) => {
    const d = (VPS.secoes || {})[id] || { titulo: id, tecnico: id, ajuda: '', vazio: 'nada aqui' }
    return `<section>
      <div class="col-head">
        <span>${esc(d.titulo)}</span>
        <span class="vps-tec">${esc(d.tecnico)}</span>
        ${d.ajuda ? `<button class="ajuda" data-ajuda="${esc(d.ajuda)}" title="o que é isto?">?</button>` : ''}
        <span class="n">${(lista || []).length}</span>
      </div>
      <div class="cards">${(lista || []).length ? lista.map(cartao).join('') : `<div class="path">${esc(d.vazio)}</div>`}</div>
    </section>`
  }

  return `
    <div class="vps-stats">
      ${s.uptime ? `<span class="path">${esc(s.uptime.trim())}</span>` : ''}
      ${ramPct != null ? statLinha('ram', ramPct, `${s.ram.usadoMB} de ${s.ram.totalMB} MB`) : ''}
      ${discoPct != null ? statLinha('disco', discoPct, `${s.disco.usadoGB} de ${s.disco.totalGB} GB`) : ''}
    </div>
    <div class="vps-organograma">
      ${secao('nginx', s.nginx, cartaoNginx)}
      ${secao('docker', s.docker, cartaoDockerVps)}
      ${secao('pm2', s.pm2, cartaoPm2)}
    </div>`
}

function viewVps() {
  if (!VPS) return '<div class="empty">carregando…</div>'
  if (!VPS.configurado) return `<div class="col-head"><span>conectar na VPS</span></div>${viewVpsFormulario()}`

  const s = VPS.snapshot
  const saude = VPS.saude || { cor: 'neutro', frase: '', alertas: [] }

     traduzir sozinho para saber se estava tudo bem. */
  return `

  </div>`

// A porta é o que identifica o servidor na cabeça de quem procura — por isso
// vem primeiro e grande, em vez de ser a primeira coluna de uma tabela.
function cartaoSrv(s) {
  /* CC-120: qual agente está na mesma pasta que este servidor.
   *
   * Saiu do inventário das telas: a aba de servidores mostra o processo, a de
   * agentes mostra quem trabalha, e o elo entre os dois só existia na cabeça
   * dele. O dado já estava todo aqui, dos dois lados, e ninguém cruzava.
   *
   * **O rótulo diz "trabalhando aqui", e não "subiu isto", porque a prova é de
   * pasta e não de autoria.** Ninguém registra quem deu `npm run dev`: o que se
   * sabe é que a pasta do agente e a do servidor são a mesma. Prometer autoria
   * seria a tela afirmando mais do que mediu.
   *
   * **O casamento é por PROJETO, e a primeira versão fazia por caminho.** Ela
   * saiu no print e estava errada de um jeito que o código não denunciava: a
   * sessão avulsa aberta na pasta pessoal casava com TODOS os servidores, porque
   * todo projeto mora dentro dela. Um agente aparecia em cada cartão da tela.
   *
   * Sobra o caminho para quem não tem projeto identificado, e aí só valem a
   * pasta idêntica ou o agente numa subpasta do servidor. O sentido contrário,
   * servidor dentro da pasta do agente, é justamente o que trouxe o defeito.
   */
  const norm = (p) => String(p || '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase()
  const aqui = (DATA.jobs || []).filter((j) => {
    if (s.project && j.project) return norm(s.project) === norm(j.project)
    const a = norm(j.worktreePath || j.cwd)
    const b = norm(s.path)
    return a && b && (a === b || a.startsWith(`${b}/`))
  })

  return `
    <article class="srv-card${s.dev ? ' dev' : ''}">
      <header>
        <b class="port">:${s.ports.join(', :')}</b>
        <span class="cat">${esc(s.kind)}</span>
        <span class="grow"></span>
        ${s.dev ? `<button class="srv-fav${s.favorito ? ' on' : ''}" data-srv-fav="${esc(s.chave)}"
          title="${s.favorito ? 'tirar dos favoritos' : 'marcar como favorito'}">${s.favorito ? '★' : '☆'}</button>` : ''}
        <span class="path">pid ${s.pid}</span>
      </header>
      <b class="c-titulo">${esc(s.titulo || s.name)}</b>
      ${s.resumo && s.resumo !== s.titulo
        ? `<p class="srv-resumo" title="${esc(s.cmd)}">${esc(s.resumo)}</p>` : ''}
      ${s.nota ? `<p class="srv-nota">${esc(s.nota)}</p>` : ''}
      ${s.path ? `<p class="c-proj" title="${esc(s.path)}">${esc(cauda(s.path))}</p>` : ''}
      ${aqui.length ? `<p class="c-proj">${aqui.map((j) => `
        <span class="ck-frio" data-job="${esc(j.id)}" tabindex="0"
          title="agente na mesma pasta deste servidor. O painel não sabe quem deu o comando: o que ele sabe é que a pasta é a mesma">
          <i class="dot s-${j.status}"></i>${esc(j.subject || j.project)}
        </span>`).join('')}</p>` : ''}
      ${s.dev ? acoesDoCartao(s) : ''}
      <footer>
        <span class="path idade">${s.startedAt ? 'no ar há ' + age(Date.now() - s.startedAt) : '...'}</span>
        <span class="grow"></span>
        ${s.url ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">abrir</a>` : ''}
        ${s.dev && !s.protegido
          ? `<button class="btn danger" data-kill="${s.pid}">${armed === s.pid ? 'confirmar?' : 'encerrar'}</button>`
          : ''}
      </footer>
    </article>`
}

  // Por porta é o padrão porque a porta é o que a pessoa lembra. Por projeto

  const lista = srvModo === 'projeto'

  const vdSrv = dev.length

     , <button class="btn mini danger" data-dedup="1">${

/* ========================= render ============================ */

let redesenhoAdiado = false
let dadosPendentes = null

/**
 * O stream manda evento a cada 2s e `render()` reescreve o painel inteiro —
 * o cursor sumiria no meio da palavra. Enquanto houver campo em foco dentro
 * do painel, o redesenho espera; sai o foco, ele acontece.
 */
function editando() {
  const alvo = document.activeElement
  /* `select` entrou em 17/08, ao levar o seletor de modo para a lista de
     módulos: é a mesma armadilha do menu de abas. O popup NATIVO do select
     morre junto com o nó no redesenho de 2s, e no telefone ele fechava na cara
     do Felipe antes do toque. O redesenho volta no blur, como nos campos. */
  if (!alvo || !alvo.matches('input, textarea, select')) return false
  // `SEM_GUARDA` é a chave que o teste vira para provar que ainda pega o
  // defeito. Sem respeitá-la aqui, a auto-prova passava por acidente: a trava
  // do menu desligava e esta continuava segurando o redesenho.
  if (window.SEM_GUARDA) return false
  // o painel lateral também é reescrito por render(), vale a mesma trava
  return $('#main').contains(alvo) || $('#drawer').contains(alvo)
}

/**
 * Trocar `DATA` no meio da digitação é pior que redesenhar: a tela continua
 * mostrando a lista antiga enquanto os índices já mudaram, e a edição vai
 * parar em outra tarefa. Snapshot e tela esperam juntos.
 */
function aplicarDados(snapshot) {
  if (editando()) { dadosPendentes = snapshot; return }
  DATA = snapshot
  // liga/desliga num aparelho tem que aparecer nos outros sem reabrir a aba
  // (bug relatado em 13/08: "ligado" só via quem clicou). `projetos` continua
  // vindo só do GET inicial, que é a parte cara (varre disco); `ativos` é
  // barato e chega em todo tique de 2s.
  if (REMOTO_DATA && snapshot.remoto) REMOTO_DATA.ativos = snapshot.remoto
  render()
}

/**
 * Trocar de aba, num lugar só.
 *
 * Antes isto vivia dentro do handler de clique, e a mesma lista de "o que
 * carregar" estava repetida no boot — duas cópias que precisavam ser lembradas
 * juntas a cada aba nova. Com o F11 apareceu uma terceira porta de entrada (o
 * clique no grupo), e três cópias seria pedir para uma delas ficar para trás.
 */
function trocarAba(id) {
  if (!TABS.some((t) => t.id === id)) return
  tab = id
  localStorage.setItem('cc-tab', tab)
  armed = null
  render()
  carregarDaAba()
}

/** O que cada aba precisa buscar ao abrir. Chamado na troca e no boot. */
function carregarDaAba() {
  if (tab === 'agentes') carregarAgentesFora()
  if (tab === 'servidores') carregarServidores()
  if (tab === 'vps') carregarVps()
  if (tab === 'agenda') carregarAgenda()
  if (tab === 'hooks') carregarHooks()
  if (tab === 'rotinas') carregarRotinas()
  if (tab === 'remoto') { carregarRemoto(); if (!FEDERACAO) carregarFederacao() }
  if (tab === 'escritorio') carregarPaineis()
  if (tab === 'meu') carregarMeu()
  if (tab === 'glossario') carregarGlossario()
  if (tab === 'projetos') carregarTrabalho()
  if (tab === 'docs') carregarDocs()
  if (tab === 'bancada') carregarBancada()
  if (tab === 'tempo' || tab === 'graficos') carregarTempo()
  if (tab === 'preco') carregarPreco()
}

/* Markdown reduzido ao que ele escreve. Mesmo subconjunto do `previa.mjs`, e
   pelo mesmo motivo: "algo bem leve" foi a palavra dele, e uma biblioteca
   quebraria a regra de zero dependência do projeto. */
function mdParaHtml(md) {
  const linhas = String(md || '').split(/\r?\n/)
  const fora = []
  let lista = false
  let codigo = false
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[\[([^\]]+)\]\]/g, '<b>$1</b>')
  for (const l of linhas) {
    if (/^```/.test(l)) { fora.push(codigo ? '</pre>' : '<pre>'); codigo = !codigo; continue }
    if (codigo) { fora.push(esc(l)); continue }
    const item = /^\s*[-*]\s+(.+)$/.exec(l)
    if (item) {
      if (!lista) { fora.push('<ul>'); lista = true }
      fora.push(`<li>${inline(item[1])}</li>`); continue
    }
    if (lista) { fora.push('</ul>'); lista = false }
    const h = /^(#{1,3})\s+(.+)$/.exec(l)
    if (h) { fora.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue }
    const cit = /^>\s?(.*)$/.exec(l)
    if (cit) { fora.push(`<blockquote>${inline(cit[1])}</blockquote>`); continue }
    if (l.trim()) fora.push(`<p>${inline(l)}</p>`)
  }
  if (lista) fora.push('</ul>')
  if (codigo) fora.push('</pre>')
  return fora.join('\n')
}

const quandoCurto = (ms) => {
  if (!ms) return ''
  const d = Math.floor((Date.now() - ms) / 86400000)
  if (d === 0) return 'hoje'
  if (d === 1) return 'ontem'
  if (d < 30) return `há ${d} dias`
  return new Date(ms).toLocaleDateString('pt-BR')
}

/* A tela inteira: quatro visões da mesma pergunta, uma de cada vez.

   Ele pediu a divisão em 16/08: *"tem como a gente dividir isso em três
   janelas, poder ver os sprints, só ver os meus e só ver o de produto"*, e
   *"uma aba geral em que vê os três juntos, de uma forma diminuída"*. Os nomes
   são os que ele escolheu, não os nossos.

   As três listas continuam exatamente como estavam, porque foram aprovadas

   comprime as três em quadradinhos. Sprint primeiro porque é o que acontece
   agora, pendências dele em segundo porque bloqueiam, e o backlog de produto
   por último porque é o mais longo e o menos urgente. */
function viewTrabalho(jobs = []) {

  const sprint = agrupadoPorAgente(jobs)
  const nSprint = sprint.reduce((a, g) => a + g.itens.length, 0)
  const minhas = (TRABALHO.pendencias || []).filter((p) => !p.feito)
  const nBacklog = (TRABALHO.grupos || []).reduce((a, g) => a + g.cartoes.length, 0)
  const nMudou = mudancasRecentes().length

  const vista = (id, rotulo, n, cor) => `<button

      + (nMudou ? `<section class="bl-sec">${viewMudou()}</section>` : ''),

  const vd = typeof TRABALHO.veredito === 'string'
    ? { frase: TRABALHO.veredito, cor: minhas.length ? 'atencao' : 'bom', calmo: !minhas.length }

  return cabecaDaTela('Em que pé está o trabalho?', vd.frase, vd.cor)

    /* CC-115: a porta dos módulos. A vista antiga do cockpit tinha o botão do

/* CC: o "?" que diz o que a sigla quer dizer.

function vistaGeral(sprint, nSprint, minhas, nBacklog, nMudou) {
  /* O botão vem ANTES do fio, colado na contagem. Depois dele, num monitor de
     1900, ele terminava a 1800px do título a que pertence, que é a mesma
     viagem de olho que fez os cartões grandes serem recusados. */
  const cab = (titulo, n, alvo) => `<div class="gr-h">
    <b>${esc(titulo)}</b>
    <span class="bl-h-n">${n}</span>
    <button class="gr-abrir" data-trab-vista="${alvo}">abrir a lista</button>
    <span class="bl-fio" aria-hidden="true"></span>
  </div>`

  const focoSprint = trabalhoFoco?.startsWith('s:')
  const focoVoce = trabalhoFoco?.startsWith('v:')
  const focoBacklog = trabalhoFoco?.startsWith('b:')

  /* S1 e V1 são POSIÇÃO na lista, não identidade, e o detalhe precisa repetir o
     mesmo código que estava no quadrado tocado. O mapa nasce aqui, onde a
     posição é contada uma vez só, em vez de o detalhe recontar por fora e as
     duas contas discordarem no dia em que a ordem mudar. */
  const codigos = new Map()

  let n = 0
  /* O código vem da tarefa, não da posição: `s01` nasce quando a tarefa nasce
     e não muda quando outra fecha. Era o defeito que ele apontou em 17/08 —
     "essas tarefas S não dizem nada c nada e tão fora de qualquer projeto".
     O projeto entra no texto de apoio e no cabeçalho do grupo. */
  const quadSprint = sprint.flatMap(({ job, itens }) => itens.map(({ t, i }) => {
    const ruim = (t.revisoes || []).some((r) => !r.respondeu)
    const cod = t.codigo || `s${i + 1}`
    codigos.set(`s:${job.id}:${i}`, cod)
    return quadrado(`s:${job.id}:${i}`, cod, ruim ? 'failed' : 'working',
      ruim ? 'revisar' : 'anda', `${t.text}, no projeto ${job.project}`)
  })).join('')

  const quadVoce = minhas.map((p, i) => {
    codigos.set(`v:${p.id}`, `V${i + 1}`)
    return quadrado(`v:${p.id}`, `V${i + 1}`, 'waiting',
      'você', `${p.texto}, em ${p.projeto || 'sem projeto'}`)
  }).join('')

  const detalhe = () => detalheDoFoco(sprint, minhas, codigos)

  /* O detalhe entra depois da grade DO PROJETO tocado, não no fim do bloco: com
     35 itens em quatro projetos, o fim do bloco fica 350px abaixo do quadrado,
     e abrir o detalhe empurraria para fora da tela justamente o que se tocou. */
  const blocosProduto = (TRABALHO.grupos || []).map((g) => `
    <div class="gr-proj">
      <span class="gr-proj-n">${esc(g.projeto)}</span>
      <span class="gr-proj-c">${g.cartoes.length}</span>
      ${siglaDo(g.projeto)}
    </div>
    <div class="gr-grade">${g.cartoes.map((c) => quadrado(
    `b:${g.projeto}:${c.nome}`, c.marca?.texto || '?', c.estado.cor,
    palavraCurta(c.estado.palavra), `${c.rotulo || c.nome}, ${c.estado.palavra.toLowerCase()}`,
  )).join('')}</div>
    ${focoBacklog && trabalhoFoco.startsWith(`b:${g.projeto}:`) ? detalhe() : ''}`).join('')

  return `<div class="gr">
    <div>
      <p class="gr-leg">
        <i class="s-working">andando</i>
        <i class="s-waiting">espera você</i>
        <i class="s-failed">com problema</i>
        <i class="s-done">feito</i>
        <i>na fila</i>
      </p>
      ${cab('Sprint backlog', nSprint, 'sprint')}
      ${quadSprint
    ? `<div class="gr-grade">${quadSprint}</div>` : '<p class="bl-nada">nenhuma tarefa aberta agora</p>'}
      ${focoSprint ? detalhe() : ''}
    </div>

    <div>
      ${cab('Backlog de pendências', minhas.length, 'voce')}
      ${quadVoce
    ? `<div class="gr-grade">${quadVoce}</div>` : '<p class="bl-nada">nada depende de você agora</p>'}
      ${focoVoce ? detalhe() : ''}
    </div>

    <div>
      ${cab('Product backlog', nBacklog, 'produto')}
      ${blocosProduto || '<p class="bl-nada">nenhum projeto com item aberto</p>'}
    </div>

    ${nMudou ? viewMudou() : ''}
  </div>`
}

/* "VOCÊ DECIDE" não cabe em 54px, e "NA FILA" não precisa caber: fila é o
   estado padrão de 30 dos 35 itens, e escrever o óbvio 30 vezes foi a queixa
   registrada dele. Fora da fila, uma palavra curta e nada mais. */
function palavraCurta(palavra) {
  const p = (palavra || '').toUpperCase()
  if (p === 'NA FILA') return ''
  if (p === 'VOCÊ DECIDE') return 'você'
  if (p === 'ANDANDO') return 'anda'
  return p.toLowerCase().split(' ')[0].slice(0, 7)
}

/* O quadradinho. Carrega o código e a cor, que é o mínimo para escolher onde
   tocar; o `aria-label` carrega a frase inteira, para quem ouve a tela. */
function quadrado(chave, codigo, cor, curta, dica) {
  const sel = trabalhoFoco === chave
  return `<button class="gq s-${cor}${sel ? ' sel' : ''}" data-trab-foco="${esc(chave)}"
    aria-pressed="${sel}" title="${esc(dica)}" aria-label="${esc(`${codigo}: ${dica}`)}">
    <span class="gq-cod">${esc(codigo)}</span>
    ${curta ? `<span class="gq-est">${esc(curta)}</span>` : ''}
  </button>`
}

/* O detalhe do quadrado tocado. Uma função para os três tipos porque a leitura
   é a mesma nos três: código e estado, o nome, de onde é, e o caminho para a
   lista inteira. O que muda é só o corpo do meio. */
function detalheDoFoco(sprint, minhas, codigos) {
  const [tipo, ...resto] = (trabalhoFoco || '').split(':')
  const fechar = '<button class="gq-x" data-trab-foco="">fechar</button>'
  // o código repete o do quadrado tocado: é o que liga o detalhe ao lugar de
  // onde ele saiu, e sem isso a caixa que abre parece vir do nada
  const cod = codigos.get(trabalhoFoco) || ''

  if (tipo === 's') {
    const [jobId, i] = [resto[0], Number(resto[1])]
    const grupo = sprint.find(({ job }) => job.id === jobId)
    const t = grupo?.job.todos?.[i]
    if (!t) return ''
    const ruim = (t.revisoes || []).some((r) => !r.respondeu)
    return `<div class="gq-det s-${ruim ? 'failed' : 'working'}">
      <div class="gq-det-h">
        <span class="ct-cod real">${esc(cod)}</span>
        ${ruim ? '<span class="ct-selo c-failed">revisar</span>' : ''}
        ${t.prova ? '<span class="ct-selo c-working">com prova</span>' : ''}
        ${fechar}
      </div>
      <label class="gq-det-c">
        <input type="checkbox" data-todo="${esc(grupo.job.id)}" data-i="${i}"
          aria-label="marcar &quot;${esc(t.text)}&quot; como feita">
        <span class="gq-det-t">${esc(t.text)}</span>
      </label>
      <p class="gq-det-m">${esc(grupo.job.subject || grupo.job.project)}${
  t.prova ? ` · prova: ${esc(t.prova)}` : ''}</p>
      <div class="gq-det-a">
        <button class="bl-ord" data-tab-ir="todos">ver o sprint com prova e revisão</button>
      </div>
    </div>`
  }

  if (tipo === 'v') {
    const p = minhas.find((x) => x.id === resto.join(':'))
    if (!p) return ''
    return `<div class="gq-det s-waiting">
      <div class="gq-det-h">
        <span class="ct-cod real">${esc(cod)}</span>
        <span class="ct-selo c-waiting">${esc(p.fonte === 'lista' ? 'sua lista'
    : p.fonte === 'agente' ? 'do agente' : 'roadmap')}</span>
        ${fechar}
      </div>
      ${p.fonte === 'lista'
    ? `<label class="gq-det-c">
          <input type="checkbox" data-meu-check="${esc(p.id)}"
            aria-label="marcar &quot;${esc(p.texto)}&quot; como resolvida">
          <span class="gq-det-t">${esc(p.texto)}</span>
        </label>`
    : `<span class="gq-det-t">${esc(p.texto)}</span>`}
      ${p.porque ? `<p class="gq-det-m">${esc(p.porque)}</p>` : ''}
      <p class="gq-det-m">${esc(p.projeto || 'sem projeto')}${p.frente ? ` · ${esc(p.frente)}` : ''}${
  p.em ? ` · há ${esc(idadeCurta(p.em))}` : ''}</p>
      <div class="gq-det-a">
        <button class="bl-ord" data-trab-vista="voce">abrir o backlog de pendências</button>
      </div>
    </div>`
  }

  const projeto = resto[0]
  const nome = resto.slice(1).join(':')
  const grupo = (TRABALHO.grupos || []).find((g) => g.projeto === projeto)
  const c = grupo?.cartoes.find((x) => x.nome === nome)
  if (!c) return ''
  const e = c.estado
  return `<div class="gq-det s-${e.cor}">
    <div class="gq-det-h">
      <span class="ct-cod${c.marca?.real ? ' real' : ''}">${esc(c.marca?.texto || '')}</span>
      ${e.palavra !== 'NA FILA' ? `<span class="ct-selo c-${e.cor}">${esc(e.palavra.toLowerCase())}</span>` : ''}
      ${fechar}
    </div>
    <span class="gq-det-t">${esc(c.rotulo || c.nome)}</span>
    <p class="gq-det-m">${esc(projeto)}${e.porque ? ` · ${esc(e.porque)}` : ''}${
  c.fracao ? ` · ${c.fracao.feitos}/${c.fracao.itens} fechadas` : ''}</p>
    ${c.citacao ? `<blockquote class="bl-cit">${esc(c.citacao)}</blockquote>` : ''}
    ${c.tarefas.length || c.pendencias.length
    ? `<div class="bl-sub">${[...c.tarefas, ...c.pendencias].slice(0, 4).map((x) => `<div class="bl-sub-i">
        <span aria-hidden="true">›</span>${esc(x.texto)}</div>`).join('')}</div>` : ''}
    <div class="gq-det-a">
      <button class="bl-ord" data-trab-abrir="${esc(`${projeto}:${nome}`)}">abrir no product backlog</button>
    </div>
  </div>`
}

/* ---- lista 1: o sprint, o que está sendo feito agora ---- */

function agrupadoPorAgente(jobs) {
  const saida = []
  for (const j of jobs) {
    const itens = (j.todos || []).map((t, i) => ({ t, i })).filter(({ t }) => !t.done)
    if (itens.length) saida.push({ job: j, itens })
  }
  return saida
}

/* O cabeçalho de uma seção: nome, contagem colada nele, o que a lista é, e o
   fio até a borda. O fio é o que ocupa a sobra do monitor largo sem inventar
   conteúdo para preencher. */
const cabecaSecao = (titulo, n, sub) => `<div class="bl-h">
  <span class="bl-h-t">${esc(titulo)}</span>
  <span class="bl-h-n">${n}</span>
  <span class="bl-h-s">${esc(sub)}</span>
  <span class="bl-fio" aria-hidden="true"></span>
</div>`

/* ---- a planilha de roadmap (17/08) ----

   Pedido dele: "vamos criar a visão de tarefas estilo tabela/planilha de
   roadmap (…) nós já usamos em diversos projetos". As colunas NÃO foram
   inventadas: saíram da varredura dos ROADMAP.md dele, onde o formato mais
   completo é o do `proj_carzo`:

       | ID | Task | Prioridade | Complexidade | Status | Depende de | Desbloqueia |

   Duas colunas dele ficaram de fora porque não existe dado para preencher, e
   coluna vazia é pior que coluna ausente: `Prioridade` (P0/P1) e
   `Complexidade`, que hoje só existem para tarefa já concluída, na aba de
   preço. Entram no lugar delas as duas que o cockpit sabe e o arquivo não:
   quem está com a tarefa, e se a entrega tem prova.

   Os símbolos são os do quadro dele: ✅ concluído, 🏗️ em progresso,
   🔒 bloqueado por dependência, ⏳ pendente. */
const SIMBOLO_TAREFA = {
  feito: { icone: '✅', texto: 'concluído' },
  andando: { icone: '🏗️', texto: 'em progresso' },
  travado: { icone: '🔒', texto: 'bloqueado' },
  fila: { icone: '⏳', texto: 'pendente' },
}
const VAZIO = '<span class="path">-</span>'

function planilhaSprint(grupos) {
  /* Quem destrava quem: o inverso do "depende de", calculado sobre TODAS as
     tarefas de todos os agentes. Cruza agente, porque a tarefa que trava pode
     estar na mão de outro, e é justamente isso que ele não consegue ver hoje. */
  const todas = grupos.flatMap(({ job }) => (job.todos || []).map((t) => ({ t, job })))
  const destrava = new Map()
  for (const { t } of todas) {
    if (!t.dependeDe) continue
    const lista = destrava.get(t.dependeDe) || []
    lista.push(t.codigo || t.text.slice(0, 14))
    destrava.set(t.dependeDe, lista)
  }
  const feitaPorCodigo = new Map(todas.filter(({ t }) => t.codigo).map(({ t }) => [t.codigo, t.done]))

  const linhas = grupos.flatMap(({ job, itens }) => itens.map(({ t, i }) => {
    const esperando = t.dependeDe && feitaPorCodigo.get(t.dependeDe) === false
    const estado = t.done ? 'feito' : esperando ? 'travado' : 'andando'
    const s = SIMBOLO_TAREFA[estado]
    const desbloqueia = destrava.get(t.codigo) || []
    return `<tr class="pl-l s-${estado}">
      <td class="pl-id"><code>${esc(codigoComposto(job, t))}</code></td>
      <td class="pl-task">
        <label class="pl-marca"><input type="checkbox" data-todo="${esc(job.id)}" data-i="${i}"
          aria-label="marcar &quot;${esc(t.text)}&quot; como feita"><b>${esc(textoSemCodigo(t.text))}</b></label>
        ${t.pronto ? `<span class="path">pronto quando: ${esc(t.pronto)}</span>` : ''}
      </td>
      ${/* CC-119, o funil: a coluna diz o CAMINHO até o item de backlog, não só
            quem está com a tarefa. Produto e sprint eram duas telas que não se
            referenciavam; com o item do roadmap aqui, a linha de sprint aponta
            de volta para ele, que é o elo que o campo `frente` já guardava e
            ninguém via. */ ''}
      <td class="pl-quem">
        ${job.frente
    ? `<span class="c-frente" title="item do ROADMAP.md">${esc(job.frente)}</span>`
    : '<span class="path">sem item no roadmap</span>'}
        <span class="path">${esc(job.project)}${job.subject ? ` · ${esc(job.subject)}` : ''}</span>
      </td>
      <td class="pl-st" title="${s.texto}">${s.icone} ${s.texto}</td>
      <td class="pl-dep">${t.dependeDe ? `<code>${esc(t.dependeDe)}</code>` : VAZIO}</td>
      <td class="pl-des">${desbloqueia.length ? desbloqueia.map((c) => `<code>${esc(c)}</code>`).join(' ') : VAZIO}</td>
      <td class="pl-prova">${t.prova ? esc(t.prova) : (t.olho ? 'precisa do seu olho' : VAZIO)}</td>
    </tr>`
  }))

  if (!linhas.length) return '<p class="bl-nada">nenhuma tarefa aberta agora</p>'
  return `<div class="pl-rola"><table class="pl-tab">
    ${/* As classes vão nos `th`, não só nos `td`: em tabela de largura fixa a
          medida sai da PRIMEIRA linha, e sem elas as sete colunas voltavam a se
          dividir pelo conteúdo. Foi o que aconteceu na primeira tentativa. */ ''}
    <thead><tr>
      <th class="pl-id">ID</th><th class="pl-task">Task</th><th class="pl-quem">Item do roadmap</th>
      <th class="pl-st">Status</th><th class="pl-dep">Depende de</th>
      <th class="pl-des">Desbloqueia</th><th class="pl-prova">Prova</th>
    </tr></thead>
    <tbody>${linhas.join('')}</tbody>
  </table></div>`
}

/**
 * O ID da linha, na ordem em que ele existe de verdade:
 *
 * 1. Código escrito no PRÓPRIO texto da tarefa (`ESC-132 tela de cadastro`).
 *    Muitos agentes já escrevem assim, e ignorar isso mostrava "?" na coluna ID
 *    com o código ali do lado, dentro do texto. Visto no print de 17/08.
 * 2. Item do roadmap mais o número da tarefa, o formato dele: `CC-112_s02`.
 * 3. Só o número da tarefa.
 */
const CODIGO_NO_TEXTO = /^\s*([A-Z]{2,5}-\d+)\b[:.\-\s]*/

function codigoComposto(job, t) {
  const noTexto = t.text.match(CODIGO_NO_TEXTO)?.[1]
  if (noTexto) return noTexto
  const item = (job.frente || '').match(/\b([A-Z]{2,4}-\d+)\b/)?.[1]
    || (job.subject || '').match(/\b([A-Z]{2,4}-\d+)\b/)?.[1]
  return item && t.codigo ? `${item}_${t.codigo}` : (t.codigo || '?')
}

/** O texto sem o código que já virou coluna: repetir os dois lado a lado gasta
 *  a largura que o texto da tarefa precisa. */
const textoSemCodigo = (texto) => texto.replace(CODIGO_NO_TEXTO, '')

function secaoSprint(grupos, total) {
  let n = 0
  const corpo = grupos.map(({ job, itens }) => `
    <div class="bl-grupo aberto">
      <span class="bl-grupo-t"><b>${esc(job.project)}</b>${job.subject ? ` <i class="bl-grupo-sub">${esc(job.subject)}</i>` : ''}</span>
      <span class="bl-grupo-n">${itens.length}</span>
      <span class="bl-fio" aria-hidden="true"></span>
    </div>
    <div class="bl-grade parelha">${itens.map(({ t, i }) => {
    n += 1
    /* Revisão sem resposta é o único aviso que sobe para o cartão: significa que
       alguém apontou um defeito e ninguém respondeu, e é o que trava a entrega. */
    const semResposta = (t.revisoes || []).some((r) => !r.respondeu)
    /* CC-114: a dependência POR TAREFA, lida do próprio texto ("depende da
       s03"). Se a tarefa esperada mora na mesma lista, o selo sabe dizer se
       ela já foi feita; referência de fora (CC-60) fica neutra, sem inventar
       estado que não dá para conferir daqui. */
    let espera = ''
    if (t.dependeDe) {
      const alvo = (job.todos || []).find((x) => x.codigo === t.dependeDe)
      espera = alvo?.done
        ? `<span class="ct-selo c-done">${esc(t.dependeDe)} feita</span>`
        : `<span class="ct-selo ${alvo ? 'c-waiting' : ''}">espera ${esc(t.dependeDe)}</span>`
    }
    return `<label class="ct ct-tar s-working">
      <input type="checkbox" data-todo="${esc(job.id)}" data-i="${i}"
        aria-label="marcar &quot;${esc(t.text)}&quot; como feita">
      <span class="ct-corpo">
        <span class="ct-alto">
          <span class="ct-cod real">S${n}</span>
          ${semResposta ? '<span class="ct-selo c-failed">revisar</span>' : ''}
          ${espera}
          ${t.prova ? '<span class="ct-selo c-working">com prova</span>' : ''}
        </span>
        <span class="ct-nome">${esc(t.text)}</span>
      </span>
    </label>`
  }).join('')}</div>`).join('')

  /* Planilha ou quadradinhos, escolha dele e guardada. A planilha é o padrão de
     leitura que ele já usa nos ROADMAP.md dos projetos, e responde a queixa de
     17/08: "não dá pra eu saber exatamente em qual tarefa cada agente tá". */
  const alternador = `<div class="bl-ordens">
    <button class="bl-ord${sprintPlanilha ? ' on' : ''}" data-sprint-planilha="1">planilha</button>
    <button class="bl-ord${sprintPlanilha ? '' : ' on'}" data-sprint-planilha="0">quadradinhos</button>
  </div>`

  return `<section class="bl-sec" id="bl-sprint">
    ${cabecaSecao('Sprint backlog', total, 'o que está sendo feito agora')}
    ${total ? alternador : ''}
    ${sprintPlanilha
    ? planilhaSprint(grupos)
    : (corpo
      || '<p class="bl-nada">nenhuma tarefa aberta agora. Assim que um agente registrar a dele, ela nasce aqui.</p>')}
    ${total ? '<p class="bl-nota"><button class="bl-ord" data-tab-ir="todos">abrir o sprint com prova e revisão</button></p>' : ''}
  </section>`
}

/* ---- lista 2: as pendências dele ---- */

/* Caixinha só onde ela grava. Pendência que veio do roadmap ou de um agente não
   mora no arquivo dele, então marcar não teria onde escrever: em vez de uma
   caixinha que falha calada, a linha diz de onde veio. */
function secaoVoce(minhas) {
  /* O projeto só aparece quando há mais de um: repetir "proj_controlcenter" em
     cinco linhas seguidas é exatamente o texto solto que ele reclamou. */
  const varios = new Set(minhas.map((p) => p.projeto || '')).size > 1

  const cartoes = minhas.map((p, i) => {
    const podeMarcar = p.fonte === 'lista'
    const corpo = `<span class="ct-corpo">
      <span class="ct-alto">
        <span class="ct-cod">V${i + 1}</span>
        ${podeMarcar ? '' : `<span class="ct-selo c-waiting">${p.fonte === 'agente' ? 'do agente' : 'roadmap'}</span>`}
      </span>
      <span class="ct-nome">${esc(p.texto)}</span>
      ${varios && p.projeto || p.em ? `<span class="ct-pe">
        <span class="ct-porque">${varios && p.projeto ? esc(p.projeto) : ''}</span>
        ${p.em ? `<span class="ct-idade">${esc(idadeCurta(p.em))}</span>` : ''}
      </span>` : ''}
    </span>`
    return podeMarcar
      ? `<label class="ct ct-tar s-waiting">
          <input type="checkbox" data-meu-check="${esc(p.id)}"
            aria-label="marcar &quot;${esc(p.texto)}&quot; como resolvida">
          ${corpo}</label>`
      : `<div class="ct ct-tar s-waiting"><span class="ct-vazio" aria-hidden="true"></span>${corpo}</div>`
  }).join('')

  return `<section class="bl-sec" id="bl-voce">
    ${cabecaSecao('Backlog de pendências', minhas.length, 'só você resolve, e trava o resto')}
    ${cartoes
    ? `<div class="bl-grade parelha">${cartoes}</div>`
    : '<p class="bl-nada">nada depende de você agora</p>'}
  </section>`
}

/* ---- lista 3: o backlog de produto ---- */

function secaoProduto(total) {
  const b = (id, txt) => `<button class="bl-ord${trabalhoOrdem === id ? ' on' : ''}" data-trab-ordem="${id}">${txt}</button>`
  const grupos = (TRABALHO.grupos || []).map(grupoDeProjeto).join('')
  const inventados = (TRABALHO.grupos || [])
    .flatMap((g) => g.cartoes).filter((c) => !c.id).length

  return `<section class="bl-sec" id="bl-produto">
    ${cabecaSecao('Product backlog', total, 'o que ainda não começou')}
    <div class="bl-ordens">${b('importancia', 'o que fazer agora')}${b('tempo', 'o que está encalhado')}</div>
    ${grupos || '<p class="bl-nada">nenhum projeto com item aberto</p>'}
    ${inventados ? `<p class="bl-nota">Número com <b>#</b> é a posição do item no roadmap do projeto.
      ${inventados > 1 ? `${inventados} itens ainda não ganharam` : 'Um item ainda não ganhou'} código próprio.</p>` : ''}
    ${TRABALHO.semNada?.length
    ? `<p class="bl-nota">Sem nada aberto: ${TRABALHO.semNada.map(esc).join(', ')}.</p>` : ''}
  </section>`
}

function grupoDeProjeto(g) {
  const fechado = projFechados.has(g.projeto) && !tudoAberto
  return `<div class="bl-grupo${fechado ? '' : ' aberto'}">
      <button class="bl-grupo-t" data-bl-proj="${esc(g.projeto)}"
        aria-expanded="${fechado ? 'false' : 'true'}">
        <span class="bl-cara" aria-hidden="true">▶</span>
        <b>${esc(g.projeto)}</b>
      </button>
      <span class="bl-grupo-n">${g.cartoes.length}</span>
      ${g.fechadas ? `<span class="bl-onde">${g.fechadas} já ${g.fechadas > 1 ? 'fechadas' : 'fechada'}</span>` : ''}
      <span class="bl-fio" aria-hidden="true"></span>
      <button class="btn mini" data-visita="${esc(g.projeto)}">vi isso</button>
    </div>
    ${fechado ? '' : `<div class="bl-grade">${
  g.cartoes.map((c) => cartaoDoItem(c, g.projeto)).join('')}</div>`}`

/* O cartão do backlog. Fechado mostra o código, o nome e o estado quando ele
   diz alguma coisa; a prosa toda abre no toque. É a mesma informação em árvore
   de antes, agora num bloco de 350px em vez de uma faixa de 1860px.

   O nome é o título inteiro, e não o par nome/descrição que `partirTitulo`
   sabe produzir. Não é esquecimento: o corte na primeira vírgula transforma
   "o que pre-commit, husky e Danger já resolveram" em "o que pre-commit", que
   não é nome de nada. Num cartão de 350px o título de 61 caracteres cabe em
   três linhas sem aperto, então mutilar não compra nada.

   A ordem de leitura dentro do cartão é de cima para baixo e sempre a mesma:
   etiqueta e estado, nome, o porquê e a idade. Duas coisas saem disso, e as
   duas foram queixa dele: o olho não atravessa o monitor para casar o nome com
   o estado, e cinco cartões lado a lado formam coluna, que é o que faz uma
   lista de 35 itens ser varrida em vez de lida. */
function cartaoDoItem(c, projeto) {
  const chave = `${projeto}:${c.nome}`
  const aberto = cartoesAbertos.has(chave) || tudoAberto
  const e = c.estado
  const marca = c.marca || { texto: '', real: false }
  /* "NA FILA" em 44 de 52 itens foi a queixa dele, escrita com o nome do
     defeito. Fila é o estado padrão: mostrar é repetir o óbvio 44 vezes. */
  const mostraSelo = e.cor !== 'idle' && e.palavra !== 'NA FILA'
  /* O rodapé é a linha de baixo do cartão, e ela só existe quando tem o que
     dizer. Vazia, ela seria uma faixa cinza repetida 35 vezes. */
  const pe = e.porque || c.nasceuEm

  return `<article class="ct s-${e.cor}">
    <button class="ct-cab" data-trab-card="${esc(chave)}"
      aria-expanded="${aberto ? 'true' : 'false'}">
      <span class="ct-alto">
        <span class="ct-cod${marca.real ? ' real' : ''}">${esc(marca.texto)}</span>
        ${mostraSelo ? `<span class="ct-selo c-${e.cor}">${esc(e.palavra.toLowerCase())}</span>` : ''}
      </span>
      <span class="ct-nome">${esc(c.rotulo || c.nome)}</span>
      ${pe ? `<span class="ct-pe">
        <span class="ct-porque">${esc(e.porque || '')}</span>
        ${c.nasceuEm ? `<span class="ct-idade">${esc(idadeCurta(c.nasceuEm))}</span>` : ''}
      </span>` : ''}
    </button>
    ${aberto ? `<div class="ct-det">
      ${c.citacao ? `<blockquote class="bl-cit">${esc(c.citacao)}</blockquote>` : ''}
      ${c.tarefas.length ? `<div class="bl-sub">${c.tarefas.map((t) => `<div class="bl-sub-i">
        <span aria-hidden="true">›</span>${t.codigo ? `<b class="bl-sub-cod">${esc(c.id ? `${c.id}_${t.codigo}` : t.codigo)}</b> ` : ''}${esc(t.texto)}</div>`).join('')}</div>` : ''}
      ${c.pendencias.length ? `<div class="bl-sub">${c.pendencias.map((p) => `<div class="bl-sub-i">
        <span aria-hidden="true">›</span>${esc(p.texto)}</div>`).join('')}</div>` : ''}
      ${(c.dependeDe?.length || c.desbloqueia?.length) ? `<p class="bl-dep">
        ${c.dependeDe?.length ? `<span class="bl-dep-t">espera ${c.dependeDe.map(esc).join(', ')}</span>` : ''}
        ${c.desbloqueia?.length ? `<span class="bl-dep-d">destrava ${c.desbloqueia.map(esc).join(', ')}</span>` : ''}
      </p>` : ''}
      ${c.fracao ? `<p class="bl-cru">${c.fracao.feitos}/${c.fracao.itens} fechadas</p>` : ''}
    </div>` : ''}
  </article>`
}

/* ==================== aba: bancada (CC — níveis, 16/08) ====================
   A verificação de segurança escolhida por UMA pergunta: quem alcança este
   projeto? O `npm test` responde "quebrei alguma coisa"; a Bancada responde
   "deixei alguma coisa insegura", e as duas respostas são independentes —
   suíte verde convive muito bem com chave commitada e tabela sem proteção.

   Pedido dele em 16/08: "podemos colocar um botão que ative isso em níveis
   específicos". O nível é o botão; a lista de camadas é consequência dele, e
   não uma segunda escolha. Dezenove caixinhas seria o mesmo que nenhuma. */
let BANCADA = null
let bancadaRodando = null   // id da camada em curso, ou 'nivel'

async function carregarBancada(force) {
  if (BANCADA && !force) return
  try {
    // o alvo é o projeto escolhido no filtro do topo. Vazio = o servidor usa a
    // própria pasta, que é o caso de quem abre o painel dentro de um projeto
    const alvo = $('#proj')?.value || ''
    BANCADA = await (await fetch(`/api/bancada?projeto=${encodeURIComponent(alvo)}`)).json()
  } catch { BANCADA = { error: 'não deu para ler a bancada deste projeto' } }
  render()
}

async function bancadaAcao(corpo) {
  bancadaRodando = corpo.camada || 'nivel'
  render()
  try {
    await fetch('/api/bancada', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ projeto: $('#proj')?.value || '', ...corpo }),
    })
  } finally {
    bancadaRodando = null
    await carregarBancada(true)
  }
}

/** O estado de uma camada em uma palavra, na ordem de precedência que importa. */
function bancadaEstado(c) {
  if (!c.implementada) return { txt: 'a fazer', cor: 'faint', dica: 'declarada no catálogo, ainda sem execução, dívida nossa, não sua' }
  if (!c.cabe) return { txt: 'não se aplica', cor: 'faint', dica: c.porQueNao }
  const r = c.resultado
  if (!r) return { txt: 'nunca rodou', cor: 'waiting', dica: 'ninguém verificou isto ainda' }
  if (r.verificou === false) return { txt: 'não olhou', cor: 'waiting', dica: r.detalhe || 'a camada não conseguiu rodar aqui' }
  if (r.ok === false) return { txt: `${r.achados || ''} achado(s)`.trim(), cor: 'failed', dica: r.detalhe || 'há achados graves' }
  // achado que não reprova ainda é achado: dizer "limpo" com 5 deles na dica
  // era a tela se contradizendo em duas linhas seguidas
  if (r.achados > 0) return { txt: `${r.achados} p/ olhar`, cor: 'waiting', dica: r.detalhe || 'achados leves, nenhum grave' }
  return { txt: 'limpo', cor: 'done', dica: r.detalhe || `verificado ${quandoCurto(new Date(r.em).getTime())}` }
}

function viewBancada() {
  if (!BANCADA) return '<div class="empty">lendo a bancada…</div>'
  if (BANCADA.error) return `<div class="empty">${esc(BANCADA.error)}</div>`
  if (!BANCADA.ligado) {
    return `${cabecaDaTela('Este projeto se auto-verifica?', 'o framework está desligado aqui', 'faint')}
      <div class="empty">A bancada roda junto do framework. Ligue o framework neste projeto
        na aba <b>projetos</b> para escolher um nível.</div>`
  }

  const v = BANCADA.veredito
  const atual = BANCADA.niveis.find((n) => n.id === BANCADA.nivel)
  const cor = v.falhou.length ? 'failed' : v.faltaRodar.length ? 'waiting' : 'done'
  const veredito = v.falhou.length
    ? `${v.falhou.length} camada(s) acharam problema`
    : v.faltaRodar.length ? `${v.faltaRodar.length} camada(s) nunca rodaram`
      : `sim, no nível ${BANCADA.nivel}`

  // as camadas fora da escala (as de IA) entram por aplicabilidade, nunca por
  // rigor: pôr `ataque-modelo` no nível mais alto obrigaria um site
  // institucional a rodar teste de injeção de prompt que não tem onde acontecer
  const doNivel = BANCADA.camadas.filter((c) => c.nivel)
  const foraDaEscala = BANCADA.camadas.filter((c) => !c.nivel)
  const ordem = BANCADA.niveis.map((n) => n.id)
  const exigida = (c) => ordem.indexOf(c.nivel) <= ordem.indexOf(BANCADA.nivel)

  const cartao = (c) => {
    const e = bancadaEstado(c)
    const rodando = bancadaRodando === c.id
    return `<div class="bn-camada ${exigida(c) ? '' : 'bn-fora'}">
      <div class="bn-topo">
        <b>${esc(c.nome)}</b>
        <span class="fw-selo v-${e.cor}">${rodando ? 'rodando…' : esc(e.txt)}</span>
      </div>
      <span class="bn-explica">${esc(c.explica)}</span>
      <div class="bn-pe">
        <span class="dim">${esc(e.dica || '')}</span>
        <span class="grow"></span>
        ${c.implementada && c.cabe
    ? `<button class="btn mini" data-bn-camada="${esc(c.id)}"${rodando ? ' disabled' : ''}>rodar só esta</button>`
    : ''}
      </div>
    </div>`
  }

  return `${cabecaDaTela('Este projeto está seguro para quem o alcança?', veredito, cor)}

    <div class="bn-niveis">
      ${BANCADA.niveis.map((n) => `
        <button class="bn-nivel${n.id === BANCADA.nivel ? ' on' : ''}" data-bn-nivel="${esc(n.id)}">
          <b>${esc(n.titulo)}</b>
          <span>${esc(n.pergunta)}</span>
          <i>${n.camadas.length ? `+${n.camadas.length}` : ''} camada(s)</i>
        </button>`).join('')}
    </div>

    <p class="bn-atual">${esc(atual?.explica || '')}${BANCADA.declarado ? '' : ' <b>(padrão, você ainda não escolheu)</b>'}</p>

    <div class="bn-acoes">
      <button class="btn primario" data-bn-rodar${bancadaRodando ? ' disabled' : ''}>
        ${bancadaRodando === 'nivel' ? 'rodando…' : `rodar o nível ${esc(BANCADA.nivel)}`}
      </button>
      <span class="dim">${v.naoSeAplica.length ? `${v.naoSeAplica.length} não se aplicam a este projeto` : ''}</span>
    </div>

    ${v.falhou.length ? `<div class="bn-alerta">Achou problema em: <b>${v.falhou.map(esc).join(', ')}</b>.
      Abra a camada para ver o quê.</div>` : ''}

    <h3 class="bn-h">Exigidas por ${esc(BANCADA.nivel)}</h3>
    <div class="bn-lista">${doNivel.filter(exigida).map(cartao).join('')}</div>

    <h3 class="bn-h">Nos níveis acima, ainda não exigidas</h3>
    <div class="bn-lista">${doNivel.filter((c) => !exigida(c)).map(cartao).join('') || '<span class="dim">nenhuma</span>'}</div>

    ${foraDaEscala.length ? `<h3 class="bn-h">Fora da escala, por assunto</h3>
      <p class="dim bn-explica">Não são mais rigorosas: só fazem sentido em projeto que use modelo de IA,
      então entram por aplicabilidade e nunca por nível.</p>
      <div class="bn-lista">${foraDaEscala.map(cartao).join('')}</div>` : ''}`
}

function viewGlossario() {
  if (!GLOSSARIO) return '<div class="empty">lendo os documentos…</div>'
  const q = glossarioBusca.trim().toLowerCase()
  const casa = (t) => !q || t.toLowerCase().includes(q)

  const verbetes = (GLOSSARIO.verbetes || []).filter((v) => casa([
    v.titulo, v.resumo, v.estado, ...(v.tags || []),
    ...Object.keys(v.termos || {}), ...Object.values(v.termos || {}),
  ].join(' ')))
  const termos = (GLOSSARIO.termos || []).filter((t) => casa(`${t.termo} ${t.definicao} ${t.onde}`))

  // Sem resumo escrito o cartão sairia de um chute da primeira frase: some da
  // lista principal e vira pendência no fim, em vez de poluir com texto ruim.
  const bons = verbetes.filter((v) => !v.resumoAutomatico)
  const chutados = verbetes.filter((v) => v.resumoAutomatico)

  const cartao = (v) => `<article class="gl-card">
    <header>
      <b>${esc(v.titulo)}</b>
      ${v.estado ? `<span class="fw-selo">${esc(v.estado)}</span>` : ''}
      <span class="grow"></span>
      <span class="path">${v.linhas} linhas</span>
    </header>
    <p>${esc(v.resumo || '')}</p>
    ${Object.keys(v.termos || {}).length ? `<dl class="gl-termos">${
    Object.entries(v.termos).map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>` : ''}
    <footer><span class="path">${esc(v.id)}</span></footer>
  </article>`

  /* A pergunta aqui é a dele, literal: *"se eu quiser lembrar o que é a
     bancada que eu mesmo criei, eu já não lembro"*. O veredito conta o que
     está pronto para responder isso — e cobra o que ainda não está. */
  const vereditoGl = chutados.length
    ? `${bons.length} documento${bons.length === 1 ? '' : 's'} prontos para consulta, ${chutados.length} ainda sem resumo.`
    : `${bons.length} documento${bons.length === 1 ? '' : 's'} e ${termos.length} termo${termos.length === 1 ? '' : 's'}, todos com resumo.`

  return cabecaDaTela('O que é isso mesmo?', vereditoGl, chutados.length ? 'atencao' : 'bom')
    + `<div class="gl-busca">
      <input id="gl-q" value="${esc(glossarioBusca)}" placeholder="buscar termo, documento ou assunto…" autocomplete="off">
      <span class="path">${bons.length} documento${bons.length === 1 ? '' : 's'} · ${termos.length} termo${termos.length === 1 ? '' : 's'}</span>
    </div>
    ${q && termos.length ? `<div class="gl-hits">${termos.slice(0, 12).map((t) => `
      <div class="gl-hit"><b>${esc(t.termo)}</b> <span>${esc(t.definicao)}</span>
        <span class="path">${esc(t.onde)}</span></div>`).join('')}</div>` : ''}
    ${bons.length ? `<div class="gl-lista">${bons.map(cartao).join('')}</div>`
    : '<div class="empty">nada encontrado</div>'}
    ${chutados.length ? `<details class="gl-faltando"><summary>${chutados.length} documento${
      chutados.length > 1 ? 's' : ''} ainda sem resumo escrito</summary>
      <p class="dim">O cartão sairia de um chute da primeira frase. Escrever o campo
      <code>resumo:</code> no cabeçalho do arquivo resolve.</p>
      <div class="gl-lista">${chutados.map((v) => `<div class="gl-hit">
        <b>${esc(v.titulo)}</b> <span class="path">${esc(v.id)}</span></div>`).join('')}</div>
    </details>` : ''}`
}

/* ====================== aba: escritório ====================== */

// As telas de Pixel Agents: os agentes desenhados como bonecos num escritório.
// Uma roda nesta máquina; a outra é a da VPS, alcançada por túnel SSH.
// Separada do palco de propósito: os cartões mudam de estado a toda hora e
// podem ser redesenhados à vontade; o iframe abaixo não pode ser tocado.
function viewCartoesPaineis() {
  // Mesmo container do caso normal: o render troca `.painel-cab`, e sem ele
  // aqui a primeira troca não acharia nada para substituir.
  if (!PAINEIS) return '<div class="painel-cab"><div class="painel-lista"></div></div>'
  const escolhido = PAINEIS.find((p) => p.id === painelAtivo) || PAINEIS[0]
  // CC-47: diferente das outras abas, esta NÃO é federada, e dizer isso evita a
  // pergunta certa ("cadê os agentes da outra máquina?"). O Pixel Agents lê o
  // `~/.claude` da máquina onde roda; ele não sabe receber dado de fora.
  const local = PAINEIS.find((p) => p.local)
  const aviso = `<p class="dim" style="margin:0 0 10px">O escritório é <b>local de cada máquina</b>:
    mostra os agentes${local ? ` de <b>${esc(local.nome)}</b>` : ' desta máquina'}, não os das outras.
    Para ver o escritório do outro lado, abra o cockpit de lá. As demais abas somam as duas.</p>`
  const cartoes = PAINEIS.map((p) => {
    const marca = p.noAr ? 'var(--done)' : 'var(--idle)'
    return `
      <div class="painel-card${p.id === escolhido?.id ? ' sel' : ''}" data-painel-ver="${p.id}">
        <div class="painel-topo">
          <span class="painel-bolha" style="background:${marca}"></span>
          <strong>${esc(p.nome)}</strong>
          <span class="path">:${p.porta}</span>
        </div>
        <div class="path">${esc(p.detalhe)}</div>
        <div class="painel-acoes">
          ${p.noAr
            ? `<button class="btn" data-painel-desligar="${p.id}">desligar</button>
               <button class="btn" data-painel-pip="${p.id}" title="janela flutuante, sempre por cima">PiP</button>
               <a class="btn" href="${p.url}" target="_blank" rel="noopener">abrir</a>`
            : `<button class="btn" data-painel-ligar="${p.id}">ligar</button>
               <span class="path clip" title="${esc(p.comando)}">parado</span>`}
        </div>
      </div>`
  }).join('')

  // Aviso e cartões saem juntos dentro de UM container, e é o container que o
  // render troca. Sem isso, `cartoes.outerHTML = viewCartoesPaineis()` inseria
  // outro aviso a cada 2 segundos e a página crescia sem parar.
  return `<div class="painel-cab">${aviso}<div class="painel-lista">${cartoes}</div></div>`
}

/** O painel que está de fato no palco. Mesma conta em dois lugares dava tela
 *  branca piscando: o render comparava com `painelAtivo` (nulo antes do
 *  primeiro clique) enquanto a tela mostrava `PAINEIS[0]`, então a proteção
 *  nunca casava e o iframe era recriado a cada evento do stream. */
function painelNoPalco() {
  return (PAINEIS || []).find((p) => p.id === painelAtivo) || (PAINEIS || [])[0] || null
}

/**
 * A legenda do escritório: quem é cada boneco e o que está fazendo.
 *
 * Existe porque o rótulo flutuante do Pixel Agents cobre o personagem e o
 * comando inteiro não cabe — vira uma tarja cinza atravessando a sala. Aqui o
 * texto tem largura própria: resumo de uma linha, e o comando completo só
 * quando se clica.
 */
function viewLegendaEscritorio(jobs) {
  if (!jobs.length) return '<div class="empty" style="padding:14px">nenhum agente vivo</div>'

  const ordem = { waiting: 0, failed: 1, working: 2, idle: 3, done: 4 }
  const lista = [...jobs].sort((a, b) => (ordem[a.status] ?? 9) - (ordem[b.status] ?? 9))

  return lista.map((j) => {
    const fazendo = (j.detail || j.result || j.lastPrompt || '').trim()
    const curto = fazendo.length > 64 ? fazendo.slice(0, 64) + '…' : fazendo
    const temMais = fazendo.length > 64
    const aberto = legendaAberta.has(j.id)
    return `
      <div class="leg-item${aberto ? ' on' : ''}" data-legenda="${j.id}">
        <div class="leg-topo">
          <span class="dot ${j.status}"></span>
          <span class="leg-nome" title="${esc(j.subject || j.name || '')}">${esc(j.subject || j.name || '(sem assunto)')}</span>
        </div>
        <div class="leg-proj">${esc(j.project || '?')}${j.route && j.route !== 'main' ? ' · ' + esc(j.route) : ''}</div>
        ${fazendo ? `<div class="leg-faz">${esc(aberto ? fazendo : curto)}${temMais && !aberto ? ' <span class="leg-mais">ver</span>' : ''}</div>` : ''}
      </div>`
  }).join('')
}

function viewEscritorio() {
  if (!PAINEIS) return '<div class="empty">procurando os painéis…</div>'
  const escolhido = painelNoPalco()

  // `data-src` existe para o render() comparar sem ler `iframe.src`, que o
  // navegador normaliza (barra no fim) e nunca bateria com a string do JSON.
  const palco = escolhido?.noAr
    ? `<iframe class="painel-palco" data-src="${escolhido.url}" src="${escolhido.url}" title="${esc(escolhido.nome)}"></iframe>`
    /* O texto vai dentro de UM `<p>`, e isso não é estilo: em `display:grid`,
       cada pedaço de texto solto vira um item da grade. Como a frase tinha
       texto, depois `<b>ligar</b>`, depois texto, ela virava TRÊS itens
       empilhados e espalhados pelos 420px de altura. Apareceu no print que o
       Felipe mandou em 15/08, usando o painel na lateral da tela. */
    : `<div class="empty" style="min-height:220px;display:grid;place-items:center">
         <p>${escolhido ? `${esc(escolhido.nome)} está parado, clique em <b>ligar</b> acima` : 'nenhum painel configurado'}</p>
       </div>`

  // Palco e legenda lado a lado: o escritório mostra o movimento, a coluna
  // diz o que está acontecendo. Uma coisa o outro não faz bem.
  /* CC-101: a pergunta no topo. O veredito diz se há algo para ver AGORA,
     que é o que decide se vale entrar na aba. */
  const noAr = (Array.isArray(PAINEIS) ? PAINEIS : []).filter((p) => p.noAr).length
  const cabecaEsc = cabecaDaTela('O que os painéis embutidos mostram?',
    noAr
      ? `${noAr} painel${noAr === 1 ? '' : 'is'} no ar. O escolhido aparece abaixo, inteiro.`
      : 'Nenhum painel no ar agora. "ligar" sobe o que estiver parado.',
    noAr ? 'bom' : 'neutro')
  return cabecaEsc + viewCartoesPaineis() + `
    <div class="escritorio-grade">
      ${palco}
      <aside class="escritorio-legenda">
        <h3>quem é quem</h3>
        <div class="leg-lista">${viewLegendaEscritorio(filtered())}</div>
      </aside>
    </div>`
}

async function acaoPainel(id, acao) {
  try {

      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    })

  await new Promise((r) => setTimeout(r, acao === 'ligar' ? 2500 : 900))

/**
 * Janela flutuante que fica por cima de tudo, via Document Picture-in-Picture.
 * Só existe em navegador baseado em Chromium — em outro, abre aba comum, que é
 * pior mas não deixa o botão morto.
 */
async function abrirPiP(id) {
  const p = (PAINEIS || []).find((x) => x.id === id)
  if (!p) return
  if (!window.documentPictureInPicture) {
    window.open(p.url, '_blank', 'width=480,height=380')
    return
  }
  const win = await documentPictureInPicture.requestWindow({ width: 480, height: 380 })
  win.document.title = `${p.nome}, agentes`
  const estilo = win.document.createElement('style')
  estilo.textContent = `
    html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}`
  win.document.head.append(estilo)
  const frame = win.document.createElement('iframe')
  frame.src = p.url
  win.document.body.append(frame)
}

   O endereço nunca chega aqui: o servidor devolve nome e eventos, e só. Uma

let AGENDA = null

const horaDe = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
const diaChave = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` }

/** "hoje" e "amanhã" valem mais que a data: é assim que se lê uma agenda. */
function rotuloDia(ms) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0)
  const dias = Math.round((new Date(ms).setHours(0, 0, 0, 0) - +hoje) / 864e5)
  const nome = new Date(ms).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' })
  if (dias === 0) return `hoje · ${nome}`
  if (dias === 1) return `amanhã · ${nome}`
  return nome
}

function viewAgendaFormulario() {
  const cals = AGENDA?.calendarios || []
  return `<div class="ag-form">
    <p class="ag-ajuda">No Google Calendar: <b>Configurações do calendário › Integrar agenda ›
      Endereço secreto no formato iCal</b>. Esse endereço dá acesso de leitura à agenda inteira,
      então ele fica só nesta máquina e nunca volta pra esta tela.</p>
    <label>nome<input id="ag-nome" placeholder="pessoal, faculdade, clientes…"></label>
    <label>endereço secreto (iCal)<input id="ag-url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics"></label>
    <button class="btn" data-ag-salvar="1">adicionar</button>
    ${cals.length ? `<div class="ag-cals">${cals.map((c) => `
      <span class="ag-cal">${esc(c.nome)}${c.erro ? ' <span class="bad">(fora do ar)</span>' : ''}
        <button class="btn mini danger" data-ag-remover="${esc(c.id)}" title="remover">✕</button></span>`).join('')}</div>` : ''}

}

function viewAgenda() {
  if (!AGENDA) return `<div class="empty">${agendaCarregando ? 'carregando…' : 'agenda indisponível'}</div>`
  if (!AGENDA.configurado) {
    return `<div class="col-head"><span>conectar uma agenda</span></div>${viewAgendaFormulario()}`
  }

  const agora = Date.now()
  const eventos = AGENDA.eventos || []
  const porDia = new Map()
  for (const e of eventos) {
    const k = diaChave(e.inicio)
    if (!porDia.has(k)) porDia.set(k, [])
    porDia.get(k).push(e)
  }

  const erros = (AGENDA.calendarios || []).filter((c) => c.erro)
  const topo = `<div class="ag-topo">
    <strong>${eventos.length} evento${eventos.length === 1 ? '' : 's'}</strong>
    <span class="dim">nos próximos ${agendaDias} dias</span>
    <span class="spacer"></span>
    ${[7, 14, 30].map((d) => `<button class="btn mini ${d === agendaDias ? 'on' : ''}" data-ag-dias="${d}">${d}d</button>`).join('')}
    <button class="btn mini" data-ag-atualizar="1">${agendaCarregando ? 'lendo…' : '↻ atualizar'}</button>
    <button class="btn mini" data-ag-config="1">${agendaConfigAberta ? 'fechar' : '⚙ agendas'}</button>
  </div>
  ${erros.length ? `<p class="ag-erro">sem resposta de: ${erros.map((c) => esc(c.nome)).join(', ')}, mostrando a última leitura</p>` : ''}
  ${agendaConfigAberta ? viewAgendaFormulario() : ''}`

  if (!eventos.length) return `${topo}<div class="empty">nada marcado nesta janela</div>`

  const dias = [...porDia.entries()].map(([, lista]) => `
    <section class="ag-dia">
      <h3>${esc(rotuloDia(lista[0].inicio))}</h3>
      ${lista.map((e) => {
    const rolando = agora >= e.inicio && agora < e.fim
    const passou = e.fim < agora
    return `<div class="ag-ev ${rolando ? 'agora' : ''} ${passou ? 'passou' : ''}">
        <span class="ag-hora">${e.diaInteiro ? 'dia todo' : horaDe(e.inicio)}</span>
        <span class="ag-tit">${esc(e.titulo)}${e.repete ? ' <span class="dim" title="evento que se repete">↻</span>' : ''}</span>
        ${e.local ? `<span class="ag-local dim">${esc(e.local)}</span>` : ''}
      </div>`
  }).join('')}
    </section>`).join('')

  /* CC-87. "O que eu tenho hoje?" é a pergunta de quem abre agenda — não "o
     que existe nos próximos N dias", que é como o dado estava organizado. */
  const hoje = eventos.filter((e) => diaChave(e.inicio) === diaChave(agora)).length
  const vdA = hoje
    ? `${hoje} compromisso(s) hoje, ${eventos.length} nos próximos ${agendaDias} dias.`
    : eventos.length
      ? `Nada hoje. ${eventos.length} nos próximos ${agendaDias} dias.`
      : `Nada marcado nos próximos ${agendaDias} dias.`

  return cabecaDaTela('O que eu tenho hoje?', vdA, hoje ? 'atencao' : 'bom')
    + `${topo}<div class="ag-lista">${dias}</div>`
}

/* CC-87, a tela mais técnica da lista. Três coisas mudaram:

   1. **Agrupa por NÍVEL, não por evento.** `PreToolUse` e `Stop` são nomes do
      Claude Code; "trava" e "avisa" é o que ele precisa saber. O nível veio do
      CC-69, que declarou isso num lugar só justamente para servir aqui.
   2. **O evento vira frase.** "quando eu vou usar uma ferramenta", não
      `PreToolUse`.
   3. **O veredito destaca o caso perigoso:** hook ligado e NÃO registrado. Ele
      parece ativo na tela e não faz nada — é a pior combinação possível, e
      estava escondida numa etiqueta cinza no canto. */
const QUANDO_HOOK = {
  PreToolUse: 'antes de cada ação minha',
  PostToolUse: 'depois de cada ação minha',
  Stop: 'quando eu termino de responder',
  SessionStart: 'quando a conversa começa',
  SessionEnd: 'quando a conversa acaba',
  UserPromptSubmit: 'quando você manda uma mensagem',
  PreCompact: 'antes de resumir a conversa',
}

const NIVEL_HOOK = {
  trava: { titulo: 'travam', explica: 'recusam a ação e me obrigam a mudar de caminho', cor: 'failed' },
  avisa: { titulo: 'avisam', explica: 'falam e deixam seguir, nunca bloqueiam', cor: 'waiting' },
  injeta: { titulo: 'informam', explica: 'põem contexto no começo da conversa', cor: 'done' },
  mede: { titulo: 'medem', explica: 'só registram, nunca aparecem', cor: 'dim' },
}

function viewHooks() {
  if (!HOOKS_DATA) return '<div class="empty">carregando…</div>'
  const todos = (HOOKS_DATA.hooks || []).filter((h) => h.implementado)

  /* O caso perigoso: ligado na tela e ausente do settings.json. Parece ativo e
     não faz nada. É o que o veredito precisa gritar. */
  const fantasmas = todos.filter((h) => h.ligado && !h.registrado)
  const ativos = todos.filter((h) => h.ligado && h.registrado)
  const travam = ativos.filter((h) => h.nivel === 'trava').length

  const vd = fantasmas.length
    ? `${fantasmas.length} hook(s) parecem ligados e não estão registrados, não fazem nada.`
    : `${ativos.length} ativos, ${travam} deles podem me barrar.`

  const linha = (h) => `
    <div class="hk-linha${h.ligado && !h.registrado ? ' fantasma' : ''}">
      <label><input type="checkbox" ${h.ligado ? 'checked' : ''} data-hk-toggle="${esc(h.id)}"></label>
      <div class="hk-info">
        <b>${esc(h.label)}</b>
        <span class="dim">${esc(QUANDO_HOOK[h.evento] || h.evento)} · ${esc(h.descricao)}</span>
      </div>
      ${h.ligado && !h.registrado
        ? '<span class="hk-badge bad" title="ligado aqui, mas ausente do settings.json do Claude Code, não roda">não faz nada</span>'
        : ''}
    </div>`

  const grupos = Object.entries(NIVEL_HOOK).map(([nivel, d]) => {
    const lista = todos.filter((h) => (h.nivel || 'avisa') === nivel)
    if (!lista.length) return ''
    return `<section class="hk-grupo">
      <div class="col-head">
        <span style="color:var(--${d.cor})">${d.titulo}</span>
        <span class="path">${d.explica}</span>
        <span class="n">${lista.length}</span>
      </div>
      ${lista.map(linha).join('')}
    </section>`
  }).join('')

  const planejados = (HOOKS_DATA.hooks || []).filter((h) => !h.implementado)

  /* CC-103: as travas provadas sob clique. Antes disto, saber se uma trava
     ainda pega o que promete exigia provocá-la de propósito, uma por uma, e o
     Felipe trabalha do telefone. "sem teste" aparece separado de "com defeito"
     porque as duas coisas são diferentes: uma é desconhecida, a outra é ruim. */
  const p = HOOKS_PROVA
  const barraProva = `<div class="t-ctl">
    <button class="btn" data-hk-provar ${p === 'rodando' ? 'disabled' : ''}>${
      p === 'rodando' ? 'provando as travas…' : 'as travas funcionam? provar agora'}</button>
    ${p && p !== 'rodando' ? `<span class="path">${p.resumo.provado} provada(s)`
      + `${p.resumo.falhou ? `, <b style="color:var(--failed)">${p.resumo.falhou} com defeito</b>` : ''}`
      + `, ${p.resumo.semProva} sem teste escrito</span>` : ''}
    ${p === 'rodando' ? '<span class="path">roda uma por vez, leva alguns segundos</span>' : ''}
  </div>`
  const detalheProva = !p || p === 'rodando' ? '' : `<div class="hk-prova">${
    p.resultados.filter((r) => r.estado !== 'provado').map((r) => `<div class="hk-linha">
      <span class="hk-badge ${r.estado === 'falhou' ? 'bad' : ''}">${r.estado === 'falhou' ? 'com defeito' : 'sem teste'}</span>
      <div class="hk-info"><b>${esc(r.id)}</b>${r.detalhe ? `<span class="dim">${esc(r.detalhe)}</span>` : ''}</div>
    </div>`).join('')}</div>`

  return cabecaDaTela('O que está me travando?', vd, fantasmas.length ? 'ruim' : 'bom')
    + barraProva + detalheProva
    + `<div class="hk-lista">${grupos}</div>`
    + (planejados.length
      ? `<details class="hk-planejados"><summary>${planejados.length} ainda não implementado(s)</summary>
          ${planejados.map((h) => `<div class="hk-linha"><div class="hk-info"><b>${esc(h.label)}</b>
            <span class="dim">${esc(h.descricao)}</span></div></div>`).join('')}</details>`
      : '')
}

/* ========================== aba: rotinas ==========================
   Comando (`/start-session`) é um arquivo .md, e ele mora em dois lugares: na
   pasta global e dentro do projeto. O do PROJETO vence, então cópia velha
   desliga a rotina boa em silêncio, que foi exatamente o que estava
   acontecendo. Esta aba mostra onde isso está e conserta sob clique.

   Varre disco de ~20 projetos: carrega só ao abrir a aba, nunca no stream. */

let ROTINAS_DATA = null
let ROTINA_ABERTA = null // `${dir}|${nome}` da comparação expandida

async function carregarRotinas(force) {
  if (ROTINAS_DATA && !force) return
  try {
    ROTINAS_DATA = await (await fetch('/api/rotinas')).json()
  } catch {
    ROTINAS_DATA = null
  }
  render()
}

async function verRotina(dir, nome) {
  const chave = dir + '|' + nome
  if (ROTINA_ABERTA && ROTINA_ABERTA.chave === chave) { ROTINA_ABERTA = null; return render() }
  ROTINA_ABERTA = { chave, carregando: true }
  render()
  try {
    const q = `dir=${encodeURIComponent(dir)}&nome=${encodeURIComponent(nome)}`
    ROTINA_ABERTA = { chave, ...(await (await fetch('/api/rotinas?' + q)).json()) }
  } catch {
    ROTINA_ABERTA = null
  }
  render()
}

async function acaoRotina(dir, nome, acao, projeto) {
  const aviso = acao === 'sincronizar'
    ? `Sobrescrever "${nome}" em ${projeto} com a versão global?\n\nO que essa cópia tiver de próprio (o nome do projeto no texto, por exemplo) some.`
    : `Apagar "${nome}" de ${projeto}?\n\nA rotina global volta a valer ali, que é o normal.`
  if (!confirm(aviso)) return
  const r = await fetch('/api/rotinas', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dir, nome, acao }),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  ROTINA_ABERTA = null
  return carregarRotinas(true)
}

/** Comparação linha a linha, só pra ler: o que só a global tem, o que só a cópia tem. */
function diffTexto(global, local) {
  const g = (global || '').replace(/\r\n/g, '\n').split('\n')
  const l = (local || '').replace(/\r\n/g, '\n').split('\n')
  const setG = new Set(g)
  const setL = new Set(l)
  const soGlobal = g.filter((x) => x.trim() && !setL.has(x))
  const soLocal = l.filter((x) => x.trim() && !setG.has(x))
  const bloco = (titulo, linhas, tag) => linhas.length
    ? `<b>${titulo}</b>\n<${tag}>${esc(linhas.slice(0, 40).join('\n'))}</${tag}>${linhas.length > 40 ? `\n<span class="dim">… e mais ${linhas.length - 40} linha(s)</span>` : ''}\n\n`
    : ''
  return bloco('só na global (falta na cópia):', soGlobal, 'ins')
    + bloco('só na cópia do projeto:', soLocal, 'del')
    || '<span class="dim">sem diferença de conteúdo</span>'
}

function viewRotinas() {
  if (!ROTINAS_DATA) return '<div class="empty">carregando…</div>'
  const projetos = ROTINAS_DATA.projetos || []
  if (!projetos.length) {
    return '<div class="empty">nenhum projeto tem cópia de rotina: a global vale em todos, que é o ideal</div>'
  }

  const totalDiv = projetos.reduce((s, p) => s + p.divergentes, 0)

  const rotulo = {
    divergente: '<span class="hk-badge bad">desatualizada</span>',
    igual: '<span class="hk-badge ok">igual à global</span>',
    propria: '<span class="hk-badge">só deste projeto</span>',
  }

  const linhas = (p) => p.rotinas.map((r) => {
    const chave = p.dir + '|' + r.nome
    const aberta = ROTINA_ABERTA && ROTINA_ABERTA.chave === chave
    const detalhe = r.situacao === 'divergente'
      ? `<span class="dim">${r.linhas} linhas, a global tem ${r.linhasGlobal} · ${r.diferencas} linha(s) diferentes</span>`
      : `<span class="dim">${r.linhas} linhas</span>`
    const acoes = r.situacao === 'propria' ? '' : `
      <button class="btn" data-rt-ver="${esc(chave)}">${aberta ? 'fechar' : 'comparar'}</button>
      <button class="btn" data-rt-sync="${esc(chave)}">usar a global</button>
      <button class="btn" data-rt-del="${esc(chave)}">apagar a cópia</button>`
    const corpo = aberta
      ? `<pre class="rt-diff">${ROTINA_ABERTA.carregando ? 'carregando…' : diffTexto(ROTINA_ABERTA.global, ROTINA_ABERTA.local)}</pre>`
      : ''
    return `
      <div class="rt-linha">
        <span class="rt-nome"><b>${esc(r.nome.replace(/\.md$/, ''))}</b>${detalhe}</span>
        ${rotulo[r.situacao] || ''}
        <span class="rt-acoes">${acoes}</span>
      </div>${corpo}`
  }).join('')

  const cartoes = projetos.map((p) => `
    <div class="rt-proj">
      <header>
        <b>${esc(p.projeto)}</b>
        <span class="dim">${p.rotinas.length} rotina(s)${p.divergentes ? ` · ${p.divergentes} desatualizada(s)` : ''}</span>
      </header>
      ${linhas(p)}
    </div>`).join('')

  /* CC-101: pergunta e veredito no topo. A frase antiga em cinza continua
     valendo como detalhe; a cabeça é quem diz se há o que fazer. */
  const cabeca = totalDiv
    ? cabecaDaTela('As rotinas copiadas ainda valem?',
      `${totalDiv} desatualizada${totalDiv === 1 ? '' : 's'}: a cópia velha vence a nova, e é ela que roda. "usar a global" conserta.`, 'atencao')
    : cabecaDaTela('As rotinas copiadas ainda valem?', 'Todas iguais às globais. Nada a fazer.', 'bom')

  return `${cabeca}<div class="rt-lista">${cartoes}</div>`
}
