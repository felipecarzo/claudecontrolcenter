  } catch {
    alert('não consegui falar com o painel — confira se ele ainda está no ar')
  }
  vpsAtualizando = false
  render()
}

function viewVpsFormulario() {
  const v = VPS || {}
  return `<div class="vps-form">
    <label>host (IP ou domínio)<input id="vps-host" value="${esc(v.host || '')}" placeholder="66.94.117.215"></label>
    <label>usuário<input id="vps-usuario" value="${esc(v.usuario || 'root')}"></label>
    <label>caminho da chave privada<input id="vps-chave" value=""
      placeholder="${v.configurado ? 'já configurada — deixe em branco pra manter' : '~/.ssh/id_ed25519_...'}"></label>
    <button class="btn" data-vps-salvar="1">salvar</button>
    <p class="path">a chave em si nunca sai desta máquina — só o caminho do arquivo fica guardado</p>
  </div>`
}

function viewVpsOrganograma(s) {
  const portaParaDocker = new Map()
  for (const c of s.docker) if (c.porta) portaParaDocker.set(c.porta, c.nome)

  const statLinha = (rot, uso, detalhe) => (uso == null ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${uso >= 90 ? 'alto' : uso >= 70 ? 'medio' : 'baixo'}">
    <span class="u-barra"><i style="width:${Math.min(uso, 100)}%"></i></span><b>${Math.round(uso)}%</b></span>
    <span class="path">${esc(detalhe)}</span></div>`)

  const ramPct = s.ram ? Math.round((100 * s.ram.usadoMB) / s.ram.totalMB) : null
  const discoPct = s.disco ? Math.round((100 * s.disco.usadoGB) / s.disco.totalGB) : null

  const cartaoNginx = (n) => `<article class="srv-card">
    <b class="c-titulo">${esc(n.serverName || n.arquivo)}</b>
    ${n.tipo === 'proxy'
      ? `<p class="srv-resumo">proxy → ${esc(n.alvo || '?')}${
          n.porta && portaParaDocker.has(n.porta) ? ` <span class="vps-liga">(${esc(portaParaDocker.get(n.porta))})</span>` : ''}</p>`
      : n.tipo === 'estatico'
        ? `<p class="srv-resumo">estático → ${esc(n.alvo || '?')}</p>`
        : '<p class="srv-resumo">sem proxy_pass nem root identificado</p>'}
  </article>`

  const cartaoDockerVps = (c) => `<article class="srv-card">
    <b class="c-titulo">${esc(c.nome)}</b>
    <p class="srv-resumo">${esc(c.imagem)}</p>
    ${c.portas.length ? `<p class="c-proj">${c.portas.map(esc).join(' · ')}</p>` : ''}
    <p class="path">${esc(c.status)}</p>
  </article>`

  const cartaoPm2 = (p) => `<article class="srv-card">
    <b class="c-titulo">${esc(p.nome)}</b>
    <p class="srv-resumo">${esc(p.status)}${p.memMB ? ` · ${p.memMB} MB` : ''}</p>
    <p class="path">${p.restarts} reinício${p.restarts === 1 ? '' : 's'}${p.uptimeMs ? ' · no ar há ' + age(p.uptimeMs) : ''}</p>
  </article>`

  /* Título em português, nome da ferramenta entre parênteses e um "?" que abre
     a explicação. O nome técnico fica: quem conhece reconhece na hora, quem não
     conhece não precisa dele para entender a seção. */
  const secao = (id, lista, cartao) => {
    const d = (VPS.secoes || {})[id] || { titulo: id, tecnico: id, ajuda: '', vazio: 'nada aqui' }
    return `<section>
      <div class="col-head">
        <span>${esc(d.titulo)}</span>
        <span class="vps-tec">${esc(d.tecnico)}</span>
        ${d.ajuda ? `<button class="ajuda" data-ajuda="${esc(d.ajuda)}" title="o que é isto?">?</button>` : ''}
        <span class="n">${(lista || []).length}</span>
      </div>
      <div class="cards">${(lista || []).length ? lista.map(cartao).join('') : `<div class="path">${esc(d.vazio)}</div>`}</div>
    </section>`
  }

  return `
    <div class="vps-stats">
      ${s.uptime ? `<span class="path">${esc(s.uptime.trim())}</span>` : ''}
      ${ramPct != null ? statLinha('ram', ramPct, `${s.ram.usadoMB} de ${s.ram.totalMB} MB`) : ''}
      ${discoPct != null ? statLinha('disco', discoPct, `${s.disco.usadoGB} de ${s.disco.totalGB} GB`) : ''}
    </div>
    <div class="vps-organograma">
      ${secao('nginx', s.nginx, cartaoNginx)}
      ${secao('docker', s.docker, cartaoDockerVps)}
      ${secao('pm2', s.pm2, cartaoPm2)}
    </div>`
}

function viewVps() {

/* ========================= render ============================ */

let redesenhoAdiado = false
let dadosPendentes = null

/**
 * O stream manda evento a cada 2s e `render()` reescreve o painel inteiro —
 * o cursor sumiria no meio da palavra. Enquanto houver campo em foco dentro
 * do painel, o redesenho espera; sai o foco, ele acontece.
 */
function editando() {
  const alvo = document.activeElement
  if (!alvo || !alvo.matches('input, textarea')) return false
  // o painel lateral também é reescrito por render() — vale a mesma trava
  return $('#main').contains(alvo) || $('#drawer').contains(alvo)
}

/**
 * Trocar `DATA` no meio da digitação é pior que redesenhar: a tela continua
 * mostrando a lista antiga enquanto os índices já mudaram, e a edição vai
 * parar em outra tarefa. Snapshot e tela esperam juntos.
 */
function aplicarDados(snapshot) {
  if (editando()) { dadosPendentes = snapshot; return }
  DATA = snapshot
  // liga/desliga num aparelho tem que aparecer nos outros sem reabrir a aba
  // (bug relatado em 13/08: "ligado" só via quem clicou). `projetos` continua
  // vindo só do GET inicial, que é a parte cara (varre disco); `ativos` é
  // barato e chega em todo tique de 2s.
  if (REMOTO_DATA && snapshot.remoto) REMOTO_DATA.ativos = snapshot.remoto
  render()
}

/**
 * Trocar de aba, num lugar só.
 *
 * Antes isto vivia dentro do handler de clique, e a mesma lista de "o que
 * carregar" estava repetida no boot — duas cópias que precisavam ser lembradas
 * juntas a cada aba nova. Com o F11 apareceu uma terceira porta de entrada (o
 * clique no grupo), e três cópias seria pedir para uma delas ficar para trás.
 */
function trocarAba(id) {
  if (!TABS.some((t) => t.id === id)) return
  tab = id
  localStorage.setItem('cc-tab', tab)
  armed = null
  render()
  carregarDaAba()
}

/** O que cada aba precisa buscar ao abrir. Chamado na troca e no boot. */
function carregarDaAba() {
  if (tab === 'servidores') carregarServidores()
  if (tab === 'vps') carregarVps()
  if (tab === 'agenda') carregarAgenda()
  if (tab === 'hooks') carregarHooks()
  if (tab === 'rotinas') carregarRotinas()
  if (tab === 'remoto') { carregarRemoto(); if (!FEDERACAO) carregarFederacao() }
  if (tab === 'escritorio') carregarPaineis()
  if (tab === 'meu') carregarMeu()
  if (tab === 'glossario') carregarGlossario()
  if (tab === 'tempo' || tab === 'graficos') carregarTempo()
  if (tab === 'preco') carregarPreco()
}

/* ==================== aba: meu (o que depende dele) ==================== */

/**
 * As tarefas do Felipe, de todos os projetos, num lugar.
 *
 * Ele chamou de "o meu trelo da vida": o que a IA não pode fazer (cortar um
 * asset, logar uma conta, autorizar sudo, decidir). Antes viviam soltas no meio
 * da conversa e sumiam junto com a sessão.
 */
let MEU = null

async function carregarMeu(force) {
  if (MEU && !force) return
  try {
    MEU = (await (await fetch('/api/meu')).json()).tarefas
  } catch {
    MEU = []
  }
  render()
}

async function acaoMeu(corpo) {
  try {
    await fetch('/api/meu', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo),
    })
  } catch { /* sem rede a tela segue com o que tem */ }
  return carregarMeu(true)
}

/**
 * CC-87: o topo de toda tela — a pergunta que ela responde, e a resposta.
 *
 * Regra 1 da frente "a tela fala a língua dele": *"toda tela responde uma
 * pergunta dele, escrita no topo. Se não dá para escrever a pergunta, a tela
 * não deveria existir"*.
 *
 * O veredito vem em segundo, e é o que a aba VPS provou valer: `47 processos`
 * não é veredito, `tudo no ar` é.
 */
function cabecaDaTela(pergunta, veredito, cor = 'neutro') {
  return `<div class="tela-cabeca v-${cor}">
    <b>${esc(pergunta)}</b>
    ${veredito ? `<span>${esc(veredito)}</span>` : ''}
  </div>`
}

function viewMeu() {
  if (!MEU) return '<div class="empty">carregando…</div>'
  const abertas = MEU.filter((t) => !t.feito)
  const feitas = MEU.filter((t) => t.feito)

  const linha = (t) => `<div class="meu-item${t.feito ? ' ok' : ''}">
    <button class="meu-check" data-meu-marcar="${esc(t.id)}" data-meu-feito="${t.feito ? '0' : '1'}"
      title="${t.feito ? 'reabrir' : 'marcar como feito'}">${t.feito ? '☑' : '☐'}</button>
    <div class="meu-txt">
      <b>${esc(t.texto)}</b>
      ${t.porque ? `<p class="dim">${esc(t.porque)}</p>` : ''}
      <span class="path">${t.projeto ? esc(t.projeto) : 'sem projeto'}${
  t.frente ? ` › ${esc(t.frente)}` : ''}${t.fonte === 'agente' ? ' · pedido por um agente' : ''}${
  t.em ? ` · há ${age(Date.now() - t.em)}` : ''}</span>
    </div>
    ${t.fonte === 'lista' ? `<button class="btn mini" data-meu-remover="${esc(t.id)}" title="apagar">✕</button>` : ''}
  </div>`

  /* Veredito antes da lista: a pergunta é "o que depende de mim?", e a resposta
     é um número com juízo, não a lista crua. Zero aqui é boa notícia. */
  const vereditoMeu = abertas.length === 0
    ? (feitas.length ? `Nada. Você resolveu ${feitas.length}.` : 'Nada depende de você agora.')
    : `${abertas.length} coisa${abertas.length > 1 ? 's' : ''} só você pode resolver.`

  return cabecaDaTela('O que depende de mim?', vereditoMeu,
    abertas.length === 0 ? 'bom' : 'atencao')
    + `<div class="meu-nova">
      <input id="meu-txt" placeholder="o que depende de você…" autocomplete="off">
      <input id="meu-proj" placeholder="projeto (opcional)" autocomplete="off">
      <button class="btn" data-meu-add>anotar</button>
    </div>
    ${abertas.length
    ? `<div class="meu-lista">${abertas.map(linha).join('')}</div>`
    : '<div class="empty">nada depende de você agora</div>'}
    ${feitas.length ? `<details class="meu-feitas"><summary>${feitas.length} já resolvida${
      feitas.length > 1 ? 's' : ''}</summary><div class="meu-lista">${feitas.map(linha).join('')}</div></details>` : ''}`
}

/* ======================= aba: glossário ======================= */

/**
 * Os documentos reduzidos ao que cabe numa tela, com os termos de cada um.
 *
 * Palavra dele: "se eu quiser lembrar o que que é a bancada que eu mesmo criei
 * há pouco tempo atrás, eu já não lembro, eu teria que pesquisar pra ler. E eu
 * não posso, toda hora que eu esquecer, ficar lendo um documento gigante."
 *
 * O documento continua grande, porque é a fonte de verdade que a IA lê. Isto é
 * a camada curta, extraída do próprio arquivo, nunca escrita em dobro.
 */
let GLOSSARIO = null
let glossarioBusca = ''

async function carregarGlossario(force) {
  if (GLOSSARIO && !force) return
  try {
    GLOSSARIO = await (await fetch('/api/glossario')).json()
  } catch {
    GLOSSARIO = { verbetes: [], termos: [] }
  }
  render()
}

function viewGlossario() {
  if (!GLOSSARIO) return '<div class="empty">lendo os documentos…</div>'
  const q = glossarioBusca.trim().toLowerCase()
  const casa = (t) => !q || t.toLowerCase().includes(q)

  const verbetes = (GLOSSARIO.verbetes || []).filter((v) => casa([
    v.titulo, v.resumo, v.estado, ...(v.tags || []),
    ...Object.keys(v.termos || {}), ...Object.values(v.termos || {}),
  ].join(' ')))
  const termos = (GLOSSARIO.termos || []).filter((t) => casa(`${t.termo} ${t.definicao} ${t.onde}`))

  // Sem resumo escrito o cartão sairia de um chute da primeira frase: some da
  // lista principal e vira pendência no fim, em vez de poluir com texto ruim.
  const bons = verbetes.filter((v) => !v.resumoAutomatico)
  const chutados = verbetes.filter((v) => v.resumoAutomatico)

  const cartao = (v) => `<article class="gl-card">
    <header>
      <b>${esc(v.titulo)}</b>
      ${v.estado ? `<span class="fw-selo">${esc(v.estado)}</span>` : ''}
      <span class="grow"></span>
      <span class="path">${v.linhas} linhas</span>
    </header>
    <p>${esc(v.resumo || '')}</p>
    ${Object.keys(v.termos || {}).length ? `<dl class="gl-termos">${
    Object.entries(v.termos).map(([t, d]) => `<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>` : ''}
    <footer><span class="path">${esc(v.id)}</span></footer>
  </article>`

  /* A pergunta aqui é a dele, literal: *"se eu quiser lembrar o que é a
     bancada que eu mesmo criei, eu já não lembro"*. O veredito conta o que
     está pronto para responder isso — e cobra o que ainda não está. */
  const vereditoGl = chutados.length
    ? `${bons.length} documento${bons.length === 1 ? '' : 's'} prontos para consulta, ${chutados.length} ainda sem resumo.`
    : `${bons.length} documento${bons.length === 1 ? '' : 's'} e ${termos.length} termo${termos.length === 1 ? '' : 's'}, todos com resumo.`

  return cabecaDaTela('O que é isso mesmo?', vereditoGl, chutados.length ? 'atencao' : 'bom')
    + `<div class="gl-busca">
      <input id="gl-q" value="${esc(glossarioBusca)}" placeholder="buscar termo, documento ou assunto…" autocomplete="off">
      <span class="path">${bons.length} documento${bons.length === 1 ? '' : 's'} · ${termos.length} termo${termos.length === 1 ? '' : 's'}</span>
    </div>
    ${q && termos.length ? `<div class="gl-hits">${termos.slice(0, 12).map((t) => `
      <div class="gl-hit"><b>${esc(t.termo)}</b> <span>${esc(t.definicao)}</span>
        <span class="path">${esc(t.onde)}</span></div>`).join('')}</div>` : ''}
    ${bons.length ? `<div class="gl-lista">${bons.map(cartao).join('')}</div>`
    : '<div class="empty">nada encontrado</div>'}
    ${chutados.length ? `<details class="gl-faltando"><summary>${chutados.length} documento${
      chutados.length > 1 ? 's' : ''} ainda sem resumo escrito</summary>
      <p class="dim">O cartão sairia de um chute da primeira frase. Escrever o campo
      <code>resumo:</code> no cabeçalho do arquivo resolve.</p>
      <div class="gl-lista">${chutados.map((v) => `<div class="gl-hit">
        <b>${esc(v.titulo)}</b> <span class="path">${esc(v.id)}</span></div>`).join('')}</div>
    </details>` : ''}`
}

/* ====================== aba: escritório ====================== */

// As telas de Pixel Agents: os agentes desenhados como bonecos num escritório.
// Uma roda nesta máquina; a outra é a da VPS, alcançada por túnel SSH.
// Separada do palco de propósito: os cartões mudam de estado a toda hora e
// podem ser redesenhados à vontade; o iframe abaixo não pode ser tocado.
function viewCartoesPaineis() {
  // Mesmo container do caso normal: o render troca `.painel-cab`, e sem ele
  // aqui a primeira troca não acharia nada para substituir.
  if (!PAINEIS) return '<div class="painel-cab"><div class="painel-lista"></div></div>'
  const escolhido = PAINEIS.find((p) => p.id === painelAtivo) || PAINEIS[0]
  // CC-47: diferente das outras abas, esta NÃO é federada, e dizer isso evita a
  // pergunta certa ("cadê os agentes da outra máquina?"). O Pixel Agents lê o
  // `~/.claude` da máquina onde roda; ele não sabe receber dado de fora.
  const local = PAINEIS.find((p) => p.local)
  const aviso = `<p class="dim" style="margin:0 0 10px">O escritório é <b>local de cada máquina</b>:
    mostra os agentes${local ? ` de <b>${esc(local.nome)}</b>` : ' desta máquina'}, não os das outras.
    Para ver o escritório do outro lado, abra o cockpit de lá. As demais abas somam as duas.</p>`
  const cartoes = PAINEIS.map((p) => {
    const marca = p.noAr ? 'var(--done)' : 'var(--idle)'
    return `
      <div class="painel-card${p.id === escolhido?.id ? ' sel' : ''}" data-painel-ver="${p.id}">
        <div class="painel-topo">
          <span class="painel-bolha" style="background:${marca}"></span>
          <strong>${esc(p.nome)}</strong>
          <span class="path">:${p.porta}</span>
        </div>
        <div class="path">${esc(p.detalhe)}</div>
        <div class="painel-acoes">
          ${p.noAr
            ? `<button class="btn" data-painel-desligar="${p.id}">desligar</button>
               <button class="btn" data-painel-pip="${p.id}" title="janela flutuante, sempre por cima">PiP</button>
               <a class="btn" href="${p.url}" target="_blank" rel="noopener">abrir</a>`
            : `<button class="btn" data-painel-ligar="${p.id}">ligar</button>
               <span class="path clip" title="${esc(p.comando)}">parado</span>`}
        </div>
      </div>`
  }).join('')

  // Aviso e cartões saem juntos dentro de UM container, e é o container que o
  // render troca. Sem isso, `cartoes.outerHTML = viewCartoesPaineis()` inseria
  // outro aviso a cada 2 segundos e a página crescia sem parar.
  return `<div class="painel-cab">${aviso}<div class="painel-lista">${cartoes}</div></div>`
}

/** O painel que está de fato no palco. Mesma conta em dois lugares dava tela
 *  branca piscando: o render comparava com `painelAtivo` (nulo antes do
 *  primeiro clique) enquanto a tela mostrava `PAINEIS[0]`, então a proteção
 *  nunca casava e o iframe era recriado a cada evento do stream. */
function painelNoPalco() {
  return (PAINEIS || []).find((p) => p.id === painelAtivo) || (PAINEIS || [])[0] || null
}

/**
 * A legenda do escritório: quem é cada boneco e o que está fazendo.
 *
 * Existe porque o rótulo flutuante do Pixel Agents cobre o personagem e o
 * comando inteiro não cabe — vira uma tarja cinza atravessando a sala. Aqui o
 * texto tem largura própria: resumo de uma linha, e o comando completo só
 * quando se clica.
 */
function viewLegendaEscritorio(jobs) {
  if (!jobs.length) return '<div class="empty" style="padding:14px">nenhum agente vivo</div>'

  const ordem = { waiting: 0, failed: 1, working: 2, idle: 3, done: 4 }
  const lista = [...jobs].sort((a, b) => (ordem[a.status] ?? 9) - (ordem[b.status] ?? 9))

  return lista.map((j) => {
    const fazendo = (j.detail || j.result || j.lastPrompt || '').trim()
    const curto = fazendo.length > 64 ? fazendo.slice(0, 64) + '…' : fazendo
    const temMais = fazendo.length > 64
    const aberto = legendaAberta.has(j.id)
    return `
      <div class="leg-item${aberto ? ' on' : ''}" data-legenda="${j.id}">
        <div class="leg-topo">
          <span class="dot ${j.status}"></span>
          <span class="leg-nome" title="${esc(j.subject || j.name || '')}">${esc(j.subject || j.name || '(sem assunto)')}</span>
        </div>
        <div class="leg-proj">${esc(j.project || '?')}${j.route && j.route !== 'main' ? ' · ' + esc(j.route) : ''}</div>
        ${fazendo ? `<div class="leg-faz">${esc(aberto ? fazendo : curto)}${temMais && !aberto ? ' <span class="leg-mais">ver</span>' : ''}</div>` : ''}
      </div>`
  }).join('')
}

function viewEscritorio() {
  if (!PAINEIS) return '<div class="empty">procurando os painéis…</div>'
  const escolhido = painelNoPalco()

  // `data-src` existe para o render() comparar sem ler `iframe.src`, que o
  // navegador normaliza (barra no fim) e nunca bateria com a string do JSON.
  const palco = escolhido?.noAr
    ? `<iframe class="painel-palco" data-src="${escolhido.url}" src="${escolhido.url}" title="${esc(escolhido.nome)}"></iframe>`
    /* O texto vai dentro de UM `<p>`, e isso não é estilo: em `display:grid`,
       cada pedaço de texto solto vira um item da grade. Como a frase tinha
       texto, depois `<b>ligar</b>`, depois texto, ela virava TRÊS itens
       empilhados e espalhados pelos 420px de altura. Apareceu no print que o
       Felipe mandou em 15/08, usando o painel na lateral da tela. */
    : `<div class="empty" style="min-height:220px;display:grid;place-items:center">
         <p>${escolhido ? `${esc(escolhido.nome)} está parado — clique em <b>ligar</b> acima` : 'nenhum painel configurado'}</p>
       </div>`

  // Palco e legenda lado a lado: o escritório mostra o movimento, a coluna
  // diz o que está acontecendo. Uma coisa o outro não faz bem.
  return viewCartoesPaineis() + `
    <div class="escritorio-grade">
      ${palco}
      <aside class="escritorio-legenda">
        <h3>quem é quem</h3>
        <div class="leg-lista">${viewLegendaEscritorio(filtered())}</div>
      </aside>
    </div>`
}

async function carregarPaineis(force) {
  if (PAINEIS && !force) return
  try {
    PAINEIS = (await (await fetch(`/api/paineis${force ? '?force=1' : ''}`)).json()).paineis
  } catch (e) {
    PAINEIS = []
  }
  render()
}

async function acaoPainel(id, acao) {
  try {
    const r = await fetch(`/api/paineis/${acao}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    })
    const j = await r.json()
    if (!j.ok) throw new Error(j.error || 'falhou')
  } catch (e) {
    alert(`não deu para ${acao}: ${e.message || e}`)
  }
  // O processo leva um instante para abrir (ou soltar) a porta. Sem esta
  // espera a lista volta com o estado velho e parece que o clique não fez nada.
  await new Promise((r) => setTimeout(r, acao === 'ligar' ? 2500 : 900))
  await carregarPaineis(true)
}

/**
 * Janela flutuante que fica por cima de tudo, via Document Picture-in-Picture.
 * Só existe em navegador baseado em Chromium — em outro, abre aba comum, que é
 * pior mas não deixa o botão morto.
 */
async function abrirPiP(id) {
  const p = (PAINEIS || []).find((x) => x.id === id)
  if (!p) return
  if (!window.documentPictureInPicture) {
    window.open(p.url, '_blank', 'width=480,height=380')
    return
  }
  const win = await documentPictureInPicture.requestWindow({ width: 480, height: 380 })
  win.document.title = `${p.nome} — agentes`
  const estilo = win.document.createElement('style')
  estilo.textContent = `
    html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}`
  win.document.head.append(estilo)
  const frame = win.document.createElement('iframe')
  frame.src = p.url
  win.document.body.append(frame)
}

// Fora do render() porque o atalho do escritório também precisa dele, e
// duplicar texto é como as duas telas passam a dizer coisas diferentes.
/* ========================== aba: agenda ==========================
   A agenda do Google dentro do painel, pelo endereço secreto em iCal. É a
   metade "o que aconteceu de verdade" do módulo de conteúdo social: commit e
   diário contam o que foi feito no código, o calendário conta reunião, aula e
   evento presencial, que não deixam rastro nenhum no git.

   O endereço nunca chega aqui: o servidor devolve nome e eventos, e só. Uma
   captura de tela do painel não pode vazar a agenda inteira. */

let AGENDA = null
let agendaDias = +(localStorage.getItem('cc-agenda-dias') || 7)
let agendaConfigAberta = false
let agendaCarregando = false

async function carregarAgenda(force) {
  if (AGENDA && !force) return
  agendaCarregando = true
  try {
    AGENDA = await (await fetch(`/api/calendario?dias=${agendaDias}${force ? '&force=1' : ''}`)).json()
  } catch {
    AGENDA = null
  }
  agendaCarregando = false
  render()
}

async function salvarCalendario() {
  const nome = $('#ag-nome').value.trim() || 'agenda'
  const url = $('#ag-url').value.trim()
  if (!url) return alert('cole o endereço secreto em formato iCal do Google Calendar')
  const r = await fetch('/api/calendario', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nome, url }),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  agendaConfigAberta = false
  return carregarAgenda(true)
}

async function removerCalendario(id) {
  await fetch('/api/calendario/remover', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }),
  })
  return carregarAgenda(true)
}

const horaDe = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
const diaChave = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` }

/** "hoje" e "amanhã" valem mais que a data: é assim que se lê uma agenda. */
function rotuloDia(ms) {
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0)
  const dias = Math.round((new Date(ms).setHours(0, 0, 0, 0) - +hoje) / 864e5)
  const nome = new Date(ms).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' })
  if (dias === 0) return `hoje · ${nome}`
  if (dias === 1) return `amanhã · ${nome}`
  return nome
}

function viewAgendaFormulario() {
  const cals = AGENDA?.calendarios || []
  return `<div class="ag-form">
    <p class="ag-ajuda">No Google Calendar: <b>Configurações do calendário › Integrar agenda ›
      Endereço secreto no formato iCal</b>. Esse endereço dá acesso de leitura à agenda inteira,
      então ele fica só nesta máquina e nunca volta pra esta tela.</p>
    <label>nome<input id="ag-nome" placeholder="pessoal, faculdade, clientes…"></label>
    <label>endereço secreto (iCal)<input id="ag-url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics"></label>
    <button class="btn" data-ag-salvar="1">adicionar</button>
    ${cals.length ? `<div class="ag-cals">${cals.map((c) => `
      <span class="ag-cal">${esc(c.nome)}${c.erro ? ' <span class="bad">(fora do ar)</span>' : ''}
        <button class="btn mini danger" data-ag-remover="${esc(c.id)}" title="remover">✕</button></span>`).join('')}</div>` : ''}
  </div>`
}

function viewAgenda() {
  if (!AGENDA) return `<div class="empty">${agendaCarregando ? 'carregando…' : 'agenda indisponível'}</div>`
  if (!AGENDA.configurado) {
    return `<div class="col-head"><span>conectar uma agenda</span></div>${viewAgendaFormulario()}`
  }

  const agora = Date.now()
  const eventos = AGENDA.eventos || []
  const porDia = new Map()
  for (const e of eventos) {
    const k = diaChave(e.inicio)
    if (!porDia.has(k)) porDia.set(k, [])
    porDia.get(k).push(e)
  }

  const erros = (AGENDA.calendarios || []).filter((c) => c.erro)
  const topo = `<div class="ag-topo">
    <strong>${eventos.length} evento${eventos.length === 1 ? '' : 's'}</strong>
    <span class="dim">nos próximos ${agendaDias} dias</span>
    <span class="spacer"></span>
    ${[7, 14, 30].map((d) => `<button class="btn mini ${d === agendaDias ? 'on' : ''}" data-ag-dias="${d}">${d}d</button>`).join('')}
    <button class="btn mini" data-ag-atualizar="1">${agendaCarregando ? 'lendo…' : '↻ atualizar'}</button>
    <button class="btn mini" data-ag-config="1">${agendaConfigAberta ? 'fechar' : '⚙ agendas'}</button>
  </div>
  ${erros.length ? `<p class="ag-erro">sem resposta de: ${erros.map((c) => esc(c.nome)).join(', ')} — mostrando a última leitura</p>` : ''}
  ${agendaConfigAberta ? viewAgendaFormulario() : ''}`

  if (!eventos.length) return `${topo}<div class="empty">nada marcado nesta janela</div>`

  const dias = [...porDia.entries()].map(([, lista]) => `
    <section class="ag-dia">
      <h3>${esc(rotuloDia(lista[0].inicio))}</h3>
      ${lista.map((e) => {
    const rolando = agora >= e.inicio && agora < e.fim
    const passou = e.fim < agora
    return `<div class="ag-ev ${rolando ? 'agora' : ''} ${passou ? 'passou' : ''}">
        <span class="ag-hora">${e.diaInteiro ? 'dia todo' : horaDe(e.inicio)}</span>
        <span class="ag-tit">${esc(e.titulo)}${e.repete ? ' <span class="dim" title="evento que se repete">↻</span>' : ''}</span>
        ${e.local ? `<span class="ag-local dim">${esc(e.local)}</span>` : ''}
      </div>`
  }).join('')}
    </section>`).join('')

  return `${topo}<div class="ag-lista">${dias}</div>`
}

/* ========================== aba: hooks ==========================
   Control center dos hooks do Claude Code (Método Routia, cc-check, e o que
   os próximos épicos trouxerem). Liga/desliga aqui só grava em
   control-center.json — nunca escreve no settings.json do Claude Code, por
   isso "registrado" pode aparecer não-marcado mesmo com o hook ligado: falta
   o passo manual de registrar o script lá (ver decisão D1 do backlog). */

let HOOKS_DATA = null

async function carregarHooks(force) {
  if (HOOKS_DATA && !force) return
  try {
    HOOKS_DATA = await (await fetch('/api/hooks')).json()
  } catch {
    HOOKS_DATA = null
  }
  render()
}

async function alternarHook(id, on) {
  const r = await fetch('/api/hooks', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, on }),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  return carregarHooks(true)
}

function viewHooks() {
  if (!HOOKS_DATA) return '<div class="empty">carregando…</div>'
  const linhas = (HOOKS_DATA.hooks || []).map((h) => `
    <div class="hk-linha">
      <label><input type="checkbox" ${h.ligado ? 'checked' : ''} data-hk-toggle="${esc(h.id)}"></label>
      <div class="hk-info">
        <b>${esc(h.label)}</b>
        <span class="dim">${esc(h.evento)} · ${esc(h.descricao)}</span>
      </div>
      <span class="hk-badge ${h.registrado ? 'ok' : 'bad'}" title="${h.registrado
    ? 'o script está de fato no settings.json do Claude Code'
    : 'ligado aqui, mas não está registrado no settings.json — não faz nada ainda'}">

      </span>

}

/* ========================== aba: rotinas ==========================
   Comando (`/start-session`) é um arquivo .md, e ele mora em dois lugares: na
   pasta global e dentro do projeto. O do PROJETO vence, então cópia velha
   desliga a rotina boa em silêncio, que foi exatamente o que estava
   acontecendo. Esta aba mostra onde isso está e conserta sob clique.

   Varre disco de ~20 projetos: carrega só ao abrir a aba, nunca no stream. */

let ROTINAS_DATA = null
let ROTINA_ABERTA = null // `${dir}|${nome}` da comparação expandida

async function carregarRotinas(force) {
  if (ROTINAS_DATA && !force) return
  try {
    ROTINAS_DATA = await (await fetch('/api/rotinas')).json()
  } catch {
    ROTINAS_DATA = null
  }
  render()
}

async function verRotina(dir, nome) {
  const chave = dir + '|' + nome
  if (ROTINA_ABERTA && ROTINA_ABERTA.chave === chave) { ROTINA_ABERTA = null; return render() }
  ROTINA_ABERTA = { chave, carregando: true }
  render()
  try {
    const q = `dir=${encodeURIComponent(dir)}&nome=${encodeURIComponent(nome)}`
    ROTINA_ABERTA = { chave, ...(await (await fetch('/api/rotinas?' + q)).json()) }
  } catch {
    ROTINA_ABERTA = null
  }
  render()
}

async function acaoRotina(dir, nome, acao, projeto) {
  const aviso = acao === 'sincronizar'
    ? `Sobrescrever "${nome}" em ${projeto} com a versão global?\n\nO que essa cópia tiver de próprio (o nome do projeto no texto, por exemplo) some.`
    : `Apagar "${nome}" de ${projeto}?\n\nA rotina global volta a valer ali, que é o normal.`
  if (!confirm(aviso)) return
  const r = await fetch('/api/rotinas', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dir, nome, acao }),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  ROTINA_ABERTA = null
  return carregarRotinas(true)
}

/** Comparação linha a linha, só pra ler: o que só a global tem, o que só a cópia tem. */
function diffTexto(global, local) {
  const g = (global || '').replace(/\r\n/g, '\n').split('\n')
  const l = (local || '').replace(/\r\n/g, '\n').split('\n')
  const setG = new Set(g)
  const setL = new Set(l)
  const soGlobal = g.filter((x) => x.trim() && !setL.has(x))
  const soLocal = l.filter((x) => x.trim() && !setG.has(x))
  const bloco = (titulo, linhas, tag) => linhas.length
    ? `<b>${titulo}</b>\n<${tag}>${esc(linhas.slice(0, 40).join('\n'))}</${tag}>${linhas.length > 40 ? `\n<span class="dim">… e mais ${linhas.length - 40} linha(s)</span>` : ''}\n\n`
    : ''
  return bloco('só na global (falta na cópia):', soGlobal, 'ins')
    + bloco('só na cópia do projeto:', soLocal, 'del')
    || '<span class="dim">sem diferença de conteúdo</span>'
}

function viewRotinas() {
  if (!ROTINAS_DATA) return '<div class="empty">carregando…</div>'
  const projetos = ROTINAS_DATA.projetos || []
  if (!projetos.length) {
    return '<div class="empty">nenhum projeto tem cópia de rotina: a global vale em todos, que é o ideal</div>'
  }

  const totalDiv = projetos.reduce((s, p) => s + p.divergentes, 0)

  const rotulo = {
    divergente: '<span class="hk-badge bad">desatualizada</span>',
    igual: '<span class="hk-badge ok">igual à global</span>',
    propria: '<span class="hk-badge">só deste projeto</span>',
  }

  const linhas = (p) => p.rotinas.map((r) => {
    const chave = p.dir + '|' + r.nome
    const aberta = ROTINA_ABERTA && ROTINA_ABERTA.chave === chave
    const detalhe = r.situacao === 'divergente'
      ? `<span class="dim">${r.linhas} linhas, a global tem ${r.linhasGlobal} · ${r.diferencas} linha(s) diferentes</span>`
      : `<span class="dim">${r.linhas} linhas</span>`
    const acoes = r.situacao === 'propria' ? '' : `
      <button class="btn" data-rt-ver="${esc(chave)}">${aberta ? 'fechar' : 'comparar'}</button>
      <button class="btn" data-rt-sync="${esc(chave)}">usar a global</button>
      <button class="btn" data-rt-del="${esc(chave)}">apagar a cópia</button>`
    const corpo = aberta
      ? `<pre class="rt-diff">${ROTINA_ABERTA.carregando ? 'carregando…' : diffTexto(ROTINA_ABERTA.global, ROTINA_ABERTA.local)}</pre>`
      : ''
    return `
      <div class="rt-linha">
        <span class="rt-nome"><b>${esc(r.nome.replace(/\.md$/, ''))}</b>${detalhe}</span>
        ${rotulo[r.situacao] || ''}
        <span class="rt-acoes">${acoes}</span>
      </div>${corpo}`
  }).join('')

  const cartoes = projetos.map((p) => `
    <div class="rt-proj">
      <header>
        <b>${esc(p.projeto)}</b>
        <span class="dim">${p.rotinas.length} rotina(s)${p.divergentes ? ` · ${p.divergentes} desatualizada(s)` : ''}</span>
      </header>
      ${linhas(p)}
    </div>`).join('')

  const resumo = totalDiv
    ? `<div class="dim" style="margin-bottom:12px">${totalDiv} rotina(s) desatualizada(s) em ${projetos.filter((p) => p.divergentes).length} projeto(s). A cópia do projeto vence a global, então é essa versão velha que roda hoje.</div>`
    : '<div class="dim" style="margin-bottom:12px">nenhuma cópia desatualizada</div>'

  return `${resumo}<div class="rt-lista">${cartoes}</div>`
}

  const extrasDe = (nome) => Object.keys(ativos)

/**
 * O que aquele item é, ancorado NA pastilha.
 *
 * Feedback dele vendo a prévia: *"se eu clicar no primeiro eu tenho que descer
 * pra ver; o ideal seria clicar no primeiro e já ver automaticamente"*. A
 * primeira versão punha o texto no fim da lista, a segunda usava `alert()`. As
 * duas erram pelo mesmo motivo: **a resposta tem que nascer ao lado da
 * pergunta**.
 *
 * Posição calculada em JS a partir do botão, e não `top` fixo: o cabeçalho muda
 * de altura conforme o player aparece, e popover com pixel chutado ora fica
 * certo, ora atrás do header (armadilha registrada no CLAUDE.md).
 */
function abrirFrente(botao) {
  const d = botao.dataset
  let pop = $('#frente-pop')
  if (!pop) {
    pop = document.createElement('div')
    pop.id = 'frente-pop'
    document.body.appendChild(pop)
  }

  pop.innerHTML = `
    <b>${esc(d.frenteAbrir)}</b>
    <span class="path">${esc(d.frenteN)} itens fechados</span>
    ${d.frenteCit
      ? `<p class="fp-cit">“${esc(d.frenteCit)}”</p>
         <span class="path">Foi assim que você pediu. Se não é o que você quis dizer, me diga:
         o item foi escrito a partir daí.</span>`
      : '<p class="path">Este item não guarda as suas palavras — foi escrito por mim.</p>'}
    <button class="btn mini" data-frente-fechar="1">fechar</button>`

  pop.hidden = false
  const r = botao.getBoundingClientRect()
  // largura primeiro, para medir a altura real antes de decidir se abre pra cima
  pop.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8))}px`
  const cabeAbaixo = r.bottom + pop.offsetHeight + 12 < window.innerHeight
  pop.style.top = `${Math.round(cabeAbaixo ? r.bottom + 8 : Math.max(8, r.top - pop.offsetHeight - 8))}px`
}

function render() {
  if (editando()) { redesenhoAdiado = true; return }
  redesenhoAdiado = false
  renderHeader()
  renderPip()
  const jobs = filtered()
  const views = {
    agentes: () => viewAgentes(jobs),
    todos: () => viewTodos(jobs),
    projetos: () => viewCockpit(jobs),
    tempo: () => viewTempo(),
    graficos: () => viewGraficos(),
    preco: () => viewPreco(),
    agenda: () => viewAgenda(),
    hooks: () => viewHooks(),
    rotinas: () => viewRotinas(),
    servidores: () => viewServidores(),
    vps: () => viewVps(),
    escritorio: () => viewEscritorio(),
    meu: () => viewMeu(),
    glossario: () => viewGlossario(),
    remoto: () => viewRemoto(),
  }
  // O palco do escritório é um iframe. Reescrever #main a cada evento do
  // stream o recriaria, e iframe recriado RECARREGA — a tela piscava e o
  // escritório reiniciava sozinho a cada 2 segundos. Enquanto o painel
  // escolhido não muda, só os cartões são redesenhados; o iframe não é
  // tocado. Mover o nó também recarregaria, então nem isso se faz.
  const palco = tab === 'escritorio' ? $('.painel-palco') : null
  if (palco && palco.dataset.src === painelNoPalco()?.url) {
    const cartoes = $('.painel-cab')
    if (cartoes) {
      cartoes.outerHTML = viewCartoesPaineis()
      const leg = $('.leg-lista')
      if (leg) leg.innerHTML = viewLegendaEscritorio(filtered())
      $('#foot').textContent = RODAPE[tab] || ''
      drawer()
      return
    }
  }

  $('#main').innerHTML = (views[tab] || views.agentes)()
  $('#foot').textContent = RODAPE[tab] || ''
  drawer()
}

// Revalida ao voltar na aba. Morno, /api/tempo custa ~20ms — o guard antigo
// segurava o snapshot da PRIMEIRA carga da aba pelo resto da sessão, e as
// horas congelavam sem nada na tela dizendo isso.
let tempoEm = 0
async function carregarTempo(force) {
  if (TEMPO && !force && Date.now() - tempoEm < 30_000) return
  tempoEm = Date.now()
  const q = new URLSearchParams({ corte: tempoParams.corte })
  if (tempoParams.de) q.set('de', tempoParams.de)
  if (tempoParams.ate) q.set('ate', tempoParams.ate)
  if (force === 'reler') q.set('force', '1')
  TEMPO = null
  render() // mostra "lendo os transcritos…" antes de travar no fetch
  try {
    TEMPO = await (await fetch(`/api/tempo?${q}`)).json()
  } catch (e) {
    TEMPO = { error: String(e.message || e) }
  }
  render()
}

/** Grava um número de configuração e recalcula do cache, sem reler transcrito. */
async function salvarNumero(rota, valor) {
  await fetch(rota, { method: 'POST', body: JSON.stringify({ valor: Number(valor) || 0 }) })
  carregarTempo(true)
}

/** Cotação digitada congela o valor; apagar o campo devolve a busca automática. */
const salvarCambio = (valor) => salvarNumero('/api/cambio', valor)

/** Grava a taxa e recalcula do cache — não relê transcrito por causa de preço. */

  await fetch('/api/taxa', {
    method: 'POST',
    body: JSON.stringify({ valor: Number(valor) || 0, projeto }),
