    glossario: () => viewGlossario(),
    docs: () => viewDocs(),
    bancada: () => viewBancada(),
    remoto: () => viewRemoto(),
  }
  // O palco do escritório é um iframe. Reescrever #main a cada evento do
  // stream o recriaria, e iframe recriado RECARREGA — a tela piscava e o
  // escritório reiniciava sozinho a cada 2 segundos. Enquanto o painel
  // escolhido não muda, só os cartões são redesenhados; o iframe não é
  // tocado. Mover o nó também recarregaria, então nem isso se faz.
  const palco = tab === 'escritorio' ? $('.painel-palco') : null
  if (palco && palco.dataset.src === painelNoPalco()?.url) {
    const cartoes = $('.painel-cab')
    if (cartoes) {
      cartoes.outerHTML = viewCartoesPaineis()
      const leg = $('.leg-lista')
      if (leg) leg.innerHTML = viewLegendaEscritorio(filtered())
      $('#foot').textContent = RODAPE[tab] || ''
      drawer()
      return
    }
  }

  $('#main').innerHTML = (views[tab] || views.agentes)()
  $('#foot').textContent = RODAPE[tab] || ''
  drawer()
}

async function carregarServidores(force) {
  if (SERVERS && !force) return
  const r = await fetch('/api/servers')
  const d = await r.json()
  SERVERS = d.servers
  DUPLICADOS = d.duplicados || []
  RECENTES = d.recentes || []
  render()
}

/** Varre o disco atrás de pastas de projeto. Só quando o painel de subir abre. */
async function carregarProjetos() {
  if (PROJETOS) return
  PROJETOS = (await (await fetch('/api/projetos')).json()).projetos || []
  render()
}

/** Grava apelido, explicação ou favorito e relê — o cache do servidor já caiu. */
async function salvarServidor(chave, patch) {
  const r = await fetch('/api/servidor', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ chave, patch }),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  return carregarServidores(true)
}

// Revalida ao voltar na aba. Morno, /api/tempo custa ~20ms — o guard antigo
// segurava o snapshot da PRIMEIRA carga da aba pelo resto da sessão, e as
// horas congelavam sem nada na tela dizendo isso.
let tempoEm = 0
async function carregarTempo(force) {
  if (TEMPO && !force && Date.now() - tempoEm < 30_000) return
  tempoEm = Date.now()
  const q = new URLSearchParams({ corte: tempoParams.corte })
  if (tempoParams.de) q.set('de', tempoParams.de)
  if (tempoParams.ate) q.set('ate', tempoParams.ate)
  if (force === 'reler') q.set('force', '1')
  TEMPO = null
  render() // mostra "lendo os transcritos…" antes de travar no fetch
  try {
    TEMPO = await (await fetch(`/api/tempo?${q}`)).json()
  } catch (e) {
    TEMPO = { error: String(e.message || e) }
  }
  render()
}

/** Grava um número de configuração e recalcula do cache, sem reler transcrito. */
async function salvarNumero(rota, valor) {
  await fetch(rota, { method: 'POST', body: JSON.stringify({ valor: Number(valor) || 0 }) })
  carregarTempo(true)
}

/** Cotação digitada congela o valor; apagar o campo devolve a busca automática. */
const salvarCambio = (valor) => salvarNumero('/api/cambio', valor)

/** Grava a taxa e recalcula do cache — não relê transcrito por causa de preço. */
async function salvarTaxa(projeto, valor) {
  await fetch('/api/taxa', {
    method: 'POST',
    body: JSON.stringify({ valor: Number(valor) || 0, projeto }),
  })
  carregarTempo(true)
}

/* ========================= mapa do projeto =========================
   O ROADMAP.md do projeto, ao lado. Existe porque o cartão sozinho mostrava a
   folha sem a árvore: "Pierre: travessia gamificada" não diz nada para quem
   não lembra que Pierre é uma frente do inovallbond. Aqui a frente aparece
   dentro do grupo dela, com quantos agentes estão em cada uma. */

let MAPA = null
let mapaProjeto = null
// CC-35: commits desde a última visita, ou desde 7 dias sem visita nenhuma —
// "o que mudou" tem que ter uma janela, senão viraria o histórico inteiro.
let GIT = null

const ROTULO_ESTADO = {
  bloqueado: 'travado', esperando: 'esperando alguém',
  aberto: 'aberto', feito: 'feito',
}

const TODO_ROADMAP = 'criar docs/ROADMAP.md deste projeto, seguindo a estrutura do projeto-template'

// `job` pode ser um agente de verdade (tem `cwd`) ou, vindo do cockpit sem
// nenhum agente ativo, um objeto sintético `{ project }` — o servidor resolve
// o cwd sozinho (histórico ou disco), CC-34.
let ROTAS = null

async function abrirMapa(job) {
  mapaProjeto = job
  MAPA = null
  GIT = null
  ROTAS = null
  desenharMapa()
  const q = job.cwd ? `cwd=${encodeURIComponent(job.cwd)}` : `projeto=${encodeURIComponent(job.project)}`
  try {
    MAPA = await (await fetch(`/api/roadmap?${q}`)).json()
  } catch {
    MAPA = { erro: 'não deu para ler o roadmap' }
  }
  desenharMapa()
  /* CC-78: quem está em qual rota, com o veredito de presença junto. Fora do
     stream de 2s porque varre transcrito — é leitura de disco, não de memória. */
  try { ROTAS = await (await fetch(`/api/rotas?${q}`)).json() } catch { ROTAS = { existe: false } }
  desenharMapa()
  // Sob clique (o próprio abrir do mapa já é o clique): spawn de git não
  // pode entrar no stream de 2s, então carrega à parte e redesenha quando
  // chegar — o mapa já está na tela nesse ponto, esperando só esta seção.
  const cockpitProj = (DATA.cockpit || []).find((p) => p.projeto === job.project)
  const desde = cockpitProj?.desdeVisita?.em || (Date.now() - 7 * 24 * 3600 * 1000)
  try {
    GIT = await (await fetch(`/api/git?${q}&desde=${desde}`)).json()
  } catch {
    GIT = { ok: false, motivo: 'falha ao ler o git' }
  }
  desenharMapa()
}

/* CC-98: as duas ordens que ele pediu — "em ordem de tempo e importancia".
   Duas listas curtas em vez de uma reordenação do mapa: reordenar tiraria o
   agrupamento por frente, que é o que dá o contexto. Aqui elas respondem duas
   perguntas diferentes, e o mapa inteiro continua embaixo.

   Só o que está ABERTO entra. Item feito ou parado por decisão dele não é "o
   que fazer agora" nem "o que está encalhado". */
let ordemAberta = localStorage.getItem('cc-mapa-ordem') || 'importancia'

/* CC-100 — o painel mexendo enquanto ele lê.
   Pedido dele: *"que fiquem visiveis em locais faceis pra eu ver voce mexendo e
   atualizando enquanto leio aqui"*.

   O canal já existia: o painel redesenha a cada 2 segundos. O que faltava era o
   agente escrever (CC-95) e a tela dizer O QUE mudou. Sem isso, a atualização
   acontecia e era invisível — um número trocando de 5 para 6 não conta história.

   Derivado de `feitoEm`, o carimbo que o `writeMeta` já grava ao fechar uma
   tarefa. Nada de registro novo. */
const JANELA_MUDOU = 45 * 60 * 1000

function mudancasRecentes(agora = Date.now()) {
  const saida = []
  for (const j of DATA.jobs || []) {
    for (const [texto, quando] of Object.entries(j.feitoEm || {})) {
      const t = Date.parse(quando)
      if (!Number.isFinite(t) || agora - t > JANELA_MUDOU) continue
      const todo = (j.todos || []).find((x) => x.text === texto)
      saida.push({ texto, quando: t, projeto: j.project, prova: todo?.prova || null, olho: todo?.olho === true })
    }
  }
  return saida.sort((a, b) => b.quando - a.quando)
}

function viewMudou() {
  const lista = mudancasRecentes()
  if (!lista.length) return ''
  const min = (t) => {
    const m = Math.round((Date.now() - t) / 60000)
    return m < 1 ? 'agora' : `há ${m}min`
  }
  return `<section class="mudou">
    <h4>acabou de mudar <span class="dim">${lista.length} nos últimos 45min</span></h4>
    ${/* O que precisa do olho dele vem PRIMEIRO e marcado; o resto é técnica,
         que ele alcança mas não é cobrado a olhar. Decisão dele em 17/08:
         "só o que eu vejo e uso, porém é bom eu ter acesso". */ ''}
    ${[...lista].sort((a, b) => (b.olho ? 1 : 0) - (a.olho ? 1 : 0)).slice(0, 6).map((m) => `<div class="mudou-item${m.olho ? ' precisa-olho' : ''}">
      <span class="mudou-q">${esc(min(m.quando))}</span>
      <span class="mudou-t">${m.olho ? '<b class="mudou-olho">confira</b> ' : ''}${esc(m.texto)}</span>
      ${m.prova ? `<span class="mudou-p">${esc(m.prova)}</span>` : '<span class="mudou-sp">sem prova</span>'}
    </div>`).join('')}
  </section>`
}

function viewOrdens() {
  const o = MAPA?.ordens
  if (!o) return ''
  const vivos = (l) => l.filter((x) => x.estado === 'aberto' || x.estado === 'bloqueado')
  const lista = ordemAberta === 'tempo' ? vivos(o.porTempo) : vivos(o.porImportancia)
  if (!lista.length) return ''

  const idade = (t) => {
    if (!t) return ''
    const h = (Date.now() - t) / 3600000
    return h < 24 ? `${Math.round(h)}h` : `${Math.round(h / 24)}d`
  }

  return `<section class="m-ordens">
    <div class="m-otabs">
      <button class="m-otab${ordemAberta === 'importancia' ? ' on' : ''}" data-ordem="importancia">o que fazer agora</button>
      <button class="m-otab${ordemAberta === 'tempo' ? ' on' : ''}" data-ordem="tempo">o que está encalhado</button>
    </div>
    <p class="dim m-oexp">${ordemAberta === 'importancia'
    ? 'por importância: o que destrava outros itens, o que veio de pedido seu, e o peso da frente. Tudo derivado, nada digitado.'
    : 'por idade: há quanto tempo o item foi escrito no ROADMAP e continua aberto. Sai do git, não de data escrita à mão.'}</p>
    <ol class="m-olist">
      ${lista.slice(0, 8).map((i) => `<li>
        <span class="m-onum">${ordemAberta === 'tempo' ? esc(idade(i.nasceuEm)) : i.importancia}</span>
        <span class="m-otit">${esc(i.titulo)}</span>
        ${i.dependentes ? `<span class="m-odep">${i.dependentes} depende(m)</span>` : ''}
      </li>`).join('')}
    </ol>
  </section>`
}

function fecharMapa() {
  mapaProjeto = null
  MAPA = null
  GIT = null
  ROTAS = null
  desenharMapa()
}

/** Lista compacta de commits, ou o motivo de não ter nenhum. */
function viewGit() {
  if (!GIT) return '<p class="dim m-git-carregando">lendo o git…</p>'
  if (!GIT.ok) return `<p class="dim">sem histórico de commits (${esc(GIT.motivo || 'motivo desconhecido')})</p>`
  if (!GIT.commits.length) return '<p class="dim">nenhum commit nessa janela</p>'
  return `<div class="m-git">${GIT.commits.slice(0, 12).map((c) => `
    <div class="m-commit">
      <span class="path">${age(Date.now() - c.em)}</span>
      <b>${esc(c.assunto)}</b>
      <span class="dim">${c.arquivos.length} arquivo${c.arquivos.length === 1 ? '' : 's'}</span>
    </div>`).join('')}
    ${GIT.commits.length > 12 ? `<p class="dim">+ ${GIT.commits.length - 12} commit(s) mais antigo(s) na janela</p>` : ''}
  </div>`
}

/** Quantos agentes estão em cada frente, para o mapa dizer onde há gente. */
function agentesPorFrente(projeto) {
  const conta = new Map()
  for (const j of DATA.jobs) {
    if (j.project !== projeto || !j.frente) continue
    const k = j.frente.toLowerCase()
    conta.set(k, (conta.get(k) || 0) + 1)
  }
  return conta
}

/**
 * CC-83: os três backlogs, no vocabulário que ele já tem.
 *
 * Ideia dele: *"na metodologia ágil a gente tem backlog do produto, do sprint e
 * do dia"*. Isso resolveu uma confusão que ele mesmo apontou — a tela de frentes
 * e a aba de to-dos não são duas telas concorrendo, são **dois níveis do mesmo
 * funil**, e faltava o nome que os separasse.
 *
 * **O nível do meio é DERIVADO, nunca digitado**, e essa é a decisão central.
 * Uma terceira lista para alguém manter envelheceria como todo artefato que
 * depende de disciplina. Sprint aqui é o que TEM AGENTE agora, e isso o painel
 * já sabe.
 *
 * Medido em 15/08 nos 14 projetos: os roadmaps só têm dois estados escritos, 48
 * abertas e 12 feitas, **zero "em andamento"**. Ninguém nunca escreveu isso num
 * roadmap — por isso a coluna do meio não podia vir do texto.
 */
function viewNiveis(naFrente) {
  const todas = MAPA.grupos.flatMap((g) => g.frentes)
  const temAgente = (f) => (naFrente.get(f.titulo.toLowerCase())
    ?? [...naFrente].find(([k]) => f.titulo.toLowerCase().startsWith(k))?.[1] ?? 0) > 0

  const feitas = todas.filter((f) => f.estado === 'feito')
  const sprint = todas.filter((f) => f.estado !== 'feito' && temAgente(f))
  const fila = todas.filter((f) => f.estado !== 'feito' && !temAgente(f))

  const bloco = (rotulo, lista, dica, classe) => `
    <div class="m-nivel ${classe}">
      <div class="m-nivel-cab"><b>${rotulo}</b><span class="m-frac">${lista.length}</span></div>
      <p class="path">${dica}</p>
      ${lista.length
        ? `<div class="m-nivel-itens">${lista.slice(0, 8).map((f) => `<span>${esc(f.titulo)}</span>`).join('')}${
            lista.length > 8 ? `<span class="path">e mais ${lista.length - 8}</span>` : ''}</div>`
        : ''}
    </div>`

  return `<section class="m-niveis">
    ${bloco('agora', sprint, 'frentes com agente trabalhando nelas, sai sozinho, ninguém escreve', 'n-agora')}
    ${bloco('na fila', fila, 'o resto do que está aberto no roadmap', 'n-fila')}
    ${bloco('prontas', feitas, 'já fechadas, mantidas para consulta', 'n-prontas')}
  </section>`
}

function desenharMapa() {
  const el = $('#mapa')
  const scrim = $('#scrim-mapa')
  if (!mapaProjeto) { el.hidden = true; scrim.classList.remove('on'); return }
  el.hidden = false
  scrim.classList.add('on')

  if (!MAPA) { el.innerHTML = '<div class="empty">lendo o roadmap…</div>'; return }

  const cabeca = `<header class="m-head">
    <b>${esc(mapaProjeto.project)}</b>
    <span class="grow"></span>
    <button class="btn" data-fechar-mapa>fechar</button>
  </header>`

  if (MAPA.vazio || MAPA.erro || !MAPA.grupos?.length) {
    // CC-18: o painel não escreve o arquivo direto na pasta de outro projeto —
    // isso seria o Control Center mudando disco de fora sem revisão. Em vez
    // disso, cria um to-do no job aberto; um agente de verdade lê e decide
    // como escrever, com a revisão normal de qualquer código gerado.
    const jaTem = (mapaProjeto.todos || []).some((t) => t.text === TODO_ROADMAP)
    // CC-34: mapaProjeto pode ser sintético (`{project}`, sem `id`) quando veio
    // do cockpit sem nenhum agente vivo. Sem job real não há onde gravar o
    // to-do — mostrar o botão criaria um clique que falha em silêncio.
    const podeCriarTodo = Boolean(mapaProjeto.id)
    el.innerHTML = `${cabeca}<div class="empty">
      este projeto não tem <code>docs/ROADMAP.md</code>, sem ele o painel não tem
      mapa para mostrar, só o que o agente escreveu no cartão.
      ${jaTem
        ? '<p class="m-todo-ok">✓ to-do criado, o agente vê na próxima checada</p>'
        : podeCriarTodo
          ? '<button class="btn" data-criar-todo-roadmap>+ criar to-do "escrever o roadmap"</button>'
          : '<p class="dim">sem agente ativo aqui pra carregar o to-do, abra uma sessão neste projeto</p>'}
    </div>
    <section class="m-git-sec"><h4>o que mudou</h4>${viewGit()}</section>`
    return
  }

  const naFrente = agentesPorFrente(mapaProjeto.project)
  const barra = (feitos, itens) => (itens
    ? `<span class="m-frac">${feitos}/${itens}</span>` : '')

  el.innerHTML = cabeca + viewNiveis(naFrente) + viewOrdens() + MAPA.grupos.map((g) => `
    <section class="m-grupo e-${g.estado}">
      <div class="m-gtit">
        <span class="m-selo">${ROTULO_ESTADO[g.estado] || g.estado}</span>
        <b>${esc(g.titulo)}</b>
        ${barra(g.feitos, g.itens)}
      </div>
      ${g.frentes.map((f) => {
        const quantos = naFrente.get(f.titulo.toLowerCase())
          ?? [...naFrente].find(([k]) => f.titulo.toLowerCase().startsWith(k))?.[1] ?? 0
        return `<div class="m-frente${quantos ? ' com-agente' : ''}">
          <span class="m-nome">${esc(f.titulo)}</span>
          ${barra(f.feitos, f.itens)}
          ${quantos ? `<span class="m-agentes">${quantos} agente${quantos > 1 ? 's' : ''} aqui</span>` : ''}
        </div>`
      }).join('')}
    </section>`).join('')
    + `<p class="path m-rodape">lido de <code>${esc((MAPA.arquivo || '').split(/[\\/]/).slice(-2).join('/'))}</code>
        · ${MAPA.linhas} linhas · atualizado ${MAPA.atualizadoEm ? age(Date.now() - MAPA.atualizadoEm) + ' atrás' : '...'}</p>`
    + viewRotas()
    + `<section class="m-git-sec"><h4>o que mudou</h4>${viewGit()}</section>`
}

/**
 * CC-78: as rotas do projeto, clicáveis.
 *
 * **Três cores, e o azul não se clica.** Ele pediu bolinhas que ciclam; a cor
 * do meio não precisou ser inventada, já existia como veredito do CC-49:
 * ocupada por alguém que sumiu há mais de uma hora. Clicar alterna entre livre
 * e ocupada, que são as duas escolhas de verdade — um terceiro estado clicável
 * seria cor sem significado.
 */
function viewRotas() {
  if (!ROTAS) return '<section class="m-git-sec"><h4>rotas</h4><p class="path">lendo…</p></section>'
  if (!ROTAS.existe) {
    return `<section class="m-git-sec"><h4>rotas</h4>
      <p class="path">este projeto não usa o Método Routia (sem <code>docs/ROTAS-ATIVAS.md</code>)</p></section>`
  }
  const rotulo = { livre: 'livre', ocupada: 'ocupada', orfa: 'o dono sumiu' }
  /* A planilha que ele usava nos produtos (17/08): cada rota numa LINHA, com os
     arquivos que ela reivindica na coluna ao lado. "eu via as rotas com nomes e
     cores e isso agilizava o entendimento e o formato tabela é muito prático."
     A cor continua no fio da esquerda e na palavra, nunca sozinha. */
  return `<section class="m-git-sec"><h4>rotas <span class="path">toque no nome para trocar</span></h4>
    <table class="m-rotas-tab"><tbody>${ROTAS.rotas.map((r) => `
      <tr class="c-${r.cor}">
        <td class="rt-nome-c"><button class="m-rota-bt" data-rota="${esc(r.rota)}"
          data-rota-ocupar="${r.cor === 'livre' ? '1' : ''}"
          title="${r.cor === 'livre' ? 'marcar como ocupada' : 'liberar'}"><i></i><b>${esc(r.rota)}</b></button></td>
        <td class="rt-quem-c">${rotulo[r.cor]}${r.quem ? ` · ${esc(r.quem)}` : ''}${
          r.cor === 'orfa' ? ` · calado há ${esc(r.silencio)}` : ''}</td>
        <td class="rt-arq-c">${(r.arquivos || []).length
          ? r.arquivos.map((a) => `<code>${esc(a)}</code>`).join(' ')
          : '<span class="path">pasta inteira</span>'}</td>
      </tr>`).join('')}
    ${/* CC-102: as rotas de OUTRA máquina, que até 17/08 só saíam por comando
          de terminal. Entram na mesma tabela, na mesma linguagem, com a máquina
          escrita e sem botão: liberar rota de outro aparelho à distância é o
          contrário do que o Routia protege. */ ''}
    ${(ROTAS.deFora || []).map((r) => `
      <tr class="c-${r.cor} rt-fora">
        <td class="rt-nome-c"><span class="m-rota-bt" title="rota de outra máquina, sem botão daqui"><i></i><b>${esc(r.rota)}</b></span></td>
        <td class="rt-quem-c">${esc(r.origem)}${r.quem ? ` · ${esc(r.quem)}` : ''}${
          r.cor === 'orfa' ? ` · calado há ${esc(r.silencio || '?')}` : ''}</td>
        <td class="rt-arq-c">${(r.arquivos || []).length
          ? r.arquivos.map((a) => `<code>${esc(a)}</code>`).join(' ')
          : '<span class="path">pasta inteira</span>'}</td>
      </tr>`).join('')}</tbody></table>
    ${(ROTAS.deFora || []).length
      ? `<p class="path">${ROTAS.deFora.length} rota(s) de outra máquina, sem botão: quem libera é o aparelho dono.</p>` : ''}
    ${ROTAS.rotas.some((r) => r.cor === 'orfa')
      ? '<p class="path">Azul é o dono que sumiu. Confirme antes de retomar: silêncio não é liberação.</p>' : ''}
  </section>`
}

/* ====================== módulos da máquina =========================
   CPU, memória e GPU em blocos pequenos, ao lado do player. Cada um mostra o
   número que decide alguma coisa — uso e temperatura — e guarda o resto no
   título. Sem gráfico: aqui é para bater o olho, não para analisar.

   Temperatura de CPU e de memória não existem no Windows sem o
   LibreHardwareMonitor aberto; quando faltam, o campo some em vez de mostrar
   zero, que pareceria uma máquina gelada. */

let MAQUINA = null

async function carregarMaquina() {
  try {
    MAQUINA = await (await fetch('/api/maquina')).json()
  } catch {
    MAQUINA = null
  }
  renderMaquina()
}

let DOCKER = null

/**
 * Roda sempre, não só na aba servidores: é bloco possível do PiP, e a
 * janelinha tem que ter dado mesmo com o Control Center numa aba diferente.
 */
async function carregarDocker() {
  try {
    DOCKER = await (await fetch('/api/docker')).json()
  } catch {
    DOCKER = null
  }
  if (tab === 'servidores') render()
  renderPip()
}

let PROCESSOS = null
let processosCarregando = false

/**
 * Nunca em timer — medido em 19s (`Get-Process`) numa máquina com 596
 * processos. Carrega uma vez ao abrir a aba, e só de novo com o botão
 * "atualizar", igual a VPS: caro e raro, não barato e constante.
 */
async function carregarProcessos(force) {
  if ((PROCESSOS && !force) || processosCarregando) return
  processosCarregando = true
  if (tab === 'servidores') render() // mostra "lendo…" durante a espera
  try {
    const d = await (await fetch('/api/processos')).json()
    PROCESSOS = d?.indisponivel ? null : d
  } catch {
    PROCESSOS = null
  }
  processosCarregando = false
  if (tab === 'servidores') render()
  renderPip()
}

const faixaUso = (p) => (p >= 90 ? 'alto' : p >= 70 ? 'medio' : 'baixo')
// Faixas de temperatura de silício: 80 °C é onde placa e processador começam a
// reduzir desempenho para se proteger.
const faixaTemp = (t) => (t >= 80 ? 'alto' : t >= 65 ? 'medio' : 'baixo')

function moduloHw({ rot, uso, temp, detalhe, dica }) {
  if (uso == null && temp == null) return ''
  const classe = uso == null ? faixaTemp(temp) : faixaUso(uso)
  return `<div class="mod hw n-${classe}" title="${esc(dica)}">
    <span class="hw-rot">${rot}</span>
    <span class="hw-nums">
      ${uso == null ? '' : `<b>${Math.round(uso)}<i>%</i></b>`}
      ${temp == null ? '' : `<b class="hw-temp">${Math.round(temp)}<i>°</i></b>`}
    </span>
    <span class="hw-barra"><i style="width:${Math.min(uso ?? 0, 100)}%"></i></span>
    ${detalhe ? `<span class="hw-det">${esc(detalhe)}</span>` : ''}
  </div>`
}

function renderMaquina() {
  const alvo = $('#maquina')
  if (!MAQUINA || MAQUINA.erro) { alvo.innerHTML = ''; return }
  const { cpu, ram, gpu } = MAQUINA
  const gb = (n) => (n == null ? '' : `${n}`.replace('.', ',') + ' GB')

  alvo.innerHTML = [
    moduloHw({
      rot: 'cpu',
      uso: cpu?.uso,
      temp: cpu?.temp,
      detalhe: cpu?.nucleos ? `${cpu.nucleos} fios` : '',
      dica: `${cpu?.nome || 'processador'}${cpu?.temp == null
        ? ' · temperatura precisa do LibreHardwareMonitor aberto' : ''}`,
    }),
    moduloHw({
      rot: 'ram',
      uso: ram?.uso,
      temp: ram?.temp,
      detalhe: `${gb(ram?.usadaGB)} de ${gb(ram?.totalGB)}`,
      dica: `memória: ${gb(ram?.usadaGB)} em uso de ${gb(ram?.totalGB)}`,
    }),
    gpu ? moduloHw({
      rot: 'gpu',
      uso: gpu.uso,
      temp: gpu.temp,
      detalhe: `${gb(gpu.vramUsadaGB)} de ${gb(gpu.vramTotalGB)}`,
      dica: `${gpu.nome} · vram ${gpu.usoMem ?? '...'}% · ${gpu.watts ?? '...'} W`
        + `${gpu.tempMem == null ? ' · esta placa não expõe temperatura da memória' : ` · memória ${gpu.tempMem}°`}`,
    }) : '',
  ].join('')
}

/* ========================= player de mídia =========================
   Fica fora do #main de propósito, como as notas: `render()` reescreve o
   painel a cada evento do stream, e o cursor do controle de volume sumiria no
   meio do arrasto. Aqui o desenho só acontece quando o que está tocando muda. */

let MIDIA = null
let midiaAssinatura = ''
let arrastandoVolume = false
// Qual sessão a barra controla. Vazio = a mais provável, escolhida por peso.
// Fica gravado porque trocar de app a cada vez que o YouTube pausa seria pior
// que a escolha errada.
let midiaEscolhida = localStorage.getItem('cc-midia') || ''

/** A sessão da barra: a fixada, se ainda existir; senão a mais provável. */
const sessaoAtual = () => {
  const lista = MIDIA?.sessoes || []
  return lista.find((s) => s.appId === midiaEscolhida) || lista[0] || null
}

const $player = () => $('#player')

async function carregarMidia() {
  try {
    const r = await fetch('/api/midia')
    MIDIA = await r.json()
  } catch {
    MIDIA = { erro: 'sem resposta' }
  }
  renderPlayer()
}

/** Só redesenha quando muda de verdade — e nunca durante um arrasto. */
function renderPlayer() {
  const alvo = $player()
  const s = sessaoAtual()
  if (!s) {
    alvo.hidden = true
    midiaAssinatura = ''
    return
  }
  const quantas = (MIDIA?.sessoes || []).length
  const assinatura = JSON.stringify([s.appId, s.titulo, s.artista, s.tocando, s.volume, s.mudo, s.pid, quantas])
  if (assinatura === midiaAssinatura || arrastandoVolume) return
  midiaAssinatura = assinatura
  alvo.hidden = false

  const bt = (acao, rotulo, ligado, dica) => `<button class="p-bt" data-midia="${acao}"
    ${ligado ? '' : 'disabled'} title="${dica}">${rotulo}</button>`
  const temVolume = s.pid && s.volume != null

  // Duas linhas, como os módulos de hardware: em cima o que toca, embaixo os
  // controles. Em linha única o player esticava e empurrava tudo para fora.
  alvo.innerHTML = `
    <div class="p-cima">
      <button class="p-app${quantas > 1 ? ' trocavel' : ''}" data-midia="trocar"
        ${quantas > 1 ? '' : 'disabled'}
        title="${quantas > 1 ? `clique para controlar outra mídia (${quantas} abertas)` : 'única mídia aberta'}"
        >${esc(s.app)}${quantas > 1 ? ` ${quantas}` : ''}</button>
      <b class="p-titulo" title="${esc(s.titulo)}${s.artista ? `, ${esc(s.artista)}` : ''}"
        >${esc(s.titulo || 'sem título')}</b>
    </div>
    <div class="p-baixo">
      <span class="p-bts">
        ${bt('prev', '⏮', s.podeAnterior, 'faixa anterior')}
        ${bt('toggle', s.tocando ? '⏸' : '▶', s.podePausa || s.podePlay, s.tocando ? 'pausar' : 'tocar')}
        ${bt('next', '⏭', s.podeProximo, 'próxima faixa')}
      </span>
      ${temVolume ? `
        <span class="p-vol">
          <button class="p-bt" data-midia="mudo" title="${s.mudo ? 'tirar do mudo' : 'mudo'}">${s.mudo ? '🔇' : '🔊'}</button>
          <input type="range" min="0" max="100" value="${s.volume}" data-vol
            title="volume deste aplicativo, não mexe no volume do Windows">
          <b>${s.mudo ? '...' : s.volume + '%'}</b>
        </span>`
        : '<span class="path p-semvol" title="a sessão de mídia não casou com nenhum processo de áudio">sem volume</span>'}
    </div>`
}

async function mandarMidia(corpo, rota = 'acao') {
  try {
    await fetch(`/api/midia/${rota}`, { method: 'POST', body: JSON.stringify(corpo) })
  } catch { /* a próxima leitura mostra a verdade */ }
  midiaAssinatura = '' // força redesenho com o estado novo
  carregarMidia()
}

/* ========================== notas ============================
   Fora do #main de propósito: `render()` reescreve o painel a cada evento do
   stream, de 2 em 2 segundos. Um textarea ali dentro perderia o cursor no
   meio da frase. Aqui só se redesenha ao criar ou apagar bloco. */

let NOTES = []
let armedNote = null          // bloco com "apagar" armado, esperando confirmação
let notesOpen = params.has('notes') || localStorage.getItem('cc-notes-open') === '1'
let notesW = Number(localStorage.getItem('cc-notes-w')) || 340
let saveTimer = null

const novoId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)
const notaDo = (el) => NOTES.find((n) => n.id === el.closest('.n-block')?.dataset.note)

function layoutNotas() {
  document.body.style.setProperty('--notes-w', notesW + 'px')
  $('#notas').hidden = $('#split').hidden = !notesOpen
  $('#n-toggle').setAttribute('aria-pressed', String(notesOpen))
  $('#n-toggle').classList.toggle('on', notesOpen)
}

/**
 * No modo lista, cada linha não vazia é um item; "[x]" na frente é feito.
 * Aceita "[]" sem espaço porque é assim que se digita à mão — exigir o
 * espaço faria a marca virar texto do próprio item.
 */
const itensDe = (n) => n.text.split('\n').filter((l) => l.trim()).map((linha) => {
  const m = linha.match(/^\s*\[([ xX]?)\]\s?(.*)$/)
  return m ? { text: m[2], done: m[1].trim() !== '' } : { text: linha.trim(), done: false }
})
const linhasDe = (itens) => itens.map((it) => `${it.done ? '[x] ' : '[ ] '}${it.text}`).join('\n')

function renderNotas() {
  const corpo = (n) => n.kind === 'check'
    ? `<div class="n-itens">
        ${itensDe(n).map((it, i) => `
          <div class="n-item${it.done ? ' done' : ''}">
            <input type="checkbox" data-nota-check="${esc(n.id)}" data-i="${i}" ${it.done ? 'checked' : ''}
              aria-label="marcar item">
            <input class="txt" value="${esc(it.text)}" data-nota-item="${esc(n.id)}" data-i="${i}"
              aria-label="texto do item" placeholder="em branco, o item some">
          </div>`).join('')}
        <button class="n-add-item" data-nota-add="${esc(n.id)}">+ item</button>
      </div>`
    : `<textarea style="height:${n.h}px" spellcheck="false" aria-label="conteúdo do bloco">${esc(n.text)}</textarea>`

  $('#n-list').innerHTML = NOTES.length
    ? NOTES.map((n) => `
      <div class="n-block" data-note="${esc(n.id)}">
        <div class="n-top">
          <input class="n-title" value="${esc(n.title)}" placeholder="sem título" aria-label="título do bloco">
          <button class="n-modo" data-modo="${esc(n.id)}"
            title="${n.kind === 'check' ? 'virar texto livre' : 'virar lista de itens'}"
            aria-label="alternar tipo do bloco">${n.kind === 'check' ? '¶' : '☑'}</button>
          <button class="n-del${armedNote === n.id ? ' armed' : ''}" data-del="${esc(n.id)}"
            title="apagar bloco">${armedNote === n.id ? 'apagar?' : '✕'}</button>
        </div>
        ${corpo(n)}
      </div>`).join('')
    : '<div class="n-empty">nenhum bloco ainda, clique em <b>+ bloco</b></div>'
}

function salvarNotas(agora) {
  clearTimeout(saveTimer)
  const gravar = () => fetch('/api/notes', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ notes: NOTES }),
  })
  agora ? gravar() : (saveTimer = setTimeout(gravar, 500))
}

// Digitar não redesenha: só atualiza o modelo e agenda a gravação.
document.addEventListener('input', (e) => {
  const n = notaDo(e.target)
  if (!n) return
  if (e.target.matches('textarea')) n.text = e.target.value
  else if (e.target.matches('.n-title')) n.title = e.target.value
  else if (e.target.matches('[data-nota-item]')) {
    const itens = itensDe(n)
    const i = +e.target.dataset.i
    if (!itens[i]) return
    itens[i] = { ...itens[i], text: e.target.value }
    n.text = linhasDe(itens)
  } else return
  salvarNotas()
})

// item vazio sai da lista — mesmo gesto de apagar dos to-dos
document.addEventListener('change', (e) => {
  const bloco = e.target.closest('[data-pip-bloco]')
  if (bloco) {
    const b = bloco.dataset.pipBloco
    const blocos = bloco.checked ? [...PIP_CFG.blocos, b] : PIP_CFG.blocos.filter((x) => x !== b)
    return salvarPip({ blocos })
  }
  const layout = e.target.closest('[name="pip-layout"]')
  if (layout) return salvarPip({ layout: layout.value })

  const hk = e.target.closest('[data-hk-toggle]')
  if (hk) return alternarHook(hk.dataset.hkToggle, hk.checked)
})

// clicar fora fecha o popover — sem isso ficaria aberto até um clique em cima
document.addEventListener('click', (e) => {
  const el = $('#pip-config')
  if (!el || el.hidden) return
  if (el.contains(e.target) || e.target.closest('#pip-config-toggle')) return
  el.hidden = true
})

document.addEventListener('change', (e) => {
  const campo = e.target.closest('[data-nota-item]')
  if (!campo || campo.value.trim()) return
  const n = notaDo(campo)
  if (!n) return
  n.text = linhasDe(itensDe(n).filter((_, k) => k !== +campo.dataset.i))
  renderNotas()
  salvarNotas(true)
})

// A alça de resize do textarea não emite evento próprio. Como só dá pra
// arrastá-la com o ponteiro, soltar o botão é o momento certo de conferir.
document.addEventListener('pointerup', () => {
  let mudou = false
  for (const ta of document.querySelectorAll('.n-block textarea')) {
    const n = notaDo(ta)
    const h = Math.round(ta.getBoundingClientRect().height)
    if (n && h && h !== n.h) { n.h = h; mudou = true }
  }
  if (mudou) salvarNotas()
})

$('#split').addEventListener('pointerdown', (e) => {
  e.preventDefault()
  const split = e.currentTarget
  split.setPointerCapture(e.pointerId)
  split.classList.add('drag')
  const mover = (ev) => {
    const max = Math.max(window.innerWidth * 0.78, 220)
    notesW = Math.round(Math.min(Math.max(window.innerWidth - ev.clientX, 220), max))
    document.body.style.setProperty('--notes-w', notesW + 'px')
  }
  const soltar = () => {
    split.classList.remove('drag')
    split.removeEventListener('pointermove', mover)
    split.removeEventListener('pointerup', soltar)
    localStorage.setItem('cc-notes-w', notesW)
  }
  split.addEventListener('pointermove', mover)
  split.addEventListener('pointerup', soltar)
})

/* ========================= eventos =========================== */

document.addEventListener('click', async (e) => {
  const t = e.target

  const btMapa = t.closest('[data-mapa]')
  if (btMapa) {
    const job = byId(btMapa.dataset.mapa)
    if (job) abrirMapa(job)
    return
  }

  // Mapa a partir do cockpit: prefere um agente vivo (não precisa de round
  // trip pra resolver cwd), mas projeto totalmente parado também abre — CC-34,
  // o servidor resolve o cwd pelo histórico ou pelo disco.
  const btMapaProj = t.closest('[data-mapa-projeto]')
  if (btMapaProj) {
    const projeto = btMapaProj.dataset.mapaProjeto
    const job = DATA.jobs.find((j) => j.project === projeto && j.cwd) || { project: projeto }
    abrirMapa(job)
    return
  }
  if (t.closest('[data-fechar-mapa]') || t.closest('#scrim-mapa')) return fecharMapa()

  if (t.closest('[data-criar-todo-roadmap]')) {
    const job = mapaProjeto
    if (!job) return
    await gravarTodos(job, [...job.todos, { text: TODO_ROADMAP, done: false }])
    return desenharMapa()
  }

  const btMidia = t.closest('[data-midia]')
  if (btMidia) {
    const s = sessaoAtual()
    if (!s) return
    const qual = btMidia.dataset.midia
    if (qual === 'trocar') {
      const lista = MIDIA?.sessoes || []
      const proxima = lista[(lista.indexOf(s) + 1) % lista.length]
      midiaEscolhida = proxima.appId
      localStorage.setItem('cc-midia', midiaEscolhida)
      midiaAssinatura = ''
      return renderPlayer()
    }
    if (qual === 'mudo') return mandarMidia({ pid: s.pid, mudo: !s.mudo }, 'volume')
    return mandarMidia({ indice: s.indice, qual })
  }

  const fecharTodas = t.closest('[data-fechar-todas]')
  if (fecharTodas) {
    const job = byId(fecharTodas.dataset.fecharTodas)
    // Marca tudo de uma vez porque o agente já disse que entregou; corrigir
    // item a item é para quando ele entregou parte, e aí a lista está na tela.
    return gravarTodos(job, job.todos.map((x) => ({ ...x, done: true })))
  }

  const abrirPreco = t.closest('[data-preco-abrir]')
  if (abrirPreco && !t.closest('button, input')) {
    const k = abrirPreco.dataset.precoAbrir
    precoAberta = precoAberta === k ? null : k
    return render()
  }
  const nivelBotao = t.closest('[data-preco-nivel]')
  if (nivelBotao) {
    const item = PRECO.tarefas.find((x) => chaveDe(x) === nivelBotao.dataset.precoNivel)
    // Clicar no nível que já está ativo desfaz a correção e devolve o palpite.
    const n = nivelBotao.dataset.n
    return ajustarTarefa(item, { nivel: item.nivel === n && item.corrigido ? '' : n })
  }
  if (t.closest('[data-preco-buscar]')) return carregarPreco('mercado')

  if (t.closest('[data-g-novo]')) {
    rascunho = { forma: 'barras', dimensao: 'projeto', serie: 'nenhuma', medida: 'horas', nome: '' }
    return render()
  }
  if (t.closest('[data-g-indice]')) { indiceAberto = !indiceAberto; return render() }
  if (t.closest('[data-g-cancelar]')) { rascunho = null; return render() }
  if (t.closest('[data-g-restaurar]')) return gravarGraficos(null)

  const editar = t.closest('[data-g-editar]')
  if (editar) {
    rascunho = { ...graficosAtuais().find((g) => g.id === editar.dataset.gEditar) }
    return render()
  }
  const remover = t.closest('[data-g-remover]')
  if (remover) return gravarGraficos(graficosAtuais().filter((g) => g.id !== remover.dataset.gRemover))

  if (t.closest('[data-g-salvar]')) {
    const lista = graficosAtuais()
    const salvo = { ...rascunho, id: rascunho.id || novoIdGrafico() }
    rascunho = null
    return gravarGraficos(lista.some((g) => g.id === salvo.id)
      ? lista.map((g) => (g.id === salvo.id ? salvo : g))
      : [...lista, salvo])
  }

  /* CC-74: abre e fecha os controles secundários em tela estreita. Sem estado
     guardado de propósito: é gesto de momento, e reabrir a página com o
     cabeçalho expandido devolveria o problema que isto resolve. */
  /* CC-81: o clique na pastilha mostra o que aquele item É — e, quando existe,
     as palavras dele. Não abre tela nova: é o nível de baixo da árvore (CC-75),
     e ele pediu "uma forma mais fácil de identificar" e "clicar nelas e ver o
     que é cada uma", não navegação. */
  const btRota = t.closest('[data-rota]')
  if (btRota) {
    const ocupar = Boolean(btRota.dataset.rotaOcupar)
    if (!ocupar && !confirm(`Liberar a rota "${btRota.dataset.rota}"? Se alguém ainda estiver nela, isso apaga a marca.`)) return
    btRota.disabled = true
    try {
      await fetch('/api/rotas/alternar', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          cwd: mapaProjeto?.cwd, projeto: mapaProjeto?.project,
          rota: btRota.dataset.rota, paraOcupada: ocupar,
        }),
      })
    } catch { alert('não deu para trocar a rota') }
    const q = mapaProjeto?.cwd ? `cwd=${encodeURIComponent(mapaProjeto.cwd)}` : `projeto=${encodeURIComponent(mapaProjeto.project)}`
    try { ROTAS = await (await fetch(`/api/rotas?${q}`)).json() } catch { /* mantém o que tinha */ }
    return desenharMapa()
  }

  if (t.closest('[data-frente-fechar]')) { $('#frente-pop').hidden = true; return }

  const btFrente = t.closest('[data-frente-abrir]')
  if (btFrente) return abrirFrente(btFrente)

  const btMais = t.closest('#mais-ctl')
  if (btMais) {
    const caixa = btMais.parentElement
    const aberta = caixa.classList.toggle('aberta')
    btMais.setAttribute('aria-expanded', String(aberta))
    return
  }

  if (t.closest('#n-toggle')) {
    notesOpen = !notesOpen
    localStorage.setItem('cc-notes-open', notesOpen ? '1' : '0')
    return layoutNotas()
  }

  if (t.closest('#pip-toggle')) return alternarPip()

  const cfgBtn = t.closest('#pip-config-toggle')
  if (cfgBtn) {
    const el = $('#pip-config')
    el.hidden = !el.hidden
    if (!el.hidden) {
      renderPipConfig()
      const r = cfgBtn.getBoundingClientRect()
      el.style.top = `${Math.round(r.bottom + 8)}px`
      el.style.right = `${Math.round(window.innerWidth - r.right)}px`
    }
    return
  }

  if (t.closest('#n-add')) {
    NOTES.unshift({ id: novoId(), title: '', text: '', h: 120 })
    armedNote = null
    renderNotas()
    $('#n-list .n-title')?.focus()
    return salvarNotas(true)
  }

  const modo = t.closest('[data-modo]')
  if (modo) {
    const n = NOTES.find((x) => x.id === modo.dataset.modo)
    if (!n) return
    if (n.kind === 'check') {
      n.kind = 'text' // as marcas viram "[x] " no texto: o que estava feito continua visível
    } else {
      n.kind = 'check'
      n.text = linhasDe(itensDe(n)) // normaliza: uma linha por item, sem vazias
    }
    renderNotas()
    return salvarNotas(true)
  }

  const marca = t.closest('[data-nota-check]')
  if (marca) {
    const n = NOTES.find((x) => x.id === marca.dataset.notaCheck)
    if (!n) return
    const i = +marca.dataset.i
    n.text = linhasDe(itensDe(n).map((it, k) => (k === i ? { ...it, done: !it.done } : it)))
    renderNotas()
    // o clique redesenhou a linha: devolve o foco pra quem marcou com teclado
    $(`[data-nota-check="${CSS.escape(n.id)}"][data-i="${i}"]`)?.focus()
    return salvarNotas()
  }

  const addItem = t.closest('[data-nota-add]')
  if (addItem) {
    const n = NOTES.find((x) => x.id === addItem.dataset.notaAdd)
    if (!n) return
    const itens = itensDe(n)
    n.text = linhasDe([...itens, { text: '', done: false }])
    renderNotas()
    $(`[data-nota-item="${CSS.escape(n.id)}"][data-i="${itens.length}"]`)?.focus()
    return salvarNotas()
  }

  const del = t.closest('[data-del]')
  if (del) {
    const id = del.dataset.del
    if (armedNote !== id) { armedNote = id; return renderNotas() } // primeiro clique só arma
    NOTES = NOTES.filter((n) => n.id !== id)
    armedNote = null
    renderNotas()
    return salvarNotas(true)
  }

  // F11: clicar no grupo abre a primeira aba dele, e daí em diante a navegação
  // é a de sempre. Grupo não é estado à parte: é só um atalho para uma aba.
  const grupo = t.closest('button[data-grupo]')
  if (grupo) {
    const g = GRUPOS.find((x) => x.id === grupo.dataset.grupo)
    if (!g) return
    /* CC-121: cai na primeira aba VISÍVEL do grupo. Sem isto, tocar em
       "controle" numa máquina sem VPS abriria a aba escondida, e ele veria uma
       tela vazia que nem estava no menu. */
    const temDado = DATA?.tem || null
    const disponiveis = g.abas.filter((id) => !(temDado && temDado[id] === false))
    // Se ele já está numa aba deste grupo, clicar de novo não deve tirá-lo dela.
    const alvo = g.abas.includes(tab) ? tab : (disponiveis[0] || g.abas[0])
    return trocarAba(alvo)
  }

  const agFora = t.closest('[data-agente-fora]')
  if (agFora) return abrirAgenteFora(agFora.dataset.agenteFora)

  const aba = t.closest('button[data-tab]')
  if (aba) return trocarAba(aba.dataset.tab)

  /* Trocar de visão fecha o quadrado aberto de propósito: o detalhe mora dentro
     da visão geral, e deixá-lo armado faria ele reaparecer sozinho na volta. */
  const trabVista = t.closest('[data-trab-vista]')
  if (trabVista) {
    trabalhoVista = trabVista.dataset.trabVista
    localStorage.setItem('cc-trab-vista', trabalhoVista)
    trabalhoFoco = null
    render()
    return $('#painel')?.scrollTo({ top: 0 })
  }
  /* Tocar no mesmo quadrado de novo fecha. Sem isso o detalhe não teria como
     sair da tela a não ser trocando de visão. */
  const trabFoco = t.closest('[data-trab-foco]')
  if (trabFoco) {
    const k = trabFoco.dataset.trabFoco
    trabalhoFoco = !k || trabalhoFoco === k ? null : k
    render()
    // `nearest` só rola quando precisa: tocar num quadrado da primeira fileira
    // não pode sacudir a tela, e tocar num da última não pode abrir fora dela
    return trabalhoFoco && $('.gq-det')?.scrollIntoView({ block: 'nearest' })
  }
  /* O caminho do quadradinho até o cartão inteiro: troca a visão, abre o cartão
     daquele item e rola até ele. Sem o scroll o item cairia fora da tela e o
     botão pareceria não ter feito nada. */
  const trabAbrir = t.closest('[data-trab-abrir]')
  if (trabAbrir) {
    const chave = trabAbrir.dataset.trabAbrir
    trabalhoVista = 'produto'
    localStorage.setItem('cc-trab-vista', 'produto')
    trabalhoFoco = null
    cartoesAbertos.add(chave)
    localStorage.setItem('cc-trab-abertos', JSON.stringify([...cartoesAbertos]))
    projFechados.delete(chave.split(':')[0])
    localStorage.setItem('cc-bl-fechados', JSON.stringify([...projFechados]))
    render()
    return $(`[data-trab-card="${CSS.escape(chave)}"]`)?.scrollIntoView({ block: 'center' })
  }

  const trabOrd = t.closest('[data-trab-ordem]')
  if (trabOrd) {
    trabalhoOrdem = trabOrd.dataset.trabOrdem
    localStorage.setItem('cc-trab-ordem', trabalhoOrdem)
    return carregarTrabalho(true)
  }
  // planilha ou quadradinhos: só forma de ler, nada a recarregar do servidor
  const plBt = t.closest('[data-sprint-planilha]')
  if (plBt) {
    sprintPlanilha = plBt.dataset.sprintPlanilha === '1'
    localStorage.setItem('cc-sprint-planilha', sprintPlanilha ? '1' : '0')
    return render()
  }
  const trabCard = t.closest('[data-trab-card]')
  if (trabCard) {
    const k = trabCard.dataset.trabCard
    if (cartoesAbertos.has(k)) cartoesAbertos.delete(k); else cartoesAbertos.add(k)
    localStorage.setItem('cc-trab-abertos', JSON.stringify([...cartoesAbertos]))
    return render()
  }
  const blProj = t.closest('[data-bl-proj]')
  if (blProj) {
    const p = blProj.dataset.blProj
    if (projFechados.has(p)) projFechados.delete(p); else projFechados.add(p)
    localStorage.setItem('cc-bl-fechados', JSON.stringify([...projFechados]))
    return render()
  }
  const irPara = t.closest('[data-tab-ir]')
  if (irPara) return trocarAba(irPara.dataset.tabIr)

  const ordemBtn = t.closest('[data-ordem]')
  if (ordemBtn) {
    ordemAberta = ordemBtn.dataset.ordem
    localStorage.setItem('cc-mapa-ordem', ordemAberta)
    return desenharMapa()
  }

  const bnNivel = t.closest('[data-bn-nivel]')
  if (bnNivel) return bancadaAcao({ acao: 'nivel', nivel: bnNivel.dataset.bnNivel })
  if (t.closest('[data-bn-rodar]')) return bancadaAcao({ acao: 'rodar' })
  const bnCamada = t.closest('[data-bn-camada]')
  if (bnCamada) return bancadaAcao({ acao: 'rodar', camada: bnCamada.dataset.bnCamada })

  if (t.closest('[data-doc-novo]')) return abrirEditor(null)
  if (t.closest('[data-doc-voltar]')) { docAberto = null; docCorpo = null; docArmado = null; return render() }
  if (t.closest('[data-doc-cancelar]')) return $('#doc-edit').close()
  if (t.closest('[data-doc-salvar]')) return salvarDoc()

  const docAbrir = t.closest('[data-doc-abrir]')
  if (docAbrir) return abrirDoc(docAbrir.dataset.docAbrir)

  const docEditar = t.closest('[data-doc-editar]')
  if (docEditar) return abrirEditor(docCorpo)

  const docApagar = t.closest('[data-doc-apagar]')
  if (docApagar) {
    const id = docApagar.dataset.docApagar
    if (docArmado !== id) { docArmado = id; return render() }  // primeiro clique so arma
    await fetch('/api/docs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ apagar: id }),
    })
    docArmado = null; docAberto = null; docCorpo = null
    return carregarDocs(true)
  }

  const agDias = t.closest('[data-ag-dias]')
  if (agDias) {
    agendaDias = +agDias.dataset.agDias
    localStorage.setItem('cc-agenda-dias', agendaDias)
    return carregarAgenda(true)
  }

  if (t.closest('[data-ag-atualizar]')) return carregarAgenda(true)

  if (t.closest('[data-ag-config]')) {
    agendaConfigAberta = !agendaConfigAberta
    return render()
  }

  if (t.closest('[data-ag-salvar]')) return salvarCalendario()

  const agRemover = t.closest('[data-ag-remover]')
  if (agRemover) return removerCalendario(agRemover.dataset.agRemover)

  const verPainel = t.closest('[data-painel-ver]')
  if (verPainel && !t.closest('button, a')) {
    painelAtivo = verPainel.dataset.painelVer
    localStorage.setItem('cc-painel', painelAtivo)
    render()
    return
  }

  const ligar = t.closest('[data-painel-ligar]')
  if (ligar) {
    ligar.disabled = true
    ligar.textContent = 'ligando…'
    acaoPainel(ligar.dataset.painelLigar, 'ligar')
    return
  }

  const desligar = t.closest('[data-painel-desligar]')
  if (desligar) {
    desligar.disabled = true
    desligar.textContent = 'desligando…'
    acaoPainel(desligar.dataset.painelDesligar, 'desligar')
    return
  }

  const pip = t.closest('[data-painel-pip]')
  if (pip) {
    abrirPiP(pip.dataset.painelPip)
    return
  }

  const leg = t.closest('[data-legenda]')
  if (leg) {
    const id = leg.dataset.legenda
    legendaAberta.has(id) ? legendaAberta.delete(id) : legendaAberta.add(id)
    const lista = $('.leg-lista')
    if (lista) lista.innerHTML = viewLegendaEscritorio(filtered())
    return
  }

  const projTempo = t.closest('[data-tempo-proj]')
  if (projTempo) {
    const nome = projTempo.dataset.tempoProj
    tempoAberto.has(nome) ? tempoAberto.delete(nome) : tempoAberto.add(nome)
    return render()
  }

  if (t.closest('[data-tempo-recarregar]')) return carregarTempo('reler')
  if (t.closest('[data-tempo-limpar]')) {
    tempoParams.de = tempoParams.ate = ''
    return carregarTempo(true)
  }

  if (t.closest('.d-close') || t.id === 'scrim') { selected = null; return render() }

  const sort = t.closest('[data-sort]')
  if (sort) {
    const campo = sort.dataset.sort
    // mesma coluna de novo inverte; coluna nova começa do maior pro menor
    if (campo && campo === ordem.campo) ordem.desc = !ordem.desc
    else { ordem.campo = campo; ordem.desc = true }
    localStorage.setItem('cc-ordem', JSON.stringify(ordem))
    return render()
  }

  const acao = t.closest('button[data-act]')
  if (acao) {
    e.stopPropagation() // não abrir o painel lateral junto
    return executarAcao(acao)
  }

  const zone = t.closest('button[data-zone]')
  if (zone) {
    const k = zone.dataset.zone
    collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k)
    localStorage.setItem('cc-collapsed', JSON.stringify([...collapsed]))
    return render()
  }

  if (t.closest('[data-processos-atualizar]')) return carregarProcessos(true)

  // As três ações da aba de rotinas. A chave carrega pasta + nome juntos
  // porque o mesmo nome de rotina existe em vários projetos.
  const rtVer = t.closest('[data-rt-ver]')
  if (rtVer) return verRotina(...rtVer.dataset.rtVer.split('|'))
  const rtSync = t.closest('[data-rt-sync]')
  if (rtSync) {
    const [dir, nome] = rtSync.dataset.rtSync.split('|')
    return acaoRotina(dir, nome, 'sincronizar', dir.split(/[\\/]/).pop())
  }
  const rtDel = t.closest('[data-rt-del]')
  if (rtDel) {
    const [dir, nome] = rtDel.dataset.rtDel.split('|')
    return acaoRotina(dir, nome, 'remover', dir.split(/[\\/]/).pop())
  }

  /* O "?" é o único lugar onde a explicação fica escondida, e existe só onde
     a tradução não coube no próprio texto. Alerta simples de propósito: quem
     clica quer ler uma frase, não abrir um painel. */
  const btAjuda = t.closest('[data-ajuda]')
  if (btAjuda) return alert(btAjuda.dataset.ajuda)

  if (t.closest('[data-digest]')) return alternarDigest()

  /* "ligar" e "mais uma" são o mesmo caminho: a diferença é `mais`, que faz o
     servidor escolher um rótulo livre em vez de devolver a sessão existente. */
  const btLigar = t.closest('[data-remoto-ligar]') || t.closest('[data-remoto-mais]')
  if (btLigar) {
    const mais = Boolean(btLigar.dataset.remotoMais)
    const projeto = btLigar.dataset.remotoMais || btLigar.dataset.remotoLigar
    btLigar.disabled = true
    btLigar.textContent = 'abrindo…'
    try {
      const r = await fetch('/api/remote-control', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ projeto, cwd: btLigar.dataset.remotoDir, mais }),
      })
      const out = await r.json()
      if (!out.ok) alert(out.error || out.erro)
      /* A tela da sessão nova vai para o alerta, e não é enfeite: subir sem
         olhar já deu "ligado" com processo morto por trás neste projeto. É
         também onde ele vê a pergunta de permissão que o painel não responde
         por ele. */
      else if (out.tela) alert(`${out.rotulo || projeto}\n\n${out.tela}`)
    } catch {
      alert('não deu pra abrir')
    }
    return carregarRemoto(true)
  }

  const btDesligar = t.closest('[data-remoto-desligar]')
  if (btDesligar) {
    if (!confirm(`Desligar a sessão remota de "${btDesligar.dataset.remotoDesligar}"? A conexão do celular cai junto.`)) return
    await fetch('/api/remote-control', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ projeto: btDesligar.dataset.remotoDesligar, acao: 'desligar' }),
    })
    return carregarRemoto(true)
  }

  const btLink = t.closest('[data-remoto-link]')
  if (btLink) {
    const texto = btLink.textContent
    btLink.textContent = 'buscando…'
    try {
      const r = await fetch('/api/remote-control', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ projeto: btLink.dataset.remotoLink, acao: 'link' }),
      })
      const out = await r.json()
      if (out.ok && out.url) {
        try { await navigator.clipboard.writeText(out.url) } catch { /* sem permissão de clipboard: mostra na tela mesmo */ }
        btLink.textContent = out.url
      } else {
        btLink.textContent = out.erro || out.error || 'sem link'
      }
    } catch {
      btLink.textContent = 'falhou'
    }
    setTimeout(() => { btLink.textContent = texto }, 4000)
    return
  }

  const btEnriquecer = t.closest('[data-enriquecer]')
  if (btEnriquecer) {
    const id = btEnriquecer.dataset.enriquecer
    btEnriquecer.disabled = true
    btEnriquecer.textContent = 'pedindo…'
    try {
      const r = await fetch('/api/enriquecer', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ job: id }),
      })
      const out = await r.json()
      if (!out.ok) alert(out.error)
    } catch {
      alert('não deu pra falar com o opencode')
    }
    return // o stream de 2s traz o meta.json atualizado, sem forçar recarga
  }

  const visitaBtn = t.closest('[data-visita]')
  if (visitaBtn) {
    // O cockpit vem embutido no stream de 2s (DATA.cockpit), não numa rota
    // própria — não precisa forçar recarga, o próximo tique já traz o delta
    // zerado. `/api/visita` só grava.
    return fetch('/api/visita', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ projeto: visitaBtn.dataset.visita }),
    })
  }

  const meuMarcar = t.closest('[data-meu-marcar]')
  if (meuMarcar) {
    return acaoMeu({ acao: 'marcar', id: meuMarcar.dataset.meuMarcar, feito: meuMarcar.dataset.meuFeito === '1' })
  }
  const meuRemover = t.closest('[data-meu-remover]')
  if (meuRemover) return acaoMeu({ acao: 'remover', id: meuRemover.dataset.meuRemover })
  if (t.closest('[data-meu-add]')) {
    const texto = $('#meu-txt')?.value
    if (!texto?.trim()) return
    return acaoMeu({ texto, projeto: $('#meu-proj')?.value || null })
  }

  if (t.closest('[data-fw-lista]')) return abrirFrameworkLista()
  if (t.closest('[data-hk-provar]')) return provarHooks()
  if (t.closest('[data-fila-perdida]')) return carregarFilaPerdida()
  if (t.closest('[data-vi-tudo]')) {
    return fetch('/api/vi-tudo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' })
      .then(() => carregarTrabalho(true))
  }

  if (t.closest('[data-fed-ver]')) {
    const campo = $('#fed-token')
    campo.type = campo.type === 'password' ? 'text' : 'password'
    return
  }
  if (t.closest('[data-fed-gerar]')) {
    // Gerado no navegador: não precisa de rota nova, e o valor só sai daqui
    // dentro do POST que grava. 24 bytes viram 32 caracteres.
    const bytes = crypto.getRandomValues(new Uint8Array(24))
    $('#fed-token').value = btoa(String.fromCharCode(...bytes)).replace(/[+/=]/g, '').slice(0, 32)
    $('#fed-token').type = 'text'
    return
  }
  if (t.closest('[data-fed-salvar]')) return salvarFederacao()
  if (t.closest('[data-fed-enviar]')) {
    const btn = t.closest('[data-fed-enviar]')
    btn.disabled = true
    return fetch('/api/federacao/enviar', { method: 'POST' })
      .then((r) => r.json())
      .then((r) => { alert(r.ok ? 'enviado' : `não deu: ${r.erro || r.status}`); return carregarFederacao() })
      .catch(() => { btn.disabled = false })
  }

  // CC-115: o interruptor de um grupo de proteção num projeto. Desligar pede
  // confirmação com o que se perde; religar é imediato, voltar ao seguro não
  // precisa de fricção.
  const modBtn = t.closest('[data-mod]')
  if (modBtn) {
    const ligar = modBtn.dataset.modOn === '1'
    const rotulo = modBtn.textContent.replace(' ✕', '').trim()
    if (!ligar && !confirm(`Desligar as proteções de ${rotulo} no projeto ${modBtn.dataset.modProj}?\n\n`
      + `· ${modBtn.title}\n· nenhum aviso ou trava desse grupo vai disparar lá\n· religa neste mesmo botão`)) return
    fetch('/api/modulos', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ projeto: modBtn.dataset.modProj, modulo: modBtn.dataset.mod, ligado: ligar }),
    }).then(() => { FW_LISTA = null; abrirFrameworkLista() })
    return
  }
  // CC-143: criar projeto novo
  if (t.closest('[data-novo-proj]')) return abrirNovoProjeto()
  if (t.closest('[data-novo-criar]')) {
    /* O valor sai do DOM se ele ainda estiver lá, e da variável quando o
       redesenho já levou o campo. Mesma regra do campo da entrevista. */
    for (const el of document.querySelectorAll('[data-novo-campo]')) NOVO_FORM[el.dataset.novoCampo] = el.value
    return criarProjeto()
  }

  /* CC-133: a entrevista. Os quatro cliques dela, e nenhum deles depende do
     texto estar no DOM: o rascunho é lido da variável quando o campo já morreu
     no redesenho, que é o caso normal quando o clique vem depois do blur. */
  const entAbrir = t.closest('[data-ent-abrir]')
  if (entAbrir) return abrirEntrevista(entAbrir.dataset.entAbrir)

  if (t.closest('[data-ent-fechar]')) { ENTREVISTA = null; return render() }

  const entOp = t.closest('[data-ent-op]')
  if (entOp && ENTREVISTA?.proxima) {
    return mandarEntrevista({ acao: 'responder', id: ENTREVISTA.proxima.id, texto: entOp.dataset.entOp })
  }

  if (t.closest('[data-ent-responder]') && ENTREVISTA?.proxima) {
    const texto = ($('[data-ent-campo]')?.value ?? ENTREVISTA_RASCUNHO).trim()
    if (!texto) return alert('escreva a resposta, ou toque numa das opções')
    return mandarEntrevista({ acao: 'responder', id: ENTREVISTA.proxima.id, texto })
  }

  const entVoltar = t.closest('[data-ent-voltar]')
  if (entVoltar) {
    /* A confirmação diz o que se perde, como a de desligar proteção: apagar uma
       resposta apaga junto as que só existiam por causa dela, e descobrir isso
       depois do clique é o tipo de surpresa que o quadro de rotas já custou. */
    if (!confirm('Apagar esta resposta?\n\n'
      + '· a pergunta volta a ser feita\n'
      + '· o que só existia por causa dela sai junto, e a tela diz o que saiu')) return
    return mandarEntrevista({ acao: 'desfazer', id: entVoltar.dataset.entVoltar })
  }

  const fwBtn = t.closest('[data-fw]')
  if (fwBtn) {
    const projeto = fwBtn.dataset.fwProj
    const acao = fwBtn.dataset.fw
    /* CC-91: a confirmação diz o que vai acontecer, não só pergunta "tem
       certeza?". Ele apertou esse botão por engano em 15/08 justamente porque
       ele era imediato demais e não explicava nada. */
    /* Um arquivo só ou tudo: a confirmação tem que dizer QUAL, porque a
       diferença entre os dois é o modo funcionar ou virar decoração. */
    const alvoPedido = fwBtn.dataset.fwAlvo
    if (acao === 'autorizar' && !confirm(alvoPedido
      ? `Liberar a IA para escrever em ${alvoPedido}?\n\n`
        + '· vale só para este arquivo\n'
        + '· vale até você trocar de modo'
      : `Liberar a IA para escrever código em ${projeto}?\n\n`
        + '· vale para TODOS os arquivos de código do projeto\n'
        + '· vale até você trocar de modo, trocar zera esta autorização\n'
        + '· documentação e backlog nunca estiveram travados',
    )) return
    // Diferente do "vi isso": o framework NÃO vem no stream de 2s (é leitura de
    // disco por projeto), então a resposta do POST é a única atualização que
    // esta tela vai receber. Guardar o retrato devolvido é obrigatório.
    fwBtn.disabled = true
    return fetch('/api/framework', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ projeto, acao, alvo: fwBtn.dataset.fwAlvo || undefined }),
    }).then((r) => r.json()).then((f) => {
      if (f.error) { alert(f.error); FRAMEWORKS.delete(projeto) } else FRAMEWORKS.set(projeto, f)
      // A lista aberta mostra o mesmo projeto: atualizar as duas, senão o
      // cartão diz "ligado" e a lista logo acima continua dizendo "sem framework".
      if (Array.isArray(FW_LISTA) && !f.error) {
        FW_LISTA = FW_LISTA.map((p) => (p.projeto === projeto ? { ...p, ...f } : p))
      }
      render()
    }).catch(() => { FRAMEWORKS.delete(projeto); render() })
  }

  if (t.closest('[data-vps-config]')) { vpsConfigAberto = !vpsConfigAberto; return render() }
  if (t.closest('[data-vps-salvar]')) return salvarVpsConfig()
  if (t.closest('[data-vps-atualizar]') && !vpsAtualizando) return atualizarVps()

  const srvAba = t.closest('button[data-srv-modo]')
  if (srvAba) {
    srvModo = srvAba.dataset.srvModo
    localStorage.setItem('cc-srv-modo', srvModo)
    return render()
  }

  const srvAbrirNovo = t.closest('button[data-srv-novo]')
  if (srvAbrirNovo) {
    srvNovo = !srvNovo
    render()
    if (srvNovo) carregarProjetos()
    return
  }

  const fav = t.closest('[data-srv-fav]')
  if (fav) {
    const chave = fav.dataset.srvFav
    const atual = SERVERS.find((s) => s.chave === chave)
    return salvarServidor(chave, { favorito: !atual?.favorito })
  }

  // Apelido e explicação usam prompt de propósito: campo de texto dentro do
  // #main sumiria no meio da digitação, porque render() reescreve o painel a
  // cada evento do stream.
  const renomear = t.closest('button[data-srv-nome]')
  if (renomear) {
    const chave = renomear.dataset.srvNome
    const atual = SERVERS.find((s) => s.chave === chave)
    const nome = prompt('Como você chama este servidor?', atual?.apelido || atual?.titulo || '')
    if (nome === null) return
    return salvarServidor(chave, { apelido: nome })
  }

  const explicar = t.closest('button[data-srv-nota]')
  if (explicar) {
    const chave = explicar.dataset.srvNota
    const atual = SERVERS.find((s) => s.chave === chave)
    const nota = prompt('O que este servidor abre? (fica no cartão)', atual?.nota || '')
    if (nota === null) return
    return salvarServidor(chave, { nota })
  }

  const abrir = t.closest('button[data-abrir]')
  if (abrir) {
    const r = await fetch('/api/abrir', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ dir: abrir.dataset.abrir, como: abrir.dataset.como }),
    })
    const out = await r.json()
    if (!out.ok) alert(out.error)
    return
  }

  const copiar = t.closest('button[data-copiar]')
  if (copiar) {
    await navigator.clipboard.writeText(copiar.dataset.copiar)
    copiar.textContent = 'copiado'
    setTimeout(() => { copiar.textContent = 'copiar caminho' }, 1200)
    return
  }

  const dedup = t.closest('button[data-dedup]')
  if (dedup) {
    if (!srvDedup) { srvDedup = true; return render() } // primeiro clique só arma
    srvDedup = false
    dedup.disabled = true
    // em série, e não em paralelo: cada morte invalida a lista do lado do
    // servidor, e é ela que autoriza a próxima
    for (const pid of DUPLICADOS.flatMap((g) => g.matar)) {
      const r = await fetch('/api/kill', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pid }),
      })
      const out = await r.json()
      if (!out.ok) alert(out.error)
    }
    return carregarServidores(true)
  }

  const subir = t.closest('button[data-subir-cwd]')
  if (subir) {
    const cwd = subir.dataset.subirCwd
    const comando = prompt(`Subir o quê em ${cwd}?`, subir.dataset.subirCmd || 'npm run dev')
    if (!comando) return
    subir.disabled = true
    const r = await fetch('/api/subir', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ cwd, comando }),
    })
    const out = await r.json()
    subir.disabled = false
    if (!out.ok) return alert(out.error)
    // o servidor leva alguns segundos pra abrir a porta; sem espera a lista
    // voltaria igual e pareceria que nada aconteceu
    setTimeout(() => carregarServidores(true), 4000)
    return
  }

  const kill = t.closest('button[data-kill]')
  if (kill) {
    const pid = Number(kill.dataset.kill)
    if (armed !== pid) { armed = pid; return render() } // primeiro clique só arma
    armed = null
    kill.disabled = true
    const r = await fetch('/api/kill', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pid }),
    })
    const out = await r.json()
    if (!out.ok) alert(out.error)
    SERVERS = null
    return carregarServidores(true)
  }

  const add = t.closest('button[data-add]')
  if (add) {
    const job = byId(add.dataset.add)
    if (!job) return
    job.todos = [...job.todos, { text: '', done: false }]
    render()
    // Foca pelo índice, nunca pelo último campo do DOM: as concluídas ficam
    // depois das abertas dentro do <details>, então "o último da tela" seria
    // uma tarefa já existente — e digitar em cima apagaria ela.
    const i = job.todos.length - 1
    document.querySelector(`.txt[data-edit="${CSS.escape(job.id)}"][data-i="${i}"]`)?.focus()
    return
  }

  const feitos = t.closest('details[data-feitos] > summary')
  if (feitos) {
    const id = feitos.parentElement.dataset.feitos
    feitosAbertos.has(id) ? feitosAbertos.delete(id) : feitosAbertos.add(id)
    localStorage.setItem('cc-feitos', JSON.stringify([...feitosAbertos]))
    return // o <details> abre sozinho, sem redesenhar
  }

  const linha = t.closest('[data-job]')
  if (linha && !t.matches('input, a')) {
    const id = linha.dataset.job
    selected = selected === id ? null : id
    return render()
  }
})

document.addEventListener('keydown', (e) => {
  /* Esc fecha o popover da frente ANTES de mexer na seleção: ele é o que está
     por cima, e é o que o Esc deve fechar primeiro. */
  const pop = $('#frente-pop')
  if (e.key === 'Escape' && pop && !pop.hidden) { pop.hidden = true; return }
  if (e.key === 'Escape' && selected) { selected = null; return render() }
  if (e.key !== 'Enter' && e.key !== ' ') return
  if (e.target.matches?.('input, textarea, select')) return // espaço é espaço dentro do campo
  const alvo = e.target.closest?.('[data-job]')
  if (!alvo) return
  e.preventDefault()
  alvo.click()
})

document.addEventListener('change', (e) => {
  const rasc = e.target.closest('[data-rasc]')
  if (rasc && rascunho) {
    rascunho[rasc.dataset.rasc] = rasc.value
    return render()
  }

  const cb = e.target.closest('input[data-todo]')
  if (cb) return toggleTodo(cb.dataset.todo, +cb.dataset.i, cb.checked)

  /* Estava sem tratador nenhum desde que nasceu: a caixinha marcava na tela e
     o próximo tique do stream desmarcava, sem nada ter sido gravado. Controle
     morto numa lista de pendências é o pior defeito possível aqui, porque ele
     acredita ter fechado o que continua aberto. */
  const meuCb = e.target.closest('input[data-meu-check]')
  if (meuCb) {
    return acaoMeu({ acao: 'marcar', id: meuCb.dataset.meuCheck, feito: meuCb.checked })
      // a lista de pendências desta tela vem do /api/trabalho, não do /api/meu:
      // sem recarregar as duas, o item marcado ficaria na tela até o próximo F5
      .then(() => carregarTrabalho(true))
  }

  // `change` só dispara ao sair do campo ou no Enter — uma gravação por
  // edição, não uma por tecla
  const campo = e.target.closest('.txt[data-edit]')
  if (campo) return editarTodo(campo.dataset.edit, +campo.dataset.i, campo.value)

  const nota = e.target.closest('[data-nota-job]')
  if (nota) return editarNotaDoAgente(nota.dataset.notaJob, nota.value)

  const taxa = e.target.closest('[data-taxa]')
  if (taxa) return salvarTaxa(taxa.dataset.projeto || null, taxa.value)

  const cambio = e.target.closest('[data-cambio]')
  if (cambio) return salvarCambio(cambio.value)

  const assin = e.target.closest('[data-assinatura]')
  if (assin) return salvarNumero('/api/assinatura', assin.value)

  const un = e.target.closest('[data-preco="unidade"]')
  if (un) {
    precoUnidade = un.value
    localStorage.setItem('cc-preco-unidade', precoUnidade)
    precoAberta = null
    return carregarPreco(true)
  }
  const horasCampo = e.target.closest('[data-preco-horas]')
  if (horasCampo) {
    const item = PRECO.tarefas.find((x) => chaveDe(x) === horasCampo.dataset.precoHoras)
    return ajustarTarefa(item, { horas: Number(horasCampo.value) || 0 })
  }
  // Digitar um valor/hora congela os três: buscar de novo sobrescreveria o que
  // o Felipe escolheu, então a marca de manual vale para a tabela inteira.
  const mercadoCampo = e.target.closest('[data-mercado]')
  if (mercadoCampo) {
    const v = Math.max(0, Number(mercadoCampo.value) || 0)
    const faixa = (n) => (n === mercadoCampo.dataset.mercado
      ? { min: v, max: v }
      : { min: PRECO.valorHora[n], max: PRECO.valorHora[n] })
    return fetch('/api/mercado', {
      method: 'POST',
      body: JSON.stringify({
        junior: faixa('junior'), pleno: faixa('pleno'), senior: faixa('senior'),
        fonte: 'você digitou',
      }),
    }).then(() => carregarPreco(true))
  }

  const ctl = e.target.closest('[data-tempo]')
  if (ctl) {
    tempoParams[ctl.dataset.tempo] = ctl.value
    if (ctl.dataset.tempo === 'corte') localStorage.setItem('cc-corte', ctl.value)
    carregarTempo(true) // o corte é recalculado do cache, não relê os arquivos
  }
})

/** Confirma no próprio botão, sem redesenhar a linha inteira nem usar alerta. */
function piscar(botao, texto) {
  const antes = botao.textContent
  botao.textContent = texto
  setTimeout(() => { botao.textContent = antes }, 1200)
}

async function copiar(botao, texto) {
  try {
    await navigator.clipboard.writeText(texto)
    piscar(botao, '✓')
  } catch {
    piscar(botao, '✕')
  }
}

async function executarAcao(botao) {
  const job = byId(botao.dataset.id)
  if (!job) return
  const acao = botao.dataset.act

  if (acao === 'resume') return copiar(botao, `claude --resume ${job.sessionId}`)
  if (acao === 'path') return copiar(botao, job.worktreePath || job.cwd)

  if (acao === 'pin') {
    // pin do CLI é só leitura: aqui só se mexe no que o painel escreveu
    if (job.pinned && !job.pinnedAqui) return
    const novo = !job.pinnedAqui
    job.pinned = novo
    job.pinnedAqui = novo
    render()
    await fetch('/api/meta', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: job.id, patch: { pin: novo || null } }),
    })
  }
}

/** Nota vazia some do meta.json: `null` no patch apaga o campo. */
async function editarNotaDoAgente(jobId, texto) {
  const job = byId(jobId)
  if (!job) return
  const limpo = texto.trim()
  if (limpo === (job.notes || '')) return
  job.notes = limpo
  await fetch('/api/meta', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: jobId, patch: { notes: limpo || null } }),
  })
}

// saiu do campo: o que o stream mandou durante a digitação entra agora
// (o setTimeout existe porque no focusout o foco ainda está no ar)
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (editando()) return
    if (dadosPendentes) {
      const d = dadosPendentes
      dadosPendentes = null
      return aplicarDados(d)
    }
    if (redesenhoAdiado) render()
  }, 0)
})

async function gravarTodos(job, todos) {
  job.todos = todos
  job.todosDone = todos.filter((t) => t.done).length
  render()
  await fetch('/api/meta', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: job.id, patch: { todos } }),
  })
}

function toggleTodo(jobId, i, valor) {
  const job = byId(jobId)
  if (!job || !job.todos[i]) return
  gravarTodos(job, job.todos.map((t, k) => (k === i ? { ...t, done: valor ?? !t.done } : t)))
}

/** Texto em branco apaga a tarefa — é o jeito de desfazer um "+" sem outro botão. */
function editarTodo(jobId, i, texto) {
  const job = byId(jobId)
  if (!job || !job.todos[i]) return
  const limpo = texto.trim()
  if (limpo === job.todos[i].text) return
  gravarTodos(job, limpo
    ? job.todos.map((t, k) => (k === i ? { ...t, text: limpo } : t))
    : job.todos.filter((_, k) => k !== i))
}

for (const el of ['#q', '#proj', '#maq']) $(el).addEventListener('input', render)
// a bancada é POR PROJETO: trocar o filtro sem reler mostraria o veredito do
// projeto anterior com o nome do novo, que é pior que não mostrar nada
$('#proj').addEventListener('change', () => { if (tab === 'bancada') carregarBancada(true) })

// A busca do glossário e os campos de "meu" vivem dentro do #main, que o
// render() reescreve a cada evento do stream. Por isso o listener é delegado no
// documento e o valor digitado fica numa variável: um listener preso ao
// elemento morreria no primeiro redesenho, e o texto sumiria enquanto ele
// digita — o mesmo motivo pelo qual as notas moram fora do #main.
document.addEventListener('input', (e) => {
  if (e.target?.id === 'gl-q') { glossarioBusca = e.target.value; render(); $('#gl-q')?.focus() }
  if (e.target?.id === 'doc-q') { docsBusca = e.target.value; render(); $('#doc-q')?.focus() }
  /* CC-133: guarda o que ele digita, e NÃO redesenha. É a diferença entre este
     campo e os dois de cima: aqui o texto pode ser longo (a resposta de "o que
     é pronto" costuma ter três linhas), e redesenhar a cada tecla numa lista
     de vinte projetos custaria caro sem ganhar nada. O valor volta para o
     campo no próximo desenho, venha ele de onde vier. */
  if (e.target?.matches?.('[data-ent-campo]')) ENTREVISTA_RASCUNHO = e.target.value
  // CC-143: os campos do projeto novo, pela mesma razão
  if (e.target?.matches?.('[data-novo-campo]')) NOVO_FORM[e.target.dataset.novoCampo] = e.target.value
})

// Trocar o modo do framework é `change` num <select>, não clique num botão, e
// por isso não entra no delegador de cliques lá de cima.
document.addEventListener('change', (e) => {
  const sel = e.target?.closest?.('[data-fw-modo]')
  if (!sel) return
  const projeto = sel.dataset.fwModo
  /* O mesmo seletor serve para os dois: opção de profissão vem marcada com
     `perfil:`, e o resto é modo cru. Um seletor só, porque do lado dele é a
     mesma pergunta: quem trabalha neste projeto agora. */
  const ehPerfil = sel.value.startsWith('perfil:')
  const pedido = ehPerfil ? sel.value.slice(7) : sel.value
  CONFIRMA_FW.delete(projeto) // some a confirmação anterior antes de pedir a nova
  fetch('/api/framework', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(ehPerfil
      ? { projeto, acao: 'perfil', perfil: pedido }
      : { projeto, acao: 'modo', modo: pedido }),
  }).then((r) => r.json()).then(async (f) => {
    if (f.error) { alert(f.error); return render() }
    FRAMEWORKS.set(projeto, f)
    if (Array.isArray(FW_LISTA)) FW_LISTA = FW_LISTA.map((p) => (p.projeto === projeto ? { ...p, ...f } : p))

    /* CC-91: relê o estado do SERVIDOR e compara com o que foi pedido. A
       resposta do POST diz o que o painel achou que gravou; esta segunda leitura
       diz o que está no arquivo. Duas vezes em 15/08 ele trocou o modo, a tela
       confirmou, e o `.framework/estado.json` continuava o mesmo. */
    const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    try {
      const conferido = await (await fetch(`/api/framework?projeto=${encodeURIComponent(projeto)}`)).json()
      // a conferência olha o campo certo: perfil quando foi perfil, modo quando
      // foi modo. Sem isso, escolher uma profissão daria "salvo" com aviso de erro
      const gravado = ehPerfil ? conferido.perfil : conferido.modo
      const nome = ehPerfil
        ? (conferido.perfis || []).find((x) => x.id === gravado)?.titulo || gravado
        : conferido.tituloModo || gravado
      CONFIRMA_FW.set(projeto, gravado === pedido
        ? { real: nome, hora }
        : { erro: true, pedido, real: gravado || 'nada' })
      FRAMEWORKS.set(projeto, conferido)
    } catch {
      CONFIRMA_FW.set(projeto, { erro: true, pedido, real: 'não consegui conferir' })
    }
    render()
  }).catch(() => render())
})
// A máquina escolhida sobrevive ao recarregar, igual à aba: é preferência de
// quem olha, não estado do dado.
$('#maq').addEventListener('change', (e) => localStorage.setItem('cc-maquina', e.target.value))
// Volume: `input` move a barra ao vivo, `change` é que grava. Enquanto o dedo
// está na barra, o redesenho fica travado — senão o stream devolveria o valor
// antigo no meio do arrasto e a barra pularia para trás.
$player().addEventListener('pointerdown', (e) => { if (e.target.matches('[data-vol]')) arrastandoVolume = true })
$player().addEventListener('input', (e) => {
  if (!e.target.matches('[data-vol]')) return
  const rotulo = $player().querySelector('.p-vol b')
  if (rotulo) rotulo.textContent = `${e.target.value}%`
})
$player().addEventListener('change', (e) => {
  if (!e.target.matches('[data-vol]')) return
  arrastandoVolume = false
  const s = sessaoAtual()
  if (s?.pid) mandarMidia({ pid: s.pid, nivel: Number(e.target.value) }, 'volume')
})

// O menu só pode ser montado agora: no head, o <select> ainda não existia.
$('#tema-sel').innerHTML = '<option value="auto">tema: automático</option>'
  + TEMAS.map((t) => `<option value="${t.id}">tema: ${t.nome}</option>`).join('')
$('#tema-sel').addEventListener('change', (e) => {
  temaModo = e.target.value
  localStorage.setItem('cc-tema', temaModo)
  aplicarTema()
})
aplicarTema()

// ?static=1 não abre o SSE: com a conexão pendurada, captura headless nunca
// considera a página carregada. Serve pra screenshot e impressão.
if (!params.has('static')) {
  new EventSource('/events').onmessage = (e) => aplicarDados(JSON.parse(e.data))
}
fetch('/api/jobs').then((r) => r.json()).then((d) => {
  DATA = d
  render()
  // Mesma lista da troca de aba, chamada de um lugar só: aba nova precisa ser
  // lembrada uma vez, não três.
  carregarDaAba()
  if (tab === 'servidores') carregarProcessos()
  if (srvNovo) carregarProjetos()
})

carregarPip()
// servidores é bloco possível do PiP, então precisa de dado mesmo com a aba
// fechada — o cache de 15s no servidor evita que isto pese a varredura de portas
carregarServidores()
if (!params.has('static')) setInterval(() => carregarServidores(true), 20000)

// Abrir direto na aba de rotinas/remoto (link salvo, ou `?tab=` da captura)
// precisa de uma leitura aqui: as outras chegam pelo stream, e com `static`
// ele nem existe, e a aba ficaria em "carregando…" para sempre.
if (tab === 'rotinas') carregarRotinas()
if (tab === 'remoto') carregarRemoto()

fetch('/api/graficos').then((r) => r.json()).then((d) => {
  GRAFICOS = d.graficos
  if (tab === 'graficos') render()
})

layoutNotas()
fetch('/api/notes').then((r) => r.json()).then((d) => { NOTES = d.notes || []; renderNotas() })

// A mídia tem ritmo próprio: não vem no stream porque cada leitura custa ~500ms
// no Windows, e o tique de 2s dos agentes não pode esperar por isso.
carregarMidia()
carregarMaquina()
carregarDocker()
// carregarProcessos() NÃO entra aqui: é caro (segundos, não ms) e só roda
// sob demanda — ver a função.
// Em `static` ficam na leitura única: o intervalo manteria a captura headless
// esperando para sempre, pelo mesmo motivo que o SSE fica desligado lá.
if (!params.has('static')) {
  setInterval(carregarMidia, 4000)
  setInterval(carregarMaquina, 5000)
  setInterval(carregarDocker, 10000)
}
</script>
