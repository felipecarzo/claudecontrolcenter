        TEMPO.cambio.brlPorUsd ? brl(totalUsd * TEMPO.cambio.brlPorUsd) : usd(totalUsd)}</span>
      <span class="v path">${!totalMs ? '' : (() => {
        const porHora = totalUsd / (totalMs / 36e5)
        return TEMPO.cambio.brlPorUsd ? brl(porHora * TEMPO.cambio.brlPorUsd) + '/h' : usd(porHora) + '/h'
      })()}</span>
      ${comReal ? `<span class="v real">${brl(TEMPO.projetos.reduce((a, p) => a + (p.custoReal || 0), 0))}</span>` : ''}
      ${comValor ? `<span class="v val">${brl(totalValor)}</span>` : ''}
      ${comSobra ? (() => {
        const s = TEMPO.projetos.reduce((a, p) => a + (p.sobra || 0), 0)
        return `<span class="v ${s >= 0 ? 'ok' : 'ruim'}">${brl(s)}</span>`
      })() : ''}
    </div>`
}

/* ======================== aba: gráficos ======================
   Os dados são os mesmos da aba de tempo — nada é lido de novo. O que muda é
   que aqui eles viram fatos soltos, que o motor em graficos.js cruza. */

let GRAFICOS = null          // null = nunca mexeu, mostra os prontos
// ?novo=1 e ?indice=1 abrem o construtor e o índice já na carga — sem eles não
// dá pra conferir nenhum dos dois numa captura de tela.
let rascunho = params.has('novo')
  ? { forma: 'barras', dimensao: 'projeto', serie: 'nenhuma', medida: 'horas', nome: '' }
  : null
let indiceAberto = params.has('indice')

/** Um id curto e estável, para o cartão sobreviver a reordenar e reeditar. */
const novoIdGrafico = () => 'g' + Math.random().toString(36).slice(2, 8)

const graficosAtuais = () => GRAFICOS
  || CCGraficos.PRONTOS.map((g) => ({ ...g, id: novoIdGrafico() }))

/**
 * As duas tabelas de fatos. `tempo` carrega a taxa e o custo/hora do mês junto
 * de cada linha: assim o motor calcula valor e sobra sem saber de configuração.
 */
function fatosDe(T) {
  const custoHoraMes = Object.fromEntries((T.meses || []).map((m) => [m.mes, m.custoHora]))
  const cambio = T.cambio.brlPorUsd || 0
  const tempo = []
  const uso = []
  for (const p of T.projetos) {
    for (const d of p.dias) {
      tempo.push({
        projeto: p.projeto, dia: d.dia, ms: d.ativoMs,
        taxaHora: p.taxaHora || 0,
        custoHoraMes: custoHoraMes[d.dia.slice(0, 7)] || 0,
      })
    }
    for (const u of p.usoDias || []) {
      // Converte aqui e não no motor: o motor não deve saber de moeda.
      uso.push({ ...u, projeto: p.projeto, custo: (u.custo || 0) * (cambio || 1) })
    }
  }
  return { tempo, uso }
}

const fmtG = (v, tipo) => {
  if (tipo === 'horas') return horas(v * 36e5)
  if (tipo === 'brl') return brl(v)
  if (tipo === 'tok') return tok(Math.round(v))
  if (tipo === 'moeda') return TEMPO.cambio.brlPorUsd ? brl(v) : usd(v)
  return String(Math.round(v))
}

function seletor(nome, opcoes, atual) {
  return `<select data-rasc="${nome}">${opcoes.map(([id, rot]) =>
    `<option value="${esc(id)}"${id === atual ? ' selected' : ''}>${esc(rot)}</option>`).join('')}</select>`
}

function construtor(idx, estado) {
  const s = rascunho
  const erro = CCGraficos.validar(s, estado)
  return `<div class="g-form">
    <div class="g-campos">
      <label>forma ${seletor('forma', Object.entries(CCGraficos.FORMAS).map(([id, f]) => [id, f.rotulo]), s.forma)}</label>
      <label>medida ${seletor('medida', idx.medidas.map((m) => [m.id, m.rotulo]), s.medida)}</label>
      <label>eixo ${seletor('dimensao', Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([id, d]) => [id, d.rotulo]), s.dimensao)}</label>
      <label>dividir por ${seletor('serie', Object.entries(CCGraficos.DIMENSOES).map(([id, d]) => [id, d.rotulo]), s.serie)}</label>
      <label>nome <input type="text" data-rasc="nome" value="${esc(s.nome || '')}" placeholder="${esc(CCGraficos.descrever(s))}"></label>
      <span class="grow"></span>
      <button class="btn" data-g-salvar${erro ? ' disabled' : ''}>${s.id ? 'salvar' : 'adicionar'}</button>
      <button class="btn" data-g-cancelar>cancelar</button>
    </div>
    ${erro ? `<div class="g-erro">${esc(erro)}</div>`
      : `<div class="g-previa">${CCGraficos.desenhar(s, fatosDe(TEMPO), fmtG, estado)}</div>`}
  </div>`
}

function viewIndice(idx) {
  if (!indiceAberto) return ''
  const fonteDe = (f) => (f === 'tempo' ? 'relógio' : 'uso de token')
  return `<div class="g-indice">
    <div>
      <h3>medidas</h3>
      <table class="g-tab">
        ${idx.medidas.map((m) => `<tr><td>${esc(m.rotulo)}</td><td class="path">vem do ${fonteDe(m.fonte)}</td></tr>`).join('')}
        ${idx.bloqueadas.map((m) => `<tr class="off"><td>${esc(m.rotulo)}</td>
          <td class="path">falta ${esc(m.precisa.replace('+', ' e '))} — defina na aba tempo</td></tr>`).join('')}
      </table>
    </div>
    <div>
      <h3>eixos</h3>
      <table class="g-tab">
        ${Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([, d]) =>
          `<tr><td>${esc(d.rotulo)}</td><td class="path">${d.fontes.length === 2
            ? 'cruza com qualquer medida'
            : `só com medidas do ${fonteDe(d.fontes[0])}`}</td></tr>`).join('')}
      </table>
      <p class="path" style="margin:10px 0 0">
        O relógio não sabe qual modelo rodou, e o uso de token não sabe quanto tempo levou.
        Por isso horas não cruza com modelo — e o construtor avisa em vez de desenhar zero.
      </p>
    </div>
  </div>`
}

function viewGraficos() {
  if (!TEMPO) return '<div class="empty">lendo os transcritos… a primeira vez varre ~800 MB</div>'
  if (TEMPO.error) return `<div class="empty">não deu para ler os transcritos: ${esc(TEMPO.error)}</div>`

  const estado = {
    temTaxa: TEMPO.projetos.some((p) => p.taxaHora > 0),
    temAssinatura: TEMPO.assinaturaMes > 0,
  }
  const idx = CCGraficos.indice(estado)
  const dados = fatosDe(TEMPO)
  const lista = graficosAtuais()

  const barra = `<div class="t-ctl">
    <button class="btn" data-g-novo${rascunho ? ' disabled' : ''}>+ gráfico</button>
    <button class="btn${indiceAberto ? ' on' : ''}" data-g-indice>o que dá pra cruzar</button>
    ${GRAFICOS ? '<button class="btn" data-g-restaurar>voltar aos prontos</button>' : ''}
    <span class="grow"></span>
    <span class="path">período e corte saem da aba tempo${
      TEMPO.de || TEMPO.ate ? ` · recorte ativo` : ''}</span>
  </div>`

  const cartoes = lista.map((g) => `
    <section class="g-card">
      <header>
        <b>${esc(g.nome || CCGraficos.descrever(g))}</b>
        <span class="path">${esc(CCGraficos.descrever(g))}</span>
        <span class="grow"></span>
        <button class="btn min" data-g-editar="${esc(g.id)}" title="editar">✎</button>
        <button class="btn min" data-g-remover="${esc(g.id)}" title="remover">✕</button>
      </header>
      ${CCGraficos.desenhar(g, dados, fmtG, estado)}
    </section>`).join('')

  return barra + viewIndice(idx)
    + (rascunho ? construtor(idx, estado) : '')
    + (lista.length ? `<div class="g-grade">${cartoes}</div>`
      : '<div class="empty">nenhum gráfico — use o + acima</div>')
}

async function gravarGraficos(lista) {
  GRAFICOS = lista
  render()
  await fetch('/api/graficos', { method: 'POST', body: JSON.stringify({ graficos: lista }) })
}

/* ========================= aba: preço ========================
   Quanto vale cada coisa resolvida. O tempo vem do transcript, o nível sai de
   sinais de esforço e o valor/hora é buscado na web — e nada disso vira preço
   sem o Felipe poder discordar de cada linha. */

let PRECO = null
let precoUnidade = localStorage.getItem('cc-preco-unidade') || 'sessao'
// ?tarefa=<chave> abre uma linha já na carga, para a captura conseguir mostrar
// os sinais — é o mesmo motivo do ?open= na aba de agentes.
let precoAberta = params.get('tarefa') || null

const NIVEL_ROTULO = { junior: 'júnior', pleno: 'pleno', senior: 'sênior' }

let precoEm = 0
async function carregarPreco(force) {
  if (PRECO && !force && Date.now() - precoEm < 30_000) return
  precoEm = Date.now()
  const q = new URLSearchParams({ corte: tempoParams.corte, unidade: precoUnidade })
  if (force === 'mercado') q.set('mercado', '1')
  PRECO = null
  render()
  try {
    PRECO = await (await fetch(`/api/tarefas?${q}`)).json()
  } catch (e) {
    PRECO = { error: String(e.message || e) }
  }
  render()
}

/** Grava a correção de uma linha e recalcula. */
async function ajustarTarefa(item, patch) {
  const corpo = item.sessao
    ? { sessao: item.sessao, nivel: item.nivel, horas: item.digitadoMs ? item.digitadoMs / 36e5 : 0, ...patch }
    : { job: item.job, tarefa: item.tarefa, nivel: item.nivel, horas: item.digitadoMs ? item.digitadoMs / 36e5 : 0, ...patch }
  await fetch('/api/tarefa', { method: 'POST', body: JSON.stringify(corpo) })
  carregarPreco(true)
}

const chaveDe = (t) => t.sessao || `${t.job}|${t.tarefa}`

function viewPreco() {
  if (!PRECO) return '<div class="empty">calculando… a primeira vez varre os transcritos</div>'
  if (PRECO.error) return `<div class="empty">não deu para calcular: ${esc(PRECO.error)}</div>`

  const m = PRECO.mercado
  const idade = m.em ? Math.round((Date.now() - m.em) / 864e5) : null
  const ctl = `<div class="t-ctl">
    <label>unidade
      <select data-preco="unidade">
        <option value="sessao"${precoUnidade === 'sessao' ? ' selected' : ''}>sessão de trabalho</option>
        <option value="todo"${precoUnidade === 'todo' ? ' selected' : ''}>tarefa concluída</option>
      </select>
    </label>
    <span class="path">corte de ${esc(String(tempoParams.corte))}min, da aba tempo</span>
    <span class="grow"></span>
    <span class="path">mercado: ${esc(m.fonte || '—')}${
      idade == null ? '' : idade === 0 ? ', hoje' : `, há ${idade}d`}</span>
    <button class="btn" data-preco-buscar>buscar de novo</button>
  </div>`

  const faixas = `<div class="p-niveis">
    ${['junior', 'pleno', 'senior'].map((n) => {
      const p = PRECO.porNivel[n]
      return `<div class="p-nivel n-${n}">
        <b>${NIVEL_ROTULO[n]}</b>
        <span class="p-hora">${brl(p.valorHora)}<i>/h</i></span>
        <input type="number" min="0" step="5" class="t-taxa" data-mercado="${n}"
          value="${p.valorHora}" title="digitar congela o valor e a busca para de mexer">
        <span class="path">faixa ${brl(p.faixa?.min || 0)}–${brl(p.faixa?.max || 0)}</span>
        <span class="path">${p.quantas} ${precoUnidade === 'sessao' ? 'sessões' : 'tarefas'}
          · média ${horas(p.mediaMs)} · ${brl(p.total)}</span>
      </div>`
    }).join('')}
  </div>`

  const r = PRECO.resumo
  const resumo = `<div class="p-resumo">
    <div><span class="path">${precoUnidade === 'sessao' ? 'sessões' : 'tarefas'}</span><b>${r.quantas}</b></div>
    <div><span class="path">média por problema</span><b>${horas(r.mediaMs)}</b></div>
    <div><span class="path">total de horas</span><b>${horas(r.totalMs)}</b></div>
    <div><span class="path">a cobrar</span><b class="cif">${brl(r.total)}</b></div>
  </div>`

  const aviso = `<p class="t-aviso">
    O nível sai de sinais de esforço no transcript, não de entendimento do problema —
    <b>é palpite, e o palpite é seu para corrigir</b>: clique na linha e escolha.
    ${precoUnidade === 'sessao'
      ? 'Uma sessão pode ter resolvido mais de uma coisa, então a média por sessão é maior que a média por problema.'
      : `O tempo é rateado por igual entre as tarefas fechadas na mesma sessão${
          r.rateadas ? ` (${r.rateadas} de ${r.quantas})` : ''}, porque não há marca de início e fim por tarefa.`}
    Digitar seu tempo faz a média com o medido, e é essa média que vira preço.
  </p>`

  if (!PRECO.tarefas.length) {
    return ctl + faixas + aviso + `<div class="empty">
      ${precoUnidade === 'todo'
        ? 'nenhuma tarefa marcada como concluída nos agentes vivos — marque na aba to-dos, ou veja por sessão'
        : 'nenhuma sessão com tempo no período'}</div>`
  }

  const linha = (t) => {
    const k = chaveDe(t)
    const aberta = precoAberta === k
    return `<div class="p-item${aberta ? ' on' : ''}">
      <div class="p-linha" data-preco-abrir="${esc(k)}" tabindex="0">
        <span class="p-nome" title="${esc(t.tarefa)}">${esc(t.tarefa)}</span>
        <span class="v path">${esc(t.projeto || '—')}</span>
        <span class="v n-${t.nivel}">${NIVEL_ROTULO[t.nivel]}${t.corrigido ? ' ✓' : ''}</span>
        <span class="v">${horas(t.medidoMs)}</span>
        <span class="v path">${t.digitadoMs == null ? '—' : horas(t.digitadoMs)}</span>
        <span class="v h">${horas(t.cobradoMs)}</span>
        <span class="v cif">${brl(t.preco)}</span>
      </div>
      ${aberta ? `<div class="p-detalhe">
        <div class="p-sinais">
          ${t.sinais.map((s) => `<div class="p-sinal">
            <span class="path">${esc(s.rotulo)}</span>
            <b>${esc(s.texto)}</b>
            <span class="p-notas">${'▪'.repeat(s.nota) || '·'}</span>
          </div>`).join('')}
        </div>
        <div class="p-acoes">
          <span class="path">sugerido: ${NIVEL_ROTULO[t.nivelAuto]}</span>
          ${['junior', 'pleno', 'senior'].map((n) =>
            `<button class="btn${t.nivel === n ? ' on' : ''}" data-preco-nivel="${esc(k)}" data-n="${n}">${NIVEL_ROTULO[n]}</button>`).join('')}
          <label class="path">seu tempo, em horas
            <input type="number" min="0" step="0.5" class="t-taxa" data-preco-horas="${esc(k)}"
              value="${t.digitadoMs == null ? '' : (t.digitadoMs / 36e5).toFixed(1)}" placeholder="${(t.medidoMs / 36e5).toFixed(1)}">
          </label>
          <span class="grow"></span>
          <span class="path">API ${usd(t.custoApi)} · ${tok(Math.round(t.tokens))} tokens${
            t.rateada ? ' · rateado' : ''}</span>
        </div>
      </div>` : ''}
    </div>`
  }

  return ctl + faixas + resumo + aviso
    + `<div class="p-linha p-head">
        <span>o que foi resolvido</span><span class="v">projeto</span><span class="v">nível</span>
        <span class="v">medido</span><span class="v">seu tempo</span><span class="v">cobrado</span><span class="v">preço</span>
      </div>`
    + PRECO.tarefas.slice(0, 120).map(linha).join('')
    + (PRECO.tarefas.length > 120
      ? `<p class="path" style="margin:10px 0 0">mostrando as 120 mais caras de ${PRECO.tarefas.length}</p>` : '')
}

/* ====================== aba: servidores ====================== */

function viewServidores() {
  if (!SERVERS) return '<div class="empty">lendo as portas em escuta…</div>'
  const dev = SERVERS.filter((s) => s.dev)
  const resto = SERVERS.filter((s) => !s.dev)

  // O começo do caminho é sempre o mesmo; o que identifica o app está no fim.
  const cauda = (p, n = 42) => (p.length > n ? '…' + p.slice(-(n - 1)) : p)

  // A porta é o que identifica o servidor na cabeça de quem procura — por isso
  // vem primeiro e grande, em vez de ser a primeira coluna de uma tabela.
  const cartaoSrv = (s) => `
    <article class="srv-card${s.dev ? ' dev' : ''}">
      <header>
        <b class="port">:${s.ports.join(', :')}</b>
        <span class="cat">${esc(s.kind)}</span>
        <span class="grow"></span>
        <span class="path">pid ${s.pid}</span>
      </header>
      <b class="c-titulo">${esc(s.project || s.name)}</b>
      ${s.path ? `<p class="c-proj" title="${esc(s.cmd)}">${esc(cauda(s.path))}</p>` : ''}
      <footer>
        <span class="path">${s.startedAt ? 'no ar há ' + age(Date.now() - s.startedAt) : '—'}</span>
        <span class="grow"></span>
        ${s.url ? `<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">abrir</a>` : ''}
        ${s.dev && !s.protegido
          ? `<button class="btn danger" data-kill="${s.pid}">${armed === s.pid ? 'confirmar?' : 'encerrar'}</button>`
          : ''}
      </footer>
    </article>`

  // duas instâncias do mesmo projeto quase sempre é uma esquecida de ontem
  const porProjeto = new Map()
  for (const s of dev) if (s.project) porProjeto.set(s.project, (porProjeto.get(s.project) || 0) + 1)
  const dobrados = [...porProjeto].filter(([, n]) => n > 1)

  return `
    <div class="col-head"><span>servidores de projeto</span><span class="n">${dev.length}</span></div>
    ${dobrados.length ? `<p class="note warn" style="margin:0 0 10px">${
      dobrados.map(([p, n]) => `${esc(p)} está com ${n} servidores abertos`).join(' · ')}</p>` : ''}
    ${dev.length ? `<div class="cards">${dev.map(cartaoSrv).join('')}</div>`
      : '<div class="path">nenhum servidor de desenvolvimento escutando agora</div>'}
    <details class="lvl" style="margin-top:24px">
      <summary>outros processos com porta aberta (${resto.length})</summary>
      <div class="cards" style="margin-top:10px">${resto.map(cartaoSrv).join('')}</div>
    </details>
    <p class="path" style="margin-top:20px">
      encerrar pede confirmação e só vale para servidor de desenvolvimento —
      processo do Windows fica de fora de propósito.
    </p>`
}

/* ========================= render ============================ */

let redesenhoAdiado = false
let dadosPendentes = null

/**
 * O stream manda evento a cada 2s e `render()` reescreve o painel inteiro —
 * o cursor sumiria no meio da palavra. Enquanto houver campo em foco dentro
 * do painel, o redesenho espera; sai o foco, ele acontece.
 */
function editando() {
  const alvo = document.activeElement
  if (!alvo || !alvo.matches('input, textarea')) return false
  // o painel lateral também é reescrito por render() — vale a mesma trava
  return $('#main').contains(alvo) || $('#drawer').contains(alvo)
}

/**
 * Trocar `DATA` no meio da digitação é pior que redesenhar: a tela continua
 * mostrando a lista antiga enquanto os índices já mudaram, e a edição vai
 * parar em outra tarefa. Snapshot e tela esperam juntos.
 */
function aplicarDados(snapshot) {
  if (editando()) { dadosPendentes = snapshot; return }
  DATA = snapshot
  render()
}

/* ====================== aba: escritório ====================== */

// As telas de Pixel Agents: os agentes desenhados como bonecos num escritório.
// Uma roda nesta máquina; a outra é a da VPS, alcançada por túnel SSH.
// Separada do palco de propósito: os cartões mudam de estado a toda hora e
// podem ser redesenhados à vontade; o iframe abaixo não pode ser tocado.
function viewCartoesPaineis() {
  if (!PAINEIS) return '<div class="painel-lista"></div>'
  const escolhido = PAINEIS.find((p) => p.id === painelAtivo) || PAINEIS[0]
  const cartoes = PAINEIS.map((p) => {
    const marca = p.noAr ? 'var(--done)' : 'var(--idle)'
    return `
      <div class="painel-card${p.id === escolhido?.id ? ' sel' : ''}" data-painel-ver="${p.id}">
        <div class="painel-topo">
          <span class="painel-bolha" style="background:${marca}"></span>
          <strong>${esc(p.nome)}</strong>
          <span class="path">:${p.porta}</span>
        </div>
        <div class="path">${esc(p.detalhe)}</div>
        <div class="painel-acoes">
          ${p.noAr
            ? `<button class="btn" data-painel-desligar="${p.id}">desligar</button>
               <button class="btn" data-painel-pip="${p.id}" title="janela flutuante, sempre por cima">PiP</button>
               <a class="btn" href="${p.url}" target="_blank" rel="noopener">abrir</a>`
            : `<button class="btn" data-painel-ligar="${p.id}">ligar</button>
               <span class="path clip" title="${esc(p.comando)}">parado</span>`}
        </div>
      </div>`
  }).join('')

  return `<div class="painel-lista">${cartoes}</div>`
}

/**
 * A legenda do escritório: quem é cada boneco e o que está fazendo.
 *
 * Existe porque o rótulo flutuante do Pixel Agents cobre o personagem e o
 * comando inteiro não cabe — vira uma tarja cinza atravessando a sala. Aqui o
 * texto tem largura própria: resumo de uma linha, e o comando completo só
 * quando se clica.
 */
function viewLegendaEscritorio(jobs) {
  if (!jobs.length) return '<div class="empty" style="padding:14px">nenhum agente vivo</div>'

  const ordem = { waiting: 0, failed: 1, working: 2, idle: 3, done: 4 }
  const lista = [...jobs].sort((a, b) => (ordem[a.status] ?? 9) - (ordem[b.status] ?? 9))

  return lista.map((j) => {
    const fazendo = (j.detail || j.result || j.lastPrompt || '').trim()
    const curto = fazendo.length > 64 ? fazendo.slice(0, 64) + '…' : fazendo
    const temMais = fazendo.length > 64
    const aberto = legendaAberta.has(j.id)
    return `
      <div class="leg-item${aberto ? ' on' : ''}" data-legenda="${j.id}">
        <div class="leg-topo">
          <span class="dot ${j.status}"></span>
          <span class="leg-nome" title="${esc(j.subject || j.name || '')}">${esc(j.subject || j.name || '(sem assunto)')}</span>
        </div>
        <div class="leg-proj">${esc(j.project || '?')}${j.route && j.route !== 'main' ? ' · ' + esc(j.route) : ''}</div>
        ${fazendo ? `<div class="leg-faz">${esc(aberto ? fazendo : curto)}${temMais && !aberto ? ' <span class="leg-mais">ver</span>' : ''}</div>` : ''}
      </div>`
  }).join('')
}

function viewEscritorio() {
  if (!PAINEIS) return '<div class="empty">procurando os painéis…</div>'
  const escolhido = PAINEIS.find((p) => p.id === painelAtivo) || PAINEIS[0]

  // `data-src` existe para o render() comparar sem ler `iframe.src`, que o
  // navegador normaliza (barra no fim) e nunca bateria com a string do JSON.
  const palco = escolhido?.noAr
    ? `<iframe class="painel-palco" data-src="${escolhido.url}" src="${escolhido.url}" title="${esc(escolhido.nome)}"></iframe>`
    : `<div class="empty" style="height:420px;display:grid;place-items:center">
         ${escolhido ? `${esc(escolhido.nome)} está parado — clique em <b>ligar</b> acima` : 'nenhum painel configurado'}
       </div>`

  // Palco e legenda lado a lado: o escritório mostra o movimento, a coluna
  // diz o que está acontecendo. Uma coisa o outro não faz bem.
  return viewCartoesPaineis() + `
    <div class="escritorio-grade">
      ${palco}
      <aside class="escritorio-legenda">
        <h3>quem é quem</h3>
        <div class="leg-lista">${viewLegendaEscritorio(filtered())}</div>
      </aside>
    </div>`
}

async function carregarPaineis(force) {
  if (PAINEIS && !force) return
  try {
    PAINEIS = (await (await fetch(`/api/paineis${force ? '?force=1' : ''}`)).json()).paineis
  } catch (e) {
    PAINEIS = []
  }
  render()
}

async function acaoPainel(id, acao) {
  try {
    const r = await fetch(`/api/paineis/${acao}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }),
    })
    const j = await r.json()
    if (!j.ok) throw new Error(j.error || 'falhou')
  } catch (e) {
    alert(`não deu para ${acao}: ${e.message || e}`)
  }
  // O processo leva um instante para abrir (ou soltar) a porta. Sem esta
  // espera a lista volta com o estado velho e parece que o clique não fez nada.
  await new Promise((r) => setTimeout(r, acao === 'ligar' ? 2500 : 900))
  await carregarPaineis(true)
}

/**
 * Janela flutuante que fica por cima de tudo, via Document Picture-in-Picture.
 * Só existe em navegador baseado em Chromium — em outro, abre aba comum, que é
 * pior mas não deixa o botão morto.
 */
async function abrirPiP(id) {
  const p = (PAINEIS || []).find((x) => x.id === id)
  if (!p) return
  if (!window.documentPictureInPicture) {
    window.open(p.url, '_blank', 'width=480,height=380')
    return
  }
  const win = await documentPictureInPicture.requestWindow({ width: 480, height: 380 })
  win.document.title = `${p.nome} — agentes`
  const estilo = win.document.createElement('style')
  estilo.textContent = `
    html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden}
    iframe{border:0;width:100%;height:100%;display:block}`
  win.document.head.append(estilo)
  const frame = win.document.createElement('iframe')
  frame.src = p.url
  win.document.body.append(frame)
}

// Fora do render() porque o atalho do escritório também precisa dele, e
// duplicar texto é como as duas telas passam a dizer coisas diferentes.
const RODAPE = {
  agentes: 'clique num cartão para abrir o detalhe; passe o mouse nele para retomar (↻), fixar (★) ou copiar o caminho (⧉); as bolinhas são as tarefas, cheias as concluídas',
  todos: 'clique no texto para editar, + abre tarefa nova, texto em branco apaga — tudo vai para o meta.json do agente',
  projetos: 'clique num agente para abrir o painel lateral',
  tempo: 'tempo ativo por projeto, lido dos transcritos — clique no projeto para ver os dias, os modelos, as sessões e a taxa só dele; a taxa em R$ fica nesta máquina e some da tela quando é zero',
  graficos: 'os mesmos dados da aba tempo, cruzados como você quiser — escolha medida, eixo e por que dividir; os gráficos criados ficam gravados nesta máquina',
  preco: 'clique numa linha para ver por que aquele nível foi sugerido, corrigir o nível e digitar quanto tempo você acha que levou',
  servidores: 'portas em escuta nesta máquina, com o projeto de origem quando dá pra saber',
  escritorio: 'os agentes desenhados trabalhando; PiP solta numa janelinha que fica por cima de tudo — o painel da VPS depende do túnel SSH, que este botão abre',
}

function render() {
  if (editando()) { redesenhoAdiado = true; return }
  redesenhoAdiado = false
  renderHeader()
  const jobs = filtered()
  const views = {
    agentes: () => viewAgentes(jobs),
    todos: () => viewTodos(jobs),
    projetos: () => viewProjetos(jobs),
    tempo: () => viewTempo(),
    graficos: () => viewGraficos(),
    preco: () => viewPreco(),
    servidores: () => viewServidores(),
    escritorio: () => viewEscritorio(),
  }
  // O palco do escritório é um iframe. Reescrever #main a cada evento do
  // stream o recriaria, e iframe recriado RECARREGA — a tela piscava e o
  // escritório reiniciava sozinho a cada 2 segundos. Enquanto o painel
  // escolhido não muda, só os cartões são redesenhados; o iframe não é
  // tocado. Mover o nó também recarregaria, então nem isso se faz.
  const palco = tab === 'escritorio' ? $('.painel-palco') : null
  if (palco && palco.dataset.src === (PAINEIS || []).find((p) => p.id === painelAtivo)?.url) {
    const cartoes = $('.painel-lista')
    if (cartoes) {
      cartoes.outerHTML = viewCartoesPaineis()
      const leg = $('.leg-lista')
      if (leg) leg.innerHTML = viewLegendaEscritorio(filtered())
      $('#foot').textContent = RODAPE[tab] || ''
      drawer()
      return
    }
  }

  $('#main').innerHTML = (views[tab] || views.agentes)()
  $('#foot').textContent = RODAPE[tab] || ''
  drawer()
}

async function carregarServidores(force) {
  if (SERVERS && !force) return
  const r = await fetch('/api/servers')
  SERVERS = (await r.json()).servers
  render()
}

// Revalida ao voltar na aba. Morno, /api/tempo custa ~20ms — o guard antigo
// segurava o snapshot da PRIMEIRA carga da aba pelo resto da sessão, e as
// horas congelavam sem nada na tela dizendo isso.
let tempoEm = 0
async function carregarTempo(force) {
  if (TEMPO && !force && Date.now() - tempoEm < 30_000) return
  tempoEm = Date.now()
  const q = new URLSearchParams({ corte: tempoParams.corte })
  if (tempoParams.de) q.set('de', tempoParams.de)
  if (tempoParams.ate) q.set('ate', tempoParams.ate)
  if (force === 'reler') q.set('force', '1')
  TEMPO = null
  render() // mostra "lendo os transcritos…" antes de travar no fetch
  try {
    TEMPO = await (await fetch(`/api/tempo?${q}`)).json()
  } catch (e) {
    TEMPO = { error: String(e.message || e) }
  }
  render()
}

/** Grava um número de configuração e recalcula do cache, sem reler transcrito. */
async function salvarNumero(rota, valor) {
  await fetch(rota, { method: 'POST', body: JSON.stringify({ valor: Number(valor) || 0 }) })
  carregarTempo(true)
}

/** Cotação digitada congela o valor; apagar o campo devolve a busca automática. */
const salvarCambio = (valor) => salvarNumero('/api/cambio', valor)

/** Grava a taxa e recalcula do cache — não relê transcrito por causa de preço. */
async function salvarTaxa(projeto, valor) {
  await fetch('/api/taxa', {
    method: 'POST',
    body: JSON.stringify({ valor: Number(valor) || 0, projeto }),
  })
  carregarTempo(true)
}

/* ========================= player de mídia =========================
   Fica fora do #main de propósito, como as notas: `render()` reescreve o
   painel a cada evento do stream, e o cursor do controle de volume sumiria no
   meio do arrasto. Aqui o desenho só acontece quando o que está tocando muda. */

let MIDIA = null
let midiaAssinatura = ''
let arrastandoVolume = false
// Qual sessão a barra controla. Vazio = a mais provável, escolhida por peso.
// Fica gravado porque trocar de app a cada vez que o YouTube pausa seria pior
// que a escolha errada.
let midiaEscolhida = localStorage.getItem('cc-midia') || ''

/** A sessão da barra: a fixada, se ainda existir; senão a mais provável. */
const sessaoAtual = () => {
  const lista = MIDIA?.sessoes || []
  return lista.find((s) => s.appId === midiaEscolhida) || lista[0] || null
}

const $player = () => $('#player')

async function carregarMidia() {
  try {
    const r = await fetch('/api/midia')
    MIDIA = await r.json()
  } catch {
    MIDIA = { erro: 'sem resposta' }
  }
  renderPlayer()
}

/** Só redesenha quando muda de verdade — e nunca durante um arrasto. */
function renderPlayer() {
  const alvo = $player()
  const s = sessaoAtual()
  if (!s) {
    alvo.hidden = true
    midiaAssinatura = ''
    return
  }
  const quantas = (MIDIA?.sessoes || []).length
  const assinatura = JSON.stringify([s.appId, s.titulo, s.artista, s.tocando, s.volume, s.mudo, s.pid, quantas])
  if (assinatura === midiaAssinatura || arrastandoVolume) return
  midiaAssinatura = assinatura
  alvo.hidden = false

  const bt = (acao, rotulo, ligado, dica) => `<button class="p-bt" data-midia="${acao}"
    ${ligado ? '' : 'disabled'} title="${dica}">${rotulo}</button>`
  const temVolume = s.pid && s.volume != null

  alvo.innerHTML = `
    <button class="p-app${quantas > 1 ? ' trocavel' : ''}" data-midia="trocar"
      ${quantas > 1 ? '' : 'disabled'}
      title="${quantas > 1 ? `clique para controlar outra mídia (${quantas} abertas)` : 'única mídia aberta'}"
      >${esc(s.app)}${quantas > 1 ? ` ${quantas}` : ''}</button>
    <span class="p-faixa">
      <b>${esc(s.titulo || 'sem título')}</b>
      ${s.artista ? `<span class="path">${esc(s.artista)}</span>` : ''}
    </span>
    <span class="p-bts">
      ${bt('prev', '⏮', s.podeAnterior, 'faixa anterior')}
      ${bt('toggle', s.tocando ? '⏸' : '▶', s.podePausa || s.podePlay, s.tocando ? 'pausar' : 'tocar')}
      ${bt('next', '⏭', s.podeProximo, 'próxima faixa')}
    </span>
    ${temVolume ? `
      <span class="p-vol">
        <button class="p-bt" data-midia="mudo" title="${s.mudo ? 'tirar do mudo' : 'mudo'}">${s.mudo ? '🔇' : '🔊'}</button>
        <input type="range" min="0" max="100" value="${s.volume}" data-vol
          title="volume deste aplicativo — não mexe no volume do Windows">
        <b>${s.mudo ? '—' : s.volume + '%'}</b>
      </span>`
      : '<span class="path p-semvol" title="a sessão de mídia não casou com nenhum processo de áudio">sem controle de volume</span>'}`
}

async function mandarMidia(corpo, rota = 'acao') {
  try {
    await fetch(`/api/midia/${rota}`, { method: 'POST', body: JSON.stringify(corpo) })
  } catch { /* a próxima leitura mostra a verdade */ }
  midiaAssinatura = '' // força redesenho com o estado novo
  carregarMidia()
}

/* ========================== notas ============================
   Fora do #main de propósito: `render()` reescreve o painel a cada evento do
   stream, de 2 em 2 segundos. Um textarea ali dentro perderia o cursor no
   meio da frase. Aqui só se redesenha ao criar ou apagar bloco. */

let NOTES = []
let armedNote = null          // bloco com "apagar" armado, esperando confirmação
let notesOpen = params.has('notes') || localStorage.getItem('cc-notes-open') === '1'
let notesW = Number(localStorage.getItem('cc-notes-w')) || 340
let saveTimer = null

const novoId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)
const notaDo = (el) => NOTES.find((n) => n.id === el.closest('.n-block')?.dataset.note)

function layoutNotas() {
  document.body.style.setProperty('--notes-w', notesW + 'px')
  $('#notas').hidden = $('#split').hidden = !notesOpen
  $('#n-toggle').setAttribute('aria-pressed', String(notesOpen))
  $('#n-toggle').classList.toggle('on', notesOpen)
}

/**
 * No modo lista, cada linha não vazia é um item; "[x]" na frente é feito.
 * Aceita "[]" sem espaço porque é assim que se digita à mão — exigir o
 * espaço faria a marca virar texto do próprio item.
 */
const itensDe = (n) => n.text.split('\n').filter((l) => l.trim()).map((linha) => {
  const m = linha.match(/^\s*\[([ xX]?)\]\s?(.*)$/)
  return m ? { text: m[2], done: m[1].trim() !== '' } : { text: linha.trim(), done: false }
})
const linhasDe = (itens) => itens.map((it) => `${it.done ? '[x] ' : '[ ] '}${it.text}`).join('\n')

function renderNotas() {
  const corpo = (n) => n.kind === 'check'
    ? `<div class="n-itens">
        ${itensDe(n).map((it, i) => `
          <div class="n-item${it.done ? ' done' : ''}">
            <input type="checkbox" data-nota-check="${esc(n.id)}" data-i="${i}" ${it.done ? 'checked' : ''}
              aria-label="marcar item">
            <input class="txt" value="${esc(it.text)}" data-nota-item="${esc(n.id)}" data-i="${i}"
              aria-label="texto do item" placeholder="em branco, o item some">
          </div>`).join('')}
        <button class="n-add-item" data-nota-add="${esc(n.id)}">+ item</button>
      </div>`
    : `<textarea style="height:${n.h}px" spellcheck="false" aria-label="conteúdo do bloco">${esc(n.text)}</textarea>`

  $('#n-list').innerHTML = NOTES.length
    ? NOTES.map((n) => `
      <div class="n-block" data-note="${esc(n.id)}">
        <div class="n-top">
          <input class="n-title" value="${esc(n.title)}" placeholder="sem título" aria-label="título do bloco">
          <button class="n-modo" data-modo="${esc(n.id)}"
            title="${n.kind === 'check' ? 'virar texto livre' : 'virar lista de itens'}"
            aria-label="alternar tipo do bloco">${n.kind === 'check' ? '¶' : '☑'}</button>
          <button class="n-del${armedNote === n.id ? ' armed' : ''}" data-del="${esc(n.id)}"
            title="apagar bloco">${armedNote === n.id ? 'apagar?' : '✕'}</button>
        </div>
        ${corpo(n)}
      </div>`).join('')
    : '<div class="n-empty">nenhum bloco ainda — clique em <b>+ bloco</b></div>'
}

function salvarNotas(agora) {
  clearTimeout(saveTimer)
  const gravar = () => fetch('/api/notes', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ notes: NOTES }),
  })
  agora ? gravar() : (saveTimer = setTimeout(gravar, 500))
}

// Digitar não redesenha: só atualiza o modelo e agenda a gravação.
document.addEventListener('input', (e) => {
  const n = notaDo(e.target)
  if (!n) return
  if (e.target.matches('textarea')) n.text = e.target.value
  else if (e.target.matches('.n-title')) n.title = e.target.value
  else if (e.target.matches('[data-nota-item]')) {
    const itens = itensDe(n)
    const i = +e.target.dataset.i
    if (!itens[i]) return
    itens[i] = { ...itens[i], text: e.target.value }
    n.text = linhasDe(itens)
  } else return
  salvarNotas()
})

// item vazio sai da lista — mesmo gesto de apagar dos to-dos
document.addEventListener('change', (e) => {
  const campo = e.target.closest('[data-nota-item]')
  if (!campo || campo.value.trim()) return
  const n = notaDo(campo)
  if (!n) return
  n.text = linhasDe(itensDe(n).filter((_, k) => k !== +campo.dataset.i))
  renderNotas()
  salvarNotas(true)
})

// A alça de resize do textarea não emite evento próprio. Como só dá pra
// arrastá-la com o ponteiro, soltar o botão é o momento certo de conferir.
document.addEventListener('pointerup', () => {
  let mudou = false
  for (const ta of document.querySelectorAll('.n-block textarea')) {
    const n = notaDo(ta)
    const h = Math.round(ta.getBoundingClientRect().height)
    if (n && h && h !== n.h) { n.h = h; mudou = true }
  }
  if (mudou) salvarNotas()
})

$('#split').addEventListener('pointerdown', (e) => {
  e.preventDefault()
  const split = e.currentTarget
  split.setPointerCapture(e.pointerId)
  split.classList.add('drag')
  const mover = (ev) => {
    const max = Math.max(window.innerWidth * 0.78, 220)
    notesW = Math.round(Math.min(Math.max(window.innerWidth - ev.clientX, 220), max))
    document.body.style.setProperty('--notes-w', notesW + 'px')
  }
  const soltar = () => {
    split.classList.remove('drag')
    split.removeEventListener('pointermove', mover)
    split.removeEventListener('pointerup', soltar)
    localStorage.setItem('cc-notes-w', notesW)
  }
  split.addEventListener('pointermove', mover)
  split.addEventListener('pointerup', soltar)
})

/* ========================= eventos =========================== */

document.addEventListener('click', async (e) => {
  const t = e.target

  const btMidia = t.closest('[data-midia]')
  if (btMidia) {
    const s = sessaoAtual()
    if (!s) return
    const qual = btMidia.dataset.midia
    if (qual === 'trocar') {
      const lista = MIDIA?.sessoes || []
      const proxima = lista[(lista.indexOf(s) + 1) % lista.length]
      midiaEscolhida = proxima.appId
      localStorage.setItem('cc-midia', midiaEscolhida)
      midiaAssinatura = ''
      return renderPlayer()
    }
    if (qual === 'mudo') return mandarMidia({ pid: s.pid, mudo: !s.mudo }, 'volume')
    return mandarMidia({ indice: s.indice, qual })
  }

  const fecharTodas = t.closest('[data-fechar-todas]')
  if (fecharTodas) {
    const job = byId(fecharTodas.dataset.fecharTodas)
    // Marca tudo de uma vez porque o agente já disse que entregou; corrigir
    // item a item é para quando ele entregou parte, e aí a lista está na tela.
    return gravarTodos(job, job.todos.map((x) => ({ ...x, done: true })))
  }

  const abrirPreco = t.closest('[data-preco-abrir]')
  if (abrirPreco && !t.closest('button, input')) {
    const k = abrirPreco.dataset.precoAbrir
    precoAberta = precoAberta === k ? null : k
    return render()
  }
  const nivelBotao = t.closest('[data-preco-nivel]')
  if (nivelBotao) {
    const item = PRECO.tarefas.find((x) => chaveDe(x) === nivelBotao.dataset.precoNivel)
    // Clicar no nível que já está ativo desfaz a correção e devolve o palpite.
    const n = nivelBotao.dataset.n
    return ajustarTarefa(item, { nivel: item.nivel === n && item.corrigido ? '' : n })
  }
  if (t.closest('[data-preco-buscar]')) return carregarPreco('mercado')

  if (t.closest('[data-g-novo]')) {
    rascunho = { forma: 'barras', dimensao: 'projeto', serie: 'nenhuma', medida: 'horas', nome: '' }
    return render()
  }
  if (t.closest('[data-g-indice]')) { indiceAberto = !indiceAberto; return render() }
  if (t.closest('[data-g-cancelar]')) { rascunho = null; return render() }
  if (t.closest('[data-g-restaurar]')) return gravarGraficos(null)

  const editar = t.closest('[data-g-editar]')
  if (editar) {
    rascunho = { ...graficosAtuais().find((g) => g.id === editar.dataset.gEditar) }
    return render()
  }
  const remover = t.closest('[data-g-remover]')
  if (remover) return gravarGraficos(graficosAtuais().filter((g) => g.id !== remover.dataset.gRemover))

  if (t.closest('[data-g-salvar]')) {
    const lista = graficosAtuais()
    const salvo = { ...rascunho, id: rascunho.id || novoIdGrafico() }
    rascunho = null
    return gravarGraficos(lista.some((g) => g.id === salvo.id)
      ? lista.map((g) => (g.id === salvo.id ? salvo : g))
      : [...lista, salvo])
  }

  if (t.closest('#n-toggle')) {
    notesOpen = !notesOpen
    localStorage.setItem('cc-notes-open', notesOpen ? '1' : '0')
    return layoutNotas()
  }

  if (t.closest('#n-add')) {
    NOTES.unshift({ id: novoId(), title: '', text: '', h: 120 })
    armedNote = null
    renderNotas()
    $('#n-list .n-title')?.focus()
    return salvarNotas(true)
  }

  const modo = t.closest('[data-modo]')
  if (modo) {
    const n = NOTES.find((x) => x.id === modo.dataset.modo)
    if (!n) return
    if (n.kind === 'check') {
      n.kind = 'text' // as marcas viram "[x] " no texto: o que estava feito continua visível
    } else {
      n.kind = 'check'
      n.text = linhasDe(itensDe(n)) // normaliza: uma linha por item, sem vazias
    }
    renderNotas()
    return salvarNotas(true)
  }

  const marca = t.closest('[data-nota-check]')
  if (marca) {
    const n = NOTES.find((x) => x.id === marca.dataset.notaCheck)
    if (!n) return
    const i = +marca.dataset.i
    n.text = linhasDe(itensDe(n).map((it, k) => (k === i ? { ...it, done: !it.done } : it)))
    renderNotas()
    // o clique redesenhou a linha: devolve o foco pra quem marcou com teclado
    $(`[data-nota-check="${CSS.escape(n.id)}"][data-i="${i}"]`)?.focus()
    return salvarNotas()
  }

  const addItem = t.closest('[data-nota-add]')
  if (addItem) {
    const n = NOTES.find((x) => x.id === addItem.dataset.notaAdd)
    if (!n) return
    const itens = itensDe(n)
    n.text = linhasDe([...itens, { text: '', done: false }])
    renderNotas()
    $(`[data-nota-item="${CSS.escape(n.id)}"][data-i="${itens.length}"]`)?.focus()
    return salvarNotas()
  }

  const del = t.closest('[data-del]')
  if (del) {
    const id = del.dataset.del
    if (armedNote !== id) { armedNote = id; return renderNotas() } // primeiro clique só arma
    NOTES = NOTES.filter((n) => n.id !== id)
    armedNote = null
    renderNotas()
    return salvarNotas(true)
  }

  const aba = t.closest('button[data-tab]')
  if (aba) {
    tab = aba.dataset.tab
    localStorage.setItem('cc-tab', tab)
    armed = null
    render()
    if (tab === 'servidores') carregarServidores()
    if (tab === 'escritorio') carregarPaineis()
    if (tab === 'tempo' || tab === 'graficos') carregarTempo()
    if (tab === 'preco') carregarPreco()
    return
  }

  const verPainel = t.closest('[data-painel-ver]')
  if (verPainel && !t.closest('button, a')) {
    painelAtivo = verPainel.dataset.painelVer
    localStorage.setItem('cc-painel', painelAtivo)
    render()
    return
  }

  const ligar = t.closest('[data-painel-ligar]')
  if (ligar) {
    ligar.disabled = true
    ligar.textContent = 'ligando…'
    acaoPainel(ligar.dataset.painelLigar, 'ligar')
    return
  }

  const desligar = t.closest('[data-painel-desligar]')
  if (desligar) {
    desligar.disabled = true
    desligar.textContent = 'desligando…'
    acaoPainel(desligar.dataset.painelDesligar, 'desligar')
    return
  }

  const pip = t.closest('[data-painel-pip]')
  if (pip) {
    abrirPiP(pip.dataset.painelPip)
    return
  }

  const leg = t.closest('[data-legenda]')
  if (leg) {
    const id = leg.dataset.legenda
    legendaAberta.has(id) ? legendaAberta.delete(id) : legendaAberta.add(id)
    const lista = $('.leg-lista')
    if (lista) lista.innerHTML = viewLegendaEscritorio(filtered())
    return
  }

  const projTempo = t.closest('[data-tempo-proj]')
  if (projTempo) {
    const nome = projTempo.dataset.tempoProj
    tempoAberto.has(nome) ? tempoAberto.delete(nome) : tempoAberto.add(nome)
    return render()
  }

  if (t.closest('[data-tempo-recarregar]')) return carregarTempo('reler')
  if (t.closest('[data-tempo-limpar]')) {
    tempoParams.de = tempoParams.ate = ''
    return carregarTempo(true)
  }

  if (t.closest('.d-close') || t.id === 'scrim') { selected = null; return render() }

  const sort = t.closest('[data-sort]')
  if (sort) {
    const campo = sort.dataset.sort
    // mesma coluna de novo inverte; coluna nova começa do maior pro menor
    if (campo && campo === ordem.campo) ordem.desc = !ordem.desc
    else { ordem.campo = campo; ordem.desc = true }
    localStorage.setItem('cc-ordem', JSON.stringify(ordem))
    return render()
  }

  const acao = t.closest('button[data-act]')
  if (acao) {
    e.stopPropagation() // não abrir o painel lateral junto
    return executarAcao(acao)
  }

  const zone = t.closest('button[data-zone]')
  if (zone) {
    const k = zone.dataset.zone
    collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k)
    localStorage.setItem('cc-collapsed', JSON.stringify([...collapsed]))
    return render()
  }

  const kill = t.closest('button[data-kill]')
  if (kill) {
    const pid = Number(kill.dataset.kill)
    if (armed !== pid) { armed = pid; return render() } // primeiro clique só arma
    armed = null
    kill.disabled = true
    const r = await fetch('/api/kill', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pid }),
    })
    const out = await r.json()
    if (!out.ok) alert(out.error)
    SERVERS = null
    return carregarServidores(true)
  }

  const add = t.closest('button[data-add]')
  if (add) {
    const job = byId(add.dataset.add)
    if (!job) return
    job.todos = [...job.todos, { text: '', done: false }]
    render()
    // Foca pelo índice, nunca pelo último campo do DOM: as concluídas ficam
    // depois das abertas dentro do <details>, então "o último da tela" seria
    // uma tarefa já existente — e digitar em cima apagaria ela.
    const i = job.todos.length - 1
    document.querySelector(`.txt[data-edit="${CSS.escape(job.id)}"][data-i="${i}"]`)?.focus()
    return
  }

  const feitos = t.closest('details[data-feitos] > summary')
  if (feitos) {
    const id = feitos.parentElement.dataset.feitos
    feitosAbertos.has(id) ? feitosAbertos.delete(id) : feitosAbertos.add(id)
    localStorage.setItem('cc-feitos', JSON.stringify([...feitosAbertos]))
    return // o <details> abre sozinho, sem redesenhar
  }

  const linha = t.closest('[data-job]')
  if (linha && !t.matches('input, a')) {
    const id = linha.dataset.job
    selected = selected === id ? null : id
    return render()
  }
})

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && selected) { selected = null; return render() }
  if (e.key !== 'Enter' && e.key !== ' ') return
  if (e.target.matches?.('input, textarea, select')) return // espaço é espaço dentro do campo
  const alvo = e.target.closest?.('[data-job]')
  if (!alvo) return
  e.preventDefault()
  alvo.click()
})

document.addEventListener('change', (e) => {
  const rasc = e.target.closest('[data-rasc]')
  if (rasc && rascunho) {
    rascunho[rasc.dataset.rasc] = rasc.value
    return render()
  }

  const cb = e.target.closest('input[data-todo]')
  if (cb) return toggleTodo(cb.dataset.todo, +cb.dataset.i, cb.checked)

  // `change` só dispara ao sair do campo ou no Enter — uma gravação por
  // edição, não uma por tecla
  const campo = e.target.closest('.txt[data-edit]')
  if (campo) return editarTodo(campo.dataset.edit, +campo.dataset.i, campo.value)

  const nota = e.target.closest('[data-nota-job]')
  if (nota) return editarNotaDoAgente(nota.dataset.notaJob, nota.value)

  const taxa = e.target.closest('[data-taxa]')
  if (taxa) return salvarTaxa(taxa.dataset.projeto || null, taxa.value)

  const cambio = e.target.closest('[data-cambio]')
  if (cambio) return salvarCambio(cambio.value)

  const assin = e.target.closest('[data-assinatura]')
  if (assin) return salvarNumero('/api/assinatura', assin.value)

  const un = e.target.closest('[data-preco="unidade"]')
  if (un) {
    precoUnidade = un.value
    localStorage.setItem('cc-preco-unidade', precoUnidade)
    precoAberta = null
    return carregarPreco(true)
  }
  const horasCampo = e.target.closest('[data-preco-horas]')
  if (horasCampo) {
    const item = PRECO.tarefas.find((x) => chaveDe(x) === horasCampo.dataset.precoHoras)
    return ajustarTarefa(item, { horas: Number(horasCampo.value) || 0 })
  }
  // Digitar um valor/hora congela os três: buscar de novo sobrescreveria o que
  // o Felipe escolheu, então a marca de manual vale para a tabela inteira.
  const mercadoCampo = e.target.closest('[data-mercado]')
  if (mercadoCampo) {
    const v = Math.max(0, Number(mercadoCampo.value) || 0)
    const faixa = (n) => (n === mercadoCampo.dataset.mercado
      ? { min: v, max: v }
      : { min: PRECO.valorHora[n], max: PRECO.valorHora[n] })
    return fetch('/api/mercado', {
      method: 'POST',
      body: JSON.stringify({
        junior: faixa('junior'), pleno: faixa('pleno'), senior: faixa('senior'),
        fonte: 'você digitou',
      }),
    }).then(() => carregarPreco(true))
  }

  const ctl = e.target.closest('[data-tempo]')
  if (ctl) {
    tempoParams[ctl.dataset.tempo] = ctl.value
    if (ctl.dataset.tempo === 'corte') localStorage.setItem('cc-corte', ctl.value)
    carregarTempo(true) // o corte é recalculado do cache, não relê os arquivos
  }
})

/** Confirma no próprio botão, sem redesenhar a linha inteira nem usar alerta. */
function piscar(botao, texto) {
  const antes = botao.textContent
  botao.textContent = texto
  setTimeout(() => { botao.textContent = antes }, 1200)
}

async function copiar(botao, texto) {
  try {
    await navigator.clipboard.writeText(texto)
    piscar(botao, '✓')
  } catch {
    piscar(botao, '✕')
  }
}

async function executarAcao(botao) {
  const job = byId(botao.dataset.id)
  if (!job) return
  const acao = botao.dataset.act

  if (acao === 'resume') return copiar(botao, `claude --resume ${job.sessionId}`)
  if (acao === 'path') return copiar(botao, job.worktreePath || job.cwd)

  if (acao === 'pin') {
    // pin do CLI é só leitura: aqui só se mexe no que o painel escreveu
    if (job.pinned && !job.pinnedAqui) return
    const novo = !job.pinnedAqui
    job.pinned = novo
    job.pinnedAqui = novo
    render()
    await fetch('/api/meta', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: job.id, patch: { pin: novo || null } }),
    })
  }
}

/** Nota vazia some do meta.json: `null` no patch apaga o campo. */
async function editarNotaDoAgente(jobId, texto) {
  const job = byId(jobId)
  if (!job) return
  const limpo = texto.trim()
  if (limpo === (job.notes || '')) return
  job.notes = limpo
  await fetch('/api/meta', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: jobId, patch: { notes: limpo || null } }),
  })
}

// saiu do campo: o que o stream mandou durante a digitação entra agora
// (o setTimeout existe porque no focusout o foco ainda está no ar)
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (editando()) return
    if (dadosPendentes) {
      const d = dadosPendentes
      dadosPendentes = null
      return aplicarDados(d)
    }
    if (redesenhoAdiado) render()
  }, 0)
})

async function gravarTodos(job, todos) {
  job.todos = todos
  job.todosDone = todos.filter((t) => t.done).length
  render()
  await fetch('/api/meta', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: job.id, patch: { todos } }),
  })
}

function toggleTodo(jobId, i, valor) {
  const job = byId(jobId)
  if (!job || !job.todos[i]) return
  gravarTodos(job, job.todos.map((t, k) => (k === i ? { ...t, done: valor ?? !t.done } : t)))
}

/** Texto em branco apaga a tarefa — é o jeito de desfazer um "+" sem outro botão. */
function editarTodo(jobId, i, texto) {
  const job = byId(jobId)
  if (!job || !job.todos[i]) return
  const limpo = texto.trim()
  if (limpo === job.todos[i].text) return
  gravarTodos(job, limpo
    ? job.todos.map((t, k) => (k === i ? { ...t, text: limpo } : t))
    : job.todos.filter((_, k) => k !== i))
}

for (const el of ['#q', '#proj']) $(el).addEventListener('input', render)

// Volume: `input` move a barra ao vivo, `change` é que grava. Enquanto o dedo
// está na barra, o redesenho fica travado — senão o stream devolveria o valor
// antigo no meio do arrasto e a barra pularia para trás.
$player().addEventListener('pointerdown', (e) => { if (e.target.matches('[data-vol]')) arrastandoVolume = true })
$player().addEventListener('input', (e) => {
  if (!e.target.matches('[data-vol]')) return
  const rotulo = $player().querySelector('.p-vol b')
  if (rotulo) rotulo.textContent = `${e.target.value}%`
})
$player().addEventListener('change', (e) => {
  if (!e.target.matches('[data-vol]')) return
  arrastandoVolume = false
  const s = sessaoAtual()
  if (s?.pid) mandarMidia({ pid: s.pid, nivel: Number(e.target.value) }, 'volume')
})

// O menu só pode ser montado agora: no head, o <select> ainda não existia.
$('#tema-sel').innerHTML = '<option value="auto">tema: automático</option>'
  + TEMAS.map((t) => `<option value="${t.id}">tema: ${t.nome}</option>`).join('')
$('#tema-sel').addEventListener('change', (e) => {
  temaModo = e.target.value
  localStorage.setItem('cc-tema', temaModo)
  aplicarTema()
})
aplicarTema()

// ?static=1 não abre o SSE: com a conexão pendurada, captura headless nunca
// considera a página carregada. Serve pra screenshot e impressão.
if (!params.has('static')) {
  new EventSource('/events').onmessage = (e) => aplicarDados(JSON.parse(e.data))
}
fetch('/api/jobs').then((r) => r.json()).then((d) => {
  DATA = d
  render()
  if (tab === 'servidores') carregarServidores()
  if (tab === 'escritorio') carregarPaineis()
  if (tab === 'tempo' || tab === 'graficos') carregarTempo()
  if (tab === 'preco') carregarPreco()
})

fetch('/api/graficos').then((r) => r.json()).then((d) => {
  GRAFICOS = d.graficos
  if (tab === 'graficos') render()
})

layoutNotas()
fetch('/api/notes').then((r) => r.json()).then((d) => { NOTES = d.notes || []; renderNotas() })

// A mídia tem ritmo próprio: não vem no stream porque cada leitura custa ~500ms
// no Windows, e o tique de 2s dos agentes não pode esperar por isso.
carregarMidia()
// Em `static` fica na leitura única: o intervalo manteria a captura headless
// esperando para sempre, pelo mesmo motivo que o SSE fica desligado lá.
if (!params.has('static')) setInterval(carregarMidia, 4000)
</script>
