  corte: Number(params.get('corte')) || Number(localStorage.getItem('cc-corte')) || 15,
  de: params.get('de') || '',
  ate: params.get('ate') || '',
}
const tempoAberto = new Set()
let armed = null              // pid com "encerrar" armado, aguardando confirmação
let selected = params.get('open') || null

const TABS = [
  { id: 'agentes', label: 'agentes' },
  // CC-83: o nome vem do Scrum, que ele já domina — decisão dele em 15/08:
  // "vamos chamar os to-dos de sprint backlog? fica melhor usar aquela ideia
  // dos nomes do scrum pras coisas". O `id` continua `todos` de propósito:
  // trocar mandaria quem tem a aba lembrada no localStorage pra outro lugar.
  { id: 'todos', label: 'sprint' },
  // id continua `projetos` de propósito: mudar mandaria quem tem a aba
  // lembrada no localStorage pra outro lugar sem motivo.
  { id: 'projetos', label: 'cockpit' },
  { id: 'tempo', label: 'tempo' },
  { id: 'graficos', label: 'gráficos' },
  { id: 'preco', label: 'preço' },
  { id: 'agenda', label: 'agenda' },
  { id: 'hooks', label: 'hooks' },
  { id: 'rotinas', label: 'rotinas' },
  { id: 'servidores', label: 'servidores' },
  { id: 'vps', label: 'VPS' },
  { id: 'escritorio', label: 'escritório' },
  // CC-63/64: o que depende dele, e o glossário. Ficam no fim até o redesign
  // de abas agrupar tudo — acrescentar aba solta é exatamente o que ele
  // reclamou, mas sem tela o recurso não existe pra ele.
  { id: 'meu', label: 'meu' },
  { id: 'glossario', label: 'glossário' },
  { id: 'remoto', label: 'remoto' },
]

/**
 * F11: as quatro portas.
 *
 * Eram 15 abas numa fileira só, e duas delas nasceram no mesmo dia do redesign
 * — o Felipe reclamou com razão. O critério de agrupamento é dele: **a pergunta
 * que ele faz**, nunca o tipo de dado. Dois grupos ele nomeou diretamente
 * (tempo/gráficos/preço juntos; servidores/VPS/hooks/remoto juntos), os outros
 * seguem a mesma lógica.
 *
 * A aba continua sendo a unidade real: `tab` guarda o id de sempre, `?tab=`
 * continua valendo (a captura de tela depende disso) e o localStorage de quem
 * já usa não muda de lugar. O grupo é derivado da aba ativa, não guardado —
 * um estado a menos para dessincronizar.
 */
const GRUPOS = [
  { id: 'agora', label: 'agora', abas: ['projetos', 'agentes', 'todos', 'meu', 'escritorio'] },
  { id: 'custo', label: 'custo', abas: ['tempo', 'graficos', 'preco'] },
  { id: 'controle', label: 'controle', abas: ['servidores', 'vps', 'hooks', 'rotinas', 'remoto'] },
  { id: 'saber', label: 'saber', abas: ['glossario', 'agenda'] },
]
// A aba lembrada pode não existir mais: quem tinha `custo` guardado abriria o
// painel sem nenhuma aba marcada.
let tab = params.get('tab') || localStorage.getItem('cc-tab') || 'agentes'
if (!TABS.some((t) => t.id === tab)) tab = 'agentes'

const collapsed = params.has('expand')
  ? new Set()
  : new Set(JSON.parse(localStorage.getItem('cc-collapsed') || '["done","idle"]'))

// quais agentes estão com as tarefas concluídas à mostra na aba de to-dos
const feitosAbertos = new Set(JSON.parse(localStorage.getItem('cc-feitos') || '[]'))
const tudoAberto = params.has('expand') // captura de tela precisa ver tudo

// ordem da tabela de agentes; campo vazio = agrupado por urgência
const ordem = { campo: '', desc: true, ...JSON.parse(localStorage.getItem('cc-ordem') || '{}') }

const ZONES = [
  { key: 'waiting', title: 'precisa de você' },
  { key: 'failed', title: 'falhou' },
  { key: 'working', title: 'trabalhando' },
  { key: 'idle', title: 'parados' },
  { key: 'done', title: 'prontos' },
]
const LABEL = { working: 'ativos', waiting: 'esperando', failed: 'falharam', done: 'prontos', idle: 'parados' }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const age = (ms) => {
  if (!(ms >= 0)) return '—'
  const m = Math.floor(ms / 6e4)
  if (m < 60) return m + 'm'
  const h = Math.floor(m / 60)
  return h < 24 ? h + 'h' + String(m % 60).padStart(2, '0') : Math.floor(h / 24) + 'd' + (h % 24) + 'h'
}
const tok = (n) => !n ? '—' : n < 1e3 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k'
  : n < 1e9 ? (n / 1e6).toFixed(1) + 'M' : (n / 1e9).toFixed(1) + 'B'
const byId = (id) => DATA.jobs.find((j) => j.id === id)

function filtered() {
  const q = $('#q').value.trim().toLowerCase()
  const proj = $('#proj').value
  const maq = $('#maq').value
  return DATA.jobs.filter((j) => {
    // CC-47: "só este desktop", "só a VPS", ou tudo. Compara por id e não por
    // nome: renomear a máquina não pode zerar o filtro guardado.
    if (maq && j.origem?.id !== maq) return false
    if (proj && j.project !== proj) return false
    if (!q) return true
    return [j.subject, j.route, j.project, j.sub, j.category, j.detail, j.model, j.id, j.lastPrompt,
      ...j.todos.map((t) => t.text)].join(' ').toLowerCase().includes(q)
  })
}

/* ============================ topo ============================ */

/**
 * Uso do plano, no topo e em toda aba — é o número que decide se dá pra
 * despachar mais um agente agora. Vem do statusLine do Claude Code, então
 * só anda quando ele responde algo: por isso a hora da leitura aparece
 * quando envelhece, em vez de fingir que é de agora.
 */
function renderUso() {
  const u = DATA.uso
  const alvo = $('#uso')
  if (!u || (!u.cincoHoras && !u.semana)) {
    alvo.innerHTML = ''
    alvo.title = 'sem leitura ainda — aparece depois da próxima resposta do Claude Code'
    return
  }
  const faixa = (p) => (p >= 85 ? 'alto' : p >= 60 ? 'medio' : 'baixo')
  const relogio = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
  const dia = (ms) => new Date(ms).toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')
  /** Quanto falta para zerar, curto o bastante para caber ao lado do número. */
  const falta = (ms) => {
    const min = Math.round((ms - Date.now()) / 60000)
    if (min <= 0) return 'zerando'
    if (min < 60) return `${min}min`
    const h = Math.floor(min / 60)
    return h < 24 ? `${h}h${String(min % 60).padStart(2, '0')}` : `${Math.floor(h / 24)}d${h % 24}h`
  }
  const medidor = (rot, j, nota = '') => {
    if (!j) return ''
    const quando = j.resetaEm
      ? `zera ${falta(j.resetaEm)} — ${dia(j.resetaEm)} às ${relogio(j.resetaEm)}`
      : 'sem hora de virada informada'
    return `<span class="u-item n-${faixa(j.pct)}" title="${rot}: ${j.pct.toFixed(1)}% usado · ${quando}${nota ? ` · ${nota}` : ''}">
      <span class="u-rot">${rot}</span>
      <span class="u-barra"><i style="width:${Math.min(j.pct, 100)}%"></i></span>
      <b>${Math.round(j.pct)}%</b>
      ${j.resetaEm ? `<span class="u-reset">${falta(j.resetaEm)}</span>` : ''}
    </span>`
  }
  // Só avisa quando a leitura envelhece: enquanto o Claude Code está sendo
  // usado, ela é de segundos atrás e dizer isso seria ruído.
  const velha = Date.now() - u.em > 20 * 60_000
  alvo.innerHTML = medidor('5h', u.cincoHoras)
    + medidor('semana', u.semana, 'o Fable puxa desta janela, até 50% dela, e mais rápido que o Opus')
    + medidor('opus', u.semanaOpus)
    + medidor('sonnet', u.semanaSonnet)
    + (velha ? `<span class="u-velho" title="a leitura vem do statusLine e só anda quando o Claude Code responde">${age(Date.now() - u.em)} atrás</span>` : '')
  alvo.title = `uso do plano, leitura de ${relogio(u.em)}. `
    + 'O Fable não tem janela própria: consome da semanal, com teto de 50% dela.'
}

function renderHeader() {
  const s = DATA.summary
  renderUso()
  /* CC-74: contador zerado não ocupa espaço. No print dele, em tela estreita,
     a linha era "1 esperando · 0 falharam · 0 ativos · 0 parados · 7 prontos":
     quatro dos cinco números eram zero, e ocupavam a mesma altura que os dois
     que importavam. Zero não é informação aqui — é a ausência dela.

     `done` fica sempre, mesmo em zero: "0 prontos" é resposta legítima a "o que
     terminou?", e sem ele a linha ficaria vazia num dia parado. */
  $('#counts').innerHTML = ['waiting', 'failed', 'working', 'idle', 'done']
    .filter((k) => (s[k] ?? 0) > 0 || k === 'done')
    .map((k) => {
      const n = s[k] ?? 0
      const hot = n > 0 && (k === 'waiting' || k === 'failed')
      return `<span class="count${hot ? ' hot' : ''}" style="${hot ? `color:var(--${k})` : ''}"><b>${n}</b>${LABEL[k]}</span>`
    }).join('') + `<span class="count"><b>${tok(s.tokens)}</b>tokens</span>`

  const sel = $('#proj'), cur = sel.value
  sel.innerHTML = ['<option value="">todos os projetos</option>']
    .concat((s.projects || []).map((p) => `<option${p === cur ? ' selected' : ''}>${esc(p)}</option>`)).join('')

  // CC-47: o seletor de máquina. Escondido enquanto só existe uma, porque aí
  // ele seria uma escolha sem alternativa ocupando espaço no celular.
  const maqs = DATA.maquinas || []
  const selMaq = $('#maq')
  selMaq.hidden = maqs.length < 2
  if (!selMaq.hidden) {
    const escolhida = selMaq.value || localStorage.getItem('cc-maquina') || ''
    selMaq.innerHTML = ['<option value="">todas as máquinas</option>']
      .concat(maqs.map((m) => {
        const rotulo = m.local ? `${m.nome} (aqui)` : m.semContato ? `${m.nome} · sem contato` : m.nome
        return `<option value="${esc(m.id)}"${m.id === escolhida ? ' selected' : ''}>${esc(rotulo)}</option>`
      })).join('')
  }

  const counts = {
    agentes: DATA.jobs.length,
    todos: DATA.jobs.reduce((a, j) => a + j.todos.filter((t) => !t.done).length, 0),
    projetos: (s.projects || []).length,
    servidores: SERVERS ? SERVERS.filter((x) => x.dev).length : null,
  }
  // F11: duas fileiras. Em cima os quatro grupos, embaixo as abas do grupo
  // ativo. O grupo sai da aba, nunca do contrário: guardar os dois criaria a
  // chance de discordarem, e aí o painel abriria num grupo que não contém a
  // aba marcada.
  const grupoAtivo = GRUPOS.find((g) => g.abas.includes(tab)) || GRUPOS[0]
  const soma = (g) => g.abas.reduce((a, id) => a + (counts[id] || 0), 0)

  const linhaGrupos = GRUPOS.map((g) => {
    const n = soma(g)
    return `<button class="grupo" data-grupo="${g.id}" aria-selected="${g.id === grupoAtivo.id}">
      ${g.label}${n ? `<span class="n">${n}</span>` : ''}
    </button>`
  }).join('')

  const doGrupo = grupoAtivo.abas
    .map((id) => TABS.find((t) => t.id === id))
    .filter(Boolean)

  $('#tabs').innerHTML = `<div class="tab-grupos">${linhaGrupos}</div>
    <div class="tab-abas">${doGrupo.map((t) => `
      <button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === tab}">
        ${t.label}${counts[t.id] != null ? `<span class="n">${counts[t.id]}</span>` : ''}
      </button>`).join('')}</div>`
}

/* ===================== janela flutuante (resumo) =====================
   Um resumo compacto numa janela real do SO via documentPictureInPictureAPI:
   sobrevive a trocar de aba ou minimizar o Chrome, ao contrário de um
   elemento fixo na página. Só existe em Chrome/Edge recentes; sem a API o
   botão fica escondido.

   O que aparece é configurável (`PIP_CFG.blocos`) e o layout tem dois modos:
   `quadrado` empilha cartões e ganha abas própias quando há mais de um bloco
   ativo (não precisa voltar pro Control Center pra trocar de vista); `fita`
   condensa tudo numa linha só, pensada pra encostar num canto da tela sem
   cobrir nada. Cada bloco por isso tem duas saídas — `full` (cartão) e `fita`
   (uma frase curta) — em vez de um único HTML reaproveitado nos dois modos. */

let pipWin = null
let PIP_CFG = { blocos: ['uso', 'agentes'], layout: 'quadrado' }
let pipAbaAtiva = localStorage.getItem('cc-pip-aba') || null

/** Uma pastilha da fita: rótulo curto + valor em destaque, cor opcional por faixa. */
const pipChip = (rotulo, valor, faixa = '') => `<span class="pip-chip${faixa ? ' n-' + faixa : ''}">
  <span class="pip-chip-rot">${esc(rotulo)}</span><b>${esc(valor)}</b></span>`
const faixaPct = (v, altoEm = 90, medioEm = 70) => (v == null ? '' : v >= altoEm ? 'alto' : v >= medioEm ? 'medio' : 'baixo')

function pipUsoFull() {
  const u = DATA.uso
  const barra = (rot, j) => !j ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${j.pct >= 85 ? 'alto' : j.pct >= 60 ? 'medio' : 'baixo'}">
      <span class="u-barra"><i style="width:${Math.min(j.pct, 100)}%"></i></span>
      <b>${Math.round(j.pct)}%</b>
    </span></div>`
  return barra('5h', u?.cincoHoras) + barra('semana', u?.semana) || '<p class="pip-vazio">sem leitura ainda</p>'
}
const pipUsoFita = () => {
  const u = DATA.uso
  const item = (rot, j) => (j ? pipChip(rot, `${Math.round(j.pct)}%`, faixaPct(j.pct, 85, 60)) : '')
  return item('5h', u?.cincoHoras) + item('sem', u?.semana) || pipChip('uso', '—')
}

function pipAgentesFull() {
  // "em andamento" e não "todos": pronto/parado não é o que se quer ver de
  // relance sem a tela por perto — é o que ainda pede atenção
  const emAndamento = DATA.jobs.filter((j) => j.status === 'working' || j.status === 'waiting')
    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
  if (!emAndamento.length) return '<p class="pip-vazio">nenhum agora</p>'
  return emAndamento.map((j) => `<div class="pip-ag">
    <b style="color:var(--${j.status})">● ${esc(j.project)}${j.frente ? ` › ${esc(j.frente)}` : ''}</b>
    <p title="${esc(j.subject || j.detail || '')}">${esc(j.subject || j.detail || '—')}</p>
    <p>${j.todos.length ? `${j.todosDone}/${j.todos.length} to-dos` : 'sem to-dos'} · ${tok(j.tokens)} tokens</p>
  </div>`).join('')
}
const pipAgentesFita = () => {
  const jobs = DATA.jobs.filter((j) => j.status === 'working' || j.status === 'waiting')
  const esperando = jobs.filter((j) => j.status === 'waiting').length
  // esperando pede atenção — vermelho não é exagero aqui, é o mesmo critério
  // do contador "esperando" no topo do painel
  return pipChip('agentes', String(jobs.length), esperando ? 'alto' : '')
}

function pipMaquinaFull() {
  if (!MAQUINA || MAQUINA.erro) return '<p class="pip-vazio">sem leitura</p>'
  const { cpu, ram, gpu } = MAQUINA
  const linha = (rot, uso) => (uso == null ? '' : `<div class="pip-item"><span class="pip-rot">${rot}</span>
    <span class="u-item n-${uso >= 90 ? 'alto' : uso >= 70 ? 'medio' : 'baixo'}">
    <span class="u-barra"><i style="width:${Math.min(uso, 100)}%"></i></span><b>${Math.round(uso)}%</b></span></div>`)
  return linha('cpu', cpu?.uso) + linha('ram', ram?.uso) + (gpu ? linha('gpu', gpu.uso) : '')
}
const pipMaquinaFita = () => {
  if (!MAQUINA || MAQUINA.erro) return pipChip('máquina', '—')
  const { cpu, ram, gpu } = MAQUINA
  const item = (rot, v) => (v == null ? '' : pipChip(rot, `${Math.round(v)}%`, faixaPct(v)))
  return item('cpu', cpu?.uso) + item('ram', ram?.uso) + (gpu ? item('gpu', gpu.uso) : '')
}

function pipServidoresFull() {
  const dev = (SERVERS || []).filter((s) => s.dev)
  if (!dev.length) return '<p class="pip-vazio">nenhum agora</p>'
  return dev.map((s) => `<div class="pip-ag"><b>:${s.ports[0]} ${esc(s.titulo || s.name)}</b>
    ${s.resumo ? `<p>${esc(s.resumo)}</p>` : ''}</div>`).join('')
}
const pipServidoresFita = () => {
  const n = (SERVERS || []).filter((s) => s.dev).length
  return pipChip('servidores', String(n))
}

function pipDockerFull() {
  if (!DOCKER || DOCKER.disponivel === false) return '<p class="pip-vazio">sem Docker nesta máquina</p>'
  if (!DOCKER.containers) return '<p class="pip-vazio">lendo…</p>'
  const rodando = DOCKER.containers.filter((c) => c.rodando)
  if (!rodando.length) return '<p class="pip-vazio">nenhum container rodando</p>'
  return rodando.map((c) => `<div class="pip-ag"><b>● ${esc(c.nome)}</b><p>${esc(c.imagem)}</p></div>`).join('')
}
const pipDockerFita = () => {
  if (!DOCKER || DOCKER.disponivel === false) return ''
  const n = (DOCKER.containers || []).filter((c) => c.rodando).length
  return pipChip('docker', String(n))
}

function pipProcessosFull() {
  if (!PROCESSOS) return '<p class="pip-vazio">sem leitura</p>'
  const linha = (p, valor) => `<div class="pip-item"><span class="pip-proc-nome">${esc(p.nome)}</span><b>${esc(valor)}</b></div>`
  const bloco = (tit, lista, valor) => !lista.length ? '' : `<b class="pip-sec-tit">${tit}</b>${lista.slice(0, 4).map((p) => linha(p, valor(p))).join('')}`
  const saida = bloco('cpu', PROCESSOS.porCpu, (p) => `${Math.round(p.cpuPct)}%`)
    + bloco('ram', PROCESSOS.porRam, (p) => `${p.ramMB} MB`)
  return saida || '<p class="pip-vazio">sem leitura ainda</p>'
}
const pipProcessosFita = () => {
  const top = PROCESSOS?.porRam?.[0]
  return top ? pipChip(top.nome.slice(0, 16), `${top.ramMB} MB`) : ''
}

const PIP_BLOCO = {
  uso: { label: 'uso do plano', full: pipUsoFull, fita: pipUsoFita },
  agentes: { label: 'agentes', full: pipAgentesFull, fita: pipAgentesFita },
  maquina: { label: 'cpu/ram/gpu', full: pipMaquinaFull, fita: pipMaquinaFita },
  servidores: { label: 'servidores', full: pipServidoresFull, fita: pipServidoresFita },
  docker: { label: 'docker', full: pipDockerFull, fita: pipDockerFita },
  processos: { label: 'processos', full: pipProcessosFull, fita: pipProcessosFita },
}

async function carregarPip() {
  try {
    const d = await (await fetch('/api/pip')).json()
    if (d.pip) PIP_CFG = d.pip
  } catch { /* fica no padrão */ }
  renderPipConfig()
  renderPip()
}

/** Grava e aplica na hora — a janelinha não pode esperar o próximo tique. */
async function salvarPip(patch) {
  const r = await fetch('/api/pip', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  PIP_CFG = out.pip
  renderPipConfig()
  // layout novo muda o tamanho da janela, e isso só se consegue reabrindo —
  // documentPictureInPicture não redimensiona uma janela já aberta
  if (pipWin && 'layout' in patch) { pipWin.close(); await alternarPip() }
  else renderPip()
}

function atualizarBotaoPip() {
  const b = $('#pip-toggle')
  if (!b) return
  const g = $('#pip-config-toggle')
  if (!('documentPictureInPicture' in window)) { b.hidden = true; g.hidden = true; return }
  b.hidden = false
  g.hidden = false
  b.textContent = pipWin ? 'fechar flutuante' : 'flutuar'
  b.setAttribute('aria-pressed', String(!!pipWin))
  // `?pipcfg=1` abre o popover de configuração: o headless não clica em nada,
  // então sem isto não dá pra capturar essa parte da tela
  if (params.has('pipcfg')) {
    const el = $('#pip-config')
    el.hidden = false
    const r = $('#pip-config-toggle').getBoundingClientRect()
    el.style.top = `${Math.round(r.bottom + 8)}px`
    el.style.right = `${Math.round(window.innerWidth - r.right)}px`
  }
}

function renderPipConfig() {
  const el = $('#pip-config')
  if (!el) return
  const check = (b) => `<label class="pip-cfg-item">
    <input type="checkbox" data-pip-bloco="${b}" ${PIP_CFG.blocos.includes(b) ? 'checked' : ''}>
    ${esc(PIP_BLOCO[b].label)}
  </label>`
  el.innerHTML = `
    <b class="pip-cfg-tit">janela flutuante mostra</b>
    <div class="pip-cfg-blocos">${Object.keys(PIP_BLOCO).map(check).join('')}</div>
    <b class="pip-cfg-tit">formato</b>
    <div class="pip-cfg-blocos">
      <label class="pip-cfg-item"><input type="radio" name="pip-layout" value="quadrado" ${PIP_CFG.layout === 'quadrado' ? 'checked' : ''}> quadrado, com abas</label>
      <label class="pip-cfg-item"><input type="radio" name="pip-layout" value="fita" ${PIP_CFG.layout === 'fita' ? 'checked' : ''}> fita horizontal</label>
    </div>`
}

/** Tamanho de abertura por layout — fita é pra encostar numa borda da tela. */
const PIP_TAMANHO = { quadrado: [300, 420], fita: [620, 54] }

async function alternarPip() {
  if (pipWin) { pipWin.close(); return }
  const [width, height] = PIP_TAMANHO[PIP_CFG.layout] || PIP_TAMANHO.quadrado
  pipWin = await documentPictureInPicture.requestWindow({ width, height })
  pipWin.document.title = 'Agent Cockpit — resumo'
  // mesma folha de estilo da página principal: reaproveita as variáveis de
  // tema em vez de manter uma segunda paleta sincronizada à mão
  pipWin.document.head.append(document.querySelector('style').cloneNode(true))
  const extra = document.createElement('style')
  extra.textContent = `
    body { margin: 0; background: var(--bg); color: var(--fg); font: 12px var(--mono); overflow: hidden; }
    #pip-root { height: 100vh; box-sizing: border-box; overflow-y: auto; }
    #pip-root.quadrado { padding: 10px 12px 14px; display: grid; gap: 8px; align-content: start; }
    #pip-root.fita { display: flex; align-items: center; gap: 0; padding: 0 12px; white-space: nowrap; overflow-x: auto; overflow-y: hidden; }
    /* cada bloco é um grupo de pastilhas, com uma linha fina separando do próximo */
    .pip-grupo { display: inline-flex; align-items: center; gap: 6px; padding-right: 12px; margin-right: 12px; border-right: 1px solid var(--line); flex: none; }
    .pip-grupo:last-child { border-right: none; padding-right: 0; margin-right: 0; }
    .pip-chip {
      display: inline-flex; align-items: baseline; gap: 5px; flex: none;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: 4px 10px; font-size: 12px; line-height: 1;
    }
    .pip-chip b { font-variant-numeric: tabular-nums; }
    .pip-chip-rot { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .02em; }
    .pip-chip.n-alto { border-color: var(--failed); color: var(--failed); }
    .pip-chip.n-medio { border-color: var(--waiting); color: var(--waiting); }
    .pip-chip.n-baixo { border-color: var(--done); color: var(--done); }
    .pip-chip.n-alto .pip-chip-rot, .pip-chip.n-medio .pip-chip-rot, .pip-chip.n-baixo .pip-chip-rot { color: inherit; opacity: .75; }
    .pip-abas { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px; }
    .pip-aba {
      background: none; border: 1px solid var(--line); color: var(--dim); cursor: pointer;
      border-radius: 999px; padding: 3px 10px; font: 10.5px var(--mono);
    }
    .pip-aba.on { color: var(--acento); border-color: var(--acento); }
    .pip-item { display: flex; align-items: center; gap: 8px; }
    .pip-rot { width: 46px; flex: none; color: var(--faint); font-size: 10px; text-transform: uppercase; }
    .pip-ag { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
    .pip-ag + .pip-ag { margin-top: 5px; }
    .pip-ag b { display: block; font-size: 11.5px; }
    .pip-ag p { margin: 2px 0 0; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pip-vazio { color: var(--faint); margin: 0; }
    .pip-sec + .pip-sec { margin-top: 10px; }
    .pip-sec-tit { display: block; font-size: 10px; letter-spacing: .04em; color: var(--faint); text-transform: uppercase; margin-bottom: 5px; }
    .pip-proc-nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 11px; }
  `
  pipWin.document.head.append(extra)
  const root = document.createElement('div')
  root.id = 'pip-root'
  pipWin.document.body.append(root)
  // abas moram na própria janelinha: sem isto, trocar de vista exigiria
  // voltar pro Control Center — justamente o que a janela existe pra evitar
  pipWin.document.addEventListener('click', (e) => {
    const aba = e.target.closest('[data-pip-aba]')
    if (!aba) return
    pipAbaAtiva = aba.dataset.pipAba
    localStorage.setItem('cc-pip-aba', pipAbaAtiva)
    renderPip()
  })
  // fechada pela pessoa (botão nativo da janelinha) ou pelo botão da página:
  // os dois caminhos passam por aqui, então só um listener basta
  pipWin.addEventListener('pagehide', () => { pipWin = null; atualizarBotaoPip() })
  atualizarBotaoPip()
  renderPip()
  // "processos" é caro e nunca roda sozinho — mas pedir pra aparecer no PiP
  // e nunca carregar também seria ruim. Abrir a janelinha com ele escolhido
  // conta como o clique que autoriza a leitura, uma vez.
  if (PIP_CFG.blocos.includes('processos')) carregarProcessos()
}

/** Os blocos escolhidos em configurações, no formato escolhido. */
function renderPip() {
  atualizarBotaoPip()
  if (!pipWin) return
  const root = pipWin.document.getElementById('pip-root')
  if (!root) return
  // tema pode trocar com a janelinha já aberta (auto virando escuro à noite)
  pipWin.document.documentElement.dataset.tema = document.documentElement.dataset.tema
  root.className = PIP_CFG.layout === 'fita' ? 'fita' : 'quadrado'

  const ativos = PIP_CFG.blocos.filter((b) => PIP_BLOCO[b])
  if (!ativos.length) { root.innerHTML = '<p class="pip-vazio">nada selecionado — configure em ⚙, no painel</p>'; return }

  if (PIP_CFG.layout === 'fita') {
    // cada bloco vira um grupo de pastilhas (uma ou mais), separado do
    // próximo por uma linha fina — bloco sem nada a mostrar agora (Docker
    // não instalado, processos nunca lidos) simplesmente não aparece
    const grupos = ativos.map((b) => PIP_BLOCO[b].fita()).filter(Boolean)
    root.innerHTML = grupos.length
      ? grupos.map((h) => `<span class="pip-grupo">${h}</span>`).join('')
      : '<span class="pip-vazio">nada pra mostrar ainda</span>'
    return
  }

  // "geral" é tudo empilhado — a vista original, e o padrão de abertura.
  // Com um bloco só ela seria idêntica à aba dele, então nem aparece.
  const opcoes = ativos.length > 1 ? ['geral', ...ativos] : ativos
  if (!opcoes.includes(pipAbaAtiva)) pipAbaAtiva = opcoes[0]

  const abas = opcoes.length > 1
    ? `<div class="pip-abas">${opcoes.map((b) => `<button class="pip-aba${b === pipAbaAtiva ? ' on' : ''}"
        data-pip-aba="${b}">${b === 'geral' ? 'geral' : esc(PIP_BLOCO[b].label)}</button>`).join('')}</div>`
    : ''
  const conteudo = pipAbaAtiva === 'geral'
    ? ativos.map((b) => `<div class="pip-sec"><b class="pip-sec-tit">${esc(PIP_BLOCO[b].label)}</b>${PIP_BLOCO[b].full()}</div>`).join('')
    : PIP_BLOCO[pipAbaAtiva].full()
  root.innerHTML = abas + conteudo
}

/* ======================= aba: agentes ======================== */

/**
 * Um agente vira um cartão, e a leitura é de cima pra baixo: o que é, de quem
 * é, o que está fazendo agora, quanto falta. Tabela obrigava a varrer a linha
 * inteira até o fim da tela para juntar as mesmas quatro coisas.
 */
/**
 * De onde vem este agente, e de que tipo ele é.
 *
 * CC-47: com duas máquinas na mesma tela, "quem está fazendo isso" deixa de ser
 * óbvio. A pastilha só aparece quando há mais de uma máquina: no uso de uma
 * máquina só ela seria carimbo repetido em toda linha.
 *
 * CC-51: `interativa` é a sessão que você mesmo está tocando (terminal ou
 * celular), diferente do job que roda sozinho. Sem essa distinção, uma sessão
 * sua apareceria como se fosse um agente trabalhando em background.
 */
function selo(j) {
  const varias = (DATA.maquinas || []).length > 1
  const partes = []
  if (varias && j.origem?.nome) {
    const velho = j.origem.semContato ? ` · sem contato há ${age(j.origem.idadeMs)}` : ''
    partes.push(`<span class="selo-maq${j.origem.semContato ? ' frio' : ''}"
      title="máquina de origem${velho}">${esc(j.origem.nome)}</span>`)
  }
  if (j.tipo === 'interativa') {
    partes.push(`<span class="selo-maq" title="${j.remoto
      ? 'sessão interativa, pilotada por Remote Control'
      : 'sessão interativa num terminal desta máquina'}">${j.remoto ? 'remoto' : 'terminal'}</span>`)
  }
  return partes.join('')
}

function cartao(j) {
  // "done" repetiria o ponto e a faixa: nota só quando acrescenta algo.
  // CC-17: `detail` é o status que o próprio agente escreveu (`cc set`), e
  // vem antes de `lastPrompt` — o que você digitou por último, lido do
  // transcript. Quase todo job tem transcript, então antes disso `lastPrompt`
  // quase sempre ganhava e escondia o status; o cartão parecia ecoar seu
  // pedido em vez de dizer o que está acontecendo. Sem `detail`, `lastPrompt`
  // ainda aparece, mas rotulado — pra não parecer status quando é só eco.
  const nota = j.stale ? `<p class="c-nota warn">sem sinal há ${age(j.idleMs)}</p>`
    : j.blockers.length ? `<p class="c-nota bad">${esc(j.blockers[0])}</p>`
    : j.inFlight.length ? `<p class="c-nota">${esc(j.inFlight[0].label)}</p>`
    : j.detail ? `<p class="c-nota">${esc(j.detail)}</p>`
    : j.lastPrompt ? `<p class="c-nota"><span class="c-nota-origem">você pediu:</span> ${esc(j.lastPrompt)}</p>` : ''

  // Bolinhas em vez de barra: com poucas tarefas dá pra contar de relance, e é
  // isso que se quer saber — quantas faltam, não a porcentagem.
  const N = 10
  const progresso = !j.todos.length ? '<span class="path">sem tarefa</span>'
    : j.todos.length <= N
      ? `<span class="c-pontos">${'●'.repeat(j.todosDone)}${'○'.repeat(j.todos.length - j.todosDone)}</span>
         <span class="c-frac">${j.todosDone}/${j.todos.length}</span>`
      : `<span class="c-barra"><i style="width:${Math.round((j.todosDone / j.todos.length) * 100)}%"></i></span>
         <span class="c-frac">${j.todosDone}/${j.todos.length}</span>`

  return `
    <article class="card s-${j.status}${selected === j.id ? ' sel' : ''}${j.pinned ? ' pinned' : ''}"
        data-job="${j.id}" tabindex="0" title="${j.pinned ? 'fixado · ' : ''}${esc(j.id)}">
      <header>
        ${j.category ? `<span class="cat">${esc(j.category)}</span>` : '<span class="cat vazia"></span>'}
        ${selo(j)}
        <span class="grow"></span>
        <span class="c-acts">
          <button data-act="resume" data-id="${j.id}" ${j.sessionId ? '' : 'disabled'}
            title="${j.sessionId ? 'copiar claude --resume' : 'sem sessão para retomar'}">↻</button>
          <button data-act="pin" data-id="${j.id}" class="${j.pinned ? 'on' : ''}"
            title="${j.pinnedAqui ? 'desafixar' : j.pinned ? 'fixado pelo Claude Code' : 'fixar no topo'}"
            ${j.pinned && !j.pinnedAqui ? 'disabled' : ''}>${j.pinned ? '★' : '☆'}</button>
          <button data-act="path" data-id="${j.id}" title="copiar o caminho da pasta">⧉</button>
        </span>
      </header>
      <b class="c-titulo">${esc(j.subject)}</b>
      <p class="c-proj">
        <button class="c-mapa" data-mapa="${esc(j.id)}" title="abrir o mapa deste projeto">${esc(j.project)}</button>
        ${j.frente
          ? `<span class="c-frente" title="frente do ROADMAP.md">› ${esc(j.frente)}</span>`
          : `<em>/${esc(j.route)}</em>`}
      </p>
      ${nota}
      <footer>
        <span class="c-prog">${progresso}</span>
        <span class="grow"></span>
        <span class="path" title="${tok(j.tokens)} tokens · ${esc(j.model)}">${esc(j.model)} · ${tok(j.tokens)}</span>
        <span class="c-idade" title="começou há ${age(j.ageMs)}">${age(j.idleMs)}</span>
      </footer>
    </article>`
}

const CAMPOS = {
  subject: (j) => j.subject.toLowerCase(),
  project: (j) => `${j.project}/${j.route}`.toLowerCase(),
  model: (j) => j.model.toLowerCase(),
  tokens: (j) => j.tokens || 0,
  todos: (j) => (j.todos.length ? j.todosDone / j.todos.length : -1),
}

function ordenar(lista) {
  const f = CAMPOS[ordem.campo]
  if (!f) return lista
  const dir = ordem.desc ? -1 : 1
  return [...lista].sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1 // fixado fica no topo
    const [x, y] = [f(a), f(b)]
    return (x < y ? -1 : x > y ? 1 : 0) * dir
  })
}

const ORDENAR_POR = [
  ['', 'urgência'], ['subject', 'assunto'], ['project', 'projeto'],
  ['tokens', 'tokens'], ['todos', 'to-dos'],
]

function viewAgentes(jobs) {
  const grade = (lista) => `<div class="cards">${lista.map(cartao).join('')}</div>`

  // Ordenar desliga as faixas: comparar tokens dentro de cada faixa de urgência
  // esconde justamente o agente caro que se quer achar.
  const corpo = ordem.campo
    ? grade(ordenar(jobs))
    : ZONES.map((z) => {
        const list = jobs.filter((j) => j.status === z.key)
        // Faixa vazia não vira coluna magra: some, e o que sobra ocupa a tela.
        if (!list.length) return ''
        const oculta = collapsed.has(z.key)
        return `<section class="faixa">
          <div class="f-head">
            <button data-zone="${z.key}" aria-expanded="${!oculta}">
              <span class="z-${z.key}">${oculta ? '▸' : '▾'} ${z.title}</span>
              <span class="n">${list.length}</span>
            </button>
            <span class="rule"></span>
          </div>
          ${oculta ? '' : grade(list)}
        </section>`
      }).join('')

  const barra = `<div class="ord">
    <span class="path">ordenar por</span>
    ${ORDENAR_POR.map(([campo, rotulo]) => {
      const ativo = (ordem.campo || '') === campo
      return `<button class="btn${ativo ? ' on' : ''}" data-sort="${campo}">${rotulo}${
        ativo && campo ? `<span class="dir">${ordem.desc ? ' ▾' : ' ▴'}</span>` : ''}</button>`
    }).join('')}
    ${ordem.campo ? '<span class="path">faixas desligadas enquanto ordena</span>' : ''}
  </div>`

  return barra + (corpo || '<div class="empty">nenhum agente no filtro</div>')
}

/* ======================== aba: to-dos ======================== */

function viewTodos(jobs) {
  const comTodo = jobs.filter((j) => j.todos.length)
  const semTodo = jobs.filter((j) => !j.todos.length)
  if (!jobs.length) return '<div class="empty">nenhum agente no filtro</div>'

  // Entregou e não marcou nada: a lista mente e a métrica de tempo por tarefa
  // sai vazia. Mostrar aqui, com o conserto ao lado, é o que faz o dado existir.
  const sujos = jobs.filter((j) => j.entregueEmAberto)
  const alerta = sujos.length ? `<div class="aviso-todo">
    <b>${sujos.length} ${sujos.length > 1 ? 'agentes entregaram' : 'agente entregou'} sem marcar nada.</b>
    <span class="path">Enquanto isso, a aba de preço não sabe quanto levou cada tarefa.</span>
    ${sujos.map((j) => `<div class="aviso-linha">
      <span class="path" data-job="${j.id}" tabindex="0" title="abrir o agente">${esc(j.subject)}</span>
      <span class="path">${j.todos.length} em aberto</span>
      <button class="btn" data-fechar-todas="${j.id}">marcar todas como feitas</button>
    </div>`).join('')}
  </div>` : ''

  /* A primeira tarefa aberta de um agente que está TRABALHANDO é o que ele faz
     agora. Derivado, não digitado: ninguém marca "estou nesta". */
  const item = (j, t, i) => `
    <div class="item${t.done ? ' done' : ''}${
      !t.done && j.status === 'working' && (j.todos || []).findIndex((x) => !x.done) === i ? ' agora' : ''}">
      <input type="checkbox" data-todo="${j.id}" data-i="${i}" ${t.done ? 'checked' : ''}
        aria-label="marcar como feita">
      <input class="txt" value="${esc(t.text)}" data-edit="${j.id}" data-i="${i}"
        aria-label="texto da tarefa" placeholder="descreva a tarefa — em branco, ela some">
    </div>
    ${(() => {
      // CC-36: explicação do opencode, se já enriquecida. Chaveada por texto,
      // igual feitoEm — some se o texto do to-do mudar.
      const e = j.explicacoes?.[t.text]
      if (!e) return ''
      return `<p class="todo-explicacao">${e.titulo ? `<b>${esc(e.titulo)}:</b> ` : ''}${esc(e.resumo || '')}${
        e.arquivo ? ` <code>${esc(e.arquivo)}</code>` : ''}</p>`
    })()}`

  // Cabeçalho por agente: sem isso "projeto/rota · assunto" se repetiria em
  // toda linha da lista.
  const grupo = (j) => {
    const marcados = j.todos.map((t, i) => ({ t, i }))
    const abertos = marcados.filter(({ t }) => !t.done)
    const feitos = marcados.filter(({ t }) => t.done)
    return `<section class="grupo s-${j.status}">
      <div class="g-head">
        <b class="clip" style="flex:1;color:var(--fg)" data-job="${j.id}" tabindex="0"
          title="abrir o agente">${esc(j.subject)}</b>
        <span class="n">${abertos.length}</span>
        ${abertos.length ? `<button class="btn mini" data-enriquecer="${j.id}" title="pedir pro opencode explicar as tarefas deste agente (pode levar até 1min)">explicar</button>` : ''}
        <button class="g-add" data-add="${j.id}" title="nova tarefa neste agente">+</button>
      </div>
      <p class="c-proj">${esc(j.project)}<em>/${esc(j.route)}</em></p>
      ${abertos.map(({ t, i }) => item(j, t, i)).join('')}
      ${feitos.length ? `
        <details class="lvl"${feitosAbertos.has(j.id) || tudoAberto ? ' open' : ''} data-feitos="${j.id}">
          <summary>${feitos.length} concluída${feitos.length > 1 ? 's' : ''}</summary>
          ${feitos.map(({ t, i }) => item(j, t, i)).join('')}
        </details>` : ''}
      ${!abertos.length && !feitos.length ? '<div class="path" style="padding:3px 5px">sem tarefa</div>' : ''}
    </section>`
  }

  return `${alerta}<div class="lista">
    ${comTodo.length ? comTodo.map(grupo).join('') : '<div class="path">nenhum agente registrou tarefa ainda</div>'}
    ${semTodo.length ? `
      <details class="lvl outros"${tudoAberto ? ' open' : ''}>
        <summary>abrir tarefa em outro agente (${semTodo.length})</summary>
        ${semTodo.map(grupo).join('')}
      </details>` : ''}
  </div>`
}

/* ======================= aba: projetos ======================= */

/* ======================= aba: cockpit =========================
   "Onde eu mexo agora?" — projetos ordenados por urgência, o topo da lista é
   onde ele deve olhar. A ordenação e as frases vêm de `src/cockpit.mjs`, que
   é código puro e testado; aqui só se desenha.

   O peso numérico NUNCA aparece: o que aparece é a frase ("travado: falta
   credencial"). Número sem explicação vira burocracia que se desliga.

   Calculado no cliente a partir do snapshot que já chega pelo stream — sem
   fetch próprio, então atualiza junto com o resto a cada 2s. A rota
   `/api/cockpit` existe para consumo externo (PiP, futuro), não para esta aba. */

// Cor por tipo de motivo, reusando os tokens de estado que já existem.
const COR_MOTIVO = {
  travado: 'failed', failed: 'failed', stale: 'waiting',
  // CC-41: pedem atenção, não são falha — mesma cor de waiting
  rajada: 'waiting', repeticao: 'waiting',
  waiting: 'waiting', aberto: 'waiting', working: 'working', parado: 'dim',
}

// CC-34: mini-mapa de frentes no cartão. Carga preguiçosa e cacheada por
// sessão — uma leitura por projeto, nunca no tique de 2s. Ler ~20 ROADMAP.md
// a cada tique custaria I/O que o stream não paga hoje (VPS/processos/git-log
// seguem a mesma regra: sob clique ou sob demanda única, nunca timer).
const MAPAS_MINI = new Map() // projeto -> mapa | 'carregando' | 'vazio'

function pedirMapaMini(projeto) {
  if (MAPAS_MINI.has(projeto)) return
  MAPAS_MINI.set(projeto, 'carregando')
  fetch(`/api/roadmap?projeto=${encodeURIComponent(projeto)}`)
    .then((r) => r.json())
    .then((mapa) => { MAPAS_MINI.set(projeto, mapa?.grupos?.length ? mapa : 'vazio'); render() })
    .catch(() => MAPAS_MINI.set(projeto, 'vazio'))
}

// O framework de engenharia, por projeto. Mesma regra do mini-mapa: uma
// leitura por projeto, sob demanda, nunca no tique de 2s.
const FRAMEWORKS = new Map() // projeto -> retrato | 'carregando'
let FW_LISTA = null // null = fechado; 'carregando'; ou a lista de projetos
let FEDERACAO = null // CC-47: identidade desta máquina, token e quem reporta aqui

async function carregarFederacao() {
  try {
    FEDERACAO = await (await fetch('/api/federacao')).json()
  } catch {
    FEDERACAO = { maquinas: [], configurada: false }
  }
  render()
}

async function salvarFederacao(extra = {}) {
  const corpo = {
    nome: $('#fed-nome')?.value ?? undefined,
    token: $('#fed-token')?.value ?? undefined,
    enviarPara: $('#fed-destino')?.value ?? undefined,
    ...extra,
  }
  try {
    await fetch('/api/federacao/config', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(corpo),
    })
  } catch { /* sem rede o painel continua inteiro */ }
  return carregarFederacao()
}

/**
 * A lista de TODOS os projetos, sob clique.
 *
 * O botão no cartão não basta: cartão só existe para projeto com agente, e o
 * caso principal do framework é projeto novo, antes de haver código e antes de
 * haver agente. Na VPS, com zero job vivo, a aba inteira fica vazia.
 */
function abrirFrameworkLista() {
  if (FW_LISTA) { FW_LISTA = null; return render() }
  FW_LISTA = 'carregando'
  render()
  fetch('/api/framework/projetos')
    .then((r) => r.json())
    .then((d) => { FW_LISTA = d.projetos || []; render() })
    .catch(() => { FW_LISTA = []; render() })
}

function viewFrameworkLista() {
  if (FW_LISTA === 'carregando') return '<p class="dim">lendo os projetos…</p>'
  if (!FW_LISTA.length) return '<p class="dim">nenhum projeto encontrado nesta máquina</p>'
  const ligados = FW_LISTA.filter((p) => p.existe && p.ligado).length
  return `<div class="fw-lista">
    <p class="dim">${ligados} de ${FW_LISTA.length} projeto${FW_LISTA.length === 1 ? '' : 's'} com o framework ligado.
      Ligar cria <code>.framework/estado.json</code> dentro do projeto; desligar não apaga o MVP.</p>
    ${FW_LISTA.map((p) => {
    const estado = !p.existe
      ? '<span class="dim">sem framework</span>'
      : p.ligado
        ? `<span class="fw-selo fw-on" style="border-color:var(--${p.portaoAberto ? 'done' : 'waiting'});color:var(--${p.portaoAberto ? 'done' : 'waiting'})">${esc(p.tituloFase)}</span>
           <span class="dim fw-frase">${esc(p.pendencias?.[0] || 'portão aberto')}</span>`
        : '<span class="fw-selo fw-off">desligado</span>'
    const acao = !p.existe || !p.ligado ? 'ligar' : 'desligar'
    return `<div class="fw-linha">
        <b>${esc(p.projeto)}</b>
        ${estado}
        <span class="grow"></span>
        <button class="btn mini" data-fw="${acao}" data-fw-proj="${esc(p.projeto)}">${
      !p.existe ? 'ligar' : p.ligado ? 'desligar' : 'religar'}</button>
      </div>`
  }).join('')}
  </div>`
}

function pedirFramework(projeto) {
  if (FRAMEWORKS.has(projeto)) return
  FRAMEWORKS.set(projeto, 'carregando')
  fetch(`/api/framework?projeto=${encodeURIComponent(projeto)}`)
    .then((r) => r.json())
    .then((f) => { FRAMEWORKS.set(projeto, f); render() })
    .catch(() => FRAMEWORKS.set(projeto, { existe: false, ligado: false }))
}

/**
 * O botão de ligar e desligar, mais o estado em uma frase.
 *
 * Três aparências, porque são três situações diferentes e tratá-las igual foi
 * o que já confundiu antes: nunca ligado (convite), ligado (fase e o que falta,
 * com destaque) e desligado com dado guardado (o MVP continua lá).
 */
function seloFramework(projeto) {
  const f = FRAMEWORKS.get(projeto)
  if (!f || f === 'carregando' || f.semPasta) return ''

  if (!f.existe) {
    return `<button class="btn mini" data-fw="ligar" data-fw-proj="${esc(projeto)}"
      title="ligar o framework de engenharia neste projeto">ligar framework</button>`
  }

  if (!f.ligado) {
    return `<span class="fw-selo fw-off" title="o MVP registrado continua guardado">framework desligado</span>
      <button class="btn mini" data-fw="ligar" data-fw-proj="${esc(projeto)}">religar</button>`
  }

  const cor = f.portaoAberto ? 'done' : 'waiting'
  const frase = f.pendencias?.length ? f.pendencias[0] : 'portão aberto'

  // O seletor de modo e o "autorizar" são o que fazem o sugestivo existir de
  // verdade: o desenho dele é autorizar por CLIQUE. Sem isso sobraria o CLI,
  // que não serve pra quem está no celular.
  const modos = (f.modos || []).map((m) => `<option value="${m.id}"${
    m.id === f.modo ? ' selected' : ''} title="${esc(m.explica)}">${esc(m.titulo)}</option>`).join('')

  const autorizacao = !f.modoTrava ? '' : (f.autorizado || []).length
    ? `<span class="fw-selo" style="border-color:var(--done);color:var(--done)"
         title="${esc((f.autorizado || []).join(', '))}">autorizado</span>`
    : `<button class="btn mini" data-fw="autorizar" data-fw-proj="${esc(projeto)}"
         title="liberar a IA pra escrever código neste projeto até o modo mudar">autorizar</button>`

  return `<span class="fw-selo fw-on" style="border-color:var(--${cor});color:var(--${cor})"
      title="${esc(f.resumo || '')}">${esc(f.tituloFase || 'framework')}</span>
    <select class="fw-modo" data-fw-modo="${esc(projeto)}" title="${esc(f.explicaModo || '')}">${modos}</select>
    ${autorizacao}
    <span class="dim fw-frase" title="${esc(f.resumo || '')}">${esc(frase)}</span>
    ${f.mudancasDeEscopo ? `<span class="fw-selo" title="o escopo do MVP mudou ${f.mudancasDeEscopo} vez(es), com motivo registrado">escopo mudou ${f.mudancasDeEscopo}×</span>` : ''}
    <button class="btn mini" data-fw="desligar" data-fw-proj="${esc(projeto)}"
      title="desligar sem apagar o MVP nem o histórico">desligar</button>`
}

/** Pastilhas por frente, sem biblioteca. Ponto quando há agente ali. */
function miniMapa(projeto) {
  const mapa = MAPAS_MINI.get(projeto)
  if (!mapa || mapa === 'carregando' || mapa === 'vazio') return ''
  const naFrente = agentesPorFrente(projeto)
  const frentes = mapa.grupos.flatMap((g) => g.frentes)
  if (!frentes.length) return ''
  return `<div class="ck-mini">${frentes.map((f) => {
    const cor = COR_MOTIVO_ESTADO[f.estado] || 'dim'
    const temAgente = naFrente.has(f.titulo.toLowerCase())
    /* CC-81: clicável, com peso, e carregando as palavras dele.
       Queixa que gerou: "está tudo empilhado como se fosse só pequenas
       tarefas, e não é bem isso" — e "teria que dar pra clicar nelas". */
    return `<button class="ck-mini-f f-${cor} p-${f.peso || 1}"
      data-frente-abrir="${esc(f.titulo)}"
      data-frente-cit="${esc(f.citacao || '')}"
      data-frente-n="${f.feitos}/${f.itens || 0}"
      title="${esc(f.titulo)}: ${f.feitos}/${f.itens || 0}">
      ${temAgente ? '<i class="dot s-working"></i>' : ''}${esc(f.titulo)}
      ${f.citacao ? '<i class="tem-fala" title="tem as suas palavras">”</i>' : ''}
      ${f.itens ? `<b>${f.feitos}/${f.itens}</b>` : ''}
    </button>`
  }).join('')}</div>`
}

// Mesmo vocabulário de cor do roadmap.mjs (estadoDe), não o do motivo do agente.
const COR_MOTIVO_ESTADO = { bloqueado: 'failed', esperando: 'waiting', feito: 'done', aberto: 'dim' }

// CC-24: digest semanal, sob clique — nunca carregado sozinho, é spawn de git
// em ~20 projetos.
let DIGEST = null // null=fechado, 'carregando', ou o resultado
async function alternarDigest() {
  if (DIGEST) { DIGEST = null; return render() }
  DIGEST = 'carregando'
  render()
  try {
    DIGEST = await (await fetch('/api/digest')).json()
  } catch {
    DIGEST = { erro: true }
  }
  render()
}

function viewDigest() {
  if (DIGEST === 'carregando') return '<p class="dim">cruzando histórico, git e diário de todos os projetos…</p>'
  if (!DIGEST || DIGEST.erro) return '<p class="dim">não deu para montar o digest</p>'
  if (!DIGEST.projetos.length) {
    return `<p class="dim">nenhum projeto com novidade nos últimos 7 dias${
      DIGEST.silenciosos ? ` (${DIGEST.silenciosos} projeto(s) sem nada nessa janela)` : ''}</p>`
  }
  return `<div class="dg-lista">${DIGEST.projetos.map((p) => {
    const itens = [
      p.commits.length && `${p.commits.length} commit(s)`,
      p.marcos.filter((m) => m.tipo === 'todo').length && `${p.marcos.filter((m) => m.tipo === 'todo').length} tarefa(s) fechada(s)`,
      p.diario.length && `${p.diario.length} dia(s) de diário`,
    ].filter(Boolean).join(' · ')
    return `<div class="dg-proj">
      <b>${esc(p.projeto)}</b><span class="dim"> — ${itens || 'sem sinal'}</span>
      ${p.commits.slice(0, 5).map((c) => `<div class="dg-item">${esc(c.assunto)}</div>`).join('')}
    </div>`
  }).join('')}
  ${DIGEST.silenciosos ? `<p class="dim">+ ${DIGEST.silenciosos} projeto(s) sem novidade nessa janela</p>` : ''}
  </div>`
}

function viewCockpit(jobs) {
  // O cabeçalho é montado ANTES de qualquer saída antecipada, de propósito.
  // Achado em 14/08 na VPS: sem job vivo, a função retornava "nenhum projeto no
  // filtro" e levava junto o botão do framework, que é justamente o que serve
  // para projeto sem agente. Máquina sem agente nenhum é o caso mais comum de
  // quem acabou de abrir o painel.
  /* A pergunta desta aba é a mais importante do painel inteiro, e é a razão de
     ela existir: ela já ordena por urgência, só nunca dizia isso em voz alta. */
  const esperando = jobs.filter((j) => j.status === 'waiting').length
  const trabalhando = jobs.filter((j) => j.status === 'working').length
  const vereditoCk = esperando
    ? `${esperando} agente${esperando > 1 ? 's' : ''} parado${esperando > 1 ? 's' : ''} esperando você. Comece pelo de cima.`
    : trabalhando
      ? `Ninguém esperando. ${trabalhando} trabalhando agora.`
      : 'Nada em curso — comece pelo projeto de cima, que é o mais atrasado.'

  const cabecalhoDigest = cabecaDaTela('Onde eu mexo agora?', vereditoCk,
    esperando ? 'atencao' : 'bom')
    + `<div class="dg-cab">
    <button class="btn" data-digest>${DIGEST ? 'fechar digest' : 'digest da semana'}</button>
    <button class="btn" data-fw-lista>${FW_LISTA ? 'fechar framework' : 'framework nos projetos'}</button>
    ${DIGEST ? viewDigest() : ''}
    ${FW_LISTA ? viewFrameworkLista() : ''}
  </div>`

  if (!jobs.length) return cabecalhoDigest + '<div class="empty">nenhum agente ativo nesta máquina</div>'
  // O cockpit vem pronto do servidor (`cockpit.mjs`, testado). O filtro do topo
  // continua valendo, mas por PROJETO: achar um agente pela busca mostra o
  // projeto dele inteiro — é visão de projeto, não de agente.
  const visiveis = new Set(jobs.map((j) => j.project))
  const projetos = (DATA.cockpit || []).filter((p) => visiveis.has(p.projeto))
  if (!projetos.length) return cabecalhoDigest + '<div class="empty">nenhum projeto no filtro</div>'

  return cabecalhoDigest + `<div class="ck-lista">${projetos.map((p) => {
    pedirMapaMini(p.projeto)
    pedirFramework(p.projeto)
    const cor = COR_MOTIVO[p.motivo.tipo] || 'dim'
    const status = ZONES.map((z) => {
      const n = p.porStatus[z.key] || 0
      return n ? `<span style="color:var(--${z.key})">${n} ${z.title}</span>` : ''
    }).filter(Boolean).join(' · ')

    // Quem espera decisão dele — é o que este painel existe pra despachar.
    const esperando = p.esperando.length ? `<div class="ck-espera">
      ${p.esperando.map((e) => `
        <div class="ck-ag" data-job="${e.id}" tabindex="0" title="abrir detalhe">
          <span class="ck-ag-motivo" style="color:var(--${COR_MOTIVO[e.tipo] || 'dim'})">${esc(e.motivo)}</span>
          <b>${esc(e.subject)}</b>
          ${e.frente ? `<span class="dim">› ${esc(e.frente)}</span>` : ''}
          <span class="grow"></span>
          <span class="path">${age(e.idleMs)}</span>
        </div>
        ${e.nota ? `<p class="ck-nota">${esc(e.nota.texto)}</p>` : ''}`).join('')}
    </div>` : ''

    // Os demais agentes, em uma linha só: contexto sem virar parede de texto.
    const resto = p.jobs.filter((j) => !p.esperando.some((e) => e.id === j.id))
    const chip = (j) => `<span class="ck-frio" data-job="${j.id}" tabindex="0" title="${esc(j.motivo)}">
        <i class="dot s-${j.status}"></i>${esc(j.subject)}
      </span>`
    // CC-06: agrupar por rota só quando vira lista comprida — com poucos
    // agentes, um por rota, o agrupamento só adicionaria moldura sem ajudar.
    const frios = !resto.length ? '' : resto.length <= 4
      ? `<div class="ck-frios">${resto.map(chip).join('')}</div>`
      : (() => {
        const porRota = new Map()
        for (const j of resto) {
          const k = j.route || 'sem rota'
          if (!porRota.has(k)) porRota.set(k, [])
          porRota.get(k).push(j)
        }
        return [...porRota].map(([rota, js]) => `
          <div class="ck-rota"><span class="dim">${esc(rota)}</span>
            <div class="ck-frios">${js.map(chip).join('')}</div>
          </div>`).join('')
      })()

    // CC-33: o delta desde a última vez que ele clicou "vi isso". Sem visita
    // registrada, não mostra frase nenhuma — inventar "desde sempre" mentiria.
    const visita = p.desdeVisita?.em
      ? `<span class="dim" title="desde ${new Date(p.desdeVisita.em).toLocaleString('pt-BR')}">${
          p.desdeVisita.resumo ? esc(p.desdeVisita.resumo) : 'nada novo desde sua visita'}</span>`
      : ''

    return `<article class="ck-proj p-${cor}">
      <header class="ck-head">
        <button class="ck-nome" data-mapa-projeto="${esc(p.projeto)}" title="abrir o mapa deste projeto">${esc(p.projeto)}</button>
        <span class="ck-motivo" style="color:var(--${cor})">${esc(p.motivo.frase)}${
      p.motivo.peso >= 3 ? ` há ${age(p.motivo.desde)}` : ''}</span>
        <span class="grow"></span>
        ${visita}
        <button class="btn mini" data-visita="${esc(p.projeto)}" title="marcar como visto agora">vi isso</button>
        <span class="path">${p.ultimaAtividade ? `visto há ${age(Date.now() - p.ultimaAtividade)}` : '—'}</span>
      </header>
      ${esperando}
      ${frios}
      ${miniMapa(p.projeto)}
      ${(() => { const s = seloFramework(p.projeto); return s ? `<div class="ck-fw">${s}</div>` : '' })()}
      <footer class="ck-pe">
        <span class="dim">${status || 'sem agente ativo'}</span>
        <span class="grow"></span>
        <span class="path">${p.agentes} agente${p.agentes === 1 ? '' : 's'}${
      p.abertos ? ` · ${p.abertos} com to-do aberto` : ''} · ${tok(p.tokens)}</span>
      </footer>
    </article>`
  }).join('')}</div>`
}

/* ======================== aba: tempo ========================= */

const horas = (ms) => {
  const min = Math.round(ms / 60_000)
  return `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}`
}
const usd = (n) => (n >= 1000 ? `$${(n / 1000).toFixed(1)}k` : `$${n.toFixed(2)}`)
// Valor de projeto é número que vai pra proposta: sem abreviar em "k", porque
// R$ 12,4k não se cola num orçamento. Centavos só abaixo de cem reais — num
// custo de API de R$ 3,74 eles são a informação, num projeto de R$ 15 mil são ruído.
const brl = (n) => {
  const casas = Math.abs(n) < 100 ? 2 : 0
  return n.toLocaleString('pt-BR', {
    style: 'currency', currency: 'BRL', minimumFractionDigits: casas, maximumFractionDigits: casas,
  })
}
const dataCurta = (dia) => dia.slice(8) + '/' + dia.slice(5, 7)
const diaDe = (ms) => new Date(ms).toISOString().slice(0, 10)

function viewTempo() {
  if (!TEMPO) return '<div class="empty">lendo os transcritos… a primeira vez varre ~800 MB</div>'
  if (TEMPO.error) return `<div class="empty">não deu para ler os transcritos: ${esc(TEMPO.error)}</div>`

  const ctl = `
    <div class="t-ctl">
      <label>parada que encerra
        <select data-tempo="corte">${[2, 5, 10, 15, 30, 60].map((m) =>
          `<option value="${m}"${m === TEMPO.corteMin ? ' selected' : ''}>${m} min</option>`).join('')}</select>
      </label>
      <label>de <input type="date" data-tempo="de" value="${esc(TEMPO.de || '')}"></label>
      <label>até <input type="date" data-tempo="ate" value="${esc(TEMPO.ate || '')}"></label>
      ${TEMPO.de || TEMPO.ate ? '<button class="btn" data-tempo-limpar>período inteiro</button>' : ''}
      <label title="0 esconde a coluna de valor">R$ por hora
        <input type="number" min="0" step="10" class="t-taxa" data-taxa value="${TEMPO.taxaGlobal || ''}" placeholder="—">
      </label>
      <label title="quanto você paga de assinatura por mês; 0 mostra só o preço de API">assinatura/mês
        <input type="number" min="0" step="10" class="t-taxa" data-assinatura
          value="${TEMPO.assinaturaMes || ''}" placeholder="—">
      </label>
      <label title="${TEMPO.cambio.em
        ? `cotação de ${new Date(TEMPO.cambio.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}${
            TEMPO.cambio.manual ? ', digitada por você' : ', buscada automaticamente'}`
        : 'sem cotação — digite uma para ver o custo em real'}">dólar
        <input type="number" min="0" step="0.01" class="t-taxa" data-cambio
          value="${TEMPO.cambio.brlPorUsd ? TEMPO.cambio.brlPorUsd.toFixed(2) : ''}" placeholder="—">
      </label>
      <span class="grow"></span>
      <button class="btn" data-tempo-recarregar>reler transcritos</button>
    </div>`

  const aviso = `<p class="t-aviso">
    Tempo ativo é a soma dos intervalos entre mensagens, descartando as paradas maiores
    que o corte acima. <b>Agente rodando sozinho conta como trabalho</b>, e tempo lendo
    código ou em reunião não conta. O custo é o preço de API dos tokens gastos —
    referência de esforço, não o que foi cobrado de você na assinatura.
    ${TEMPO.cambio.brlPorUsd
      ? `Convertido a ${brl(TEMPO.cambio.brlPorUsd)} por dólar${TEMPO.cambio.manual
          ? ', cotação digitada por você'
          : `, cotação de ${new Date(TEMPO.cambio.em).toLocaleDateString('pt-BR')}`}.`
      : ''}
    ${TEMPO.modelosSemPreco.length
      ? `<br>Sem preço conhecido, fora da conta: ${TEMPO.modelosSemPreco.map(esc).join(', ')}.` : ''}
  </p>`

  if (!TEMPO.projetos.length) return ctl + aviso + '<div class="empty">nenhum trabalho no período</div>'

  const totalMs = TEMPO.projetos.reduce((a, p) => a + p.ativoMs, 0)
  const totalUsd = TEMPO.projetos.reduce((a, p) => a + p.custo, 0)
  // A coluna de valor só existe depois que uma taxa foi definida: sem taxa,
  // mostrar R$ 0,00 em toda linha diria que o trabalho não vale nada.
  const comValor = TEMPO.projetos.some((p) => p.taxaHora > 0)
  const comReal = TEMPO.assinaturaMes > 0
  const comSobra = comValor && comReal
  const cls = `${comValor ? ' com-valor' : ''}${comReal ? ' com-real' : ''}${comSobra ? ' com-sobra' : ''}`

  const barras = (dias) => {
    const maior = Math.max(...dias.map((d) => d.ativoMs))
    return `<div>
      <h3>por dia</h3>
      <div class="t-dias">${dias.map((d) => `
        <div class="t-dia" title="${d.dia}: ${horas(d.ativoMs)}">
          <i style="height:${Math.max((d.ativoMs / maior) * 100, 2)}%"></i>
        </div>`).join('')}</div>
      <div class="t-eixo"><span>${dataCurta(dias[0].dia)}</span>
        <span>${horas(maior)} no melhor dia</span>
        <span>${dataCurta(dias[dias.length - 1].dia)}</span></div>
    </div>`
  }

  const proj = (p) => {
    const aberto = tempoAberto.has(p.projeto) || tudoAberto
    const porDia = p.diasTrabalhados ? p.ativoMs / p.diasTrabalhados : 0
    return `<div class="t-proj">
      <div class="t-linha${cls}" data-tempo-proj="${esc(p.projeto)}" tabindex="0">
        <span class="nome">${aberto ? '▾' : '▸'} ${esc(p.projeto)}${
      // CC-47: de onde vieram estas horas. Só quando o projeto foi tocado em
      // mais de uma máquina — no caso comum seria carimbo repetido inútil.
      (p.porMaquina || []).length > 1
        ? ` ${p.porMaquina.map((m) => `<span class="selo-maq" title="${esc(m.maquina.nome)}: ${horas(m.ativoMs)}">${
          esc(m.maquina.nome)} ${horas(m.ativoMs)}</span>`).join('')}`
        : ''}</span>
        <span class="v h">${horas(p.ativoMs)}</span>
        <span class="v path">${p.diasTrabalhados}d</span>
        <span class="v path">${horas(porDia)}/dia</span>
        <span class="v num">${tok(p.tokens)}</span>
        <span class="v cif" title="${usd(p.custo)} de API">${p.custoBrl == null ? usd(p.custo) : brl(p.custoBrl)}</span>
        <span class="v path">${!p.ativoMs ? '—' : (() => {
          const porHora = p.custo / (p.ativoMs / 36e5)
          return TEMPO.cambio.brlPorUsd ? brl(porHora * TEMPO.cambio.brlPorUsd) + '/h' : usd(porHora) + '/h'
        })()}</span>
        ${comReal ? `<span class="v real" title="fatia da assinatura pelas horas deste projeto em cada mês">${brl(p.custoReal)}</span>` : ''}
        ${comValor ? `<span class="v val" title="${p.taxaHora ? `${horas(p.ativoMs)} a ${brl(p.taxaHora)}/h${p.taxaPropria ? ' (taxa deste projeto)' : ''}` : 'sem taxa'}">${
          p.taxaHora ? brl(p.valor) : '—'}</span>` : ''}
        ${comSobra ? `<span class="v ${p.sobra == null ? '' : p.sobra >= 0 ? 'ok' : 'ruim'}">${
          p.sobra == null ? '—' : brl(p.sobra)}</span>` : ''}
      </div>
      ${aberto ? `<div class="t-corpo">
        <div class="t-valor">
          <label>R$ por hora aqui
            <input type="number" min="0" step="10" class="t-taxa" data-taxa
              data-projeto="${esc(p.projeto)}"
              value="${p.taxaPropria ? p.taxaHora : ''}"
              placeholder="${TEMPO.taxaGlobal || '—'}">
          </label>
          ${p.taxaHora ? `<b>${brl(p.valor)}</b>
            <span class="path">${horas(p.ativoMs)} × ${brl(p.taxaHora)}/h${
              p.taxaPropria ? '' : ' (taxa global)'} · API ${
              p.custoBrl == null ? usd(p.custo) : `${brl(p.custoBrl)} (${usd(p.custo)})`}</span>`
            : '<span class="path">defina a taxa para ver o valor do projeto</span>'}
          ${p.custoReal == null ? '' : `<span class="path">· assinatura ${brl(p.custoReal)}${
            p.sobra == null ? '' : ` · <b class="${p.sobra >= 0 ? 'ok' : 'ruim'}">sobra ${brl(p.sobra)}</b>`}</span>`}
        </div>
        ${p.dias.length ? barras(p.dias) : ''}
        <div>
          <h3>gasto por modelo</h3>
          <table class="t-ses">
            <tr class="path"><td>modelo</td><td class="num">entrada</td><td class="num">saída</td>
              <td class="num">cache escrito</td><td class="num">cache lido</td><td class="num">custo</td></tr>
            ${p.uso.map((u) => `
              <tr>
                <td style="color:var(--fg)">${esc(u.modelo)}</td>
                <td class="num">${tok(u.input)}</td>
                <td class="num">${tok(u.output)}</td>
                <td class="num">${tok(u.escrita5m + u.escrita1h)}</td>
                <td class="num">${tok(u.leitura)}</td>
                <td class="num cif" title="${u.custo == null ? '' : usd(u.custo) + ' de API'}">${
                  u.custo == null ? '<em class="path">sem preço</em>'
                    : TEMPO.cambio.brlPorUsd ? brl(u.custo * TEMPO.cambio.brlPorUsd) : usd(u.custo)}</td>
              </tr>`).join('')}
          </table>
          <p class="path" style="margin:6px 0 0">
            releitura de cache costuma ser a maior fatia do volume e a menor do preço — custa 10% da entrada.
          </p>
        </div>
        <div>
          <h3>sessões — ${p.sessoes.length}</h3>
          <table class="t-ses">${p.sessoes.slice(0, 40).map((s) => {
            const fmt = (ms, opts) => new Date(ms).toLocaleString('pt-BR', opts)
            const mesmoDia = diaDe(s.inicio) === diaDe(s.fim)
            // sessão de madrugada com agente autônomo cruza o dia; mostrar só
            // o começo faria parecer que 19h de trabalho couberam num dia
            const quando = mesmoDia
              ? fmt(s.inicio, { dateStyle: 'short', timeStyle: 'short' })
              : `${fmt(s.inicio, { dateStyle: 'short', timeStyle: 'short' })} → ${fmt(s.fim, { dateStyle: 'short', timeStyle: 'short' })}`
            return `<tr>
              <td class="path">${quando}</td>
              <td class="num" style="color:var(--fg);width:70px">${horas(s.ativoMs)}</td>
              <td class="path num" style="width:80px" title="janela do começo ao fim">${horas(s.fim - s.inicio)} corridas</td>
              <td class="path clip" title="${esc(s.id)}">${esc(s.id.slice(0, 8))}</td>
            </tr>`
          }).join('')}
          </table>
          ${p.sessoes.length > 40 ? `<p class="path" style="margin:6px 0 0">mostrando as 40 mais recentes de ${p.sessoes.length}</p>` : ''}
        </div>
      </div>` : ''}
    </div>`
  }

  const totalValor = TEMPO.projetos.reduce((a, p) => a + p.valor, 0)
  return `${ctl}${aviso}
    <div class="rolagem">
    <div class="t-linha t-head${cls}">
      <span>projeto</span><span class="v">horas</span><span class="v">dias</span>
      <span class="v">média</span><span class="v">tokens</span><span class="v">custo api</span><span class="v">por hora</span>
      ${comReal ? '<span class="v">custo real</span>' : ''}
      ${comValor ? '<span class="v">valor</span>' : ''}
      ${comSobra ? '<span class="v">sobra</span>' : ''}
    </div>
    ${TEMPO.projetos.map(proj).join('')}
    <div class="t-linha${cls}" style="border-top:1px solid var(--line);cursor:default">
      <span class="nome" style="color:var(--faint)">total</span>
      <span class="v h">${horas(totalMs)}</span><span class="v"></span><span class="v"></span>
      <span class="v num">${tok(TEMPO.projetos.reduce((a, p) => a + p.tokens, 0))}</span>
      <span class="v cif" title="${usd(totalUsd)} de API">${
        TEMPO.cambio.brlPorUsd ? brl(totalUsd * TEMPO.cambio.brlPorUsd) : usd(totalUsd)}</span>
      <span class="v path">${!totalMs ? '' : (() => {
        const porHora = totalUsd / (totalMs / 36e5)
        return TEMPO.cambio.brlPorUsd ? brl(porHora * TEMPO.cambio.brlPorUsd) + '/h' : usd(porHora) + '/h'
      })()}</span>
      ${comReal ? `<span class="v real">${brl(TEMPO.projetos.reduce((a, p) => a + (p.custoReal || 0), 0))}</span>` : ''}
      ${comValor ? `<span class="v val">${brl(totalValor)}</span>` : ''}
      ${comSobra ? (() => {
        const s = TEMPO.projetos.reduce((a, p) => a + (p.sobra || 0), 0)
        return `<span class="v ${s >= 0 ? 'ok' : 'ruim'}">${brl(s)}</span>`
      })() : ''}
    </div>
    </div>`
}

/* ======================== aba: gráficos ======================
   Os dados são os mesmos da aba de tempo — nada é lido de novo. O que muda é
   que aqui eles viram fatos soltos, que o motor em graficos.js cruza. */

let GRAFICOS = null          // null = nunca mexeu, mostra os prontos
// ?novo=1 e ?indice=1 abrem o construtor e o índice já na carga — sem eles não
// dá pra conferir nenhum dos dois numa captura de tela.
let rascunho = params.has('novo')
  ? { forma: 'barras', dimensao: 'projeto', serie: 'nenhuma', medida: 'horas', nome: '' }
  : null
let indiceAberto = params.has('indice')

/** Um id curto e estável, para o cartão sobreviver a reordenar e reeditar. */
const novoIdGrafico = () => 'g' + Math.random().toString(36).slice(2, 8)

const graficosAtuais = () => GRAFICOS
  || CCGraficos.PRONTOS.map((g) => ({ ...g, id: novoIdGrafico() }))

/**
 * As duas tabelas de fatos. `tempo` carrega a taxa e o custo/hora do mês junto
 * de cada linha: assim o motor calcula valor e sobra sem saber de configuração.
 */
function fatosDe(T) {
  const custoHoraMes = Object.fromEntries((T.meses || []).map((m) => [m.mes, m.custoHora]))
  const cambio = T.cambio.brlPorUsd || 0
  const tempo = []
  const uso = []
  for (const p of T.projetos) {
    for (const d of p.dias) {
      tempo.push({
        projeto: p.projeto, dia: d.dia, ms: d.ativoMs,
        taxaHora: p.taxaHora || 0,
        custoHoraMes: custoHoraMes[d.dia.slice(0, 7)] || 0,
      })
    }
    for (const u of p.usoDias || []) {
      // Converte aqui e não no motor: o motor não deve saber de moeda.
      uso.push({ ...u, projeto: p.projeto, custo: (u.custo || 0) * (cambio || 1) })
    }
  }
  return { tempo, uso }
}

const fmtG = (v, tipo) => {
  if (tipo === 'horas') return horas(v * 36e5)
  if (tipo === 'brl') return brl(v)
  if (tipo === 'tok') return tok(Math.round(v))
  if (tipo === 'moeda') return TEMPO.cambio.brlPorUsd ? brl(v) : usd(v)
  return String(Math.round(v))
}

function seletor(nome, opcoes, atual) {
  return `<select data-rasc="${nome}">${opcoes.map(([id, rot]) =>
    `<option value="${esc(id)}"${id === atual ? ' selected' : ''}>${esc(rot)}</option>`).join('')}</select>`
}

function construtor(idx, estado) {
  const s = rascunho
  const erro = CCGraficos.validar(s, estado)
  return `<div class="g-form">
    <div class="g-campos">
      <label>forma ${seletor('forma', Object.entries(CCGraficos.FORMAS).map(([id, f]) => [id, f.rotulo]), s.forma)}</label>
      <label>medida ${seletor('medida', idx.medidas.map((m) => [m.id, m.rotulo]), s.medida)}</label>
      <label>eixo ${seletor('dimensao', Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([id, d]) => [id, d.rotulo]), s.dimensao)}</label>
      <label>dividir por ${seletor('serie', Object.entries(CCGraficos.DIMENSOES).map(([id, d]) => [id, d.rotulo]), s.serie)}</label>
      <label>nome <input type="text" data-rasc="nome" value="${esc(s.nome || '')}" placeholder="${esc(CCGraficos.descrever(s))}"></label>
      <span class="grow"></span>
      <button class="btn" data-g-salvar${erro ? ' disabled' : ''}>${s.id ? 'salvar' : 'adicionar'}</button>
      <button class="btn" data-g-cancelar>cancelar</button>
    </div>
    ${erro ? `<div class="g-erro">${esc(erro)}</div>`
      : `<div class="g-previa">${CCGraficos.desenhar(s, fatosDe(TEMPO), fmtG, estado)}</div>`}
  </div>`
}

function viewIndice(idx) {
  if (!indiceAberto) return ''
  const fonteDe = (f) => (f === 'tempo' ? 'relógio' : 'uso de token')
  return `<div class="g-indice">
    <div>
      <h3>medidas</h3>
      <table class="g-tab">
        ${idx.medidas.map((m) => `<tr><td>${esc(m.rotulo)}</td><td class="path">vem do ${fonteDe(m.fonte)}</td></tr>`).join('')}
        ${idx.bloqueadas.map((m) => `<tr class="off"><td>${esc(m.rotulo)}</td>
          <td class="path">falta ${esc(m.precisa.replace('+', ' e '))} — defina na aba tempo</td></tr>`).join('')}
      </table>
    </div>
    <div>
      <h3>eixos</h3>
      <table class="g-tab">
        ${Object.entries(CCGraficos.DIMENSOES).filter(([id]) => id !== 'nenhuma').map(([, d]) =>
          `<tr><td>${esc(d.rotulo)}</td><td class="path">${d.fontes.length === 2
            ? 'cruza com qualquer medida'
            : `só com medidas do ${fonteDe(d.fontes[0])}`}</td></tr>`).join('')}
      </table>
      <p class="path" style="margin:10px 0 0">
        O relógio não sabe qual modelo rodou, e o uso de token não sabe quanto tempo levou.
        Por isso horas não cruza com modelo — e o construtor avisa em vez de desenhar zero.
      </p>
    </div>
  </div>`
}

function viewGraficos() {
  if (!TEMPO) return '<div class="empty">lendo os transcritos… a primeira vez varre ~800 MB</div>'
  if (TEMPO.error) return `<div class="empty">não deu para ler os transcritos: ${esc(TEMPO.error)}</div>`

  const estado = {
    temTaxa: TEMPO.projetos.some((p) => p.taxaHora > 0),
    temAssinatura: TEMPO.assinaturaMes > 0,
  }
  const idx = CCGraficos.indice(estado)
  const dados = fatosDe(TEMPO)
  const lista = graficosAtuais()

  const barra = `<div class="t-ctl">
    <button class="btn" data-g-novo${rascunho ? ' disabled' : ''}>+ gráfico</button>
    <button class="btn${indiceAberto ? ' on' : ''}" data-g-indice>o que dá pra cruzar</button>
    ${GRAFICOS ? '<button class="btn" data-g-restaurar>voltar aos prontos</button>' : ''}
    <span class="grow"></span>
    <span class="path">período e corte saem da aba tempo${
      TEMPO.de || TEMPO.ate ? ` · recorte ativo` : ''}</span>
  </div>`

  const cartoes = lista.map((g) => `
    <section class="g-card">
      <header>
        <b>${esc(g.nome || CCGraficos.descrever(g))}</b>
        <span class="path">${esc(CCGraficos.descrever(g))}</span>
        <span class="grow"></span>
        <button class="btn min" data-g-editar="${esc(g.id)}" title="editar">✎</button>
        <button class="btn min" data-g-remover="${esc(g.id)}" title="remover">✕</button>
      </header>
      ${CCGraficos.desenhar(g, dados, fmtG, estado)}
    </section>`).join('')

  return barra + viewIndice(idx)
    + (rascunho ? construtor(idx, estado) : '')
    + (lista.length ? `<div class="g-grade">${cartoes}</div>`
      : '<div class="empty">nenhum gráfico — use o + acima</div>')
}

async function gravarGraficos(lista) {
  GRAFICOS = lista
  render()
  await fetch('/api/graficos', { method: 'POST', body: JSON.stringify({ graficos: lista }) })
}

/* ========================= aba: preço ========================
   Quanto vale cada coisa resolvida. O tempo vem do transcript, o nível sai de
   sinais de esforço e o valor/hora é buscado na web — e nada disso vira preço
   sem o Felipe poder discordar de cada linha. */

let PRECO = null
let precoUnidade = localStorage.getItem('cc-preco-unidade') || 'sessao'
// ?tarefa=<chave> abre uma linha já na carga, para a captura conseguir mostrar
// os sinais — é o mesmo motivo do ?open= na aba de agentes.
let precoAberta = params.get('tarefa') || null

const NIVEL_ROTULO = { junior: 'júnior', pleno: 'pleno', senior: 'sênior' }

let precoEm = 0
async function carregarPreco(force) {
  if (PRECO && !force && Date.now() - precoEm < 30_000) return
  precoEm = Date.now()
  const q = new URLSearchParams({ corte: tempoParams.corte, unidade: precoUnidade })
  if (force === 'mercado') q.set('mercado', '1')
  PRECO = null
  render()
  try {
    PRECO = await (await fetch(`/api/tarefas?${q}`)).json()
  } catch (e) {
    PRECO = { error: String(e.message || e) }
  }
  render()
}

/** Grava a correção de uma linha e recalcula. */
async function ajustarTarefa(item, patch) {
  const corpo = item.sessao
    ? { sessao: item.sessao, nivel: item.nivel, horas: item.digitadoMs ? item.digitadoMs / 36e5 : 0, ...patch }
    : { job: item.job, tarefa: item.tarefa, nivel: item.nivel, horas: item.digitadoMs ? item.digitadoMs / 36e5 : 0, ...patch }
  await fetch('/api/tarefa', { method: 'POST', body: JSON.stringify(corpo) })
  carregarPreco(true)
}

const chaveDe = (t) => t.sessao || `${t.job}|${t.tarefa}`

function viewPreco() {
  if (!PRECO) return '<div class="empty">calculando… a primeira vez varre os transcritos</div>'
  if (PRECO.error) return `<div class="empty">não deu para calcular: ${esc(PRECO.error)}</div>`

  const m = PRECO.mercado
  const idade = m.em ? Math.round((Date.now() - m.em) / 864e5) : null
  const ctl = `<div class="t-ctl">
    <label>unidade
      <select data-preco="unidade">
        <option value="sessao"${precoUnidade === 'sessao' ? ' selected' : ''}>sessão de trabalho</option>
        <option value="todo"${precoUnidade === 'todo' ? ' selected' : ''}>tarefa concluída</option>
      </select>
    </label>
    <span class="path">corte de ${esc(String(tempoParams.corte))}min, da aba tempo</span>
    <span class="grow"></span>
    <span class="path">mercado: ${esc(m.fonte || '—')}${
      idade == null ? '' : idade === 0 ? ', hoje' : `, há ${idade}d`}</span>
    <button class="btn" data-preco-buscar>buscar de novo</button>
  </div>`

  const faixas = `<div class="p-niveis">
    ${['junior', 'pleno', 'senior'].map((n) => {
      const p = PRECO.porNivel[n]
      return `<div class="p-nivel n-${n}">
        <b>${NIVEL_ROTULO[n]}</b>
        <span class="p-hora">${brl(p.valorHora)}<i>/h</i></span>
        <input type="number" min="0" step="5" class="t-taxa" data-mercado="${n}"
          value="${p.valorHora}" title="digitar congela o valor e a busca para de mexer">
        <span class="path">faixa ${brl(p.faixa?.min || 0)}–${brl(p.faixa?.max || 0)}</span>
        <span class="path">${p.quantas} ${precoUnidade === 'sessao' ? 'sessões' : 'tarefas'}
          · média ${horas(p.mediaMs)} · ${brl(p.total)}</span>
      </div>`
    }).join('')}
  </div>`

  const r = PRECO.resumo
  const resumo = `<div class="p-resumo">
    <div><span class="path">${precoUnidade === 'sessao' ? 'sessões' : 'tarefas'}</span><b>${r.quantas}</b></div>
    <div><span class="path">média por problema</span><b>${horas(r.mediaMs)}</b></div>
    <div><span class="path">total de horas</span><b>${horas(r.totalMs)}</b></div>
    <div><span class="path">a cobrar</span><b class="cif">${brl(r.total)}</b></div>
  </div>`

  const aviso = `<p class="t-aviso">
    O nível sai de sinais de esforço no transcript, não de entendimento do problema —
    <b>é palpite, e o palpite é seu para corrigir</b>: clique na linha e escolha.
    ${precoUnidade === 'sessao'
      ? 'Uma sessão pode ter resolvido mais de uma coisa, então a média por sessão é maior que a média por problema.'
      : `O tempo é rateado por igual entre as tarefas fechadas na mesma sessão${
          r.rateadas ? ` (${r.rateadas} de ${r.quantas})` : ''}, porque não há marca de início e fim por tarefa.`}
    Digitar seu tempo faz a média com o medido, e é essa média que vira preço.
  </p>`

  if (!PRECO.tarefas.length) {
    return ctl + faixas + aviso + `<div class="empty">
      ${precoUnidade === 'todo'
        ? 'nenhuma tarefa marcada como concluída nos agentes vivos — marque na aba to-dos, ou veja por sessão'
        : 'nenhuma sessão com tempo no período'}</div>`
  }

  const linha = (t) => {
    const k = chaveDe(t)
    const aberta = precoAberta === k
    return `<div class="p-item${aberta ? ' on' : ''}">
      <div class="p-linha" data-preco-abrir="${esc(k)}" tabindex="0">
        <span class="p-nome" title="${esc(t.tarefa)}">${esc(t.tarefa)}</span>
        <span class="v path">${esc(t.projeto || '—')}</span>
        <span class="v n-${t.nivel}">${NIVEL_ROTULO[t.nivel]}${t.corrigido ? ' ✓' : ''}</span>
        <span class="v">${horas(t.medidoMs)}</span>
        <span class="v path">${t.digitadoMs == null ? '—' : horas(t.digitadoMs)}</span>
        <span class="v h">${horas(t.cobradoMs)}</span>
        <span class="v cif">${brl(t.preco)}</span>
      </div>
      ${aberta ? `<div class="p-detalhe">
        <div class="p-sinais">
          ${t.sinais.map((s) => `<div class="p-sinal">
            <span class="path">${esc(s.rotulo)}</span>
            <b>${esc(s.texto)}</b>
            <span class="p-notas">${'▪'.repeat(s.nota) || '·'}</span>
          </div>`).join('')}
        </div>
        <div class="p-acoes">
          <span class="path">sugerido: ${NIVEL_ROTULO[t.nivelAuto]}</span>
          ${['junior', 'pleno', 'senior'].map((n) =>
            `<button class="btn${t.nivel === n ? ' on' : ''}" data-preco-nivel="${esc(k)}" data-n="${n}">${NIVEL_ROTULO[n]}</button>`).join('')}
          <label class="path">seu tempo, em horas
            <input type="number" min="0" step="0.5" class="t-taxa" data-preco-horas="${esc(k)}"
              value="${t.digitadoMs == null ? '' : (t.digitadoMs / 36e5).toFixed(1)}" placeholder="${(t.medidoMs / 36e5).toFixed(1)}">
          </label>
          <span class="grow"></span>
          <span class="path">API ${usd(t.custoApi)} · ${tok(Math.round(t.tokens))} tokens${
            t.rateada ? ' · rateado' : ''}</span>
        </div>
      </div>` : ''}
    </div>`
  }

  return ctl + faixas + resumo + aviso
    + `<div class="p-linha p-head">
        <span>o que foi resolvido</span><span class="v">projeto</span><span class="v">nível</span>
        <span class="v">medido</span><span class="v">seu tempo</span><span class="v">cobrado</span><span class="v">preço</span>
      </div>`
    + PRECO.tarefas.slice(0, 120).map(linha).join('')
    + (PRECO.tarefas.length > 120
      ? `<p class="path" style="margin:10px 0 0">mostrando as 120 mais caras de ${PRECO.tarefas.length}</p>` : '')
}

/* ========================== aba: VPS ==========================
   Organograma da VPS — nginx, Docker e PM2 — pra não depender só de SSH cru.
   A leitura é sempre sob clique (`atualizarVps`), nunca automática: usa a
   chave privada do Felipe pra entrar num servidor de produção, e o painel já
   é processo que fica sempre religado — não é lugar pra SSH em timer. */

let VPS = null
let vpsConfigAberto = false
let vpsAtualizando = false

async function carregarVps(force) {
  if (VPS && !force) return
  try {
    VPS = await (await fetch('/api/vps')).json()
  } catch {
    VPS = null
  }
  render()
}

async function salvarVpsConfig() {
  const host = $('#vps-host').value.trim()
  const usuario = $('#vps-usuario').value.trim() || 'root'
  const chaveDigitada = $('#vps-chave').value.trim()
  if (!VPS?.configurado && !chaveDigitada) {
    return alert('primeira vez: precisa do caminho da chave privada também')
  }
  const body = { host, usuario }
  if (chaveDigitada) body.chave = chaveDigitada // vazio = mantém a que já tem
  const r = await fetch('/api/vps', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  })
  const out = await r.json()
  if (!out.ok) return alert(out.error)
  vpsConfigAberto = false
  return carregarVps(true)
}

async function atualizarVps() {
  vpsAtualizando = true
  render()
  try {
    const r = await fetch('/api/vps/atualizar', { method: 'POST' })
    const out = await r.json()
    if (!out.ok) alert(out.error)
    else VPS = { ...VPS, snapshot: out.snapshot }
