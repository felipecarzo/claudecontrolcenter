<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia das skills</title>
<style>
:root{--bg:#10131a;--card:#1a1f2b;--borda:#2e3647;--txt:#f1f4fa;--dim:#b4bdd0;--ac:#ffb454;--ac2:#7fd1ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:2rem;margin:0 0 6px}
.sub{color:var(--dim);margin:0 0 4px}
.data{color:var(--dim);font-size:.9rem;margin:0 0 20px}
#busca{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--borda);background:#0b0e14;color:var(--txt)}
#busca:focus{outline:none;border-color:var(--ac)}
h2{font-size:1.35rem;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--borda)}
h2 small{color:var(--dim);font-weight:400;font-size:.85rem}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.cartao{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;min-width:0}
.cartao.top{border-color:var(--ac)}
.cmd{display:inline-block;font:700 1.1rem ui-monospace,Consolas,monospace;color:var(--ac);background:#0b0e14;padding:3px 9px;border-radius:7px;margin-bottom:8px;overflow-wrap:anywhere}
.faz{margin:0 0 6px}
.quando{margin:0;color:var(--ac2);font-size:.95rem}
#vazio{display:none;color:var(--dim);margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Guia das skills</h1>
<p class="sub">Lista dos comandos e skills do seu Claude Code, agrupados pelo uso, para lembrar o que existe.</p>
<p class="data">Atualizado em 22/11/2026</p>
<input id="busca" type="search" placeholder="Buscar: copy, deploy, imagem, teste..." aria-label="Buscar skill" autocomplete="off">
<p id="vazio">Nada encontrado para essa busca.</p>
<div id="raiz"></div>
</main>

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function cartao(s,top){var c=el('div','cartao'+(top?' top':''));c.appendChild(el('span','cmd',s[0]));c.appendChild(el('p','faz',s[1]));c.appendChild(el('p','quando',s[2]));return c}
var raiz=document.getElementById('raiz'),secs=[],vistos={};
function secao(t,lista,top){var h=el('h2',null,t);var g=el('div','grade');lista.forEach(function(s){g.appendChild(cartao(s,top));if(!top)vistos[s[0]]=1});raiz.appendChild(h);raiz.appendChild(g);secs.push({h:h,g:g})}
secao('As 8 que mais valem lembrar',TOP,true);
G.forEach(function(x){secao(x[0],x[1],false)});
secs.slice(1).forEach(function(s){s.h.appendChild(document.createTextNode(' '));s.h.appendChild(el('small',null,'('+s.g.children.length+')'))});
document.getElementById('busca').addEventListener('input',function(){
 var q=this.value.trim().toLowerCase(),total=0;
 secs.forEach(function(s){var v=0;Array.prototype.forEach.call(s.g.children,function(c){var ok=!q||c.textContent.toLowerCase().indexOf(q)>-1;c.style.display=ok?'':'none';if(ok)v++});s.h.style.display=s.g.style.display=v?'':'none';total+=v});
 document.getElementById('vazio').style.display=total?'none':'block'});
</script>
